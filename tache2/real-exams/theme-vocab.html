<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>TCF Tâche 2｜主题词汇与问法</title>
<style>
:root{--bg:#f7f7f4;--panel:#fff;--text:#1f2421;--muted:#69716c;--line:#dde2de;--accent:#285b4c;--soft:#e8f0ed;--gold:#fff7e8;--pink:#f7ecef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,select,input{font:inherit}.wrap{max-width:1280px;margin:auto;padding:24px 18px 60px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}h1{margin:5px 0 6px;font-size:clamp(28px,4vw,40px)}h2{margin:0 0 12px}.muted{color:var(--muted)}.back{display:inline-block;text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;color:var(--text);font-weight:700}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}.btn.primary,.btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.soft{background:var(--soft);color:var(--accent);border-color:transparent}.panel{display:none}.panel.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.filters label{display:grid;gap:5px;font-size:12px;color:var(--muted);font-weight:700}.filters select,.filters input{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px}.summary{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 9px;font-size:13px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}.tbl{width:100%;border-collapse:collapse;min-width:900px}.tbl th{background:#dcebdc;text-align:left;padding:11px;position:sticky;top:0}.tbl td{padding:11px;border-top:1px solid #edf0ed;vertical-align:top}.fr{font-weight:800;font-size:16px}.zh{color:#4d5752;margin-top:4px}.ex{background:#f5f8f6;border-left:3px solid var(--accent);padding:8px 10px;border-radius:8px;margin-top:7px}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 7px;cursor:pointer;font-size:12px}.mini.on{background:var(--soft);color:var(--accent)}.stars{white-space:nowrap}.study{max-width:760px;margin:16px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}.study .prompt{font-size:28px;font-weight:800;line-height:1.5;margin:20px 0}.answer{background:#f5f8f6;border-left:4px solid var(--accent);padding:15px;border-radius:10px}.answer .big{font-size:24px;font-weight:800}.hidden{display:none!important}.progress{height:7px;background:#e7ece8;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent)}.scenario-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.scenario-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.scenario-card h3{margin:0 0 8px}.tag{display:inline-block;background:var(--soft);color:var(--accent);border-radius:999px;padding:4px 7px;font-size:12px;margin:2px}.pattern{font-size:17px;font-weight:800}.error{background:#fff4f4;border:1px solid #e8caca;border-radius:12px;padding:15px;color:#8a3434}
@media(max-width:720px){.top{flex-direction:column}.scenario-grid{grid-template-columns:1fr}.wrap{padding:16px 10px 40px}.study .prompt{font-size:23px}}
</style></head><body><div class="wrap">
<div class="top"><div><div class="eyebrow">TCF Canada · Expression orale · Tâche 2</div><h1 id="title">主题词汇与问法</h1><p class="muted" id="subtitle"></p></div><a class="back" id="backLink" href="./">← 返回真题</a></div>
<div id="error" class="error hidden"></div>
<div id="app" class="hidden">
<div class="nav"><button class="btn active" data-tab="list">📚 约100词块</button><button class="btn" data-tab="study">🧠 批量学习</button><button class="btn" data-tab="scenes">🧳 场景分包</button><button class="btn" data-tab="patterns">🧩 套用问法</button></div>
<div id="speechStatus" class="muted" role="status" aria-live="polite" style="min-height:1.4em;font-size:12px">🔊 例句使用当前真题 Piper · fr_FR-siwis-medium</div>
<section id="list" class="panel active"><div class="card filters"><label>场景<select id="sceneFilter"></select></label><label>优先级<select id="priorityFilter"><option value="">全部</option><option value="5">★★★★★ 核心</option><option value="4">★★★★ 高价值</option><option value="3">★★★ 扩展</option></select></label><label>搜索<input id="search" placeholder="法语 / 中文"></label></div><div class="summary" id="summary"></div><div class="table-wrap"><table class="tbl"><thead><tr><th>#</th><th>词 / 词块</th><th>中文</th><th>场景</th><th>优先级</th><th>真实套用问法</th></tr></thead><tbody id="vocabRows"></tbody></table></div></section>
<section id="study" class="panel"><div class="card filters"><label>学习范围<select id="studyScope"><option value="core20">核心20</option><option value="core50">核心50</option><option value="all">全部约100</option><option value="review">只学待复习</option><option value="fav">只学收藏</option></select></label><label>场景<select id="studyScene"></select></label><button class="btn soft" id="shuffle">↻ 随机顺序</button></div><div class="study"><div class="progress"><span id="bar"></span></div><div class="muted" id="studyMeta"></div><div class="prompt" id="prompt"></div><div class="answer hidden" id="answer"><div class="big" id="answerFr"></div><div class="zh" id="answerZh"></div><div class="ex"><div id="answerExFr"></div><div class="zh" id="answerExZh"></div></div></div><div class="actions"><button class="btn primary" id="reveal">显示法语</button><button class="btn" id="wordAudio">🔊 词块</button><button class="btn" id="audio">🔊 例句</button><button class="btn" id="prev">← 上一个</button><button class="btn" id="next">下一个 →</button><button class="btn" id="master">✅ 已掌握</button><button class="btn" id="review">🟡 待复习</button><button class="btn" id="fav">☆ 收藏</button></div></div></section>
<section id="scenes" class="panel"><div class="scenario-grid" id="sceneGrid"></div></section>
<section id="patterns" class="panel"><div class="card"><strong>训练方法：</strong>先看骨架和中文，自己替换槽位问出来，再听真实题库中的对应例句。重点不是背整句，而是做到“看到信息点 → 立即套出问法”。</div><div id="patternList"></div></section>
</div></div>
<script src="piper-inline.js?v=3"></script><script src="housing-vocab-piper.js?v=2"></script><script src="social-vocab-piper.js?v=2"></script><script src="education-vocab-piper.js?v=2"></script><script src="consumption-vocab-piper.js?v=2"></script><script src="transport-vocab-piper.js?v=2"></script><script src="family-vocab-piper.js?v=2"></script><script src="sport-vocab-piper.js?v=2"></script><script>
(async()=>{'use strict';const $=id=>document.getElementById(id),slug=new URLSearchParams(location.search).get('theme')||'travel';if(!['travel','housing','social','education','consumption','transport','family','sport'].includes(slug)){$('error').textContent='当前主题词汇模块尚未完成。';$('error').classList.remove('hidden');return}let data;try{const r=await fetch('vocab/'+slug+'.json?v=1',{cache:'no-cache'});if(!r.ok)throw Error('词汇数据尚未部署');data=await r.json()}catch(e){$('error').textContent=e.message;$('error').classList.remove('hidden');return}
$('app').classList.remove('hidden');$('title').textContent=data.title+'｜主题词汇与问法';$('subtitle').textContent=data.target+' · '+data.principle;$('backLink').href=slug==='travel'?'travel.html':'theme-study.html?theme='+slug;$('backLink').textContent='← 返回'+data.title+'真题';const KEY='TCF-T2-VOCAB-'+slug.toUpperCase()+'-v1';let state={tab:'list',studyIndex:0,order:[],progress:{}};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const smap=Object.fromEntries(data.scenarios.map(x=>[x.id,x.name]));function prog(v){return state.progress[v.id]||(state.progress[v.id]={status:'new',favorite:false})}function speak(t){const players={travel:window.TCF_TRAVEL_PIPER,housing:window.TCF_HOUSING_VOCAB_PIPER,social:window.TCF_SOCIAL_VOCAB_PIPER,education:window.TCF_EDUCATION_VOCAB_PIPER,consumption:window.TCF_CONSUMPTION_VOCAB_PIPER,transport:window.TCF_TRANSPORT_VOCAB_PIPER,family:window.TCF_FAMILY_VOCAB_PIPER,sport:window.TCF_SPORT_VOCAB_PIPER};return players[slug]?.play(t,$('speechStatus'),1)}
function sceneOptions(el,all=true){el.innerHTML=(all?'<option value="">全部场景</option>':'<option value="">全部场景</option>')+data.scenarios.map(s=>'<option value="'+s.id+'">'+s.name+'</option>').join('')}sceneOptions($('sceneFilter'));sceneOptions($('studyScene'));
function setTab(t){state.tab=t;save();document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));$(t).classList.add('active');document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));if(t==='list')renderList();if(t==='study')renderStudy();if(t==='scenes')renderScenes();if(t==='patterns')renderPatterns()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function filtered(){const s=$('sceneFilter').value,p=$('priorityFilter').value,q=$('search').value.trim().toLowerCase();return data.vocabulary.filter(v=>(!s||v.scenario===s)&&(!p||String(v.priority)===p)&&(!q||v.fr.toLowerCase().includes(q)||v.zh.includes(q)))}
function mark(v,status){prog(v).status=status;save();renderList();renderStudy()}function fav(v){prog(v).favorite=!prog(v).favorite;save();renderList();renderStudy()}
function renderList(){const arr=filtered();let m=0,r=0,f=0;data.vocabulary.forEach(v=>{const p=prog(v);if(p.status==='mastered')m++;if(p.status==='review')r++;if(p.favorite)f++});$('summary').innerHTML='<span class="pill">共 '+data.vocabulary.length+' 个词块</span><span class="pill">当前显示 '+arr.length+'</span><span class="pill">✅ '+m+' 已掌握</span><span class="pill">🟡 '+r+' 待复习</span><span class="pill">★ '+f+' 收藏</span>';$('vocabRows').innerHTML='';arr.forEach(v=>{const p=prog(v),tr=document.createElement('tr');tr.innerHTML='<td>'+v.id+'</td><td><div class="fr">'+v.fr+'</div><div class="actions"><button class="mini audio">🔊 词块</button><button class="mini master '+(p.status==='mastered'?'on':'')+'">✅</button><button class="mini review '+(p.status==='review'?'on':'')+'">🟡</button><button class="mini fav '+(p.favorite?'on':'')+'">'+(p.favorite?'★':'☆')+'</button></div></td><td>'+v.zh+'</td><td>'+smap[v.scenario]+'</td><td class="stars">'+('★'.repeat(v.priority))+'</td><td><div>'+v.exampleFr+'</div><div class="zh">'+v.exampleZh+'</div><div class="actions"><button class="mini exaudio">🔊 例句</button></div></td>';tr.querySelector('.audio').onclick=()=>speak(v.fr);tr.querySelector('.exaudio').onclick=()=>speak(v.exampleFr);tr.querySelector('.master').onclick=()=>mark(v,'mastered');tr.querySelector('.review').onclick=()=>mark(v,'review');tr.querySelector('.fav').onclick=()=>fav(v);$('vocabRows').append(tr)})}
['sceneFilter','priorityFilter'].forEach(id=>$(id).onchange=renderList);$('search').oninput=renderList;
function pool(){let arr=data.vocabulary.slice(),scope=$('studyScope').value,sc=$('studyScene').value;if(scope==='core20')arr=arr.filter(v=>v.id<=20);else if(scope==='core50')arr=arr.filter(v=>v.id<=50);else if(scope==='review')arr=arr.filter(v=>prog(v).status==='review');else if(scope==='fav')arr=arr.filter(v=>prog(v).favorite);if(sc)arr=arr.filter(v=>v.scenario===sc);if(state.order.length){const pos=new Map(state.order.map((id,i)=>[id,i]));arr.sort((a,b)=>(pos.get(a.id)??9999)-(pos.get(b.id)??9999))}return arr}
function renderStudy(){const arr=pool();if(!arr.length){$('studyMeta').textContent='当前范围没有词条';$('prompt').textContent='';$('answer').classList.add('hidden');return}state.studyIndex=Math.max(0,Math.min(state.studyIndex,arr.length-1));const v=arr[state.studyIndex],p=prog(v);$('studyMeta').textContent=(state.studyIndex+1)+' / '+arr.length+' · '+smap[v.scenario]+' · '+('★'.repeat(v.priority));$('prompt').textContent=v.zh;$('answerFr').textContent=v.fr;$('answerZh').textContent=v.zh;$('answerExFr').textContent=v.exampleFr;$('answerExZh').textContent=v.exampleZh;$('answer').classList.add('hidden');$('reveal').textContent='显示法语';$('fav').textContent=p.favorite?'★ 已收藏':'☆ 收藏';$('bar').style.width=((state.studyIndex+1)/arr.length*100)+'%'}
$('studyScope').onchange=()=>{state.studyIndex=0;state.order=[];save();renderStudy()};$('studyScene').onchange=()=>{state.studyIndex=0;state.order=[];save();renderStudy()};$('shuffle').onclick=()=>{const a=pool().map(v=>v.id);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}state.order=a;state.studyIndex=0;save();renderStudy()};$('reveal').onclick=()=>{$('answer').classList.toggle('hidden');$('reveal').textContent=$('answer').classList.contains('hidden')?'显示法语':'隐藏法语'};$('wordAudio').onclick=()=>{const a=pool();if(a.length)speak(a[state.studyIndex].fr)};$('audio').onclick=()=>{const a=pool();if(a.length)speak(a[state.studyIndex].exampleFr)};$('prev').onclick=()=>{const a=pool();if(a.length){state.studyIndex=(state.studyIndex-1+a.length)%a.length;save();renderStudy()}};$('next').onclick=()=>{const a=pool();if(a.length){state.studyIndex=(state.studyIndex+1)%a.length;save();renderStudy()}};$('master').onclick=()=>{const a=pool();if(a.length)mark(a[state.studyIndex],'mastered')};$('review').onclick=()=>{const a=pool();if(a.length)mark(a[state.studyIndex],'review')};$('fav').onclick=()=>{const a=pool();if(a.length)fav(a[state.studyIndex])};
function renderScenes(){$('sceneGrid').innerHTML='';data.scenarios.forEach(s=>{const vs=data.vocabulary.filter(v=>v.scenario===s.id),ps=data.patterns.filter(p=>p.scenario===s.id||p.scenario==='general').slice(0,6);if(!vs.length)return;const d=document.createElement('div');d.className='scenario-card';d.innerHTML='<h3>'+s.name+'</h3><div class="muted">'+vs.length+' 个词块</div><p>'+vs.slice(0,12).map(v=>'<span class="tag">'+v.fr+'</span>').join('')+'</p><div>'+ps.map(p=>'<div style="margin:7px 0">• '+p.pattern+'</div>').join('')+'</div>';$('sceneGrid').append(d)})}
function renderPatterns(){$('patternList').innerHTML='';data.patterns.forEach(p=>{const d=document.createElement('div');d.className='card';d.innerHTML='<div class="pattern">'+p.pattern+'</div><div class="zh">'+p.zh+'</div><div class="ex"><div>'+p.exampleFr+'</div><div class="zh">'+p.exampleZh+'</div></div><div class="actions"><button class="mini">🔊 真实例句</button><span class="tag">'+smap[p.scenario]+'</span></div>';d.querySelector('button').onclick=()=>speak(p.exampleFr);$('patternList').append(d)})}
setTab(state.tab||'list');
})();</script></body></html>
