<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>TCF Tâche 2｜真题学习</title>
<style>
:root{--bg:#f7f7f4;--panel:#fff;--text:#1f2421;--muted:#69716c;--line:#dde2de;--accent:#285b4c;--accent-soft:#e8f0ed;--pink:#f7ecef;--green:#eef5ea}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,select{font:inherit}.wrap{max-width:1460px;margin:auto;padding:24px 18px 60px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}h1{margin:5px 0 6px;font-size:clamp(27px,4vw,40px)}.muted{color:var(--muted)}.back{display:inline-block;text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;color:var(--text);font-weight:700}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:20px 0}.toolbar label{display:grid;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}select{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff}.btn{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;font-weight:700;cursor:pointer}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.soft{background:var(--accent-soft);color:var(--accent);border-color:transparent}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}.subject{background:#eef4f8;border-left:4px solid #3f6f8b}.subject strong,.logic-row strong{color:#2d617d}.logic-row{font-size:15px;line-height:1.8}.note{font-size:13px;color:#86631b;background:#fff9ec;border:1px solid #efdfb9;border-radius:10px;padding:10px;margin-top:10px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:15px;background:#fff}.study-table{width:100%;border-collapse:collapse;min-width:980px}.study-table th{background:#dcebdc;padding:12px 10px;text-align:left;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}.study-table td{padding:13px 10px;vertical-align:top;border-bottom:1px solid var(--line);border-right:1px solid #eef0ee}.study-table tr:last-child td{border-bottom:0}.study-table td:nth-child(1),.study-table td:nth-child(2){background:#f6faf7}.study-table td:nth-child(3).future{background:var(--pink)}.study-table td:nth-child(3).present{background:var(--green)}.study-table td:nth-child(3).past{background:#eef2fb}.qcell{min-width:430px}.fr{font-size:17px;font-weight:750;line-height:1.65}.zh{margin-top:6px;color:#4d5752;line-height:1.6}.row-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;cursor:pointer;font-size:12px}.mini.on{background:var(--accent-soft);color:var(--accent);border-color:#c7dad2}.follow{display:inline-block;margin-right:5px;color:#986b13;font-weight:800}.summary{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}.pill{background:#fff;border:1px solid var(--line);padding:7px 10px;border-radius:999px;font-size:13px}.mode-panel{display:none}.mode-panel.active{display:block}.practice-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:18px}.practice-meta{font-size:13px;color:var(--muted);margin-bottom:10px}.practice-zh{font-size:23px;font-weight:750;line-height:1.6;margin:14px 0}.practice-fr{font-size:21px;line-height:1.7;background:#f5f8f6;border-left:4px solid var(--accent);padding:14px;border-radius:10px}.hidden{display:none!important}.practice-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chain-progress{height:7px;background:#e8ece9;border-radius:999px;overflow:hidden;margin:12px 0}.chain-progress span{display:block;height:100%;background:var(--accent)}.error{background:#fff4f4;border:1px solid #e8caca;border-radius:12px;padding:16px;margin:20px 0;color:#8a3434}
@media(max-width:760px){.top{flex-direction:column}.toolbar{align-items:stretch}.toolbar label{width:100%}.toolbar select{width:100%}.wrap{padding:16px 10px 40px}.card{padding:14px}.practice-zh{font-size:20px}}
</style></head><body><div class="wrap">
<div class="top"><div><div class="eyebrow">TCF Canada · Expression orale · Tâche 2</div><h1 id="title">真题学习</h1><p class="muted">严格按最终学习版 DOC：Sujet → 总逻辑 → 时间线 → 四列表格。每个提问附中文翻译、Piper 法语发音与学习状态。</p></div><a class="back" href="./">← 返回 7–10 月真题学习</a></div>
<div id="loadError" class="error hidden"></div>
<div id="app" class="hidden">
<div class="toolbar"><label>月份<select id="monthSelect"></select></label><label>题目<select id="questionSelect"></select></label><button class="btn soft" id="prevQ">← 上一题</button><button class="btn soft" id="nextQ">下一题 →</button><button class="btn" data-mode="table">📋 完整表格</button><button class="btn" data-mode="single">🧠 逐句学习</button><button class="btn primary" data-mode="chain">▶ 整题连练</button><a class="btn soft hidden" id="vocabLink" style="text-decoration:none">🧩 主题词汇与问法</a></div>
<div class="summary" id="summary"></div><div id="speechStatus" class="muted" role="status" aria-live="polite" style="min-height:1.4em;font-size:12px;margin:-4px 0 10px">🔊 Piper · fr_FR-siwis-medium（静态预生成音频，不使用浏览器 TTS）</div>
<section id="tableMode" class="mode-panel active"><div id="headArea"></div><div class="table-wrap"><table class="study-table"><thead><tr><th>大维度</th><th>小维度</th><th>时间线</th><th>提问 · 中文 · 发音</th></tr></thead><tbody id="questionRows"></tbody></table></div></section>
<section id="singleMode" class="mode-panel"><div class="practice-card"><div class="practice-meta" id="singleMeta"></div><div class="practice-zh" id="singleZh"></div><div class="practice-fr hidden" id="singleFr"></div><div class="practice-actions"><button class="btn primary" id="singleReveal">显示法语</button><button class="btn" id="singleAudio">🔊 发音</button><button class="btn" id="singlePrev">← 上一句</button><button class="btn" id="singleNext">下一句 →</button><button class="btn" id="singleMaster">✅ 已掌握</button><button class="btn" id="singleReview">🟡 待复习</button><button class="btn" id="singleFav">☆ 收藏</button></div></div></section>
<section id="chainMode" class="mode-panel"><div class="practice-card"><div class="practice-meta" id="chainTitle"></div><div class="chain-progress"><span id="chainBar"></span></div><div class="practice-meta" id="chainMeta"></div><div class="practice-zh" id="chainZh"></div><div class="practice-fr hidden" id="chainFr"></div><div class="practice-actions"><button class="btn primary" id="chainReveal">显示法语</button><button class="btn" id="chainAudio">🔊 发音</button><button class="btn" id="chainPrev">← 上一问</button><button class="btn" id="chainNext">下一问 →</button><button class="btn" id="chainRestart">↺ 从第1问开始</button></div></div></section>
</div></div>
<script src="theme-piper.js?v=1"></script><script>
(async()=>{'use strict';
const MAP={housing:['住房与安家',33],social:['社交聚会与个人生活',17],education:['教育与培训',17],consumption:['消费餐饮与生活服务',19],transport:['交通与车辆',13],family:['家庭儿童与宠物照护',5],sport:['体育户外与场馆',9],health:['健康安全与公共服务',10],culture:['文化媒体与节庆',12],work:['工作与职业',9]};
const slug=new URLSearchParams(location.search).get('theme')||'',meta=MAP[slug],$=id=>document.getElementById(id);
if(!meta){$('loadError').textContent='未找到对应主题，请从真题学习首页进入。';$('loadError').classList.remove('hidden');return}
document.title='TCF Tâche 2｜'+meta[0];$('title').textContent=meta[0]+'｜'+meta[1]+' 道真题';if(['housing','social','education'].includes(slug)){$('vocabLink').href='theme-vocab.html?theme='+slug;$('vocabLink').classList.remove('hidden')}
let payload;try{const r=await fetch('data/'+slug+'.json?v=1',{cache:'no-cache'});if(!r.ok)throw Error('学习数据尚未部署');payload=await r.json()}catch(e){$('loadError').textContent=e.message+'。Piper 音频和中文翻译正在构建时可能短暂出现此提示，请稍后刷新。';$('loadError').classList.remove('hidden');return}
const D=payload.entries.sort((a,b)=>a.month.localeCompare(b.month)||a.number-b.number),KEY='TCF-T2-REAL-'+slug+'-v1';let state={index:0,mode:'table',single:0,chain:0,progress:{}};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}
$('app').classList.remove('hidden');const save=()=>localStorage.setItem(KEY,JSON.stringify(state)),cur=()=>D[state.index]||D[0],rowKey=(q,r)=>q.month+'-'+q.number+'-'+r.n,prog=(q,r)=>state.progress[rowKey(q,r)]||(state.progress[rowKey(q,r)]={status:'new',favorite:false});
function speak(text){return window.TCF_THEME_PIPER?.play(text,$('speechStatus'),1)}
function timeClass(t){return /过去/.test(t)?'past':/将来|条件/.test(t)?'future':'present'}
function renderSelects(){const months=[...new Set(D.map(x=>x.month))];$('monthSelect').innerHTML=months.map(m=>'<option>'+m+'</option>').join('');$('monthSelect').value=cur().month;const same=D.filter(x=>x.month===cur().month);$('questionSelect').innerHTML=same.map(x=>'<option value="'+D.indexOf(x)+'">第 '+x.number+' 题</option>').join('');$('questionSelect').value=state.index}
function head(){const q=cur(),h=$('headArea');h.innerHTML='';const s=document.createElement('div');s.className='card subject';s.innerHTML='<strong>Sujet</strong><p>'+q.sujet+'</p>';h.append(s);(q.notes||[]).forEach(n=>{const x=document.createElement('div');x.className='note';x.textContent=n;h.append(x)});const l=document.createElement('div');l.className='card logic-row';l.innerHTML='<p><strong>总逻辑：</strong>'+q.logic+'</p><p><strong>时间线：</strong>'+q.timeline+'</p>'+(q.followup?'<p><strong>↳ 条件追问：</strong>'+q.followup+'</p>':'');h.append(l)}
function mark(q,r,status){prog(q,r).status=status;save();renderRows();renderSummary();renderSingle()}
function fav(q,r){const p=prog(q,r);p.favorite=!p.favorite;save();renderRows();renderSummary();renderSingle()}
function renderRows(){const q=cur(),tb=$('questionRows');tb.innerHTML='';q.rows.forEach(r=>{const p=prog(q,r),tr=document.createElement('tr'),qhtml=(r.follow?'<span class="follow">↳</span>':'')+'<div class="fr">'+r.n+'. '+r.fr+'</div><div class="zh">🇨🇳 '+(r.zh||'中文翻译暂缺')+'</div><div class="row-actions"><button class="mini audio">🔊 Piper 发音</button><button class="mini master '+(p.status==='mastered'?'on':'')+'">✅ 已掌握</button><button class="mini review '+(p.status==='review'?'on':'')+'">🟡 待复习</button><button class="mini fav '+(p.favorite?'on':'')+'">'+(p.favorite?'★ 已收藏':'☆ 收藏')+'</button></div>';tr.innerHTML='<td>'+r.dimension+'</td><td>'+r.sub+'</td><td class="'+timeClass(r.timeline)+'">'+r.timeline+'</td><td class="qcell">'+qhtml+'</td>';tr.querySelector('.audio').onclick=()=>speak(r.fr);tr.querySelector('.master').onclick=()=>mark(q,r,'mastered');tr.querySelector('.review').onclick=()=>mark(q,r,'review');tr.querySelector('.fav').onclick=()=>fav(q,r);tb.append(tr)})}
function renderSummary(){const q=cur();let m=0,r=0,f=0;q.rows.forEach(x=>{const p=prog(q,x);if(p.status==='mastered')m++;if(p.status==='review')r++;if(p.favorite)f++});$('summary').innerHTML='<span class="pill">'+q.month+' · 第 '+q.number+' 题</span><span class="pill">15 个提问</span><span class="pill">✅ '+m+' 已掌握</span><span class="pill">🟡 '+r+' 待复习</span><span class="pill">★ '+f+' 收藏</span>'}
function renderSingle(){const q=cur(),r=q.rows[Math.max(0,Math.min(state.single,14))],p=prog(q,r);state.single=r.n-1;$('singleMeta').textContent=r.n+' / 15 · '+r.dimension+' → '+r.sub+' · '+r.timeline;$('singleZh').textContent=r.zh||'中文翻译暂缺';$('singleFr').textContent=r.fr;$('singleFr').classList.add('hidden');$('singleReveal').textContent='显示法语';$('singleFav').textContent=p.favorite?'★ 已收藏':'☆ 收藏'}
function renderChain(){const q=cur(),r=q.rows[Math.max(0,Math.min(state.chain,14))];state.chain=r.n-1;$('chainTitle').textContent=payload.title+' · '+q.month+' · 第 '+q.number+' 题 · 整题连练';$('chainMeta').textContent=r.n+' / 15 · '+r.dimension+' → '+r.sub+' · '+r.timeline;$('chainZh').textContent=r.zh||'中文翻译暂缺';$('chainFr').textContent=r.fr;$('chainFr').classList.add('hidden');$('chainReveal').textContent='显示法语';$('chainBar').style.width=(r.n/15*100)+'%'}
function mode(m){window.TCF_THEME_PIPER?.stop();state.mode=m;save();document.querySelectorAll('.mode-panel').forEach(x=>x.classList.remove('active'));$(m+'Mode').classList.add('active');if(m==='single')renderSingle();if(m==='chain')renderChain()}
function render(){renderSelects();head();renderRows();renderSummary();mode(state.mode||'table')}
$('monthSelect').onchange=()=>{window.TCF_THEME_PIPER?.stop();state.index=D.findIndex(x=>x.month===$('monthSelect').value);state.single=state.chain=0;save();render()};$('questionSelect').onchange=()=>{window.TCF_THEME_PIPER?.stop();state.index=+$('questionSelect').value;state.single=state.chain=0;save();render()};$('prevQ').onclick=()=>{window.TCF_THEME_PIPER?.stop();state.index=(state.index-1+D.length)%D.length;state.single=state.chain=0;save();render()};$('nextQ').onclick=()=>{window.TCF_THEME_PIPER?.stop();state.index=(state.index+1)%D.length;state.single=state.chain=0;save();render()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>mode(b.dataset.mode));
$('singleReveal').onclick=()=>{$('singleFr').classList.toggle('hidden');$('singleReveal').textContent=$('singleFr').classList.contains('hidden')?'显示法语':'隐藏法语'};$('singleAudio').onclick=()=>speak(cur().rows[state.single].fr);$('singlePrev').onclick=()=>{state.single=(state.single+14)%15;save();renderSingle()};$('singleNext').onclick=()=>{state.single=(state.single+1)%15;save();renderSingle()};$('singleMaster').onclick=()=>mark(cur(),cur().rows[state.single],'mastered');$('singleReview').onclick=()=>mark(cur(),cur().rows[state.single],'review');$('singleFav').onclick=()=>fav(cur(),cur().rows[state.single]);
$('chainReveal').onclick=()=>{$('chainFr').classList.toggle('hidden');$('chainReveal').textContent=$('chainFr').classList.contains('hidden')?'显示法语':'隐藏法语'};$('chainAudio').onclick=()=>speak(cur().rows[state.chain].fr);$('chainPrev').onclick=()=>{state.chain=(state.chain+14)%15;save();renderChain()};$('chainNext').onclick=()=>{state.chain=(state.chain+1)%15;save();renderChain()};$('chainRestart').onclick=()=>{state.chain=0;save();renderChain()};render()
})();
</script></body></html>
