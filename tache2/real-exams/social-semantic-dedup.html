</style></head><body><main class="wrap"><nav class="nav"><a href="social-dedup.html">← 返回第一轮211条去重 List</a><a href="theme-study.html?theme=social">返回原始17题</a></nav><h1>社交聚会与个人生活｜二轮语义去重 List</h1><p class="muted">以“核心提问功能”为单位整合语义相同或高度相似的问题；原句、时态、人称、情境和出处全部保留在“展开原句／变体”中。与第一轮211条学习状态互不影响。此版仅合并高置信度、可复用的核心提问功能。不同的用途、必要情境及原句都保留；每组可展开全部原句及来源，供人工审核。不改变原题库。</p>
<section class="panel stats" id="stats"></section><section class="panel controls"><select id="category" aria-label="提问功能"></select><select id="filter"><option value="all">全部学习状态</option><option value="new">未学习</option><option value="review">待复习</option><option value="mastered">已掌握</option><option value="favorite">收藏</option></select><select id="sort"><option value="freq">按合并频次</option><option value="original">原题顺序</option><option value="alpha">按法语字母</option></select><input id="search" type="search" placeholder="搜索法语、中文、提问功能、变体"><button id="view" class="primary">切换：逐句学习</button></section><p id="speech" class="meta">Piper · fr_FR-siwis-medium（沿用已有静态音频；未覆盖的文本将提示）</p><section class="panel"><div class="nav"><strong id="results"></strong><span class="meta" id="position"></span></div><div id="list"></div><div class="pagination" id="pager"></div></section></main>
<script src="theme-piper.js?v=housing-round2-final-20261018"></script>
<script>(async()=>{
'use strict';
const payload=await (await fetch('data/social.json?v=1',{cache:'no-cache'})).json();
const G=[[31,46,89,118,133,146,159],[16,32,47,119,134,160],[17,33,48,120,135,148,161],[18,34,49,91,121,136],[35,50,122,149],[36,123,137,150,202],[19,125,138,154,173],[38,126,162,179],[39,127,152,163],[37,141,158],[42,95,139],[53,196],[56,191],[97,192],[80,99],[131,169],[65,74],[11,200],[28,156,168],[130,164],[189,190],[51,100],[194,82]], $=id=>document.getElementById(id),KEY='TCF-T2-SOCIAL-SEMANTIC-V1';
const questions=payload.entries.sort((a,b)=>a.month.localeCompare(b.month)||a.number-b.number);
const cats=['聚会与活动','时间与安排','地点与交通','邀请与参与','费用与支付','餐饮与准备','人际关系与沟通','个人生活与近况','服务与设施','规则与条件','评价与建议','其他'];
function category(r){
 const s=(r.dimension+' '+r.sub+' '+r.zh).toLowerCase();
 if(/费用|价格|预算|支付|多少钱|收费|折扣|优惠|分摊|付款/.test(s))return '费用与支付';
 if(/时间|日期|几点|什么时候|多久|时长|开放|营业|频率|开始|结束/.test(s))return '时间与安排';
 if(/地点|交通|路线|位置|地址|停车|距离|怎么去|如何到达|周边/.test(s))return '地点与交通';
 if(/邀请|参加|报名|人数|谁会|能否来|参与|出席|宾客|客人/.test(s))return '邀请与参与';
 if(/吃|喝|餐饮|食物|饮料|菜单|餐厅|准备|带什么|蛋糕|礼物/.test(s))return '餐饮与准备';
 if(/关系|朋友|认识|沟通|交流|联系|相处|交友|社交圈/.test(s))return '人际关系与沟通';
 if(/住房|近况|现居|生活|工作|家庭|爱好|日常|经历|个人/.test(s))return '个人生活与近况';
 if(/设施|设备|服务|场地|音乐|音响/.test(s))return '服务与设施';
 if(/条件|规定|限制|要求|手续|规则|着装/.test(s))return '规则与条件';
 if(/评价|推荐|建议|体验|意见|适合|如何选择/.test(s))return '评价与建议';
 if(/聚会|活动|派对|庆祝|节日|组织|娱乐|节目|出游|旅行/.test(s))return '聚会与活动';
 return '其他';
}
const unique=new Map();let total=0;questions.forEach(q=>q.rows.forEach(r=>{total++;const key=r.fr.trim().normalize('NFC');if(!unique.has(key))unique.set(key,{fr:r.fr,zh:r.zh,dim:r.dimension,sub:r.sub,cat:category(r),refs:[]});unique.get(key).refs.push({q,r})}));const list=[...unique.values()];
const p=Array.from({length:list.length},(_,i)=>i);function root(i){return p[i]===i?i:(p[i]=root(p[i]))}G.forEach(g=>g.slice(1).forEach(i=>{p[root(i-1)]=root(g[0]-1)}));const mm=new Map();list.forEach((x,i)=>{const k=root(i);if(!mm.has(k))mm.set(k,{...list[k],id:k,variants:[],refs:[]});mm.get(k).variants.push(x);mm.get(k).refs.push(...x.refs)});const all=[...mm.values()].sort((a,b)=>a.id-b.id);
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){};function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}}
function state(x){return saved[x.id]||{status:'new',favorite:false}};function update(x,t){let s={...state(x)};if(t==='favorite')s.favorite=!s.favorite;else s.status=t;saved[x.id]=s;persist();render()}
function speak(fr){if(window.TCF_THEME_PIPER?.play)window.TCF_THEME_PIPER.play(fr,$('speech'),1);else $('speech').textContent='Piper 播放器未成功加载';}
function n(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function btn(txt,fn,active){const b=n('button',active?'active':'',txt);b.onclick=fn;return b}
$('stats').innerHTML='<span class="stat"><b>'+questions.length+'</b> 道真题</span><span class="stat"><b>'+total+'</b> 原始提问</span><span class="stat"><b>'+list.length+'</b> 第一轮去重</span><span class="stat"><b>'+all.length+'</b> 第二轮核心提问</span><span class="stat" id="done"></span>';
$('category').innerHTML='<option value="all">全部提问功能（'+all.length+'）</option>'+cats.map(c=>'<option value="'+c+'">'+c+'（'+all.filter(x=>x.cat===c).length+'）</option>').join('');
let focus=false,index=0,page=0;function filtered(){const c=$('category').value,f=$('filter').value,q=$('search').value.toLowerCase().trim(),sort=$('sort').value;const a=all.filter(x=>(c==='all'||x.cat===c)&&(!q||[...x.variants.map(v=>v.fr+' '+v.zh),x.cat,x.dim,x.sub].join(' ').toLowerCase().includes(q))&&(f==='all'||f==='favorite'&&state(x).favorite||f==='new'&&state(x).status==='new'||f===state(x).status));if(sort==='freq')a.sort((a,b)=>b.variants.length-a.variants.length||a.id-b.id);if(sort==='alpha')a.sort((a,b)=>a.fr.localeCompare(b.fr,'fr'));if(sort==='original')a.sort((a,b)=>a.id-b.id);return a}
function draw(x,idx){const s=state(x),it=n('article','item');it.append(n('div','meta',idx+' · '+x.cat+' · '+x.dim+' / '+x.sub+' · '+x.variants.length+'种原句表达'));const fr=n('div','fr',x.fr);const zh=n('div','zh',x.zh);if(focus){it.append(zh);fr.classList.add('hide');it.append(fr,btn('显示 / 隐藏法语',()=>fr.classList.toggle('hide')))}else it.append(fr,zh);
const action=n('div','actions');action.append(btn('🔊 发音',()=>speak(x.fr)),btn('✅ 已掌握',()=>update(x,'mastered'),s.status==='mastered'),btn('🟡 待复习',()=>update(x,'review'),s.status==='review'),btn(s.favorite?'★ 已收藏':'☆ 收藏',()=>update(x,'favorite'),s.favorite));it.append(action);
const details=n('details','variants');const summary=n('summary','', '展开原句／变体（'+x.variants.length+'种表达，'+x.refs.length+'条原题来源）');details.append(summary);const ul=n('ul');x.variants.forEach(v=>{const li=n('li');li.append(n('span','',v.fr+' — '+v.zh+' '),btn('🔊',()=>speak(v.fr)));v.refs.forEach(({q,r})=>{const a=n('a','',q.month+' 第'+q.number+'题 #'+r.n);a.href='theme-study.html?theme=social&month='+encodeURIComponent(q.month)+'&question='+q.number+'&row='+r.n;li.append(' ',a)});ul.append(li)});details.append(ul);it.append(details);return it}
function render(){const a=filtered();$('done').textContent='✅ '+all.filter(x=>state(x).status==='mastered').length+' / '+all.length+' 已掌握';$('list').replaceChildren();$('pager').replaceChildren();$('results').textContent='当前筛选：'+a.length+' 条';$('view').textContent=focus?'切换：完整清单':'切换：逐句学习';if(!a.length){$('position').textContent='';return}index=Math.min(index,a.length-1);if(focus){$('list').append(draw(a[index],index+1));$('position').textContent=(index+1)+' / '+a.length;$('pager').append(btn('← 上一句',()=>{index=(index+a.length-1)%a.length;render()}),btn('下一句 →',()=>{index=(index+1)%a.length;render()}))}else{const pages=Math.ceil(a.length/30);page=Math.min(page,pages-1);a.slice(page*30,page*30+30).forEach((x,i)=>$('list').append(draw(x,page*30+i+1)));$('position').textContent='第 '+(page+1)+' / '+pages+' 页';$('pager').append(btn('← 上一页',()=>{page=Math.max(0,page-1);render()}),btn('下一页 →',()=>{page=Math.min(pages-1,page+1);render()}))}}
['category','filter','sort'].forEach(x=>$(x).onchange=()=>{index=page=0;render()});$('search').oninput=()=>{index=page=0;render()};$('view').onclick=()=>{focus=!focus;index=page=0;render()};render();
})();</script></body></html>
