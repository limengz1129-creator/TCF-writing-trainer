<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BonTCF T3 · 159题核心论点</title><meta name="theme-color" content="#f7f8fc">
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#24314b;background:#f6f7fc}*{box-sizing:border-box}body{margin:0;padding:24px;max-width:1320px;margin:auto}header{margin-bottom:20px}.small{color:#69758a;font-size:.9rem}h1{margin:.25rem 0;font-size:clamp(1.35rem,2.5vw,2.1rem)}a{color:#4c57df;text-decoration:none}.top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.pill{background:#5058e9;color:white;padding:9px 14px;border-radius:12px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}select,input,button{font:inherit;border:1px solid #dce2ed;border-radius:10px;padding:10px 12px;background:white;color:#27334b}input{flex:1;min-width:190px}button{cursor:pointer}button:hover{background:#edf0ff}.layout{display:grid;grid-template-columns:225px 1fr;gap:16px}.subjects{background:white;border:1px solid #e0e5ef;padding:12px;border-radius:16px;align-self:start}.subject{display:flex;width:100%;border:none;justify-content:space-between;margin:3px 0;text-align:left;padding:12px 10px}.subject.active{background:#e7e9ff;color:#3344ba;font-weight:700}.list{display:grid;gap:12px}.item{border:1px solid #e2e6ee;border-radius:14px;background:white;padding:17px}.item summary{cursor:pointer;list-style:none}.item summary::-webkit-details-marker{display:none}.heading{display:flex;justify-content:space-between;align-items:start;gap:8px}.q{font-size:1.05rem;line-height:1.6;font-weight:650}.meta{font-size:.82rem;color:#728099;margin-top:7px}.score{white-space:nowrap;font-weight:700;color:#795519}.args{display:grid;gap:10px;border-top:1px solid #eef0f5;margin-top:13px;padding-top:14px}.arg{border-left:3px solid #5058e9;padding:8px 12px;background:#f8f9ff;border-radius:6px}.arg.new{border-left-color:#c78631;background:#fffaf1}.fr{font-size:1rem;line-height:1.6}.zh{font-size:.9rem;color:#68768a;margin-top:6px}.part{font-size:.78rem;color:#5965b9;margin-bottom:5px}.new .part{color:#9a601b}.status{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:13px;flex-wrap:wrap}.status select{font-size:.87rem;padding:7px}.hidden{display:none!important}.empty{padding:26px;background:white;border-radius:12px}.alert{border:1px solid #e2bf88;background:#fff8ec;border-radius:10px;padding:10px;margin:12px 0;color:#865f26;font-size:.89rem}@media(max-width:800px){body{padding:12px}.layout{grid-template-columns:1fr}.subjects{display:flex;overflow-x:auto;padding:5px}.subject{white-space:nowrap;width:auto;gap:5px}.controls{margin:12px 0}.q{font-size:1rem}}
</style></head><body>
<header><div class="top"><a href="./" aria-label="返回语料主页">← 口语 T3 主页</a><span class="pill">BonTCF 真题论点匹配</span><a href="./#argumentMapView">论点地图</a></div>
<h1>159组真题 · 三条 C1 核心论点</h1><div class="small">九大主题分类 · 默认低分优先 · 已有论点直接来自 C1 冲刺复习模块，新论点独立标记</div></header>
<div class="controls"><input id="search" type="search" placeholder="搜索法语真题或论点"><select id="sort"><option value="score">历史最低分：低到高</option><option value="name">题目 A–Z</option></select><select id="stage"><option value="">全部复习状态</option><option value="new">未学习</option><option value="doing">学习中</option><option value="mastered">已掌握</option></select><select id="kind"><option value="">全部匹配类型</option><option value="existing">只看全部旧素材</option><option value="supplement">含新增论点</option><option value="unresolved">含待核索引</option></select></div>
<div id="notice" class="alert hidden"></div><div class="layout"><aside id="subjects" class="subjects"></aside><section><div id="count" class="small" style="margin-bottom:9px"></div><div id="list" class="list"></div></section></div>
<script src="c1-travel-data.js"></script>
<script src="c1-career-data.js"></script>
<script src="c1-education-data.js"></script>
<script src="c1-media-data.js"></script>
<script src="c1-tech-data.js"></script>
<script src="c1-health-data.js"></script>
<script src="c1-environment-data.js"></script>
<script src="c1-social-data.js"></script>
<script src="c1-family-data.js"></script><script src="bontcf-t3-data.js"></script><script src="bontcf-t3-supplements.js"></script>
<script>
'use strict';
const topics=['旅行与移民','职业与职场','教育与儿童','媒体与文化','科技与网络','饮食与健康','环境与城市','社会与公共事务','家庭与人际'];
const records={'旅行与移民':window.TCF_C1_TRAVEL,'职业与职场':window.TCF_C1_CAREER,'教育与儿童':window.TCF_C1_EDUCATION,'媒体与文化':window.TCF_C1_MEDIA,'科技与网络':window.TCF_C1_TECH,'饮食与健康':window.TCF_C1_HEALTH,'环境与城市':window.TCF_C1_ENVIRONMENT,'社会与公共事务':window.TCF_C1_SOCIAL,'家庭与人际':window.TCF_C1_FAMILY};
const byRecord=Object.fromEntries(Object.entries(records).map(([k,v])=>[k,new Map((v||[]).map(x=>[x.id,x]))]));
const $=s=>document.querySelector(s), qs=window.BONT_T3_GROUPS||[], supplements=window.BONT_T3_SUPPLEMENTS||[];
let sel='全部',progress={};try{progress=JSON.parse(localStorage.getItem('bontcf-t3-159-progress')||'{}')}catch{}
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function parseCore(raw){let t=String(raw||'').split(/例子关键词|Exemple-clé/)[0].replace(/\s+/g,' ').trim();let m=t.match(/[\u3400-\u9fff]/);return m?[t.slice(0,m.index).trim(),t.slice(m.index).trim()]:[t,''];}
function groupKey(q){let s=norm(q);if(s.includes('celebrites')&&s.includes('raisons'))return'celebs';if(s.includes('ne jamais avoir d’enfants'))return'nochildren';if(s.includes('sportifs professionnels')&&s.includes('argent'))return'athletes';if(s.includes('place accordée aux animaux'))return'pets';if(s.includes('mesures prises')&&s.includes('pollution'))return'localpollution';if(s.includes('trier ses déchets'))return'recycling';if(s.includes('travailler a distance')&&s.includes('tout le monde'))return'remote';if(s.includes('lutter contre le stress'))return'stress';return null}
function getArg(q,a,slot){const record=byRecord[a.topic]?.get(a.record);if(record){let [fr,zh]=parseCore(record.core);return {fr,zh,kind:'existing',name:'已有 C1',source:record.id,topic:a.topic}}let s=supplements.find(x=>x.group===groupKey(q.q)&&x.slot===slot);if(s)return {fr:s.core,zh:s.zh,kind:'supplement',name:'新增核心论点',topic:s.topic};return{fr:'此条索引仍需确认，不应直接背诵。',zh:a.state||'待核对',kind:'unresolved',name:'待确认',topic:a.topic}}
const normalized=qs.map(q=>({...q,topic:q.args.find(a=>topics.includes(a.topic))?.topic||'社会与公共事务',matched:q.args.map((a,i)=>getArg(q,a,i+1))}));
function filters(){let term=norm($('#search').value),st=$('#stage').value,kind=$('#kind').value;let data=normalized.filter(q=>(sel==='全部'||q.topic===sel)&&(!term||norm(q.q+' '+q.matched.map(a=>a.fr+' '+a.zh).join(' ')).includes(term))&&(!st||(progress[q.id]||'new')===st)&&(!kind||(kind==='existing'?q.matched.every(a=>a.kind==='existing'):kind==='supplement'?q.matched.some(a=>a.kind==='supplement'):q.matched.some(a=>a.kind==='unresolved'))));if($('#sort').value==='name')data.sort((a,b)=>a.q.localeCompare(b.q,'fr'));else data.sort((a,b)=>(a.score??999)-(b.score??999));return data;}
function dom(tag,cls,value){let x=document.createElement(tag);if(cls)x.className=cls;if(value!==undefined)x.textContent=value;return x}
function renderSubjects(){let box=$('#subjects');box.replaceChildren();for(let t of ['全部',...topics]){let count=normalized.filter(q=>t==='全部'||q.topic===t).length;let b=dom('button','subject'+(t===sel?' active':''));b.append(dom('span','',t),dom('span','small',count));b.onclick=()=>{sel=t;render()};box.append(b)}}
function render(){renderSubjects();let rows=filters();$('#count').textContent='显示 '+rows.length+' / '+qs.length+' 组真题（语义去重后）';let list=$('#list');list.replaceChildren();if(!rows.length){list.append(dom('div','empty','没有符合条件的真题'));return;}
for(let q of rows){let details=dom('details','item'),sum=dom('summary'),heading=dom('div','heading');let left=dom('div');left.append(dom('div','q',q.q),dom('div','meta',q.topic+' · '+q.matched.filter(a=>a.kind==='supplement').length+' 条新增核心论点'));heading.append(left,dom('div','score',q.score===null?'未练习':q.score+'/20'));sum.append(heading);details.append(sum);let args=dom('div','args');q.matched.forEach((a,i)=>{let row=dom('div','arg'+(a.kind==='supplement'?' new':''));row.append(dom('div','part','论点 '+(i+1)+' · '+a.name),dom('div','fr',a.fr),dom('div','zh',a.zh));args.append(row)});let footer=dom('div','status');let select=dom('select');for(let [v,k] of [['new','未学习'],['doing','学习中'],['mastered','已掌握']]){let o=dom('option','',k);o.value=v;select.append(o)}select.value=progress[q.id]||'new';select.onchange=()=>{progress[q.id]=select.value;localStorage.setItem('bontcf-t3-159-progress',JSON.stringify(progress));if($('#stage').value)render()};footer.append(select,dom('div','small','仅显示核心论点 · 原文可在 C1 冲刺复习中查看'));args.append(footer);details.append(args);list.append(details)}}
for(let id of ['#search','#sort','#stage','#kind'])$(id).addEventListener(id==='#search'?'input':'change',render);
if(qs.length!==159){$('#notice').classList.remove('hidden');$('#notice').textContent='题目数量异常：预期159组，实际'+qs.length+'组，请检查数据文件。'}
render();
</script></body></html>
