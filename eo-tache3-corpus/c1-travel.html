<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅行与移民 · C1 冲刺试点</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif;color:#26314a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #dde3ed;padding:20px max(4vw,16px)}h1{font-size:1.55rem;margin:8px 0}a{color:#2454a2}button{cursor:pointer;border:1px solid #b9c7df;background:#fff;color:#243f71;border-radius:8px;padding:9px 12px}button.active{background:#234b86;color:white}main{display:grid;grid-template-columns:285px minmax(0,1fr);gap:20px;max-width:1250px;margin:auto;padding:20px}nav{background:#fff;border:1px solid #e0e5ef;border-radius:12px;padding:12px;align-self:start;max-height:82vh;overflow:auto;position:sticky;top:14px}nav button{width:100%;text-align:left;margin:3px 0;font-size:13px}nav .mother{margin-left:13px;width:calc(100% - 13px)}article{background:white;border:1px solid #dfe5ee;border-radius:12px;padding:18px;margin-bottom:14px}article h2{font-size:1.18rem;margin:5px 0 12px}article h3{font-size:1rem;margin:4px 0}.muted{color:#66758f;font-size:.89rem}.tag{font-size:.8rem;color:#4a647e}.bodycopy{white-space:pre-wrap;line-height:1.72}.bodycopy p{margin:6px 0}.label{font-weight:650;margin:16px 0 8px}.fr{color:#132a4d}.zh{color:#647087;font-size:.94em}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}details{margin-top:12px}summary{cursor:pointer;color:#28578e}#search{font:inherit;border:1px solid #b6c4d7;padding:11px;width:100%;border-radius:8px}#notice{font-size:.91rem;color:#68768b}.hidden{display:none}@media(max-width:750px){main{display:block;padding:12px}nav{position:static;max-height:240px;margin-bottom:12px}header{padding:15px}article{padding:14px}}
</style></head><body><header><div class="muted">TCF Canada · Tâche 3 · C1 冲刺试点</div><h1>旅行与移民｜按原思维导图学习</h1><p class="muted">8 主分支 · 28 母论点 · 72 个冲刺示范段；保留原始永久 ID 与融合关系。原情境中的交叉引用以来源 ID 回溯。</p><div class="tabs"><a href="./">← 原始论段与思维导图</a><button class="active" id="all">全部内容</button><button id="compact">关键词速览</button></div><input id="search" placeholder="搜索情境、母论点、原论段 ID、法语表达"><p id="notice"></p></header><main><nav id="tree" aria-label="思维导图分层索引"></nav><section id="cards"></section></main><script src="c1-travel-data.js"></script><script>
(()=>{'use strict';const data=window.TCF_C1_TRAVEL||[];const tree=document.getElementById('tree'),cards=document.getElementById('cards'),search=document.getElementById('search'),notice=document.getElementById('notice');let selected='',compact=false;const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const wrap=s=>esc(s).replace(/\n/g,'<br>');const idKey=d=>d.group+'::'+d.mother;const mothers=[...new Map(data.map(d=>[idKey(d),d])).values()];for(const g of [...new Set(data.map(d=>d.group))]){const title=document.createElement('button');title.textContent=g;title.onclick=()=>{selected=g;render()};tree.append(title);for(const m of mothers.filter(x=>x.group===g)){const b=document.createElement('button');b.className='mother';b.textContent=m.mother;b.onclick=()=>{selected=idKey(m);render();window.scrollTo(0,0)};tree.append(b)}}
const block=(label,s,detail=false)=>!s?'':detail?'<details><summary>'+label+'</summary><div class="bodycopy">'+wrap(s)+'</div></details>':'<div class="label">'+label+'</div><div class="bodycopy">'+wrap(s)+'</div>';
function render(){const q=search.value.trim().toLowerCase();const filtered=data.filter(d=>(!selected||d.group===selected||idKey(d)===selected)&&(!q||[d.id,d.group,d.mother,d.scene,d.source,d.question,d.core,d.vocab,d.chain,d.text].join(' ').toLowerCase().includes(q)));notice.textContent='当前显示 '+filtered.length+' / '+data.length+' 个示范段'+(selected?' · '+selected.replace('::',' / '):'');cards.innerHTML=filtered.map(d=>'<article id="c1-'+esc(d.id)+'"><div class="tag">'+esc(d.group)+' → '+esc(d.mother)+'</div><h2>'+esc(d.scene)+' · '+esc(d.id)+'</h2><div class="muted">原始论段 ID：'+esc(d.source)+'<br>原题 ID：'+esc(d.question)+'</div>'+block('① 核心论点＋例子关键词',d.core)+(!compact?block('② 精简词块',d.vocab,true)+block('③ 中法逻辑链',d.chain,true)+block('④ 法语论段＋逐句中文',d.text,true):'')+'<div class="tabs"><a href="./">返回原稿 / 论点地图</a><button type="button" onclick="navigator.clipboard&&navigator.clipboard.writeText('+JSON.stringify('')+')" class="hidden">复制</button></div></article>').join('')||'<article>未找到匹配的内容。</article>';tree.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.textContent===selected||selected.endsWith('::'+b.textContent)))}search.addEventListener('input',render);document.getElementById('all').onclick=()=>{compact=false;selected='';document.getElementById('all').classList.add('active');document.getElementById('compact').classList.remove('active');render()};document.getElementById('compact').onclick=()=>{compact=true;document.getElementById('compact').classList.add('active');document.getElementById('all').classList.remove('active');render()};render()})();
</script></body></html>
