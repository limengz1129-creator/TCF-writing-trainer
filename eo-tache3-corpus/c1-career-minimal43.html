*{box-sizing:border-box}body{font:16px/1.65 system-ui,-apple-system,"PingFang SC",sans-serif;background:#f6f7fb;color:#24314a;margin:0;padding:24px;max-width:1150px;margin:auto}a{color:#4551c4;text-decoration:none}.header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.tag{background:#e8ecff;color:#4551bb;padding:4px 12px;border-radius:18px;font-weight:700}h1{margin:14px 0 5px;font-size:clamp(23px,3vw,31px)}.sub{color:#69758a;font-size:14px}.tools{margin:18px 0;display:flex;flex-wrap:wrap;gap:9px}select,input,button{font:inherit;color:inherit;border-radius:10px;background:white;border:1px solid #dce2ec;padding:9px 12px}button{cursor:pointer}button:hover{background:#f1f3ff}input{min-width:180px;flex:1}.wrap{display:grid;gap:12px}.unit{border-radius:15px;background:white;padding:18px 20px;border:1px solid #e0e5ef}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.unit h2{font-size:17px;margin:3px 0 7px}.muted{font-size:13px;color:#77839a}.fr{white-space:pre-line;line-height:1.9;color:#24314a;padding:13px 16px;background:#f6f8ff;border-radius:10px;margin-top:12px}.zh{font-size:14px;margin:10px 0;color:#52627b}.detail{font-size:14px;background:#fafbfe;padding:10px 13px;border-radius:8px;margin-top:8px}.detail strong{display:block;color:#4756ad}.options{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.options button,.options select{font-size:13px;padding:5px 9px}.hide-fr .fr{display:none}#summary{margin:0 0 13px;color:#596986}.note{border:1px solid #d8e0ed;background:#fff;padding:12px;border-radius:10px;font-size:14px;margin-top:12px}@media(max-width:650px){body{padding:12px}.unit{padding:14px}.tools>*{max-width:100%}}
</style></head><body><header><div class="header"><a href="./">← Tâche 3 首页</a><span class="tag">职业与职场 · C1 极简背诵</span><a href="bontcf-t3.html">BonTCF 159题</a></div><h1>43个主背单元</h1><div class="sub">71条原有情境保留在 C1 冲刺复习中；这里只展示跨情境融合后的短论段与替换关键词。</div></header>
<div class="note">这是独立试点，不覆盖原有71条 C1 记录及159题双向索引。43个短主段根据既有素材整理，按真题要求切换结论；不能把一套通用骨架重复当作三个独立理由。</div>
<div class="tools"><input id="search" type="search" placeholder="搜索法语、中文、母论点"><select id="mother"><option value="">全部母论点</option></select><select id="status"><option value="">全部进度</option><option value="new">未学习</option><option value="learning">学习中</option><option value="mastered">已掌握</option></select><button id="toggle">隐藏全部法语</button><label for="piperRate">语速</label><select id="piperRate"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.2">1.2×</option></select></div>
<p id="summary"></p><main id="list" class="wrap"></main>
<script src="c1-career-minimal43-data.js?v=career43-final-20261022"></script><script>
'use strict';
let currentAudio=null,currentUrl=null,playingButton=null,manifestPromise=null,playVersion=0;
function stopPiper(){playVersion++;if(currentAudio){currentAudio.pause();currentAudio.removeAttribute('src');currentAudio=null;}if(currentUrl){URL.revokeObjectURL(currentUrl);currentUrl=null;}if(playingButton){playingButton.textContent='🔊 Piper 朗读';playingButton=null;}}
function getAudioIndex(){if(!manifestPromise)manifestPromise=fetch('c1-career-minimal43-audio/manifest.json?v=career43-final-20261022',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('静态音频尚未部署');return r.json()}).catch(e=>{manifestPromise=null;throw e});return manifestPromise}
async function playPiper(sentence,btn){
 if(playingButton===btn){stopPiper();return;}stopPiper();const version=playVersion;btn.textContent='加载 Piper…';playingButton=btn;
 try{
  const manifest=await getAudioIndex();if(version!==playVersion)return;
  const entry=manifest.entries?.[sentence.trim()];if(!entry)throw Error('该原文尚未生成音频');
  const file=entry.reuse||entry.pack;
  const response=await fetch('c1-career-minimal43-audio/'+file);if(!response.ok)throw Error('音频包不存在');
  const pack=await response.json();if(version!==playVersion)return;
  const record=pack[entry.id];if(!record?.audio||record.text!==sentence.trim())throw Error('音频原文校验失败');
  const raw=atob(record.audio),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
  currentUrl=URL.createObjectURL(new Blob([bytes],{type:'audio/mpeg'}));
  currentAudio=new Audio(currentUrl);currentAudio.playbackRate=Number(document.getElementById('piperRate').value)||1;
  currentAudio.onended=()=>stopPiper();currentAudio.onerror=()=>{btn.title='音频无法解码';stopPiper()};
  btn.textContent='■ 停止';await currentAudio.play();
 }catch(err){if(version===playVersion){stopPiper();btn.textContent='音频未就绪';btn.title=err.message;}}
}
const units=window.TCF_CAREER_MINIMAL_43||[], $=id=>document.getElementById(id);let memorized={};try{memorized=JSON.parse(localStorage.getItem('tcf-career-minimal-43')||'{}')}catch{}
let showFrench=true;
const unique=[...new Set(units.flatMap(x=>x.mothers.match(/\d+/g)||[]))].sort((a,b)=>Number(a)-Number(b));
for(const m of unique){let o=document.createElement('option');o.value=m;o.textContent='母论点 '+m.padStart(2,'0');$('mother').append(o)}
function el(tag,cls,value){let n=document.createElement(tag);if(cls)n.className=cls;if(value!==undefined)n.textContent=value;return n}
function render(){stopPiper();let s=$('search').value.toLocaleLowerCase(),mother=$('mother').value,st=$('status').value;let filtered=units.filter(x=>(!mother||(x.mothers.match(/\d+/g)||[]).some(v=>Number(v)===Number(mother)))&&(!st||(memorized[x.id]||'new')===st)&&(!s||[x.id,x.title,x.fr,x.zh,x.variants,x.branches,x.references.join(' ')].join(' ').toLocaleLowerCase().includes(s)));$('summary').textContent='显示 '+filtered.length+' / '+units.length+' 个主背单元 · 已掌握 '+units.filter(x=>memorized[x.id]==='mastered').length+' 个';let list=$('list');list.replaceChildren();for(const x of filtered){const item=el('article','unit'+(showFrench?'':' hide-fr'));const header=el('div','row'),left=el('div');left.append(el('div','muted',x.id+' · 母论点 '+x.mothers+' · 原C1 '+x.references.join(' / ')),el('h2','',x.title));const opts=el('div','options'),speech=el('button','','🔊 Piper 朗读');speech.type='button';speech.title='Piper · fr_FR-siwis-medium';speech.onclick=()=>playPiper(x.fr,speech);const toggle=el('button','',showFrench?'隐藏法语':'显示法语');toggle.onclick=()=>{item.classList.toggle('hide-fr');toggle.textContent=item.classList.contains('hide-fr')?'显示法语':'隐藏法语'};let select=el('select');for(const [k,v] of [['new','未学习'],['learning','学习中'],['mastered','已掌握']]){let o=el('option','',v);o.value=k;select.append(o)}select.value=memorized[x.id]||'new';select.onchange=()=>{memorized[x.id]=select.value;localStorage.setItem('tcf-career-minimal-43',JSON.stringify(memorized));if(st)render();else $('summary').textContent='显示 '+filtered.length+' / '+units.length+' 个主背单元 · 已掌握 '+units.filter(x=>memorized[x.id]==='mastered').length+' 个'};opts.append(speech,toggle,select);header.append(left,opts);item.append(header,el('div','fr',x.fr),el('div','zh',x.zh));const v=el('div','detail');v.append(el('strong','','可替换情境关键词'),el('div','',x.variants));item.append(v);const b=el('div','detail');b.append(el('strong','','同组其他情境 · 不同论证方向'));for(const alt of (x.alternatives||[])){const line=el('div','',alt.id+' · '+alt.label);line.style.marginTop='8px';line.append(el('div','fr',alt.fr),el('div','zh',alt.zh));const altSpeak=el('button','','🔊 Piper 朗读');altSpeak.onclick=()=>playPiper(alt.fr,altSpeak);line.append(altSpeak);b.append(line)}if(!(x.alternatives||[]).length)b.append(el('div','','本组保留一条独立C1核心论点'));item.append(b);list.append(item)}}for(const id of ['search','mother','status'])$(id).addEventListener(id==='search'?'input':'change',render);$('toggle').onclick=()=>{showFrench=!showFrench;$('toggle').textContent=showFrench?'隐藏全部法语':'显示全部法语';render()};document.getElementById('piperRate').onchange=()=>{if(currentAudio)currentAudio.playbackRate=Number(document.getElementById('piperRate').value)||1};render();
</script></body></html>
