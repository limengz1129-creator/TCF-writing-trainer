<script>
const RAW="TCF Canada · Tâche 1\nC1 统一学习稿｜20 道既有回答＋23 个新增模块＋132 条问法映射｜2026 年 11 月\n\n使用说明：保留原有七段结构。Tâche 1 是互动面谈，不必在开场完整背诵；问答作为可拆分素材。职业目\n前使用过去工作经历；家庭信息按当前真实情况，不虚构孩子。\n\n\nA. 自我介绍｜Présentation\n\n① 开场白：自我介绍\nBonjour ! Enchantée de faire votre connaissance.\n您好！很高兴认识您。\n\nJe m’appelle Megan, j’ai trente-trois ans et je suis originaire de Chine.\n我叫 Megan，今年 33 岁，来自中国。\n\n② 家庭介绍\nDepuis plusieurs années, je vis à Seattle, aux États-Unis. Je suis mariée depuis un peu plus de deux\nans.\n几年来，我一直生活在美国西雅图。我结婚已经两年多了。\n\nJe mène une vie bien remplie, entre mes projets personnels, l’apprentissage du français et mes\nactivités quotidiennes.\n我的生活很充实，包括个人计划、法语学习和日常活动。\n\n③ 职业\nSur le plan professionnel, j’ai obtenu mon MBA à New York, puis j’ai travaillé dans l’analyse de\ndonnées.\n在职业方面，我在纽约获得 MBA 学位，之后从事过数据分析工作。\n\nCe qui me passionne surtout, c’est de pouvoir analyser des données complexes, construire des\nmodèles statistiques et en tirer des informations utiles.\n最让我感兴趣的是分析复杂数据、建立统计模型，并从中提取有价值的信息。\n\nJ’aimerais reprendre ma carrière dans ce domaine et mettre mes compétences à profit.\n我希望重新从事这一领域的工作，充分发挥自己的专业能力。\n\n④ 兴趣爱好\nEn ce qui concerne mes loisirs, je me passionne pour la nutrition, notamment pour tout ce qui\ntouche à une alimentation saine et équilibrée.\n说到兴趣爱好，我对营养学很感兴趣，尤其关注健康均衡的饮食。\n\nLe week-end, j’aime faire des randonnées pour profiter de la nature. J’aime aussi cuisiner, ce qui\nme permet de me détendre et de découvrir de nouvelles recettes.\n\n\n周末我喜欢徒步、享受大自然，也喜欢烹饪，这让我放松并尝试新菜谱。\n\n⑤ 学习法语\nPar ailleurs, j’ai un véritable coup de cœur pour la langue française. Ce qui m’attire\nparticulièrement, c’est son élégance et sa richesse culturelle.\n此外，我对法语情有独钟，尤其喜欢它的优雅和丰富的文化内涵。\n\nPour moi, apprendre le français représente à la fois un défi intellectuel stimulant et une occasion\nde m’ouvrir à d’autres cultures.\n对我而言，学法语既是激发思考的智力挑战，也是接触其他文化的机会。\n\n⑥ 未来计划（定居加拿大）\nQuant à mes projets d’avenir, je souhaite m’établir au Canada.\n至于未来计划，我希望在加拿大定居。\n\nAprès plusieurs années aux États-Unis, je me suis bien habituée au mode de vie nord-américain. Le\nCanada présente de nombreuses similitudes culturelles, éducatives et professionnelles avec les\nÉtats-Unis.\n在美国生活多年后，我已习惯北美生活方式。加拿大与美国在文化、教育和职业环境上有许多共同之处。\n\nJ’aimerais y mettre à profit mon MBA et mon expérience en analyse de données, tout en profitant\nd’un rythme de vie qui me semble plus tranquille.\n我希望在那里发挥 MBA 学历和数据分析经验的价值，同时享受我认为更从容的生活节奏。\n\n⑦ 结尾\nVoilà, c’est une brève présentation de mon parcours et de mes projets.\n以上就是对我个人经历和未来计划的简要介绍。\n\nJ’espère pouvoir réaliser un jour mon projet de m’installer au Canada.\n我希望有一天能实现定居加拿大的计划。\n\n\nB. 职业｜Le travail\n01 · Pourquoi avez-vous choisi de travailler dans l’analyse de données ?\nJ’ai choisi ce domaine parce que j’aime résoudre des problèmes et comprendre comment les choses\nfonctionnent. Après mon MBA, j’ai découvert que l’analyse de données pouvait aider à prendre des\ndécisions plus éclairées. C’est ce mélange de logique et d’utilité concrète qui m’a attirée.\n\n02 · Qu’est-ce que vous aimez le plus dans ce métier ?\nCe qui me plaît le plus, c’est de repérer des tendances qu’on ne remarque pas forcément au\npremier regard. Analyser des données, c’est un peu comme résoudre une énigme. Et c’est\nsatisfaisant quand les résultats peuvent aider une entreprise à prendre de meilleures décisions.\n\n\n\n\n03 · En quoi consistait votre travail au quotidien ?\nJe nettoyais et analysais des données, notamment avec SQL, et je créais des tableaux de bord pour\nprésenter les résultats. Selon les projets, je pouvais aussi construire des modèles statistiques. Ce\nque j’aimais, c’était de transformer des informations complexes en recommandations utiles.\n\n\nC. 法语学习｜Le français\n04 · Pourquoi avez-vous décidé d’apprendre le français ?\nJ’ai commencé à apprendre le français parce que cette langue et sa culture m’intéressent\nbeaucoup. Et comme j’aimerais m’installer au Canada, le français pourrait aussi m’ouvrir\ndavantage de portes. C’est donc à la fois un plaisir personnel et un projet important pour mon\navenir.\n\n05 · Comment pratiquez-vous le français au quotidien ?\nJ’essaie d’intégrer le français dans mon quotidien autant que possible. Par exemple, j’écoute des\ncontenus en français, je lis des articles et je m’entraîne à parler à voix haute. Cela m’aide à\nréutiliser les expressions que j’apprends et à gagner progressivement en fluidité.\n\n06 · Quelles difficultés rencontrez-vous en apprenant le français ?\nCe qui me pose le plus de difficultés, c’est de trouver rapidement les bonnes expressions quand je\nparle spontanément. Parfois, je connais les mots, mais ils ne me viennent pas tout de suite. Alors, je\nm’entraîne régulièrement à les réutiliser dans différents contextes.\n\n\nD. 加拿大｜Le Canada\n07 · Pourquoi souhaitez-vous vous installer au Canada ?\nEn réalité, mon intérêt pour le Canada ne date pas d’hier. Il y a quelques années, j’avais même\ndéposé une candidature pour y faire un deuxième master, mais j’ai finalement renoncé à ce projet\naprès mon mariage aux États-Unis. Aujourd’hui, je connais bien le mode de vie nord-américain et\nj’aimerais m’installer au Canada pour y construire mon avenir. Je pourrais aussi mettre à profit\nmon MBA et mon expérience en analyse de données pour poursuivre ma carrière dans\nl’informatique.\n\n08 · Pourquoi le Canada plutôt qu’un autre pays ?\nAprès plusieurs années passées aux États-Unis, j’aimerais rester en Amérique du Nord. Le Canada\net les États-Unis ont beaucoup de points communs sur les plans culturel, éducatif et professionnel,\ndonc je pense que mon adaptation serait plus facile. Et puis, le rythme de vie au Canada me semble\nun peu plus tranquille, ce qui correspond davantage à mes préférences.\n\n\n\n\n09 · Qu’est-ce qui vous attire dans la culture canadienne ?\nCe qui m’attire particulièrement, c’est la diversité culturelle du Canada. J’aime l’idée que des\npersonnes d’origines différentes puissent partager leurs traditions. J’apprécie aussi la place\naccordée aux activités de plein air et, à mes yeux, l’importance de la qualité de vie.\n\n10 · Comment comptez-vous vous adapter à la vie au Canada ?\nD’abord, je voudrais continuer à améliorer mon français afin de communiquer plus facilement au\nquotidien. J’aimerais aussi participer à des activités locales pour rencontrer des gens. Comme j’ai\ndéjà vécu, étudié et travaillé en Amérique du Nord, je pense que cette expérience pourrait faciliter\nmon adaptation.\n\n\nE. 生活与爱好｜La vie quotidienne et les loisirs\n11 · Comment organisez-vous vos journées ?\nEn ce moment, je consacre une bonne partie de mon temps à l’apprentissage du français et à mes\nprojets personnels. J’essaie de garder un rythme régulier. Quand j’ai un moment libre, j’aime\ncuisiner ou me promener pour changer d’air.\n\n12 · Pourquoi aimez-vous cuisiner avec d’autres personnes ?\nCe que j’aime, c’est surtout le côté convivial. On peut discuter, essayer de nouvelles recettes et\npartager un bon moment. Pour moi, préparer un repas ensemble est souvent aussi agréable que de\nle déguster.\n\n13 · Quel type de randonnées aimez-vous faire ?\nJ’aime surtout les randonnées en forêt ou près des lacs, car je trouve ces endroits très apaisants.\nQuand il fait beau, je préfère les sentiers offrant de beaux points de vue, surtout au bord de l’eau.\nC’est une façon de prendre l’air et de me ressourcer.\n\n\nE2. 加拿大动机与身份｜追问补充（新增）\n14 · Pourquoi souhaitez-vous vous installer au Canada maintenant ?\nMême si j’ai renoncé à mon projet d’études à l’époque, je n’ai jamais vraiment abandonné l’idée de\nvivre au Canada. Aujourd’hui, après plusieurs années aux États-Unis, j’aimerais reprendre ma\ncarrière et construire un projet de vie plus stable à long terme.\n\n15 · Pourquoi ne restez-vous pas aux États-Unis ?\nActuellement, mon statut de personne à charge aux États-Unis ne me permet pas de travailler sans\nautorisation spécifique. Pourtant, j’ai un MBA et de l’expérience dans l’analyse de données. Si\nj’obtenais la résidence permanente au Canada, je pourrais y travailler légalement et reprendre ma\ncarrière. C’est donc une option qui correspond mieux à mes projets professionnels.\n\n\n\n\n16 · Quel avantage aurait votre diplôme américain au Canada ?\nJ’ai obtenu mon MBA à New York et j’ai déjà travaillé dans l’analyse de données. Je pense que cette\nformation et mon expérience pourraient m’aider à m’intégrer au marché du travail canadien,\nmême si les conditions de recrutement varient selon les employeurs.\n\n17 · Avez-vous déjà visité le Canada ?\nPas encore, malheureusement. Même si je vis aux États-Unis depuis plusieurs années, je n’ai pas\nencore eu l’occasion d’aller au Canada. Je me suis renseignée sur le pays et j’aimerais vraiment le\ndécouvrir par moi-même avant de prendre une décision définitive.\n\n18 · Qu’est-ce qui vous plaît dans le mode de vie canadien ?\nJ’ai l’impression que le rythme de vie y est un peu plus tranquille qu’aux États-Unis. J’accorde aussi\nde l’importance à l’accès aux services publics, notamment dans les domaines de la santé et de\nl’éducation. Bien sûr, j’aimerais découvrir la réalité sur place.\n\n19 · Quel est votre projet professionnel au Canada ?\nMon objectif serait de reprendre une carrière dans l’informatique, plus précisément dans l’analyse\nde données. J’aimerais mettre à profit mes compétences techniques, mon MBA et mon expérience\nprofessionnelle, tout en continuant à me former.\n\n20 · Pourquoi aviez-vous abandonné votre projet de deuxième master au Canada ?\nÀ l’époque, j’avais fait une demande pour suivre un deuxième master au Canada. Mais ma\nsituation personnelle a changé : je me suis mariée et je suis restée aux États-Unis. J’ai donc mis ce\nprojet de côté, sans perdre mon intérêt pour le Canada.\n\n\nF. 核心词汇与词块｜Vocabulaire et expressions clés\n\n身份、个人背景与家庭\n 法语词块 / 句型                                           中文释义 / 例句\n être originaire de Chine                            来自中国\n être mariée depuis un peu plus de deux ans          结婚两年多\n un statut de personne à charge                      家属身份\n une autorisation de travail                         工作许可\n obtenir la résidence permanente                     获得永久居民身份\n reprendre ma carrière                               恢复职业生涯\n un projet de vie à long terme                       长期生活规划\n\n\n学历、职业与数据分析\n 法语词块 / 句型                                           中文释义 / 例句\n obtenir un MBA à New York                           在纽约获得 MBA\n\ntravailler dans l’analyse de données               从事数据分析\nanalyser des données complexes                     分析复杂数据\nconstruire des modèles statistiques                建立统计模型\nen tirer des informations utiles                   从中提炼有用信息\ncréer des tableaux de bord                         制作数据看板\nmettre mes compétences à profit                    发挥专业能力\nmettre à profit mon expérience                     充分利用已有经验\npoursuivre ma carrière dans l’informatique         继续在 IT 领域发展\ns’intégrer au marché du travail canadien           融入加拿大就业市场\n\n\n加拿大、北美与未来规划\n法语词块 / 句型                                          中文释义 / 例句\nle mode de vie nord-américain                      北美生活方式\nprésenter de nombreuses similitudes                存在许多相似之处\nsur les plans culturel, éducatif et                在文化、教育与职业层面\nprofessionnel\nfaciliter mon adaptation                           帮助我适应\ns’installer durablement au Canada                  在加拿大长期定居\nun rythme de vie plus tranquille                   较从容的生活节奏\nl’accès aux services publics                       公共服务可及性\nles domaines de la santé et de l’éducation         医疗与教育领域\navoir déposé une candidature                       曾提交申请\nrenoncer à un projet                               放弃计划\nne pas dater d’hier                                并非最近才开始\nse renseigner sur un pays                          了解一个国家的信息\n\n\n法语、兴趣与生活\n法语词块 / 句型                                          中文释义 / 例句\nun véritable coup de cœur pour                     对……情有独钟\nun défi intellectuel stimulant                     富有挑战性的智力活动\ns’ouvrir à d’autres cultures                       接触其他文化\ngagner en fluidité                                 提高流利度\nune alimentation saine et équilibrée               健康均衡饮食\npartir en randonnée                                去徒步\n\nchanger d’air                                        换换环境\nse ressourcer                                        恢复精力、放松身心\n\n\n\nG. 高频口语句型｜Structures réutilisables\n\n24 条可迁移句框\n法语词块 / 句型                                            中文释义 / 例句\nCe qui me plaît le plus, c’est de...                 我最喜欢的是……；例：Ce qui me plaît le plus,\n                                                     c’est de repérer des tendances.\nCe qui fait la différence pour moi, c’est...         对我来说区别在于……；例：Ce qui fait la\n                                                     différence pour moi, c’est l’équilibre de vie.\nCe que j’apprécie particulièrement, c’est...         我尤其欣赏……\nC’est justement ce qui m’a attirée.                  这正是吸引我的地方。\nCela me permet de + infinitif                        这让我能够……\nJ’accorde beaucoup d’importance à + nom              我非常重视……\nJ’essaie de + infinitif                              我尝试……\nJ’ai parfois du mal à + infinitif                    我有时很难……\nCela correspond bien à mes aspirations.              这很符合我的期望。\nC’est avant tout une façon de + infinitif            这首先是一种……的方式。\nJe me suis orientée vers..., car...                  我转向了……，因为……\nCe qui me passionne surtout, c’est de...             最让我感兴趣的是……\nJe me passionne pour..., notamment pour...           我热衷……，尤其……\nJ’ai un véritable coup de cœur pour...               我对……情有独钟\nPour moi, ... représente à la fois... et...          对我来说，……既……又……\nD’une part..., d’autre part...                       一方面……另一方面……\nJ’aimerais mettre à profit...                        我希望充分利用……\nJe me suis déjà bien habituée à...                   我已经很好地适应……\nJe pense que ... pourrait faciliter...               我认为……可能帮助……\nIl y a quelques années, j’avais...                   几年前，我当时已经……（愈过去时）\nMême si ..., je n’ai jamais...                       即便……，我从未……\nSi j’obtenais..., je pourrais...                     如果我获得……，我就能够……\nÀ mes yeux, ... me semble...                         在我看来……似乎……\nJe n’ai pas encore eu l’occasion de...               我还没有机会……\n\n\n\nH. 备考备注与一致性检查\n• 家庭：不再虚构孩子；自我介绍只介绍已婚及结婚两年多。若考官问是否有孩子，可回答：Non, nous\nn’avons pas d’enfants.\n\n• 职业：目前没有美国工作许可，因此自我介绍使用过去时 j’ai travaillé；未来就业使用条件式 j’aimerais\nreprendre。\n\n• 加拿大：以北美文化延续、学历与职业经验可迁移、生活节奏和职业自主权作为理由；不宣称美国学位在\n加拿大自动获得认可。\n\n• 永久居民：回答“如果获得加拿大 PR 就可以工作”时用条件式，不暗示目前已经获得 PR。\n\n• 旅行：没有去过加拿大，如实回答；对加拿大的生活节奏和福利用 j’ai l’impression que / à mes yeux 表\n达个人印象。\n\n• 学习与职业规划：过去曾申请加拿大第二硕士，后来因结婚改变计划；当前优先继续 IT，不加入尚未决定\n的护理转行。\n\n• 考试：T1 是自然互动，考官可能很早打断。13 道基础问答与新增 7 道答案均为备用模块，不宜全部背诵输\n出。\n\n\n\nI. 198 场考生回忆库｜追问整合与覆盖索引\n审计口径：用户提供的 198 场 Tâche 1 回忆中，部分记录没有具体追问，仅写“有打断”或话题词。以下保留\n上一轮整理出的 132 个分类问法条目，逐一指定复用的已有答案（01–20）或新增回答模块（21–43）；不\n把缺乏原文的法语句子标注为考官原话。\n\n“直用”=可直接从指定稿回答；“调整”=需根据提问换时态/细节；“补充”=新增模块；“核实”=涉及未确认的个\n人事实，不预设虚构答案。不同条目之间可有语义重合，因此 132 并非 132 个独立母题。\n\n\nJ. 新增 23 个可复用追问模块｜21–43\n下面只新增覆盖明显缺口的模块；旧版 01–20 保留不重复编写。涉及未提供的个人经历以“运用提示”标明，\n避免把示例当事实。\n\n21｜家乡与出生城市｜Ville d’origine\nJe suis originaire de Chine. La ville où j’ai grandi a ses propres particularités, notamment sur le\nplan culturel. Ce qui m’intéresse, c’est de comparer ces habitudes avec celles que j’ai découvertes\naux États-Unis.\n我来自中国。我成长的城市有自己的特点，尤其是文化方面。我很喜欢比较家乡的生活习惯与在美国了解到\n的生活方式。\n运用提示：须补充真实出生城市、特色、一个具体对比，不预设城市。\n\n\n\n\n22｜西雅图生活与城市比较｜Vivre à Seattle\nJe vis dans la région de Seattle depuis quelque temps. J’aime particulièrement la proximité de la\nnature et les possibilités de faire des promenades. Bien sûr, il y a des différences avec les villes\nchinoises que je connais, mais je me suis progressivement adaptée.\n我在西雅图地区生活已有一段时间。我尤其喜欢附近的大自然和散步的机会。当然，这里与我熟悉的中国城\n市不同，但我已经逐渐适应。\n运用提示：“多久”“为什么搬来”“最喜欢哪方面”需按真实时间线补充。\n\n23｜家庭基本情况｜Situation familiale\nJe suis mariée depuis un peu plus de deux ans et nous n’avons pas d’enfants. En ce moment, je vis\naux États-Unis et je me concentre notamment sur mon apprentissage du français et mes projets\nprofessionnels.\n我结婚两年多了，我们没有孩子。目前我住在美国，主要投入法语学习与职业规划。\n运用提示：如问家人住在哪里、丈夫职业，请用真实事实作答；不用假设孩子。\n\n24｜丈夫职业与简单描述｜Mon mari\nMon mari travaille dans le secteur de l’informatique. C’est un domaine que je connais également\ngrâce à mon expérience en analyse de données. Nous avons donc certains centres d’intérêt\nprofessionnels en commun.\n我丈夫在 IT 行业工作。由于我有数据分析经验，这也是我熟悉的领域，因此我们有一些共同的职业兴趣。\n运用提示：问具体岗位、地点或性格时需按本人愿意公开的真实情况回答，可只做简短介绍。\n\n25｜学习经历与 MBA｜Mes études\nJ’ai fait un MBA à New York, ce qui m’a permis d’approfondir mes connaissances en gestion et en\nanalyse. Cette formation m’a donné envie d’utiliser les données pour résoudre des problèmes\nconcrets. Par la suite, je me suis orientée vers l’analyse de données.\n我在纽约读了 MBA，深入学习管理和分析。这段学习让我更想用数据解决实际问题，之后便转向数据分\n析。\n运用提示：可回答学什么、为何选专业、学习经历；问具体大学名称时如实补充。\n\n26｜美国留学与未留在其他国家｜Choix des études à l’étranger\nJ’avais choisi de poursuivre mes études aux États-Unis pour découvrir un environnement\nuniversitaire international. Cette expérience m’a permis de mieux connaître la vie nord-\naméricaine et a influencé mes projets professionnels.\n当初我选择在美国继续学习，是为了接触国际化大学环境。这段经历让我更了解北美生活，也影响了我的职\n业规划。\n运用提示：若被问为何不留某个其他国家，按真实经历调整，不虚构英国留学。\n\n27｜职业项目与技术工具｜Un exemple de projet\nDans mon travail, j’utilisais surtout SQL pour extraire et analyser des données, puis je présentais\nles résultats dans des tableaux de bord. Par exemple, l’objectif pouvait être de repérer une\ntendance et de rendre les informations plus faciles à utiliser pour l’équipe.\n\n工作中我主要用 SQL 提取和分析数据，再用看板呈现结果。例如，目标可能是发现某个趋势，帮助团队更方\n便地使用信息。\n运用提示：这里是通用工作流程示例，不是已核实的具体项目；请替换为你真实参与的项目。\n\n28｜职业技能、转行与未来求职｜Compétences et évolution\nGrâce à mes études et à mon expérience, j’ai développé mon esprit d’analyse et ma capacité à\nprésenter des résultats clairement. Aujourd’hui, j’aimerais reprendre mon activité dans\nl’informatique, idéalement dans un poste lié aux données.\n通过学习和工作，我培养了分析思维和清晰呈现结果的能力。如今我希望重返 IT 行业，最好从事数据相关\n岗位。\n运用提示：可衔接现有 19 题；为何未从事本专业工作需依据真实本科专业回答。\n\n29｜法语学习时间、课程和其他语言｜Parcours linguistique\nJ’apprends le français dans le cadre de mon projet personnel. Je travaille surtout la compréhension\net l’expression orales, et j’essaie d’en faire un peu chaque jour. J’ai aussi appris l’anglais au cours\nde mon parcours scolaire et professionnel.\n我学习法语是出于个人规划，主要练听力和口语，并尽量每天练习一点。此前在学习和工作经历中也学过英\n语。\n运用提示：开始日期、是否上过课、会说几种语言、童年学习经历应按真实事实补充。\n\n30｜TCF 考试目的｜Pourquoi passer le TCF ?\nJe passe le TCF Canada pour évaluer mon niveau de français et avancer dans mon projet\nd’installation au Canada. C’est aussi un objectif concret qui me motive à pratiquer régulièrement.\n我参加 TCF Canada 是为了评估自己的法语水平，并推进定居加拿大的计划。这也是一个推动我持续练习的\n具体目标。\n运用提示：第几次考试根据真实考试经历回答。\n\n31｜法国文化具体兴趣｜La culture francophone\nLa langue française m’intéresse pour sa sonorité, mais aussi parce qu’elle me permet d’accéder à\ndes films, des livres et des points de vue différents. Ce qui me plaît, c’est de découvrir une culture à\ntravers sa langue.\n法语的声音很吸引我，它也让我接触不同的电影、书籍和观点。我喜欢通过语言了解文化。\n运用提示：若问最喜欢的电影、书籍或作品，准备一项真实例子。\n\n32｜加拿大家庭同行、亲友与到访｜Liens au Canada\nJe n’ai pas encore eu l’occasion de visiter le Canada. Pour le moment, je souhaite surtout mieux\nconnaître le pays et les possibilités qui correspondraient à mon projet professionnel. Je préfère\npréparer les étapes une par une.\n我还没机会去加拿大。目前我首先想更了解这个国家，以及与我职业规划相符的机会。我希望一步一步准\n备。\n运用提示：“是否有朋友/亲属”“是否与丈夫同行”不能从现有资料确定，应如实回答。\n\n\n\n33｜烹饪细节、饮食偏好｜Cuisine et nutrition\nJ’aime préparer des repas simples et équilibrés. Ce qui m’intéresse, c’est de choisir des ingrédients\nvariés et de trouver un bon équilibre entre le goût et la santé. J’aime aussi essayer de nouvelles\nrecettes.\n我喜欢做简单均衡的饭菜。我注重选择多样的食材，在口味与健康之间找到平衡，也喜欢尝试新菜谱。\n运用提示：菜系、荤素偏好、具体菜名需补充真实例子。\n\n34｜运动地点、频率与户外活动｜Sports et sorties\nJ’aime surtout marcher et faire de petites randonnées quand j’en ai l’occasion. Dans la région de\nSeattle, il y a beaucoup d’espaces naturels agréables. Pour moi, ces sorties sont une façon de\nbouger et de me détendre.\n我有机会时喜欢散步和短途徒步。西雅图地区有很多不错的自然空间。对我而言，户外活动既能运动，也能\n放松。\n运用提示：具体频率、去哪里、最近一次地点需按实际情况补充。\n\n35｜读书、电影及其他娱乐｜Livres et films\nPendant mon temps libre, j’aime découvrir des contenus qui m’apprennent quelque chose,\nnotamment sur la culture ou la santé. Si un livre ou un film m’intéresse, j’aime en discuter et\nexpliquer pourquoi il m’a marquée.\n空闲时我喜欢接触能让我学到新东西的内容，尤其是文化或健康方面。如果有一本书或一部电影吸引我，我\n也喜欢讨论并解释原因。\n运用提示：本段是备用结构，不应假称读过特定书、看过电影；需准备真实作品。\n\n36｜最近旅行与旅游计划｜Voyage récent\nJ’aime voyager parce que cela permet de changer de cadre et de découvrir d’autres façons de vivre.\nPour raconter mon dernier voyage, je commencerais par le lieu, puis je dirais ce que j’y ai fait, quel\ntemps il faisait et ce que j’en ai pensé.\n我喜欢旅行，因为旅行可以换个环境并了解不同的生活方式。描述最近一次旅行时，我会先说地点，再讲做\n了什么、天气如何和自己的感受。\n运用提示：此模块是讲述框架，不是完整个人经历；请填入真实的最近一次旅行，练习复合过去时。\n\n37｜假期、节日与已发生的活动｜Vacances et fêtes\nPendant mes dernières vacances, j’ai essayé de me reposer et de prendre du temps pour mes\nactivités personnelles. J’en ai profité pour sortir un peu et changer de rythme.\n最近一个假期里，我尽量休息，给自己的个人活动留时间，也趁机外出走走，换换节奏。\n运用提示：仅在事实符合时采用；新年具体活动不可虚构。\n\n38｜街区、附近餐厅与住所｜Quartier et logement\nJ’habite dans un quartier plutôt calme, dans la région de Seattle. Ce que j’apprécie, c’est de pouvoir\nprofiter des espaces verts. Pour les restaurants et les commerces, je choisis surtout des endroits\npratiques pour mes déplacements.\n\n\n\n我住在西雅图地区一个相对安静的社区。我喜欢附近的绿地。餐馆和商店方面，我一般选择出行方便的地\n方。\n运用提示：具体街区、餐厅、最喜欢的房间等事实需根据真实情况回答。\n\n39｜天气与最喜欢的季节｜La météo et les saisons\nPersonnellement, j’aime les saisons où il fait assez doux pour sortir et marcher. Le temps influence\nbeaucoup mes activités : quand il fait beau, j’ai davantage envie de faire des promenades.\n我个人喜欢天气温和、适合出门散步的季节。天气很影响我的活动：天气好时我更想出门。\n运用提示：具体最喜欢的季节与加拿大天气印象须按真实偏好回答。\n\n40｜昨天、上周末、今晚｜Hier, le week-end dernier, ce soir\nHier, j’ai surtout consacré du temps à mes activités personnelles et à mon apprentissage du\nfrançais. Ce week-end, j’aimerais prendre un peu de temps pour me détendre.\n昨天我主要把时间投入个人活动与法语学习。这个周末我想留点时间放松。\n运用提示：只作语法示范；考试当天必须替换成真实发生的事。尤其练昨天/上周末的 passé composé 与今晚的 futur\nproche。\n\n41｜性格与缓解压力｜Caractère et stress\nJe dirais que je suis plutôt curieuse et organisée, surtout quand je prépare un projet qui me tient à\ncœur. Quand je suis stressée, j’essaie de me concentrer sur une chose à la fois ou de sortir prendre\nl’air.\n我觉得自己比较有好奇心、做事有条理，尤其在准备重视的项目时。感到有压力时，我会尽量一次处理一件\n事，或者出去透透气。\n运用提示：性格与放松方法属于供选择的表达，只保留真实适用内容。\n\n42｜中国文化与中美差异｜Cultures et différences\nÀ mes yeux, les habitudes quotidiennes peuvent être assez différentes selon les pays. Par exemple,\nle rythme de vie, la façon de communiquer et les relations sociales ne sont pas toujours les mêmes.\nVivre à l’étranger m’a appris à observer ces différences sans porter de jugement trop rapide.\n在我看来，不同国家的日常习惯可能差别很大。例如生活节奏、沟通方式和社交关系不总一样。海外生活让\n我学会观察差异，而不急于下判断。\n运用提示：要回答中国文化具体内容时，补充真实的食物、节日或家庭习俗。\n\n43｜童年与过去生活｜Souvenirs d’enfance\nQuand je repense à mon enfance, ce qui me revient surtout, ce sont les moments passés avec ma\nfamille et mes amis. Avec le recul, je trouve que certaines habitudes de cette époque ont influencé\nma façon de voir les choses aujourd’hui.\n回想童年，我首先想起的是与家人、朋友相处的时光。现在回头看，我觉得当时的一些习惯影响了今天的想\n法。\n运用提示：只是通用框架；具体童年朋友、回忆、从前生活需要真实细节。\n\n\n\n\nK. 132 条分类问法｜逐条复用索引\n索引的问句为从考生中文回忆整理出的语义标签，并非逐字法语考官题。A = 本文七段自我介绍；01–20 =\n已有基础及加拿大追问；21–43 = 本次新增回答模块。\n\n个人背景、家乡与居住地\n编号           考官追问（中文语义）             使用答案                   准备状态\nP01          你叫什么名字？                A                      直用\nP02          你来自哪个国家？               A                      直用\nP03          你出生在哪个城市？              21                     核实\nP04          你能介绍一下家乡吗？             21                     调整\nP05          你的家乡是怎样的城              21                     调整\n             市？\nP06          你的家乡和现在住的城             21,22                  调整\n             市有什么区别？\nP07          你喜欢原来的国家或城             21 const clean=RAW.replace(/\r/g,"");

const chapterRe=/^(?:[A-L]|E2)\.\s+/;
const chapters=[];let current=null;
for(let line of lines){if(chapterRe.test(line.trim())){current={title:line.trim(),lines:[]};chapters.push(current)}else if(current)current.lines.push(line)}
const allItems=[];
for(const ch of chapters){
 const blocks=ch.lines.join("\n").split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
 let currentItem=null;ch.items=[];
 for(const b of blocks){
   const first=b.split("\n")[0].trim();
   const isQ=/^(?:0[1-9]|[12]\d|3\d|4[0-3])\s*[·｜]/.test(first);
   const isSub=/^[①②③④⑤⑥⑦]/.test(first);

   if(isTitle){currentItem={title:first,body:b.slice(first.length).trim()};ch.items.push(currentItem)}

 }

 const needle=document.getElementById("search").value.trim().toLocaleLowerCase();

 const chaptersShown=needle?chapters:[chapters[selected]];
 heading.innerHTML="";
 const count=chaptersShown.reduce((n,c)=>n+c.items.filter(it=>(it.title+" "+it.body).toLocaleLowerCase().includes(needle)).length,0);
 const h=document.createElement("h2");h.textContent=needle?"全库搜索 · "+count+" 条匹配":chapters[selected].title;heading.appendChild(h);

 for(const it of ch.items){
  if(needle&&!(it.title+" "+it.body).toLocaleLowerCase().includes(needle))continue;
  const article=document.createElement("article");article.className="item";
  const title=document.createElement("h3");title.textContent=it.title;article.appendChild(title);

  article.appendChild(detail);
  if(/^(?:0[1-9]|[12]\d|3\d|4[0-3])\s*[·｜]/.test(it.title)){
   const area=document.createElement("textarea");area.placeholder="在此默写或记录你的法语回答（仅保存在本浏览器）";const key="tcf_t1_text_"+it.title.match(/^\d+/)?.[0];try{area.value=localStorage.getItem(key)||""}catch(e){}
   area.oninput=()=>{try{localStorage.setItem(key,area.value)}catch(e){}};article.appendChild(area);
   const controls=document.createElement("div");controls.className="practice-actions";
   const btn=document.createElement("button");btn.className="action";btn.textContent="显示 / 隐藏原稿";btn.onclick=()=>{detail.open=!detail.open};controls.appendChild(btn);
   const copy=document.createElement("button");copy.className="action";copy.textContent="清空默写";copy.onclick=()=>{if(confirm("清空这道题的默写？")){area.value="";area.dispatchEvent(new Event("input"))}};controls.appendChild(copy);article.appendChild(controls);
  }
  cards.appendChild(article);
 }}
 if(!cards.children.length){cards.textContent="没有找到符合条件的内容。"}
}
document.getElementById("search").oninput=render;
document.getElementById("reset").onclick=()=>{document.getElementById("search").value="";render()};
document.getElementById("toggle").onclick=()=>{expanded=!expanded;document.getElementById("toggle").textContent=expanded?"全部折叠答案":"全部展开答案";render()};
render();
</script></body></html>
