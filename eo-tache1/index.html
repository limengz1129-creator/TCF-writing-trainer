<script>
const RAW="TCF Canada · Tâche 1\nC1 统一学习稿｜20 道既有回答＋23 个新增模块＋132 条问法映射｜2026 年 11 月\n\n使用说明：保留原有七段结构。Tâche 1 是互动面谈，不必在开场完整背诵；问答作为可拆分素材。职业目\n前使用过去工作经历；家庭信息按当前真实情况，不虚构孩子。\n\n\nA. 自我介绍｜Présentation\n\n① 开场白：自我介绍\nBonjour ! Enchantée de faire votre connaissance.\n您好！很高兴认识您。\n\nJe m’appelle Megan, j’ai trente-trois ans et je suis originaire de Chine.\n我叫 Megan，今年 33 岁，来自中国。\n\n② 家庭介绍\nDepuis plusieurs années, je vis à Seattle, aux États-Unis. Je suis mariée depuis un peu plus de deux\nans.\n几年来，我一直生活在美国西雅图。我结婚已经两年多了。\n\nJe mène une vie bien remplie, entre mes projets personnels, l’apprentissage du français et mes\nactivités quotidiennes.\n我的生活很充实，包括个人计划、法语学习和日常活动。\n\n③ 职业\nSur le plan professionnel, j’ai obtenu mon MBA à New York, puis j’ai travaillé dans l’analyse de\ndonnées.\n在职业方面，我在纽约获得 MBA 学位，之后从事过数据分析工作。\n\nCe qui me passionne surtout, c’est de pouvoir analyser des données complexes, construire des\nmodèles statistiques et en tirer des informations utiles.\n最让我感兴趣的是分析复杂数据、建立统计模型，并从中提取有价值的信息。\n\nJ’aimerais reprendre ma carrière dans ce domaine et mettre mes compétences à profit.\n我希望重新从事这一领域的工作，充分发挥自己的专业能力。\n\n④ 兴趣爱好\nEn ce qui concerne mes loisirs, je me passionne pour la nutrition, notamment pour tout ce qui\ntouche à une alimentation saine et équilibrée.\n说到兴趣爱好，我对营养学很感兴趣，尤其关注健康均衡的饮食。\n\nLe week-end, j’aime faire des randonnées pour profiter de la nature. J’aime aussi cuisiner, ce qui\nme permet de me détendre et de découvrir de nouvelles recettes.\n\n\n周末我喜欢徒步、享受大自然，也喜欢烹饪，这让我放松并尝试新菜谱。\n\n⑤ 学习法语\nPar ailleurs, j’ai un véritable coup de cœur pour la langue française. Ce qui m’attire\nparticulièrement, c’est son élégance et sa richesse culturelle.\n此外，我对法语情有独钟，尤其喜欢它的优雅和丰富的文化内涵。\n\nPour moi, apprendre le français représente à la fois un défi intellectuel stimulant et une occasion\nde m’ouvrir à d’autres cultures.\n对我而言，学法语既是激发思考的智力挑战，也是接触其他文化的机会。\n\n⑥ 未来计划（定居加拿大）\nQuant à mes projets d’avenir, je souhaite m’établir au Canada.\n至于未来计划，我希望在加拿大定居。\n\nAprès plusieurs années aux États-Unis, je me suis bien habituée au mode de vie nord-américain. Le\nCanada présente de nombreuses similitudes culturelles, éducatives et professionnelles avec les\nÉtats-Unis.\n在美国生活多年后，我已习惯北美生活方式。加拿大与美国在文化、教育和职业环境上有许多共同之处。\n\nJ’aimerais y mettre à profit mon MBA et mon expérience en analyse de données, tout en profitant\nd’un rythme de vie qui me semble plus tranquille.\n我希望在那里发挥 MBA 学历和数据分析经验的价值，同时享受我认为更从容的生活节奏。\n\n⑦ 结尾\nVoilà, c’est une brève présentation de mon parcours et de mes projets.\n以上就是对我个人经历和未来计划的简要介绍。\n\nJ’espère pouvoir réaliser un jour mon projet de m’installer au Canada.\n我希望有一天能实现定居加拿大的计划。\n\n\nB. 职业｜Le travail\n01 · Pourquoi avez-vous choisi de travailler dans l’analyse de données ?\nJ’ai choisi ce domaine parce que j’aime résoudre des problèmes et comprendre comment les choses fonctionnent.\n我选择这个领域，是因为我喜欢解决问题，也喜欢理解事物是如何运作的。\n\nAprès mon MBA, j’ai découvert que l’analyse de données pouvait aider à prendre des décisions plus éclairées.\n读完 MBA 之后，我发现数据分析能够帮助人们做出更明智的决策。\n\nC’est ce mélange de logique et d’utilité concrète qui m’a attirée.\n正是逻辑性与实际应用价值的结合吸引了我。\n\n02 · Qu’est-ce que vous aimez le plus dans ce métier ?\nCe qui me plaît le plus, c’est de repérer des tendances qu’on ne remarque pas forcément au premier regard.\n我最喜欢的是发现那些乍看之下不容易注意到的趋势。\n\nAnalyser des données, c’est un peu comme résoudre une énigme.\n对我来说，分析数据有点像解一道谜题。\n\nEt c’est satisfaisant quand les résultats peuvent aider une entreprise à prendre de meilleures décisions.\n而当分析结果能够帮助企业做出更好的决策时，会让我很有成就感。\n\n03 · En quoi consistait votre travail au quotidien ?\nJe nettoyais et analysais des données, notamment avec SQL, et je créais des tableaux de bord pour présenter les résultats.\n我主要负责清洗和分析数据，尤其使用 SQL，并制作数据看板来展示结果。\n\nSelon les projets, je pouvais aussi construire des modèles statistiques.\n根据项目需要，我有时也会建立统计模型。\n\nCe que j’aimais, c’était de transformer des informations complexes en recommandations utiles.\n我喜欢的是把复杂信息转化为实用的建议。\n\nC. 法语学习｜Le français\n04 · Pourquoi avez-vous décidé d’apprendre le français ?\nJ’ai commencé à apprendre le français parce que cette langue et sa culture m’intéressent beaucoup.\n我开始学法语，是因为我对这门语言及其文化一直很感兴趣。\n\nEt comme j’aimerais m’installer au Canada, le français pourrait aussi m’ouvrir davantage de portes.\n而且，由于我希望定居加拿大，法语也可能为我带来更多机会。\n\nC’est donc à la fois un plaisir personnel et un projet important pour mon avenir.\n因此，学习法语既是个人爱好，也是与未来有关的重要计划。\n\n05 · Comment pratiquez-vous le français au quotidien ?\nJ’essaie d’intégrer le français dans mon quotidien autant que possible.\n我尽可能把法语融入日常生活。\n\nPar exemple, j’écoute des contenus en français, je lis des articles et je m’entraîne à parler à voix haute.\n例如，我听法语内容、阅读文章，还练习大声说法语。\n\nCela m’aide à réutiliser les expressions que j’apprends et à gagner progressivement en fluidité.\n这有助于我重复使用学过的表达，并逐渐提高口语流利度。\n\n06 · Quelles difficultés rencontrez-vous en apprenant le français ?\nCe qui me pose le plus de difficultés, c’est de trouver rapidement les bonnes expressions quand je parle spontanément.\n对我来说，最难的是在即兴说话时迅速找到合适的表达。\n\nParfois, je connais les mots, mais ils ne me viennent pas tout de suite.\n有时候我知道那些词，却没办法立刻想起来。\n\nAlors, je m’entraîne régulièrement à les réutiliser dans différents contextes.\n所以我会经常练习在不同语境中使用这些表达。\n\nD. 加拿大｜Le Canada\n07 · Pourquoi souhaitez-vous vous installer au Canada ?\nEn réalité, mon intérêt pour le Canada ne date pas d’hier.\n其实，我对加拿大的兴趣并不是最近才有的。\n\nIl y a quelques années, j’avais même déposé une candidature pour y faire un deuxième master, mais j’ai finalement renoncé à ce projet après mon mariage aux États-Unis.\n几年前，我甚至递交过申请，计划在那里攻读第二个硕士学位，但后来因为在美国结婚，最终放弃了这个计划。\n\nAujourd’hui, je connais bien le mode de vie nord-américain et j’aimerais m’installer au Canada pour y construire mon avenir.\n如今，我已经熟悉北美生活方式，希望在加拿大定居，在那里规划自己的未来。\n\nJe pourrais aussi mettre à profit mon MBA et mon expérience en analyse de données pour poursuivre ma carrière dans l’informatique.\n我也可以充分利用 MBA 学历和数据分析经验，继续在 IT 行业发展。\n\n08 · Pourquoi le Canada plutôt qu’un autre pays ?\nAprès plusieurs années passées aux États-Unis, j’aimerais rester en Amérique du Nord.\n在美国生活多年后，我希望继续留在北美。\n\nLe Canada et les États-Unis ont beaucoup de points communs sur les plans culturel, éducatif et professionnel, donc je pense que mon adaptation serait plus facile.\n加拿大与美国在文化、教育和职业方面有许多共同之处，所以我认为自己会比较容易适应。\n\nEt puis, le rythme de vie au Canada me semble un peu plus tranquille, ce qui correspond davantage à mes préférences.\n而且，我感觉加拿大的生活节奏相对从容一些，更符合我的个人偏好。\n\n09 · Qu’est-ce qui vous attire dans la culture canadienne ?\nCe qui m’attire particulièrement, c’est la diversité culturelle du Canada.\n最吸引我的是加拿大的文化多样性。\n\nJ’aime l’idée que des personnes d’origines différentes puissent partager leurs traditions.\n我喜欢不同背景的人能够分享各自传统的理念。\n\nJ’apprécie aussi la place accordée aux activités de plein air et, à mes yeux, l’importance de la qualité de vie.\n我也很欣赏人们对户外活动的重视，以及在我看来对生活质量的重视。\n\n10 · Comment comptez-vous vous adapter à la vie au Canada ?\nD’abord, je voudrais continuer à améliorer mon français afin de communiquer plus facilement au quotidien.\n首先，我想继续提高法语水平，以便更轻松地进行日常交流。\n\nJ’aimerais aussi participer à des activités locales pour rencontrer des gens.\n我也希望参加当地活动，认识更多人。\n\nComme j’ai déjà vécu, étudié et travaillé en Amérique du Nord, je pense que cette expérience pourrait faciliter mon adaptation.\n因为我已经在北美生活、学习和工作过，所以我认为这些经历可能帮助我适应加拿大。\n\nE. 生活与爱好｜La vie quotidienne et les loisirs\n11 · Comment organisez-vous vos journées ?\nEn ce moment, je consacre une bonne partie de mon temps à l’apprentissage du français et à mes projets personnels.\n目前，我把相当一部分时间用于学习法语和个人计划。\n\nJ’essaie de garder un rythme régulier.\n我尽量保持规律的生活节奏。\n\nQuand j’ai un moment libre, j’aime cuisiner ou me promener pour changer d’air.\n有空的时候，我喜欢做饭或者出去散步，换换环境。\n\n12 · Pourquoi aimez-vous cuisiner avec d’autres personnes ?\nCe que j’aime, c’est surtout le côté convivial.\n我最喜欢的是一起做饭时轻松愉快的氛围。\n\nOn peut discuter, essayer de nouvelles recettes et partager un bon moment.\n大家可以聊天、尝试新的菜谱，一起度过美好时光。\n\nPour moi, préparer un repas ensemble est souvent aussi agréable que de le déguster.\n对我来说，一起准备一顿饭往往和品尝美食一样令人愉快。\n\n13 · Quel type de randonnées aimez-vous faire ?\nJ’aime surtout les randonnées en forêt ou près des lacs, car je trouve ces endroits très apaisants.\n我尤其喜欢森林里或湖边的徒步路线，因为这些地方让我感到很宁静。\n\nQuand il fait beau, je préfère les sentiers offrant de beaux points de vue, surtout au bord de l’eau.\n天气好的时候，我更喜欢风景优美的步道，尤其是水边的路线。\n\nC’est une façon de prendre l’air et de me ressourcer.\n对我而言，这是一种呼吸新鲜空气、放松身心的方式。\n\nE2. 加拿大动机与身份｜追问补充（新增）\n14 · Pourquoi souhaitez-vous vous installer au Canada maintenant ?\nMême si j’ai renoncé à mon projet d’études à l’époque, je n’ai jamais vraiment abandonné l’idée de vivre au Canada.\n虽然我当年放弃了留学计划，但我从未真正放弃去加拿大生活的想法。\n\nAujourd’hui, après plusieurs années aux États-Unis, j’aimerais reprendre ma carrière et construire un projet de vie plus stable à long terme.\n如今，在美国生活多年后，我希望重新开始职业生涯，并建立一个更稳定的长期生活计划。\n\n15 · Pourquoi ne restez-vous pas aux États-Unis ?\nActuellement, mon statut de personne à charge aux États-Unis ne me permet pas de travailler sans autorisation spécifique.\n目前，我在美国持有家属身份，没有专门的工作许可就不能工作。\n\nPourtant, j’ai un MBA et de l’expérience dans l’analyse de données.\n但我拥有 MBA 学位和数据分析领域的工作经验。\n\nSi j’obtenais la résidence permanente au Canada, je pourrais y travailler légalement et reprendre ma carrière.\n如果我获得加拿大永久居民身份，就可以在那里合法工作，并重新开始职业生涯。\n\nC’est donc une option qui correspond mieux à mes projets professionnels.\n因此，这个选择更符合我的职业规划。\n\n16 · Quel avantage aurait votre diplôme américain au Canada ?\nJ’ai obtenu mon MBA à New York et j’ai déjà travaillé dans l’analyse de données.\n我在纽约获得 MBA 学位，也曾从事数据分析工作。\n\nJe pense que cette formation et mon expérience pourraient m’aider à m’intégrer au marché du travail canadien, même si les conditions de recrutement varient selon les employeurs.\n我认为这些学历和经验有助于我进入加拿大就业市场，尽管不同雇主的招聘条件可能有所不同。\n\n17 · Avez-vous déjà visité le Canada ?\nPas encore, malheureusement.\n还没有，很遗憾。\n\nMême si je vis aux États-Unis depuis plusieurs années, je n’ai pas encore eu l’occasion d’aller au Canada.\n虽然我已经在美国生活多年，却一直没有机会去加拿大。\n\nJe me suis renseignée sur le pays et j’aimerais vraiment le découvrir par moi-même avant de prendre une décision définitive.\n我查阅过不少有关加拿大的信息，也很希望在做出最终决定之前亲自去看看。\n\n18 · Qu’est-ce qui vous plaît dans le mode de vie canadien ?\nJ’ai l’impression que le rythme de vie y est un peu plus tranquille qu’aux États-Unis.\n我感觉加拿大的生活节奏比美国稍微从容一些。\n\nJ’accorde aussi de l’importance à l’accès aux services publics, notamment dans les domaines de la santé et de l’éducation.\n我也很看重公共服务的可及性，尤其是医疗和教育领域。\n\nBien sûr, j’aimerais découvrir la réalité sur place.\n当然，我也希望亲自去了解当地的实际情况。\n\n19 · Quel est votre projet professionnel au Canada ?\nMon objectif serait de reprendre une carrière dans l’informatique, plus précisément dans l’analyse de données.\n我的目标是重返 IT 行业，更具体地说，是数据分析领域。\n\nJ’aimerais mettre à profit mes compétences techniques, mon MBA et mon expérience professionnelle, tout en continuant à me former.\n我希望充分发挥自己的技术能力、MBA 学历和工作经验，同时继续学习提升自己。\n\n20 · Pourquoi aviez-vous abandonné votre projet de deuxième master au Canada ?\nÀ l’époque, j’avais fait une demande pour suivre un deuxième master au Canada.\n当时，我曾申请去加拿大攻读第二个硕士学位。\n\nMais ma situation personnelle a changé : je me suis mariée et je suis restée aux États-Unis.\n但后来我的个人情况发生了变化：我结婚了，并留在美国生活。\n\nJ’ai donc mis ce projet de côté, sans perdre mon intérêt pour le Canada.\n所以我暂时搁置了这个计划，但并没有失去对加拿大的兴趣。\n\nF. 核心词汇与词块｜Vocabulaire et expressions clés\nR1 · 全量补漏优化版｜A 自我介绍＋01–43 答案\n说明：按语义去重，每条含【法语词块 — 中文 — 来源】。来源 A 表示七部分自我介绍，其余数字为题号。部分词条统一为可复用的不定式或第三人称结构，与正文的人称、时态可能不同。R1 学词块，完整句型在 R2；不收录只属于题目而未用于回答的表达。\n\n01｜个人介绍与家庭 · A、23–24\nêtre originaire de Chine — 来自中国｜来源：A·①、21\nêtre mariée depuis un peu plus de deux ans — 结婚两年多｜来源：A·②、23\nmener une vie bien remplie — 过着充实忙碌的生活｜来源：A·②\nmes projets personnels — 我的个人计划｜来源：A·②、11\nne pas avoir d’enfants — 没有孩子｜来源：23\nse concentrer sur un projet — 专注于一项计划｜来源：23\ntravailler da  comme j’aimerais..., ... pourrait...\n中文：而且，因为我希望……，……可能……\n例句：Et comme j’aimerais m’installer au Canada, le français pourrait aussi m’ouvrir davantage de portes.\n来源：04\n\n59 · Je n’ai pas encore eu l’occasion de...\n中文：我还没有机会……\n例句：Je n’ai pas encore eu l’occasion d’aller au Canada.\n来源：17\n\n60 · C’est un domaine que je connais également grâce à...\n中文：这也是我通过……而熟悉的领域\n例句：C’est un domaine que je connais également grâce à mon expérience en analyse de données.\n来源：24\n\n61 · J’apprends ... dans le cadre de...\n中文：我学习……是为了……这一计划\n例句：J’apprends le français dans le cadre de mon projet personnel.\n来源：29\n\n62 · Ce qui m’intéresse, c’est de choisir... et de trouver...\n中文：我感兴趣的是选择……并找到……\n例句：Ce qui m’intéresse, c’est de choisir des ingrédients variés et de trouver un bon équilibre entre le goût et la santé.\n来源：33\n\n63 · J’aime ... quand j’en ai l’occasion.\n中文：有机会时我喜欢……\n例句：J’aime surtout marcher et faire de petites randonnées quand j’en ai l’occasion.\n来源：34\n\n64 · Si ... m’intéresse, j’aime en discuter.\n中文：如果……让我感兴趣，我喜欢讨论它\n例句：Si un livre ou un film m’intéresse, j’aime en discuter et expliquer pourquoi il m’a marquée.\n来源：35\n\n65 · Pour raconter ..., je commencerais par..., puis...\n中文：要讲述……，我会先……再……\n例句：Pour raconter mon dernier voyage, je commencerais par le lieu, puis je dirais ce que j’y ai fait.\n来源：36\n\n66 · Ce que j’apprécie, c’est de pouvoir...\n中文：我欣赏的是能够……\n例句：Ce que j’apprécie, c’est de pouvoir profiter des espaces verts.\n来源：38\n\n67 · Quand il fait beau, j’ai davantage envie de...\n中文：天气好的时候，我更想……\n例句：Quand il fait beau, j’ai davantage envie de faire des promenades.\n来源：39\n\n审计说明：共67条句框、8个功能主题。来源涵盖自我介绍、职业、法语、加拿大、家庭、旅行、生活、跨文化与童年相关回答；不是声称43道题各有不同句式。\n\nH. 备考备注与一致性检查\n• 家庭：不再虚构孩子；自我介绍只介绍已婚及结婚两年多。若考官问是否有孩子，可回答：Non, nous\nn’avons pas d’enfants.\n\n• 职业：目前没有美国工作许可，因此自我介绍使用过去时 j’ai travaillé；未来就业使用条件式 j’aimerais\nreprendre。\n\n• 加拿大：以北美文化延续、学历与职业经验可迁移、生活节奏和职业自主权作为理由；不宣称美国学位在\n加拿大自动获得认可。\n\n• 永久居民：回答“如果获得加拿大 PR 就可以工作”时用条件式，不暗示目前已经获得 PR。\n\n• 旅行：没有去过加拿大，如实回答；对加拿大的生活节奏和福利用 j’ai l’impression que / à mes yeux 表\n达个人印象。\n\n• 学习与职业规划：过去曾申请加拿大第二硕士，后来因结婚改变计划；当前优先继续 IT，不加入尚未决定\n的护理转行。\n\n• 考试：T1 是自然互动，考官可能很早打断。13 道基础问答与新增 7 道答案均为备用模块，不宜全部背诵输\n出。\n\n\n\nI. 198 场考生回忆库｜追问整合与覆盖索引\n审计口径：用户提供的 198 场 Tâche 1 回忆中，部分记录没有具体追问，仅写“有打断”或话题词。以下保留\n上一轮整理出的 132 个分类问法条目，逐一指定复用的已有答案（01–20）或新增回答模块（21–43）；不\n把缺乏原文的法语句子标注为考官原话。\n\n“直用”=可直接从指定稿回答；“调整”=需根据提问换时态/细节；“补充”=新增模块；“核实”=涉及未确认的个\n人事实，不预设虚构答案。不同条目之间可有语义重合，因此 132 并非 132 个独立母题。\n\n\nJ. 新增 23 个可复用追问模块｜21–43\n下面只新增覆盖明显缺口的模块；旧版 01–20 保留不重复编写。涉及未提供的个人经历以“运用提示”标明，\n避免把示例当事实。\n\n21｜家乡与出生城市｜Ville d’origine\nJe suis originaire de Chine. La ville où j’ai grandi a ses propres particularités, notamment sur le\nplan culturel. Ce qui m’intéresse, c’est de comparer ces habitudes avec celles que j’ai découvertes\naux États-Unis.\n我来自中国。我成长的城市有自己的特点，尤其是文化方面。我很喜欢比较家乡的生活习惯与在美国了解到\n的生活方式。\n运用提示：须补充真实出生城市、特色、一个具体对比，不预设城市。\n\n\n\n\n22｜西雅图生活与城市比较｜Vivre à Seattle\nJe vis dans la région de Seattle depuis quelque temps. J’aime particulièrement la proximité de la\nnature et les possibilités de faire des promenades. Bien sûr, il y a des différences avec les villes\nchinoises que je connais, mais je me suis progressivement adaptée.\n我在西雅图地区生活已有一段时间。我尤其喜欢附近的大自然和散步的机会。当然，这里与我熟悉的中国城\n市不同，但我已经逐渐适应。\n运用提示：“多久”“为什么搬来”“最喜欢哪方面”需按真实时间线补充。\n\n23｜家庭基本情况｜Situation familiale\nJe suis mariée depuis un peu plus de deux ans et nous n’avons pas d’enfants. En ce moment, je vis\naux États-Unis et je me concentre notamment sur mon apprentissage du français et mes projets\nprofessionnels.\n我结婚两年多了，我们没有孩子。目前我住在美国，主要投入法语学习与职业规划。\n运用提示：如问家人住在哪里、丈夫职业，请用真实事实作答；不用假设孩子。\n\n24｜丈夫职业与简单描述｜Mon mari\nMon mari travaille dans le secteur de l’informatique. C’est un domaine que je connais également\ngrâce à mon expérience en analyse de données. Nous avons donc certains centres d’intérêt\nprofessionnels en commun.\n我丈夫在 IT 行业工作。由于我有数据分析经验，这也是我熟悉的领域，因此我们有一些共同的职业兴趣。\n运用提示：问具体岗位、地点或性格时需按本人愿意公开的真实情况回答，可只做简短介绍。\n\n25｜学习经历与 MBA｜Mes études\nJ’ai fait un MBA à New York, ce qui m’a permis d’approfondir mes connaissances en gestion et en\nanalyse. Cette formation m’a donné envie d’utiliser les données pour résoudre des problèmes\nconcrets. Par la suite, je me suis orientée vers l’analyse de données.\n我在纽约读了 MBA，深入学习管理和分析。这段学习让我更想用数据解决实际问题，之后便转向数据分\n析。\n运用提示：可回答学什么、为何选专业、学习经历；问具体大学名称时如实补充。\n\n26｜美国留学与未留在其他国家｜Choix des études à l’étranger\nJ’avais choisi de poursuivre mes études aux États-Unis pour découvrir un environnement\nuniversitaire international. Cette expérience m’a permis de mieux connaître la vie nord-\naméricaine et a influencé mes projets professionnels.\n当初我选择在美国继续学习，是为了接触国际化大学环境。这段经历让我更了解北美生活，也影响了我的职\n业规划。\n运用提示：若被问为何不留某个其他国家，按真实经历调整，不虚构英国留学。\n\n27｜职业项目与技术工具｜Un exemple de projet\nDans mon travail, j’utilisais surtout SQL pour extraire et analyser des données, puis je présentais\nles résultats dans des tableaux de bord. Par exemple, l’objectif pouvait être de repérer une\ntendance et de rendre les informations plus faciles à utiliser pour l’équipe.\n\n工作中我主要用 SQL 提取和分析数据，再用看板呈现结果。例如，目标可能是发现某个趋势，帮助团队更方\n便地使用信息。\n运用提示：这里是通用工作流程示例，不是已核实的具体项目；请替换为你真实参与的项目。\n\n28｜职业技能、转行与未来求职｜Compétences et évolution\nGrâce à mes études et à mon expérience, j’ai développé mon esprit d’analyse et ma capacité à\nprésenter des résultats clairement. Aujourd’hui, j’aimerais reprendre mon activité dans\nl’informatique, idéalement dans un poste lié aux données.\n通过学习和工作，我培养了分析思维和清晰呈现结果的能力。如今我希望重返 IT 行业，最好从事数据相关\n岗位。\n运用提示：可衔接现有 19 题；为何未从事本专业工作需依据真实本科专业回答。\n\n29｜法语学习时间、课程和其他语言｜Parcours linguistique\nJ’apprends le français dans le cadre de mon projet personnel. Je travaille surtout la compréhension\net l’expression orales, et j’essaie d’en faire un peu chaque jour. J’ai aussi appris l’anglais au cours\nde mon parcours scolaire et professionnel.\n我学习法语是出于个人规划，主要练听力和口语，并尽量每天练习一点。此前在学习和工作经历中也学过英\n语。\n运用提示：开始日期、是否上过课、会说几种语言、童年学习经历应按真实事实补充。\n\n30｜TCF 考试目的｜Pourquoi passer le TCF ?\nJe passe le TCF Canada pour évaluer mon niveau de français et avancer dans mon projet\nd’installation au Canada. C’est aussi un objectif concret qui me motive à pratiquer régulièrement.\n我参加 TCF Canada 是为了评估自己的法语水平，并推进定居加拿大的计划。这也是一个推动我持续练习的\n具体目标。\n运用提示：第几次考试根据真实考试经历回答。\n\n31｜法国文化具体兴趣｜La culture francophone\nLa langue française m’intéresse pour sa sonorité, mais aussi parce qu’elle me permet d’accéder à\ndes films, des livres et des points de vue différents. Ce qui me plaît, c’est de découvrir une culture à\ntravers sa langue.\n法语的声音很吸引我，它也让我接触不同的电影、书籍和观点。我喜欢通过语言了解文化。\n运用提示：若问最喜欢的电影、书籍或作品，准备一项真实例子。\n\n32｜加拿大家庭同行、亲友与到访｜Liens au Canada\nJe n’ai pas encore eu l’occasion de visiter le Canada. Pour le moment, je souhaite surtout mieux\nconnaître le pays et les possibilités qui correspondraient à mon projet professionnel. Je préfère\npréparer les étapes une par une.\n我还没机会去加拿大。目前我首先想更了解这个国家，以及与我职业规划相符的机会。我希望一步一步准\n备。\n运用提示：“是否有朋友/亲属”“是否与丈夫同行”不能从现有资料确定，应如实回答。\n\n\n\n33｜烹饪细节、饮食偏好｜Cuisine et nutrition\nJ’aime préparer des repas simples et équilibrés. Ce qui m’intéresse, c’est de choisir des ingrédients\nvariés et de trouver un bon équilibre entre le goût et la santé. J’aime aussi essayer de nouvelles\nrecettes.\n我喜欢做简单均衡的饭菜。我注重选择多样的食材，在口味与健康之间找到平衡，也喜欢尝试新菜谱。\n运用提示：菜系、荤素偏好、具体菜名需补充真实例子。\n\n34｜运动地点、频率与户外活动｜Sports et sorties\nJ’aime surtout marcher et faire de petites randonnées quand j’en ai l’occasion. Dans la région de\nSeattle, il y a beaucoup d’espaces naturels agréables. Pour moi, ces sorties sont une façon de\nbouger et de me détendre.\n我有机会时喜欢散步和短途徒步。西雅图地区有很多不错的自然空间。对我而言，户外活动既能运动，也能\n放松。\n运用提示：具体频率、去哪里、最近一次地点需按实际情况补充。\n\n35｜读书、电影及其他娱乐｜Livres et films\nPendant mon temps libre, j’aime découvrir des contenus qui m’apprennent quelque chose,\nnotamment sur la culture ou la santé. Si un livre ou un film m’intéresse, j’aime en discuter et\nexpliquer pourquoi il m’a marquée.\n空闲时我喜欢接触能让我学到新东西的内容，尤其是文化或健康方面。如果有一本书或一部电影吸引我，我\n也喜欢讨论并解释原因。\n运用提示：本段是备用结构，不应假称读过特定书、看过电影；需准备真实作品。\n\n36｜最近旅行与旅游计划｜Voyage récent\nJ’aime voyager parce que cela permet de changer de cadre et de découvrir d’autres façons de vivre.\nPour raconter mon dernier voyage, je commencerais par le lieu, puis je dirais ce que j’y ai fait, quel\ntemps il faisait et ce que j’en ai pensé.\n我喜欢旅行，因为旅行可以换个环境并了解不同的生活方式。描述最近一次旅行时，我会先说地点，再讲做\n了什么、天气如何和自己的感受。\n运用提示：此模块是讲述框架，不是完整个人经历；请填入真实的最近一次旅行，练习复合过去时。\n\n37｜假期、节日与已发生的活动｜Vacances et fêtes\nPendant mes dernières vacances, j’ai essayé de me reposer et de prendre du temps pour mes\nactivités personnelles. J’en ai profité pour sortir un peu et changer de rythme.\n最近一个假期里，我尽量休息，给自己的个人活动留时间，也趁机外出走走，换换节奏。\n运用提示：仅在事实符合时采用；新年具体活动不可虚构。\n\n38｜街区、附近餐厅与住所｜Quartier et logement\nJ’habite dans un quartier plutôt calme, dans la région de Seattle. Ce que j’apprécie, c’est de pouvoir\nprofiter des espaces verts. Pour les restaurants et les commerces, je choisis surtout des endroits\npratiques pour mes déplacements.\n\n\n\n我住在西雅图地区一个相对安静的社区。我喜欢附近的绿地。餐馆和商店方面，我一般选择出行方便的地\n方。\n运用提示：具体街区、餐厅、最喜欢的房间等事实需根据真实情况回答。\n\n39｜天气与最喜欢的季节｜La météo et les saisons\nPersonnellement, j’aime les saisons où il fait assez doux pour sortir et marcher. Le temps influence\nbeaucoup mes activités : quand il fait beau, j’ai davantage envie de faire des promenades.\n我个人喜欢天气温和、适合出门散步的季节。天气很影响我的活动：天气好时我更想出门。\n运用提示：具体最喜欢的季节与加拿大天气印象须按真实偏好回答。\n\n40｜昨天、上周末、今晚｜Hier, le week-end dernier, ce soir\nHier, j’ai surtout consacré du temps à mes activités personnelles et à mon apprentissage du\nfrançais. Ce week-end, j’aimerais prendre un peu de temps pour me détendre.\n昨天我主要把时间投入个人活动与法语学习。这个周末我想留点时间放松。\n运用提示：只作语法示范；考试当天必须替换成真实发生的事。尤其练昨天/上周末的 passé composé 与今晚的 futur\nproche。\n\n41｜性格与缓解压力｜Caractère et stress\nJe dirais que je suis plutôt curieuse et organisée, surtout quand je prépare un projet qui me tient à\ncœur. Quand je suis stressée, j’essaie de me concentrer sur une chose à la fois ou de sortir prendre\nl’air.\n我觉得自己比较有好奇心、做事有条理，尤其在准备重视的项目时。感到有压力时，我会尽量一次处理一件\n事，或者出去透透气。\n运用提示：性格与放松方法属于供选择的表达，只保留真实适用内容。\n\n42｜中国文化与中美差异｜Cultures et différences\nÀ mes yeux, les habitudes quotidiennes peuvent être assez différentes selon les pays. Par exemple,\nle rythme de vie, la façon de communiquer et les relations sociales ne sont pas toujours les mêmes.\nVivre à l’étranger m’a appris à observer ces différences sans porter de jugement trop rapide.\n在我看来，不同国家的日常习惯可能差别很大。例如生活节奏、沟通方式和社交关系不总一样。海外生活让\n我学会观察差异，而不急于下判断。\n运用提示：要回答中国文化具体内容时，补充真实的食物、节日或家庭习俗。\n\n43｜童年与过去生活｜Souvenirs d’enfance\nQuand je repense à mon enfance, ce qui me revient surtout, ce sont les moments passés avec ma\nfamille et mes amis. Avec le recul, je trouve que certaines habitudes de cette époque ont influencé\nma façon de voir les choses aujourd’hui.\n回想童年，我首先想起的是与家人、朋友相处的时光。现在回头看，我觉得当时的一些习惯影响了今天的想\n法。\n运用提示：只是通用框架；具体童年朋友、回忆、从前生活需要真实细节。\n\n\n\n\nK. 132 条分类问法｜逐条复用索引\n索引的问句为从考生中文回忆整理出的语义标签，并非逐字法语考官题。A = 本文七段自我介绍；01–20 =\n已有基础及加拿大追问；21–43 = 本次新增回答模块。\n\n个人背景、家乡与居住地\n编号           考官追问（中文语义）             使用答案                   准备状态\nP01          你叫什么名字？                A                      直用\nP02          你来自哪个国家？               A                      直用\nP03          你出生在哪个城市？              21                     核实\nP04          你能介绍一下家乡吗？             21                     调整\nP05          你的家乡是怎样的城              21                     调整\n             市？\nP06          你的家乡和现在住的城             21,22                  调整\n             市有什么区别？\nP07          你喜欢原来的国家或城             21                     调整\n             市吗？\nP08          你现在住在哪里？住了             A,22                   调整\n             多久？\nP09          你一直住在这里吗？              22                     核实\nP10          为什么搬到现在的城              22                     核实\n             市？\nP11          为什么离开以前居住或             22                     核实\n             工作的城市？\nP12          你喜欢现在居住的城市             22                     直用\n             吗？\nP13          现在居住的城市和中国             22,42                  调整\n             有什么区别？\nP14          你以前在国外生活过              A,26                   直用\n             吗？\n\n\n家庭与人际关系\n编号 function render(){
 r1Stop();
 const needle=document.getElementById("search").value.trim().toLocaleLowerCase();
 [...nav.children].forEach((el,i)=>el.classList.toggle("active",i===selected));
 const shown=needle?chapters:[chapters[selected]];
 heading.replaceChildren();
 let count=shown.reduce((n,c)=>n+c.items.filter(it=>(it.title+" "+it.body).toLocaleLowerCase().includes(needle)).length,0);
 const h=document.createElement("h2");
 h.textContent=needle?"全库搜索 · "+count+" 条匹配":chapters[selected].title;heading.appendChild(h);
 cards.replaceChildren();
 let rendered=0;
 for(const ch of shown){
  const matched=ch.items.filter(it=>!needle||(it.title+" "+it.body).toLocaleLowerCase().includes(needle));
  if(!matched.length)continue;
  if(needle){const sub=document.createElement("h3");sub.textContent=ch.title;cards.appendChild(sub)}
  for(const it of matched){
   rendered++;
   const article=document.createElement("article");article.className="item";
   const title=document.createElement("h3");title.textContent=it.title;article.appendChild(title);
   const body=document.createElement("div");body.className="source";if(ch.title.startsWith("R1."))renderR1Answer(body,it);else body.textContent=it.body;article.appendChild(body);
   const m=it.title.match(/^(\d{2})\s*[·｜]/);
   if(m&&!ch.title.startsWith("R1.")&&!ch.title.startsWith("R2.")){
    const area=document.createElement("textarea");
    area.placeholder="可在此自行默写或记录（仅保存在本浏览器）";
    const key="tcf_t1_text_"+m[1];
    try{area.value=localStorage.getItem(key)||""}catch(e){}
    area.oninput=()=>{try{localStorage.setItem(key,area.value)}catch(e){}};
    const controls=document.createElement("div");controls.className="practice-actions";
    const clear=document.createElement("button");clear.className="action";clear.textContent="清空默写";
    clear.onclick=()=>{if(confirm("清空这道题的默写？")){area.value="";area.dispatchEvent(new Event("input"))}};
    controls.appendChild(clear);article.appendChild(area);article.appendChild(controls);
   }
   cards.appendChild(article);
  }
 }
 if(!rendered)cards.textContent="没有找到符合条件的内容。";
}
document.getElementById("search").oninput=render;
document.getElementById("reset").onclick=()=>{document.getElementById("search").value="";render()};
if(extra.size!==23){console.warn("未能完整解析23个模块，现有模块数",extra.size)}
render();
</script></body></html>
