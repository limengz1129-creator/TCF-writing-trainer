<script>const DATA=[{"id":"0-2","module":0,"category":"旅行与移民","fr":"s'installer dans un nouveau pays","zh":"在新国家定居","example":"De nos jours, la question de savoir s’il est difficile de s’installer dans un nouveau pays suscite beaucoup de débats.","source":8,"row":2},{"id":"0-3","module":0,"category":"旅行与移民","fr":"trouver ses repères","zh":"找到自己的立足点；适应新环境","example":"Certains considèrent que cette expérience représente un véritable défi, tandis que d’autres estiment qu’il est aujourd’hui plus facile de trouver ses repères grâce aux ressources disponibles.","source":8,"row":3},{"id":"0-4","module":0,"category":"旅行与移民","fr":"créer des liens avec les habitants","zh":"与当地居民建立联系","example":"Certains considèrent que ces relations sont essentielles, tandis que d’autres estiment qu’il faut surtout créer des liens avec les habitants du pays d’accueil.","source":47,"row":4},{"id":"0-5","module":0,"category":"旅行与移民","fr":"maintenir des liens avec sa culture d'origine","zh":"维持与原有文化的联系","example":"De plus, les relations avec ses compatriotes permettent de maintenir un lien avec sa culture d’origine.","source":50,"row":5},{"id":"0-6","module":0,"category":"旅行与移民","fr":"préserver sa culture d'origine","zh":"保留原有文化","example":"Cela étant dit, il faut reconnaître qu’il existe de nombreux moyens de préserver sa culture d’origine.","source":35,"row":6},{"id":"0-7","module":0,"category":"旅行与移民","fr":"s'intégrer dans la société d'accueil","zh":"融入接收国社会","example":"Parallèlement, il serait souhaitable que les parents trouvent un équilibre entre les deux afin que leurs enfants puissent s’intégrer pleinement dans la société d’accueil tout en conservant leurs racines culturelles.","source":236,"row":7},{"id":"0-8","module":0,"category":"旅行与移民","fr":"faciliter l'intégration des nouveaux arrivants","zh":"帮助新移民融入","example":"De nos jours, la question de savoir si les pays d’accueil doivent assumer la responsabilité de faciliter l’intégration des nouveaux arrivants suscite beaucoup de débats.","source":85,"row":8},{"id":"0-9","module":0,"category":"旅行与移民","fr":"se familiariser avec les codes culturels","zh":"熟悉文化规范","example":"Parallèlement, il faudrait que les nouveaux arrivants fassent l’effort de se familiariser avec la langue, les codes culturels et le fonctionnement de la société d’accueil, tout en s’impliquant activement dans la vie locale afin de faciliter leur intégration.","source":82,"row":9},{"id":"0-10","module":0,"category":"旅行与移民","fr":"maîtriser la langue du pays d'accueil","zh":"掌握接收国语言","example":"Si un nouvel arrivant maîtrise suffisamment la langue du pays d’accueil, il peut communiquer plus facilement avec les habitants, exprimer ses besoins et créer progressivement des liens.","source":94,"row":10},{"id":"0-11","module":0,"category":"旅行与移民","fr":"accomplir des démarches administratives","zh":"办理行政手续","example":"Lorsqu’une personne ne maîtrise pas suffisamment la langue du pays d’accueil, elle peut éprouver des difficultés à accomplir certaines démarches administratives, à communiquer dans son environnement professionnel ou simplement à interagir avec les habitants.","source":11,"row":11},{"id":"0-12","module":0,"category":"旅行与移民","fr":"gagner en autonomie","zh":"提高独立生活能力","example":"La maîtrise de la langue constitue donc un élément essentiel pour gagner en autonomie et trouver progressivement ses repères.","source":11,"row":12},{"id":"0-13","module":0,"category":"旅行与移民","fr":"surmonter le sentiment d'isolement","zh":"克服孤立感","example":"Lorsqu’une personne vit loin de son pays d’origine, ces relations peuvent lui apporter un soutien affectif et l’aider à surmonter le sentiment d’isolement.","source":58,"row":13},{"id":"0-14","module":0,"category":"旅行与移民","fr":"renforcer le sentiment d'appartenance","zh":"增强归属感","example":"En effet, le fait de partager la même langue, certaines traditions et des références culturelles communes peut renforcer le sentiment d’appartenance.","source":50,"row":14},{"id":"0-15","module":0,"category":"旅行与移民","fr":"participer activement à la vie locale","zh":"积极参与当地生活","example":"Il est donc essentiel d’être prêt à créer de nouvelles relations et à participer activement à la vie locale.","source":134,"row":15},{"id":"0-16","module":0,"category":"旅行与移民","fr":"rejoindre des associations locales","zh":"加入当地协会","example":"Les nouveaux arrivants peuvent, par exemple, rejoindre des associations locales, participer à des activités de quartier ou bénéficier de programmes d’accompagnement.","source":12,"row":16},{"id":"0-17","module":0,"category":"旅行与移民","fr":"fréquenter ses compatriotes","zh":"与同胞来往","example":"On peut continuer à parler sa langue maternelle en famille, célébrer les fêtes traditionnelles, cuisiner des plats de son pays ou fréquenter ses compatriotes.","source":35,"row":17},{"id":"0-18","module":0,"category":"旅行与移民","fr":"sortir de sa zone de confort","zh":"走出舒适圈","example":"En effet, avoir étudié ou travaillé dans un autre pays montre souvent qu’une personne a été capable de s’adapter à un nouvel environnement, de faire face à des situations inconnues et de sortir de sa zone de confort.","source":110,"row":18},{"id":"0-19","module":0,"category":"旅行与移民","fr":"faire face aux difficultés de la vie quotidienne","zh":"应对日常生活的困难","example":"Cela étant dit, il faut reconnaître que les personnes plus âgées ont généralement davantage d’expérience pour faire face aux difficultés de la vie quotidienne.","source":20,"row":19},{"id":"0-20","module":0,"category":"旅行与移民","fr":"conserver ses traditions","zh":"保留自己的传统","example":"Parallèlement, il faudrait que chacun reste ouvert à la culture locale tout en conservant certaines traditions de son pays d’origine, afin que les deux cultures puissent coexister et s’enrichir mutuellement.","source":29,"row":20},{"id":"0-21","module":0,"category":"旅行与移民","fr":"célébrer les fêtes traditionnelles","zh":"庆祝传统节日","example":"On peut continuer à parler sa langue maternelle en famille, célébrer les fêtes traditionnelles, cuisiner des plats de son pays ou fréquenter ses compatriotes.","source":35,"row":21},{"id":"0-22","module":0,"category":"旅行与移民","fr":"remettre en question ses propres repères","zh":"重新审视自己的固有观念","example":"En effet, ils sont généralement plus disposés à découvrir de nouvelles cultures, à accepter de nouvelles habitudes et à remettre en question leurs propres repères.","source":19,"row":22},{"id":"0-23","module":0,"category":"旅行与移民","fr":"élargir sa vision du monde","zh":"拓宽世界观","example":"Cette expérience peut ainsi élargir sa vision du monde et l’aider à éviter certains stéréotypes.","source":118,"row":23},{"id":"0-24","module":0,"category":"旅行与移民","fr":"développer un réseau social","zh":"建立社交网络","example":"Parallèlement, il faudrait que les personnes vivant à l’étranger développent un réseau social plus diversifié afin de préserver leurs racines tout en favorisant leur intégration dans la société d’accueil.","source":52,"row":24},{"id":"0-25","module":0,"category":"旅行与移民","fr":"trouver sa place dans la société","zh":"找到自己在社会中的位置","example":"En diversifiant son réseau social, une personne peut progressivement trouver sa place dans la société d’accueil tout en conservant ses propres repères culturels.","source":51,"row":25},{"id":"0-26","module":0,"category":"旅行与移民","fr":"se faire accepter dans un nouvel environnement","zh":"在新环境中获得接纳","example":"Comment se faire accepter dans un nouvel environnement (pays, travail, lieu d’études, etc.) ?","source":92,"row":26},{"id":"0-27","module":0,"category":"旅行与移民","fr":"bénéficier de programmes d'accompagnement","zh":"获得配套支持项目","example":"Les nouveaux arrivants peuvent, par exemple, rejoindre des associations locales, participer à des activités de quartier ou bénéficier de programmes d’accompagnement.","source":12,"row":27},{"id":"0-28","module":0,"category":"旅行与移民","fr":"partir vivre à l'étranger","zh":"出国定居","example":"De nos jours, on entend souvent dire qu’il est plus facile de partir vivre à l’étranger quand on est jeune.","source":16,"row":28},{"id":"0-29","module":0,"category":"旅行与移民","fr":"voyager seul plutôt qu'en groupe","zh":"独自旅行而非跟团","example":"Certaines personnes choisissent de voyager seules plutôt qu’en groupe.","source":177,"row":29},{"id":"0-30","module":0,"category":"旅行与移民","fr":"découvrir de nouvelles cultures","zh":"了解新的文化","example":"En effet, ils sont généralement plus disposés à découvrir de nouvelles cultures, à accepter de nouvelles habitudes et à remettre en question leurs propres repères.","source":19,"row":30},{"id":"0-31","module":0,"category":"旅行与移民","fr":"favoriser les échanges interculturels","zh":"促进跨文化交流","example":"Le tourisme peut ainsi favoriser les échanges interculturels et renforcer le rayonnement culturel d’un pays à l’étranger.","source":163,"row":31},{"id":"0-32","module":0,"category":"旅行与移民","fr":"contribuer au rayonnement culturel","zh":"提升文化影响力","example":"À mes yeux, je dirais qu’il est essentiel de développer ce secteur, puisqu’il peut contribuer au rayonnement culturel du pays, stimuler son économie et créer de nombreuses opportunités d’emploi.","source":162,"row":32},{"id":"0-33","module":0,"category":"旅行与移民","fr":"faire connaître son pays","zh":"推广自己的国家","example":"La cuisine est un excellent moyen de faire connaître son pays.","source":238,"row":33},{"id":"0-34","module":0,"category":"旅行与移民","fr":"développer le tourisme","zh":"发展旅游业","example":"À mes yeux, je dirais qu’un développement touristique excessif peut effectivement avoir des conséquences négatives sur certaines régions, notamment sur l’environnement et le coût de la vie.","source":185,"row":34},{"id":"0-35","module":0,"category":"旅行与移民","fr":"constituer un obstacle majeur à l'adaptation","zh":"构成适应过程中的重大障碍","example":"Tout d’abord, le sentiment d’isolement peut constituer un obstacle majeur à l’adaptation.","source":10,"row":35},{"id":"0-36","module":0,"category":"旅行与移民","fr":"ralentir le processus d'intégration","zh":"减缓融入过程","example":"De plus, la barrière linguistique peut considérablement ralentir le processus d’intégration.","source":11,"row":36},{"id":"0-37","module":0,"category":"旅行与移民","fr":"éprouver des difficultés à","zh":"做……有困难（后接不定式）","example":"Lorsqu’une personne ne maîtrise pas suffisamment la langue du pays d’accueil, elle peut éprouver des difficultés à accomplir certaines démarches administratives, à communiquer dans son environnement professionnel ou simplement à interagir avec les habitants.","source":11,"row":37,"usage":"éprouver des difficultés à＋不定式；表示在某领域有困难可用 dans＋名词。"},{"id":"0-38","module":0,"category":"旅行与移民","fr":"créer de nouvelles relations","zh":"建立新的人际关系","example":"Au début, elle peut avoir du mal à créer de nouvelles relations et à reconstruire un cercle social.","source":10,"row":38},{"id":"0-39","module":0,"category":"旅行与移民","fr":"reconstruire un cercle social","zh":"重建社交圈","example":"Au début, elle peut avoir du mal à créer de nouvelles relations et à reconstruire un cercle social.","source":10,"row":39},{"id":"0-40","module":0,"category":"旅行与移民","fr":"partager ses préoccupations","zh":"分享烦恼","example":"Prenons le cas d’un nouvel arrivant qui rentre chez lui après une journée difficile sans avoir personne avec qui partager ses préoccupations.","source":10,"row":40},{"id":"0-41","module":0,"category":"旅行与移民","fr":"gagner progressivement en autonomie","zh":"逐渐提升独立性","example":"Une bonne maîtrise de la langue lui permet non seulement de s’exprimer plus efficacement, mais aussi de gagner progressivement en autonomie.","source":79,"row":41},{"id":"0-42","module":0,"category":"旅行与移民","fr":"maintenir un lien avec sa culture d'origine","zh":"保持与原有文化的联系","example":"De plus, les relations avec ses compatriotes permettent de maintenir un lien avec sa culture d’origine.","source":50,"row":42},{"id":"0-43","module":0,"category":"旅行与移民","fr":"créer des relations avec les habitants","zh":"与当地人建立关系","example":"Pour bien vivre dans un pays étranger, il est indispensable de créer des relations avec les habitants du pays.","source":53,"row":43},{"id":"0-44","module":0,"category":"旅行与移民","fr":"comprendre les codes sociaux","zh":"理解社会规范","example":"Ces interactions lui permettent non seulement d’élargir son réseau social, mais aussi de mieux comprendre les codes sociaux du pays d’accueil.","source":42,"row":44},{"id":"0-45","module":0,"category":"旅行与移民","fr":"comprendre le fonctionnement de la société","zh":"理解社会的运作方式","example":"Par ailleurs, les activités scolaires peuvent donner aux parents l’occasion de rencontrer d’autres familles et de mieux comprendre le fonctionnement de la société locale.","source":142,"row":45},{"id":"0-46","module":0,"category":"旅行与移民","fr":"découvrir des lieux emblématiques","zh":"参观标志性景点","example":"En effet, lorsque les touristes étrangers visitent des monuments, découvrent des lieux emblématiques ou participent à des activités locales, ils ont l’occasion de mieux comprendre la culture et les coutumes du pays.","source":163,"row":46},{"id":"0-47","module":0,"category":"旅行与移民","fr":"participer à des activités locales","zh":"参与当地活动","example":"Par exemple, s’ils souhaitent s’installer à Paris, ils peuvent pratiquer le français dans leur vie quotidienne, mais aussi participer à des activités locales, rejoindre des associations ou échanger avec des habitants.","source":18,"row":47},{"id":"0-48","module":0,"category":"旅行与移民","fr":"trouver un emploi","zh":"找到工作","example":"De nos jours, la question de savoir s’il est facile de trouver un emploi lorsqu’on s’installe au Canada suscite beaucoup de débats.","source":101,"row":48},{"id":"0-49","module":0,"category":"旅行与移民","fr":"décrocher un poste","zh":"获得职位","example":"Certaines personnes considèrent qu’il est relativement facile de décrocher un poste à condition de posséder les compétences recherchées, tandis que d’autres estiment que l’accès au marché du travail peut représenter un véritable défi pour les nouveaux arrivants.","source":101,"row":49},{"id":"0-50","module":0,"category":"旅行与移民","fr":"faciliter l'accès à l'emploi","zh":"促进就业机会的获得","example":"La maîtrise de la langue peut donc faciliter l’accès à l’emploi et favoriser une insertion durable sur le marché du travail.","source":41,"row":50},{"id":"0-51","module":0,"category":"旅行与移民","fr":"favoriser l'insertion professionnelle","zh":"促进就业融入","example":"Tout d’abord, créer des liens avec les habitants peut favoriser l’insertion professionnelle.","source":56,"row":51},{"id":"0-52","module":0,"category":"旅行与移民","fr":"acquérir de nouvelles compétences","zh":"获得新技能","example":"Ces démarches leur permettent non seulement d’acquérir de nouvelles compétences, mais aussi de mieux comprendre les attentes des employeurs et de mettre davantage en valeur leur expérience sur leur CV.","source":105,"row":52},{"id":"0-53","module":0,"category":"旅行与移民","fr":"suivre une formation","zh":"参加培训","example":"Ils peuvent, par exemple, suivre une formation professionnelle, participer à des ateliers consacrés à la recherche d’emploi ou développer leur réseau professionnel.","source":105,"row":53},{"id":"0-54","module":0,"category":"旅行与移民","fr":"gagner sa vie","zh":"谋生","example":"En effet, disposer d’un emploi stable permet non seulement de gagner sa vie et d’assurer une certaine stabilité financière, mais aussi de favoriser son insertion professionnelle.","source":133,"row":54},{"id":"0-55","module":0,"category":"旅行与移民","fr":"gérer un budget","zh":"管理预算","example":"Par exemple, elles peuvent être mieux préparées pour gérer un budget, chercher un logement ou accomplir certaines démarches administratives.","source":20,"row":55},{"id":"0-56","module":0,"category":"旅行与移民","fr":"apprendre une langue étrangère","zh":"学习外语","example":"Tout d’abord, les jeunes ont généralement plus de facilité à apprendre une langue étrangère que les personnes plus âgées.","source":18,"row":56},{"id":"0-57","module":0,"category":"旅行与移民","fr":"assimiler de nouveaux mots","zh":"吸收新词汇","example":"En effet, ils peuvent souvent assimiler plus facilement de nouveaux mots et de nouvelles expressions.","source":18,"row":57},{"id":"0-58","module":0,"category":"旅行与移民","fr":"améliorer la maîtrise de la langue","zh":"提高语言掌握程度","example":"Ces interactions leur permettent d’améliorer progressivement leur maîtrise de la langue et de mieux comprendre les habitudes du pays.","source":18,"row":58},{"id":"0-59","module":0,"category":"旅行与移民","fr":"regarder des documentaires","zh":"观看纪录片","example":"Par exemple, les internautes peuvent regarder des documentaires, des vidéos en ligne ou encore des émissions produites dans d’autres pays.","source":217,"row":59},{"id":"0-60","module":0,"category":"旅行与移民","fr":"réduire le sentiment de solitude","zh":"减少孤独感","example":"Cependant, il faut reconnaître que voyager en groupe peut réduire le sentiment de solitude et offrir davantage de soutien.","source":181,"row":60},{"id":"0-61","module":0,"category":"旅行与移民","fr":"nouer de nouvelles amitiés","zh":"结交新朋友","example":"Une bonne maîtrise de la langue leur permet alors de participer plus activement à la vie locale, de nouer de nouvelles amitiés et de mieux comprendre certaines habitudes du pays d’accueil.","source":234,"row":61},{"id":"0-62","module":0,"category":"旅行与移民","fr":"accéder à des informations pratiques","zh":"获取实用信息","example":"Par ailleurs, les outils numériques leur permettent d’accéder plus facilement à des informations pratiques et de développer progressivement un nouveau réseau social.","source":12,"row":62},{"id":"0-63","module":0,"category":"旅行与移民","fr":"faire de nouveaux amis","zh":"结交新朋友","example":"À mes yeux, je dirais que se faire de nouveaux amis dans un pays étranger n’est pas toujours évident, notamment au début.","source":63,"row":63},{"id":"0-64","module":0,"category":"职业与职场","fr":"élargir ses horizons","zh":"拓宽眼界","example":"Ces expériences enrichiraient non seulement mes vidéos, mais me permettraient également d’élargir mes horizons.","source":448,"row":64},{"id":"0-65","module":0,"category":"职业与职场","fr":"se former tout au long de la vie","zh":"终身接受培训","example":"Bien que l’âge puisse parfois rendre l’apprentissage plus difficile, les nouvelles technologies offrent aujourd’hui davantage de possibilités de se former tout au long de la vie.","source":397,"row":65},{"id":"0-66","module":0,"category":"职业与职场","fr":"changer de métier","zh":"转行","example":"Cela étant dit, changer de métier trop fréquemment peut également présenter certains inconvénients.","source":403,"row":66},{"id":"0-67","module":0,"category":"职业与职场","fr":"progresser dans sa carrière","zh":"职业晋升","example":"Il peut ainsi avoir plus de chances d’obtenir une promotion et de progresser dans sa carrière.","source":267,"row":67},{"id":"0-68","module":0,"category":"职业与职场","fr":"progresser dans la hiérarchie","zh":"在组织层级中晋升","example":"Il faut être compétent dans son métier pour progresser dans la hiérarchie d’une entreprise.","source":414,"row":68},{"id":"0-69","module":0,"category":"职业与职场","fr":"occuper un poste de responsable","zh":"担任管理岗位","example":"Tout d’abord, occuper un poste de responsable exige de nombreuses compétences ainsi qu’une solide expérience professionnelle.","source":364,"row":69},{"id":"0-70","module":0,"category":"职业与职场","fr":"travailler sous la direction de quelqu'un","zh":"在某人领导下工作","example":"Avez-vous une préférence entre travailler sous la direction d’un homme ou d’une femme ?","source":347,"row":70},{"id":"0-71","module":0,"category":"职业与职场","fr":"respecter les instructions de son supérieur","zh":"遵从上司指令","example":"Pour conclure, il me semble qu’il faut généralement respecter les instructions de son supérieur, car son expérience peut guider les employés et la hiérarchie joue un rôle important dans le fonctionnement d’une entreprise.","source":381,"row":71},{"id":"0-72","module":0,"category":"职业与职场","fr":"travailler à domicile","zh":"在家办公","example":"Lorsqu’une personne travaille à domicile, elle peut avoir du mal à se déconnecter complètement de son travail.","source":302,"row":72},{"id":"0-73","module":0,"category":"职业与职场","fr":"faire face à la concurrence","zh":"应对竞争","example":"De plus, les jeunes diplômés doivent faire face à une forte concurrence sur le marché du travail.","source":427,"row":73},{"id":"0-74","module":0,"category":"职业与职场","fr":"prendre des responsabilités","zh":"承担责任","example":"Dans une entreprise, s’il se montre motivé, proactif et prêt à prendre davantage de responsabilités, son travail peut être plus facilement reconnu par ses supérieurs.","source":267,"row":74},{"id":"0-75","module":0,"category":"职业与职场","fr":"faire preuve de persévérance","zh":"表现出毅力","example":"Ils doivent s’entraîner intensivement, faire preuve de persévérance et apprendre à surmonter les difficultés.","source":283,"row":75},{"id":"0-76","module":0,"category":"职业与职场","fr":"bénéficier d'une certaine sécurité financière","zh":"获得一定经济保障","example":"Dans ce cas, disposer d’un salaire suffisant est indispensable pour faire face à ces dépenses et bénéficier d’une certaine sécurité financière.","source":259,"row":76},{"id":"0-77","module":0,"category":"职业与职场","fr":"financer ses études","zh":"支付学费","example":"Pour conclure, il me semble que travailler pour financer ses études peut être bénéfique, à condition de le faire avec modération.","source":320,"row":77},{"id":"0-78","module":0,"category":"职业与职场","fr":"travailler pendant ses études","zh":"边学习边工作","example":"Tout d’abord, travailler pendant leurs études peut permettre aux jeunes de développer leur sens des responsabilités.","source":316,"row":78},{"id":"0-79","module":0,"category":"职业与职场","fr":"créer un environnement de travail agréable","zh":"营造良好工作环境","example":"Une entreprise qui accorde de l’importance au repos et à la santé de son personnel peut créer un environnement de travail plus agréable.","source":336,"row":79},{"id":"0-80","module":0,"category":"职业与职场","fr":"obtenir de bons résultats","zh":"取得好成绩","example":"Tout d’abord, être compétent dans son métier permet généralement d’obtenir de bons résultats professionnels, ce qui constitue souvent un atout important pour obtenir une promotion.","source":416,"row":80},{"id":"0-81","module":0,"category":"职业与职场","fr":"rencontrer davantage de difficultés","zh":"遇到更多困难","example":"Toutefois, il faut reconnaître que certains artistes peuvent rencontrer davantage de difficultés financières.","source":293,"row":81},{"id":"0-82","module":0,"category":"职业与职场","fr":"résoudre rapidement un problème","zh":"迅速解决问题","example":"Cette relation de confiance peut faciliter la communication et la collaboration, notamment lorsqu’il faut résoudre rapidement un problème ou prendre une décision ensemble.","source":344,"row":82},{"id":"0-83","module":0,"category":"职业与职场","fr":"trouver un compromis acceptable","zh":"找到可接受的折中方案","example":"Au lieu de prendre immédiatement parti pour l’un ou pour l’autre, elle pourrait jouer un rôle de médiatrice et essayer de trouver un compromis acceptable pour les deux parties.","source":350,"row":83},{"id":"0-84","module":0,"category":"职业与职场","fr":"prendre davantage d'initiatives","zh":"采取更多主动行动","example":"Elle peut ainsi consacrer plus de temps et d’énergie à son travail, prendre davantage d’initiatives et chercher constamment à améliorer ses compétences.","source":267,"row":84},{"id":"0-85","module":0,"category":"职业与职场","fr":"suivre des cours en ligne","zh":"参加线上课程","example":"Ils peuvent, par exemple, suivre des cours en ligne, regarder des vidéos éducatives ou apprendre une langue étrangère à leur propre rythme.","source":395,"row":85},{"id":"0-86","module":0,"category":"职业与职场","fr":"acquérir de nouvelles connaissances","zh":"获取新知识","example":"Certaines personnes pensent qu’il devient très difficile d’apprendre quelque chose de nouveau lorsqu’on vieillit, tandis que d’autres estiment qu’il n’est jamais trop tard pour acquérir de nouvelles connaissances.","source":393,"row":86},{"id":"0-87","module":0,"category":"职业与职场","fr":"améliorer sa qualité de vie","zh":"改善生活质量","example":"Cela peut leur permettre de mieux concilier leurs responsabilités professionnelles et familiales et, par conséquent, d’améliorer leur qualité de vie.","source":301,"row":87},{"id":"0-88","module":0,"category":"职业与职场","fr":"favoriser l'égalité des chances","zh":"促进机会平等","example":"De plus, les formations proposées par l’entreprise peuvent favoriser l’égalité des chances entre les employés.","source":387,"row":88},{"id":"0-89","module":0,"category":"教育与儿童","fr":"faire preuve d'ouverture d'esprit","zh":"展现开放心态","example":"À cet âge, les enfants sont généralement plus réceptifs aux nouvelles connaissances, font preuve d’une grande ouverture d’esprit et possèdent une bonne capacité de mémorisation.","source":499,"row":89},{"id":"0-90","module":0,"category":"教育与儿童","fr":"postuler à un poste","zh":"申请职位","example":"Par exemple, si une personne souhaite postuler à un poste dans une entreprise française, le fait de parler français avec fluidité peut représenter un avantage considérable, notamment si elle doit communiquer avec des collègues ou des clients francophones.","source":624,"row":90},{"id":"0-91","module":0,"category":"教育与儿童","fr":"développer ses compétences professionnelles","zh":"提升职业技能","example":"Parallèlement, il faudrait que chacun développe ses compétences professionnelles en fonction de ses propres besoins et de son domaine d’activité.","source":627,"row":91},{"id":"0-92","module":0,"category":"教育与儿童","fr":"ouvrir de nouvelles perspectives professionnelles","zh":"开辟新的职业前景","example":"À mes yeux, je pense que ces matières ont pleinement leur place à l’école, car elles contribuent à l’épanouissement des élèves et peuvent même leur ouvrir de nouvelles perspectives professionnelles.","source":455,"row":92},{"id":"0-93","module":0,"category":"教育与儿童","fr":"développer la sensibilité artistique","zh":"培养艺术感知力","example":"Pour conclure, il me semble que les matières artistiques ont pleinement leur place à l’école, puisqu’elles permettent aux élèves de développer leur sensibilité artistique et peuvent même leur ouvrir de nouvelles perspectives professionnelles.","source":459,"row":93},{"id":"0-94","module":0,"category":"教育与儿童","fr":"consulter un dictionnaire électronique","zh":"查阅电子词典","example":"Par exemple, lorsqu’un enfant rencontre un mot qu’il ne connaît pas, il peut facilement consulter un dictionnaire électronique en ligne pour en vérifier le sens.","source":477,"row":94},{"id":"0-95","module":0,"category":"教育与儿童","fr":"accéder à des ressources éducatives","zh":"获取教育资源","example":"Les enfants peuvent l’utiliser pour accéder à de nombreuses ressources éducatives disponibles en ligne.","source":508,"row":95},{"id":"0-96","module":0,"category":"教育与儿童","fr":"garantir l'égalité des chances","zh":"保障机会平等","example":"Tout d’abord, l’un des objectifs fondamentaux de l’éducation est de garantir l’égalité des chances.","source":592,"row":96},{"id":"0-97","module":0,"category":"教育与儿童","fr":"renforcer la supervision parentale","zh":"加强家长监管","example":"Parallèlement, il faudrait renforcer la supervision parentale et fixer certaines limites concernant le temps d’écran afin d’aider les enfants à trouver un équilibre entre les activités numériques et les activités hors écran.","source":516,"row":97},{"id":"0-98","module":0,"category":"教育与儿童","fr":"développer une conscience écologique","zh":"培养环保意识","example":"À mes yeux, il est essentiel de sensibiliser les enfants à la protection de l’environnement très tôt, car cela leur permet de développer une conscience écologique et le sens des responsabilités.","source":498,"row":98},{"id":"0-99","module":0,"category":"教育与儿童","fr":"développer le sens des responsabilités","zh":"培养责任感","example":"De plus, l’éducation à l’environnement permet de développer le sens des responsabilités dès l’enfance.","source":500,"row":99},{"id":"0-100","module":0,"category":"教育与儿童","fr":"fixer certaines limites","zh":"设定一定限制","example":"Il serait préférable d’encadrer son utilisation et de fixer certaines limites, notamment concernant le temps d’écran et les contenus accessibles.","source":509,"row":100},{"id":"0-101","module":0,"category":"教育与儿童","fr":"être exposé à des contenus inappropriés","zh":"接触不适宜内容","example":"Sur Internet, ils peuvent être exposés à des contenus inappropriés ou violents, mais aussi à de fausses informations.","source":486,"row":101},{"id":"0-102","module":0,"category":"教育与儿童","fr":"passer trop de temps devant les écrans","zh":"在屏幕前花费过多时间","example":"Tout d’abord, passer trop de temps devant les écrans peut nuire à la santé physique des enfants.","source":513,"row":102},{"id":"0-103","module":0,"category":"教育与儿童","fr":"économiser l'eau","zh":"节约用水","example":"Lorsqu’on apprend aux enfants à économiser l’eau, à trier leurs déchets ou à éviter de gaspiller les ressources, ils comprennent que chacun a sa part de responsabilité dans la protection de notre planète.","source":500,"row":103},{"id":"0-104","module":0,"category":"教育与儿童","fr":"éviter de gaspiller les ressources","zh":"避免浪费资源","example":"Lorsqu’on apprend aux enfants à économiser l’eau, à trier leurs déchets ou à éviter de gaspiller les ressources, ils comprennent que chacun a sa part de responsabilité dans la protection de notre planète.","source":500,"row":104},{"id":"0-105","module":0,"category":"教育与儿童","fr":"utiliser les réseaux sociaux","zh":"使用社交媒体","example":"L’école peut donc leur apprendre à utiliser les réseaux sociaux de manière constructive afin de favoriser les échanges interculturels.","source":485,"row":105},{"id":"0-106","module":0,"category":"教育与儿童","fr":"interrompre régulièrement son travail","zh":"不断打断工作","example":"Par exemple, si leur téléphone sonne constamment à cause des SMS, des notifications ou des appels qu’ils reçoivent, ils risquent d’interrompre régulièrement leur travail pour vérifier leur écran ou répondre à un message.","source":506,"row":106},{"id":"0-107","module":0,"category":"媒体与文化","fr":"subir une pression professionnelle","zh":"承受职业压力","example":"Aujourd’hui, de nombreux employés ont des journées de travail chargées et subissent une forte pression professionnelle.","source":726,"row":107},{"id":"0-108","module":0,"category":"媒体与文化","fr":"se familiariser avec la prononciation","zh":"熟悉发音","example":"Par exemple, un enfant qui apprend le français peut regarder des émissions en français afin de se familiariser avec la prononciation et d’enrichir son vocabulaire.","source":712,"row":108},{"id":"0-109","module":0,"category":"媒体与文化","fr":"compléter l'apprentissage scolaire","zh":"补充学校教育","example":"La télévision peut donc compléter l’apprentissage scolaire d’une manière plus ludique.","source":712,"row":109},{"id":"0-110","module":0,"category":"媒体与文化","fr":"développer son esprit critique","zh":"培养批判性思维","example":"Il est donc essentiel de vérifier les sources et de développer son esprit critique avant de croire ou de partager une information.","source":735,"row":110},{"id":"0-111","module":0,"category":"媒体与文化","fr":"prendre l'habitude de s'informer régulièrement","zh":"养成定期了解资讯的习惯","example":"Parallèlement, il faudrait que chacun prenne l’habitude de s’informer régulièrement auprès de sources fiables, quel que soit le support utilisé.","source":729,"row":111},{"id":"0-112","module":0,"category":"媒体与文化","fr":"s'informer auprès de sources fiables","zh":"从可靠来源获取信息","example":"Parallèlement, il faudrait que chacun prenne l’habitude de s’informer régulièrement auprès de sources fiables, quel que soit le support utilisé.","source":729,"row":112},{"id":"0-113","module":0,"category":"媒体与文化","fr":"interrompre régulièrement la lecture","zh":"不断打断阅读","example":"Toutes ces distractions peuvent nuire à la concentration et interrompre régulièrement la lecture.","source":672,"row":113},{"id":"0-114","module":0,"category":"媒体与文化","fr":"télécharger un livre en quelques secondes","zh":"几秒钟内下载一本书","example":"Tout d’abord, on peut télécharger un livre en quelques secondes et y accéder presque n’importe où et n’importe quand.","source":673,"row":114},{"id":"0-115","module":0,"category":"媒体与文化","fr":"stocker des centaines de livres","zh":"存储数百本书","example":"De plus, un seul appareil permet de stocker des centaines de livres sans avoir à les transporter physiquement.","source":673,"row":115},{"id":"0-116","module":0,"category":"媒体与文化","fr":"démocratiser l'accès à la culture","zh":"让更多人平等接触文化","example":"De plus, la gratuité permettrait de démocratiser l’accès à la culture.","source":679,"row":116},{"id":"0-117","module":0,"category":"媒体与文化","fr":"renoncer à certaines activités culturelles","zh":"放弃某些文化活动","example":"Elles peuvent donc être obligées de renoncer à certaines activités culturelles pour des raisons financières.","source":679,"row":117},{"id":"0-118","module":0,"category":"媒体与文化","fr":"assurer leur fonctionnement quotidien","zh":"保证日常运营","example":"Les musées et les théâtres ont besoin de ressources importantes pour assurer leur fonctionnement quotidien.","source":680,"row":118},{"id":"0-119","module":0,"category":"媒体与文化","fr":"entretenir les bâtiments","zh":"维护建筑","example":"Les recettes provenant de la vente des billets peuvent notamment servir à entretenir les bâtiments, à protéger les œuvres, à rémunérer le personnel ou encore à garantir la sécurité des visiteurs.","source":680,"row":119},{"id":"0-120","module":0,"category":"媒体与文化","fr":"protéger les œuvres","zh":"保护作品","example":"Les recettes provenant de la vente des billets peuvent notamment servir à entretenir les bâtiments, à protéger les œuvres, à rémunérer le personnel ou encore à garantir la sécurité des visiteurs.","source":680,"row":120},{"id":"0-121","module":0,"category":"媒体与文化","fr":"exprimer ses sentiments","zh":"表达感情","example":"Tout d’abord, les lettres manuscrites permettent d’exprimer ses sentiments d’une manière plus personnelle et touchante.","source":686,"row":121},{"id":"0-122","module":0,"category":"媒体与文化","fr":"transmettre des émotions","zh":"传递情感","example":"Par exemple, une lettre d’amour écrite à la main peut transmettre des émotions d’une manière très personnelle, car elle reflète directement les pensées et les sentiments de son auteur.","source":686,"row":122},{"id":"0-123","module":0,"category":"媒体与文化","fr":"se changer les idées","zh":"转换心情","example":"Dans ce cas, regarder un dessin animé ou une émission divertissante pendant un certain temps peut leur permettre de se changer les idées et de décompresser.","source":711,"row":123},{"id":"0-124","module":0,"category":"媒体与文化","fr":"saisir toutes les références","zh":"理解所有典故","example":"Comme je connais assez peu son œuvre, j’aurais parfois du mal à saisir toutes les références ou toutes les subtilités d’une représentation.","source":695,"row":124},{"id":"0-125","module":0,"category":"媒体与文化","fr":"participer directement à la représentation","zh":"直接参与演出","example":"Certains spectacles interactifs permettent même aux spectateurs de participer directement à la représentation.","source":696,"row":125},{"id":"0-126","module":0,"category":"媒体与文化","fr":"conserver une trace durable","zh":"留下长久记录","example":"Tout d’abord, prendre des photos permet de conserver une trace durable des moments importants de notre vie.","source":702,"row":126},{"id":"0-127","module":0,"category":"媒体与文化","fr":"feuilleter cet album","zh":"翻阅这本相册","example":"Lorsque nous aurons soixante-dix ou quatre-vingts ans, nous pourrons feuilleter cet album et nous replonger dans les souvenirs de notre jeunesse.","source":702,"row":127},{"id":"0-128","module":0,"category":"媒体与文化","fr":"profiter pleinement du moment présent","zh":"充分享受当下","example":"Cela étant dit, il faut reconnaître qu’à force de vouloir tout photographier ou tout filmer, on risque de ne plus profiter pleinement du moment présent.","source":704,"row":128},{"id":"0-129","module":0,"category":"媒体与文化","fr":"suivre le concert à travers l'écran","zh":"通过屏幕观看演唱会","example":"Au lieu de regarder directement l’artiste qui se produit sur scène, elles finissent par suivre le concert à travers l’écran de leur téléphone.","source":704,"row":129},{"id":"0-130","module": ontrôler son poids","zh":"控制体重","example":"Faire régulièrement de l’exercice permet non seulement de contrôler son poids, mais aussi de maintenir une bonne condition physique et d’adopter un mode de vie plus actif.","source":740,"row":152},{"id":"0-153","module":0,"category":"媒体与文化","fr":"maintenir une bonne condition physique","zh":"保持良好的身体状态","example":"Faire régulièrement de l’exercice permet non seulement de contrôler son poids, mais aussi de maintenir une bonne condition physique et d’adopter un mode de vie plus actif.","source":740,"row":153},{"id":"0-154","module":0,"category":"媒体与文化","fr":"exercer des responsabilités politiques","zh":"承担政治职责","example":"Leur notoriété peut même présenter certains avantages, mais le simple fait d’être célèbre ne suffit évidemment pas pour exercer des responsabilités politiques.","source":756,"row":154},{"id":"0-155","module":0,"category":"环境与城市","fr":"protéger les espèces menacées","zh":"保护受威胁物种","example":"Protéger les espèces menacées permet donc de préserver non seulement certains animaux, mais aussi, plus largement, l’équilibre de la faune et de la biodiversité.","source":854,"row":155},{"id":"0-156","module":0,"category":"环境与城市","fr":"préserver la biodiversité","zh":"保护生物多样性","example":"Tout d’abord, protéger les espèces animales menacées est essentiel pour préserver la biodiversité et l’équilibre des écosystèmes.","source":854,"row":156},{"id":"0-157","module":0,"category":"环境与城市","fr":"perturber l'écosystème","zh":"扰乱生态系统","example":"Si une espèce disparaît complètement, cela peut également perturber l’écosystème auquel elle appartient.","source":854,"row":157},{"id":"0-158","module":0,"category":"环境与城市","fr":"menacer la survie de l'espèce","zh":"威胁物种生存","example":"Une exploitation excessive de ces animaux peut entraîner une forte diminution de leur population et menacer davantage la survie de l’espèce.","source":854,"row":158},{"id":"0-159","module":0,"category":"环境与城市","fr":"réduire les émissions de dioxyde de carbone","zh":"减少二氧化碳排放","example":"Pour conclure, il me semble que limiter certains déplacements en avion peut contribuer à protéger l’environnement, notamment en réduisant les émissions de dioxyde de carbone.","source":828,"row":159},{"id":"0-160","module":0,"category":"环境与城市","fr":"développer les énergies renouvelables","zh":"发展可再生能源","example":"Selon vous, est-il important de développer les énergies renouvelables (par exemple, utiliser la force du vent ou celle de l’eau) ?","source":876,"row":160},{"id":"0-161","module":0,"category":"环境与城市","fr":"utiliser les transports en commun","zh":"乘坐公共交通","example":"Elle peut également utiliser les transports en commun pour aller au restaurant, faire du sport ou retrouver ses amis.","source":782,"row":161},{"id":"0-162","module":0,"category":"环境与城市","fr":"trier ses déchets","zh":"垃圾分类","example":"Par exemple, dans la cuisine, chaque famille peut trier ses déchets en séparant les matières recyclables des autres déchets.","source":811,"row":162},{"id":"0-163","module":0,"category":"环境与城市","fr":"protéger l'environnement","zh":"保护环境","example":"Pour réduire la pollution et protéger l’environnement, les transports en commun devraient-ils être gratuits ?","source":787,"row":163},{"id":"0-164","module":0,"category":"环境与城市","fr":"accélérer la disparition d'espèces","zh":"加速物种消失","example":"Certaines activités humaines peuvent en effet accélérer la disparition d’espèces déjà fragiles.","source":854,"row":164},{"id":"0-165","module":0,"category":"环境与城市","fr":"se rendre au travail","zh":"去上班","example":"Beaucoup d’employés peuvent prendre le métro ou le bus pour se rendre au travail le matin et rentrer chez eux le soir.","source":782,"row":165},{"id":"0-166","module":0,"category":"环境与城市","fr":"faire ses courses","zh":"采购日用品","example":"Aujourd’hui, il n’est plus toujours nécessaire de conduire pour faire ses courses ou acheter les produits dont on a besoin.","source":783,"row":166},{"id":"0-167","module":0,"category":"环境与城市","fr":"parcouri fr":"Il vaut mieux ...","zh":"最好……","example":"De nos jours, la question de savoir s’il vaut mieux voyager seul ou en groupe suscite beaucoup de débats.","source":178,"row":40},{"id":"1-41","module":1,"category":"建议与条件","fr":"Il est essentiel de ...","zh":"……至关重要","example":"Toutefois, il est essentiel de ne pas rester enfermé dans son propre cercle culturel.","source":52,"row":41},{"id":"1-42","module":1,"category":"建议与条件","fr":"Il est important que ...","zh":"……很重要（虚拟式）","example":"De nos jours, la question de savoir s’il est important que les filles et les garçons reçoivent la même éducation suscite beaucoup de débats.","source":591,"row":42},{"id":"1-43","module":1,"category":"建议与条件","fr":"À condition que ..., ...","zh":"条件是……（虚拟式）","example":"Ces moments de détente peuvent ainsi contribuer à leur équilibre émotionnel, à condition que le temps passé devant l’écran reste raisonnable.","source":711,"row":43},{"id":"1-44","module":1,"category":"建议与条件","fr":"Chacun devrait ...","zh":"每个人都应……","example":"Chacun devrait pouvoir exprimer son opinion, mais il faut également respecter la vie privée, la réputation et les droits des autres.","source":1197,"row":44},{"id":"1-45","module":1,"category":"结尾总结","fr":"Pour conclure, il me semble que ...","zh":"总之，我认为……","example":"Pour conclure, il me semble que changer de métier reste possible à tout âge.","source":411,"row":45},{"id":"1-46","module":1,"category":"结尾总结","fr":"L'essentiel est de ...","zh":"关键在于……","example":"L’essentiel est de posséder les compétences nécessaires pour exercer correctement son métier.","source":552,"row":46},{"id":"1-47","module":1,"category":"结尾总结","fr":"Il ne faut pas oublier que ...","zh":"不要忘记……","example":"Cependant, il ne faut pas oublier que l’école offre généralement un enseignement plus structuré.","source":649,"row":47},{"id":"1-48","module":1,"category":"结尾总结","fr":"Parallèlement, il faudrait que ...","zh":"与此同时，应当……（虚拟式）","example":"Parallèlement, il faudrait que chacun sache gérer son stress afin d’en faire un moteur plutôt qu’un obstacle.","source":1109,"row":48},{"id":"1-49","module":1,"category":"结尾总结","fr":"Quel que soit / Quelle que soit / Quels que soient / Quelles que soient + nom, ...","zh":"无论……如何（按名词的性、数配合）","example":"Autrement dit, nous pouvons apprendre de nouvelles choses quel que soit notre âge.","source":397,"row":49,"cores":["quel que soit","quelle que soit","quels que soient","quelles que soient"]},{"id":"1-50","module":1,"category":"观点与立场","fr":"Je suis plutôt d'accord avec l'idée selon laquelle ...","zh":"我比较赞同……这一观点","example":"À mes yeux, je suis plutôt d’accord avec l’idée selon laquelle Internet a transformé le monde en un véritable village global, puisqu’il permet de réduire les distances géographiques et culturelles entre les populations.","source":907,"row":50},{"id":"1-51","module":1,"category":"观点与立场","fr":"Je dirais que ...","zh":"我会说……","example":"À mes yeux, je dirais que l’intégration est une responsabilité partagée.","source":86,"row":51},{"id":"1-52","module":1,"category":"观点与立场","fr":"À mes yeux, ...","zh":"依我看来……","example":"À mes yeux, je dirais qu’elle reste assez inégale.","source":1032,"row":52},{"id":"1-53","module":1,"category":"观点与立场","fr":"Il faut reconnaître que ...","zh":"必须承认……","example":"Cela étant dit, il faut reconnaître que la sieste doit être encadrée.","source":337,"row":53},{"id":"1-54","module":1,"category":"组织与递进","fr":"Cela étant dit, ...","zh":"话虽如此……","example":"Cela étant dit, il faut reconnaître qu’il ne faut pas généraliser.","source":351,"row":54},{"id":"1-55","module":1,"category":"组织与递进","fr":"D'autant plus que ...","zh":"更何况……","example":"D’autant plus que les billets d’entrée de certains zoos peuvent être relativement chers, notamment pour une famille avec plusieurs enfants.","source":849,"row":55},{"id":"1-56","module":1,"category":"组织与递进","fr":"En pratique, ...","zh":"在实际中……","example":"Même un voyage peut permettre de mettre en pratique ce qu’on a appris et de gagner en confiance.","source":635,"row":56},{"id":"1-57","module":1,"category":"组织与递进","fr":"Dans ce cas, ...","zh":"在这种情况下……","example":"Dans ce cas, changer d’appareil répond donc à un besoin professionnel réel.","source":974,"row":57},{"id":"1-58","module":1,"category":"组织与递进","fr":"À long terme, ...","zh":"从长远看……","example":"À long terme, ces interruptions répétées peuvent donc réduire son efficacité professionnelle.","source":989,"row":58},{"id":"1-59","module":1,"category":"举例说明","fr":"Prenons l'exemple d'une personne qui ...","zh":"以一位……的人为例","example":"Prenons l’exemple d’une personne qui a d’abord travaillé dans le marketing avant de devenir analyste de données.","source":402,"row":59},{"id":"1-60","module":1,"category":"举例说明","fr":"On peut citer l'exemple de ...","zh":"可以举……的例子","example":"On peut citer l’exemple des banques alimentaires.","source":1123,"row":60},{"id":"1-61","module":1,"category":"举例说明","fr":"C'est notamment le cas des ...","zh":"……就是典型情况","example":"C’est notamment le cas des voitures électriques.","source":863,"row":61},{"id":"1-62","module":1,"category":"因果与结果","fr":"Cela risque de ...","zh":"这可能会……（负面风险）","example":"À long terme, cela risque de créer chez eux un profond sentiment d’insécurité et d’avoir des conséquences sur leur bien-être psychologique.","source":771,"row":62},{"id":"1-63","module":1,"category":"因果与结果","fr":"Par conséquent, ...","zh":"因此……","example":"Par conséquent, une information fausse ou trompeuse peut se diffuser très rapidement.","source":751,"row":63},{"id":"1-64","module":1,"category":"因果与结果","fr":"C'est pourquoi ...","zh":"正因为如此……","example":"C’est pourquoi de nombreux employés attachent beaucoup d’importance à la rémunération lorsqu’ils choisissent un poste.","source":259,"row":64},{"id":"1-65","module":1,"category":"让步与限定","fr":"Cela ne signifie pas pour autant que ...","zh":"但这并不意味着……","example":"À mes yeux, je dirais que notre culture peut effectivement évoluer lorsque nous nous installons dans un autre pays, mais cela ne signifie pas pour autant que nous devons abandonner notre culture d’origine.","source":25,"row":65},{"id":"1-66","module":1,"category":"比较与选择","fr":"Plutôt que de ..., il serait préférable de ...","zh":"与其……，更好的是……","example":"Il serait donc préférable d’encadrer l’utilisation du téléphone plutôt que de l’interdire complètement.","source":373,"row":66},{"id":"1-67","module":1,"category":"比较与选择","fr":"Il vaut mieux ... que ...","zh":"……比……更好","example":"De nos jours, la question de savoir s’il vaut mieux voyager seul ou en groupe suscite beaucoup de débats.","source":178,"row":67},{"id":"1-68","module":1,"category":"比较与选择","fr":"Il est tout à fait possible de ...","zh":"完全有可能……","example":"À mes yeux, je dirais qu’il est tout à fait possible de vivre sans voiture aujourd’hui, notamment dans les grandes villes.","source":781,"row":68},{"id":"1-69","module":1,"category":"比较与选择","fr":"Il n'est jamais trop tard pour ...","zh":"做……永远不晚","example":"Pour conclure, il me semble qu’il n’est jamais trop tard pour apprendre.","source":397,"row":69},{"id":"1-70","module":1,"category":"条件与建议","fr":"Il serait souhaitable que les autorités ...","zh":"最好由当局……（虚拟式）","example":"Parallèlement, il serait souhaitable que les autorités développent ce secteur de manière durable afin d’en maximiser les bénéfices tout en limitant ses effets négatifs sur l’environnement et la population locale.","source":166,"row":70},{"id":"1-71","module":1,"category":"条件与建议","fr":"Il faudrait que chacun ...","zh":"每个人应当……（虚拟式）","example":"Parallèlement, il faudrait que chacun sache gérer son stress afin d’en faire un moteur plutôt qu’un obstacle.","source":1109,"row":71},{"id":"1-72","module":1,"category":"条件与建议","fr":"À condition de ..., ...","zh":"只要……（不定式）","example":"Une femme peut parfaitement exercer ces professions à condition de posséder les compétences et la formation nécessaires.","source":593,"row":72},{"id":"1-73","module":1,"category":"结尾总结","fr":"Pour conclure, il me semble qu'il faut ...","zh":"总之，我认为应该……","example":"Pour conclure, il me semble qu’il faut généralement respecter les instructions de son supérieur, car son expérience peut guider les employés et la hiérarchie joue un rôle important dans le fonctionnement d’une entreprise.","source":381,"row":73},{"id":"1-74","module":1,"category":"结尾总结","fr":"L'essentiel est donc de ...","zh":"因此关键在于……","example":"L’essentiel est donc de savoir comment l’utiliser.","source":480,"row":74},{"id":"1-75","module":1,"category":"结尾总结","fr":"Quel que soit leur âge, ...","zh":"无论他们年龄如何……","example":"Parallèlement, il faudrait que les autorités proposent davantage de programmes d’intégration aux nouveaux arrivants, quel que soit leur âge, afin de faciliter leur intégration sociale et culturelle.","source":21,"row":75},{"id":"2-2","module":2,"category":"动词＋介词＋名词","fr":"faire face à quelque chose","zh":"面对、应对某事","example":"Cela étant dit, il faut reconnaître que les personnes plus âgées ont généralement davantage d’expérience pour faire face aux difficultés de la vie quotidienne.","source":20,"row":2},{"id":"2-3","module":2,"category":"动词＋介词＋名词","fr":"participer à quelque chose","zh":"参加某事","example":"Beaucoup de parents demandent progressivement à leurs enfants de participer à la vie de la maison.","source":1249,"row":3},{"id":"2-4","module":2,"category":"动词＋介词＋名词","fr":"contribuer à quelque chose","zh":"有助于、促成某事","example":"Cette expérience peut donc contribuer à son épanouissement personnel.","source":1236,"row":4},{"id":"2-5","module":2,"category":"动词＋介词＋名词","fr":"accéder à quelque chose","zh":"获得／进入／访问某事物或某处","example":"Certaines personnes décident de partir à l’étranger afin d’accéder à davantage d’opportunités, d’acquérir une expérience internationale ou de développer de nouvelles compétences.","source":125,"row":5},{"id":"2-6","module":2,"category":"动词＋介词＋名词","fr":"répondre à quelque chose","zh":"回应、满足某事","example":"Il est essentiel de répondre aux besoins fondamentaux de la population et de garantir à chacun des conditions de vie dignes.","source":657,"row":6},{"id":"2-7","module":2,"category":"动词＋介词＋名词","fr":"nuire à quelque chose","zh":"损害某事物","example":"Toutefois, son utilisation excessive peut nuire à la concentration.","source":374,"row":7},{"id":"2-8","module":2,"category":"动词＋介词＋名词","fr":"profiter de quelque chose","zh":"享受、利用某事物","example":"Pour profiter de la vie, il faut travailler moins.","source":323,"row":8},{"id":"2-9","module":2,"category":"动词＋介词＋名词","fr":"bénéficier de quelque chose","zh":"从某事物中受益","example":"Les universités devraient-elles bénéficier de plus de financements ?","source":653,"row":9},{"id":"2-10","module":2,"category":"动词＋介词＋名词","fr":"dépendre de quelque chose","zh":"取决于某事物","example":"En définitive, le choix devrait dépendre de la situation familiale, des objectifs et des besoins de chaque personne.","source":143,"row":10},{"id":"2-11","module":2,"category":"动词＋介词＋名词","fr":"se familiariser avec quelque chose","zh":"熟悉某事物","example":"Il faut donc du temps pour se familiariser avec les codes sociaux du pays d’accueil.","source":65,"row":11},{"id":"2-12","module":2,"category":"动词＋介词＋名词","fr":"s'adapter à quelque chose","zh":"适应某事物","example":"Il peut également apprendre à gérer des situations difficiles et à s’adapter à différents interlocuteurs.","source":575,"row":12},{"id":"2-13","module":2,"category":"动词＋介词＋名词","fr":"s'intégrer dans quelque chose","zh":"融入某环境","example":"S’intégrer dans un nouveau pays est plus facile si on a des enfants.","source":146,"row":13},{"id":"2-14","module":2,"category":"动词＋介词＋名词","fr":"se passer de quelque chose","zh":"没有某物也能应付","example":"De nos jours, peut-on se passer de la télévision ?","source":716,"row":14},{"id":"2-15","module":2,"category":"动词＋介词＋名词","fr":"s'engager dans quelque chose","zh":"投身于某事","example":"À mes yeux, je dirais qu’elles peuvent tout à fait s’engager dans la vie politique, à condition qu’elles possèdent les compétences et les connaissances nécessaires.","source":756,"row":15},{"id":"2-16","module":2,"category":"动词＋介词＋名词","fr":"tenir compte de quelque chose","zh":"考虑到某事","example":"Toutefois, il faut tenir compte de leur capacité de compréhension.","source":502,"row":16},{"id":"2-17","module":2,"category":"动词＋介词＋名词","fr":"prendre en compte quelque chose","zh":"把某事考虑在内","example":"Tout d’abord, la maîtrise du français constitue un élément essentiel à prendre en compte avant de s’installer au Québec.","source":132,"row":17},{"id":"2-18","module":2,"category":"动词＋介词＋名词","fr":"faire preuve de quelque chose","zh":"表现出某种品质","example":"Les employés doivent également faire preuve de discernement.","source":377,"row":18},{"id":"2-19","module":2,"category":"动词＋介词＋名词","fr":"accorder de l'importance à quelque chose","zh":"重视某事","example":"Toutefois, la situation évolue progressivement, car de plus en plus de personnes commencent à accorder de l’importance à leur santé et à la qualité de ce qu’elles mangent.","source":1032,"row":19},{"id":"2-20","module":2,"category":"动词＋介词＋名词","fr":"faire attention à quelque chose","zh":"注意某事","example":"Il faut également faire attention à la qualité des aliments et maintenir une activité physique régulière.","source":1029,"row":20},{"id":"2-21","module":2,"category":"动词＋介词＋名词","fr":"avoir accès à quelque chose","zh":"能够接触或使用某物","example":"De plus, la télémédecine permet d’avoir accès à un choix plus large de professionnels de santé, y compris ceux qui vivent dans d’autres régions.","source":1092,"row":21},{"id":"2-22","module":2,"category":"动词＋介词＋名词","fr":"être confronté à quelque chose","zh":"面临某事","example":"Ils travaillent souvent sous pression et peuvent être confrontés à des situations particulièrement complexes.","source":276,"row":22},{"id":"2-23","module":2,"category":"动词＋介词＋名词","fr":"être exposé à quelque chose","zh":"暴露于某风险或环境","example":"Ils peuvent être exposés à des contenus inappropriés, violents ou destinés aux adultes.","source":522,"row":23},{"id":"2-24","module":2,"category":"动词＋介词＋名词","fr":"se concentrer sur quelque chose","zh":"专注于某事","example":"Pour elles, il est tout simplement plus important de se concentrer sur leur propre vie.","source":766,"row":24},{"id":"2-25","module":2,"category":"动词＋介词＋名词","fr":"reposer sur quelque chose","zh":"以某事为基础","example":"La formation continue devrait donc reposer sur une responsabilité partagée entre l’entreprise et ses employés.","source":388,"row":25},{"id":"2-26","module":2,"category":"动词＋介词＋名词","fr":"s'intéresser à quelque chose","zh":"对某事感兴趣","example":"Certaines personnes choisissent de ne pas s’intéresser à la politique.","source":1142,"row":26},{"id":"2-27","module":2,"category":"动词＋介词＋名词","fr":"s'occuper de quelque chose","zh":"负责、照料某事","example":"Celui-ci doit alors non seulement s’occuper de ses élèves, mais aussi communiquer régulièrement avec les parents et parfois faire face à leurs critiques.","source":441,"row":27},{"id":"2-28","module":2,"category":"动词＋介词＋名词","fr":"disposer de quelque chose","zh":"拥有、可支配某物","example":"L’entreprise, de son côté, peut disposer d’une main-d’œuvre plus qualifiée.","source":389,"row":28},{"id":"2-29","module":2,"category":"动词＋介词＋名词","fr":"souffrir de quelque chose","zh":"受某问题困扰","example":"C’est notamment le cas des personnes qui souffrent d’hypertension, de diabète ou d’asthme.","source":1064,"row":29},{"id":"2-30","module":2,"category":"动词＋介词＋名词","fr":"lutter contre quelque chose","zh":"对抗某事","example":"Les États doivent pouvoir identifier les personnes qui entrent sur leur territoire et lutter contre certaines activités criminelles.","source":158,"row":30},{"id":"2-31","module":2,"category":"动词＋介词＋名词","fr":"faire partie de quelque chose","zh":"是……的一部分／是其中一员","example":"Dans certaines entreprises, le mentorat peut faire partie des critères d’évaluation du leadership, notamment lorsqu’un employé souhaite accéder à un poste à responsabilités.","source":417,"row":31},{"id":"2-32","module":2,"category":"动词＋不定式","fr":"permettre de faire quelque chose","zh":"使做某事成为可能","example":"Les réseaux sociaux permettent de rencontrer de nouveaux amis plus facilement.","source":929,"row":32},{"id":"2-33","module":2,"category":"动词＋不定式","fr":"choisir de faire quelque chose","zh":"选择做某事","example":"Certaines personnes choisissent de ne pas avoir d’enfant.","source":1283,"row":33},{"id":"2-34","module":2,"category":"动词＋不定式","fr":"décider de faire quelque chose","zh":"决定做某事","example":"Prenons mon propre exemple : lorsque j’ai décidé de poursuivre mes études à New York, j’ai dû demander un visa étudiant avant de pouvoir partir aux États-Unis.","source":157,"row":34},{"id":"2-35","module":2,"category":"动词＋不定式","fr":"essayer de faire quelque chose","zh":"试着做某事","example":"Certaines ont même recours à la médecine esthétique, par exemple à des injections ou à la chirurgie esthétique, pour essayer de préserver une apparence plus jeune.","source":1055,"row":35},{"id":"2-36","module":2,"category":"动词＋不定式","fr":"risquer de faire quelque chose","zh":"可能会做某事、有某风险","example":"On peut citer le cas d’une famille qui ne parvient plus à payer son loyer et qui risque de perdre son logement.","source":1151,"row":36},{"id":"2-37","module":2,"category":"动词＋不定式","fr":"éviter de faire quelque chose","zh":"避免做某事","example":"Certaines personnes pensent qu’il faut éviter de travailler avec un membre de sa famille.","source":340,"row":37},{"id":"2-38","module":2,"category":"动词＋不定式","fr":"continuer à faire quelque chose","zh":"继续做某事","example":"Croyez-vous que les personnes continuent à cuisiner régulièrement aujourd’hui ?","source":1038,"row":38},{"id":"2-39","module":2,"category":"动词＋不定式","fr":"commencer à faire quelque chose","zh":"开始做某事","example":"Prenons l’exemple d’une personne âgée qui commence à apprendre une langue étrangère comme le français.","source":394,"row":39},{"id":"2-40","module":2,"category":"动词＋不定式","fr":"apprendre à faire quelque chose","zh":"学习做某事","example":"Il ne s’agit donc pas de renoncer à Internet, mais plutôt d’apprendre à l’utiliser avec discernement.","source":896,"row":40},{"id":"2-41","module":2,"category":"动词＋不定式","fr":"réussir à faire quelque chose","zh":"成功做到某事","example":"Une personne de cinquante ans qui est réellement motivée, qui accepte de se former et qui fournit des efforts réguliers peut parfaitement réussir à changer de métier.","source":410,"row":41},{"id":"2-42","module":2,"category":"动词＋不定式","fr":"chercher à faire quelque chose","zh":"力图做某事","example":"Depuis toujours, l’être humain cherche à savoir ce qui existe au-delà de notre planète.","source":915,"row":42},{"id":"2-43","module":2,"category":"动词＋不定式","fr":"hésiter à faire quelque chose","zh":"犹豫是否做某事","example":"Il risquerait, par exemple, d’être plus indulgent envers lui ou d’hésiter à lui faire des remarques.","source":342,"row":43},{"id":"2-44","module":2,"category":"动词＋不定式","fr":"veiller à faire quelque chose","zh":"注意确保做某事","example":"Il faudrait donc que les parents veillent à choisir des contenus adaptés à l’âge de leurs enfants et à maintenir un équilibre entre les jeux vidéo, les études et les autres activités.","source":963,"row":44},{"id":"2-45","module":2,"category":"动词＋不定式","fr":"renoncer à faire quelque chose","zh":"放弃做某事","example":"Elle peut alors repousser sa consultation, voire renoncer à se soigner.","source":1070,"row":45},{"id":"2-46","module":2,"category":"动词＋不定式","fr":"contribuer à faire quelque chose","zh":"有助于做某事","example":"De plus, l’immigration peut contribuer à répondre à certains besoins sur le marché du travail.","source":73,"row":46},{"id":"2-47","module":2,"category":"动词＋不定式","fr":"servir à faire quelque chose","zh":"用于做某事","example":"De plus, les réseaux sociaux peuvent servir à conserver des souvenirs personnels.","source":953,"row":47},{"id":"2-48","module":2,"category":"动词＋不定式","fr":"arrêter de faire quelque chose","zh":"停止做某事","example":"Pour être en bonne santé, doit-on arrêter de consommer de la viande ?","source":1010,"row":48},{"id":"2-49","module":2,"category":"动词＋不定式","fr":"refuser de faire quelque chose","zh":"拒绝做某事","example":"Certaines personnes refusent de regarder les actualités diffusées à la télévision.","source":724,"row":49},{"id":"2-50","module":2,"category":"动词＋不定式","fr":"accepter de faire quelque chose","zh":"同意做某事","example":"Pour progresser, il faut pratiquer régulièrement, accepter de faire des erreurs et surtout faire preuve de persévérance.","source":633,"row":50},{"id":"2-51","module":2,"category":"动词＋不定式","fr":"oublier de faire quelque chose","zh":"忘记做某事","example":"Cependant, il ne faut pas passer tout son temps à prendre des photos au point d’oublier de profiter du moment présent.","source":701,"row":51},{"id":"2-52","module":2,"category":"动词＋不定式","fr":"envisager de faire quelque chose","zh":"考虑做某事","example":"On peut citer le cas d’une municipalité qui envisage de démolir un ancien bâtiment afin de construire un nouveau centre public.","source":1198,"row":52},{"id":"2-53","module":2,"category":"动词＋不定式","fr":"avoir tendance à faire quelque chose","zh":"倾向于做某事","example":"Il aura tendance à ralentir et à conduire plus prudemment afin d’éviter une amende.","source":1190,"row":53},{"id":"2-54","module":2,"category":"动词＋不定式","fr":"avoir du mal à faire quelque chose","zh":"做某事有困难","example":"Au début, il peut avoir du mal à coordonner ses mouvements ou à parcourir une certaine distance.","source":1100,"row":54},{"id":"2-55","module":2,"category":"动词＋不定式","fr":"avoir besoin de faire quelque chose","zh":"需要做某事","example":"Elles peuvent donc avoir besoin de continuer à travailler afin de gagner leur vie et de bénéficier d’une certaine sécurité financière.","source":309,"row":55},{"id":"2-56","module":2,"category":"动词＋不定式","fr":"avoir envie de faire quelque chose","zh":"想要做某事","example":"D’autres peuvent avoir envie de visiter Séoul afin de découvrir directement le pays et son mode de vie.","source":248,"row":56},{"id":"2-57","module":2,"category":"动词＋不定式","fr":"être capable de faire quelque chose","zh":"有能力做某事","example":"Le sexe ne devrait pas function norm(s){return s.normalize('NFC').toLowerCase().replace(/[’‘`]/g,"'").replace(/œ/g,'oe').replace(/[.,!?;:…()]/g,' ').replace(/\s+/g,' ').trim()}
// Normalize only placeholder alternatives; grammatical "ou" remains significant.
function normalizeSlots(s){
 const slot=String.raw`(?:\bquelque\s+chose\b|\bquelqu['’]un\b|\b(?:qqch|qch|qqn|qn|qcn)\b)`;
 return s.replace(new RegExp(slot+String.raw`(?:\s*(?:ou|\/)\s*`+slot+')*','gi'),'__slot__');
}
function stripSlots(s){return normalizeSlots(s).replace(/__slot__/g,' ').replace(/\b(?:infinitif|subjonctif|indicatif|nom|prénom|activité|verbe|adjectif|proposition|lieu)\b/gi,' ').replace(/\+/g,' ').replace(/\s+/g,' ').trim()}
function variants(item){
 if(item.cores)return item.cores.map(norm);
 if(item.module===0)return [norm(item.fr)];
 let s=item.fr;
 const overrides={
  '… tout en + participe présent':['tout en','tout en participe présent'],
  'Après avoir + participe passé, …':['après avoir','après avoir participe passé'],
  'quel que soit / quelle que soit + nom':['quel que soit','quelle que soit'],
  'après avoir + participe passé':['après avoir','après avoir participe passé'],
  'Ayant + participe passé, ...':['ayant','ayant participe passé'],
  'Récemment, j’ai + participe passé ...':['récemment j’ai','récemment j’ai participe passé'],
  'Dès + jour / moment, ...':['dès'],
  'Après avoir + participe passé, ...':['après avoir','après avoir participe passé'],
  'À votre place, je + conditionnel.':['à votre place je','à votre place je conditionnel'],
  'Si + présent, conditionnel de politesse.':['si','si présent conditionnel de politesse'],
  'plutôt que de / à + infinitif, selon le verbe':['plutôt que de','plutôt que à'],
  'Je voudrais aussi savoir comment / si ...':['je voudrais aussi savoir comment','je voudrais aussi savoir si'],
  'prendre soin de quelqu’un / quelque chose':['prendre soin de'],
  'constater que / combien + indicatif':['constater que','constater combien'],
  'Dans le cadre de + nom, je recherche ...':['dans le cadre de je recherche'],
  'En tant que + nom, je souhaite ...':['en tant que je souhaite'],
  'Si + imparfait, conditionnel.':['si','si imparfait conditionnel'],
  'Si + présent, présent / futur / conditionnel de politesse.':['si','si présent présent','si présent futur','si présent conditionnel de politesse'],
  'En + participe présent, ...':['en','en participe présent'],
  'tout en + participe présent':['tout en','tout en participe présent'],
  'avant que + subjonctif (ne explétif possible)':['avant que'],
  'Le loyer ... est de ... par mois, charges comprises.':['le loyer est de par mois charges comprises'],
  'Situé(e) ... et bien desservi(e) par ..., ...':['situé et bien desservi par','située et bien desservie par'],
  'Situé(e) en plein centre-ville, ...':['situé en plein centre-ville','située en plein centre-ville'],
  'plutôt que de / à + infinitif (selon le verbe)':['plutôt que de','plutôt que à'],
  's’installer à / dans un lieu':['s’installer à','s’installer dans'],
  'se retrouver à un lieu / à une heure':['se retrouver à'],
  'être ravi de faire / d’avoir fait quelque chose':['être ravi de','être ravi d’avoir fait'],
  'remercier quelqu’un de faire / d’avoir fait quelque chose':['remercier de','remercier d’avoir fait'],
  's’inscrire sur un site':['s’inscrire sur'],
  's’inscrire dans une salle de sport':['s’inscrire dans'],
  's’intégrer à un milieu':['s’intégrer à'],
  'se détendre dans un lieu':['se détendre dans'],
  'être disponible dès que + futur simple':['être disponible dès que'],
  'Je t’invite à / au + activité.':['je t’invite à','je t’invite au'],
 };
 if(overrides[s])return overrides[s].map(norm);
 s=s.replace(/\([^)]*\)/g,'').replace(/de faire quelque chose/g,'de').replace(/à faire quelque chose/g,'à').replace(/pour faire quelque chose/g,'pour').replace(/faire quelque chose/g,'').replace(/un lieu|une heure/g,'');
 return [norm(stripSlots(s).replace(/\s*\/\s*/g,' ').replace(/\.{2,}/g,' '))];
}
function grade(input,item){
 const raw=norm(input);let cores=variants(item);
 if(item.module===0)return {ok:[item.fr,...(item.acceptedFr||[])].some(s=>norm(normalizeSlots(input))===norm(normalizeSlots(s))),cores};
 // Slot words may be omitted or abbreviated. Concrete content words are not guessed.
 let answer=norm(stripSlots(input.replace(/\([^)]*\)/g,'')));
 answer=answer.replace(/\b(?:de|à|pour) faire(?= |$)/g,m=>m.replace(/ faire$/,''));
 const exact=norm(item.fr);
 // Full source notation is valid, including tense labels and all placeholders.
 let ok=norm(normalizeSlots(input))===norm(normalizeSlots(item.fr))||raw===exact||cores.includes(answer)||cores.includes(raw);
 return {ok,cores};
}
if(typeof module!=='undefined')module.exports={norm,variants,grade};

function differenceAlignment(input,target){
 const a=Array.from(input),b=Array.from(target);
 const dp=Array.from({length:a.length+1},()=>new Uint16Array(b.length+1));
 for(let i=0;i<=a.length;i++)dp[i][0]=i;
 for(let j=0;j<=b.length;j++)dp[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
 const wrong=new Set(),missing=new Set();let i=a.length,j=b.length;
 while(i||j){
  if(i&&j&&a[i-1]===b[j-1]&&dp[i][j]===dp[i-1][j-1]){i--;j--;}
  else if(i&&j&&dp[i][j]===dp[i-1][j-1]+1){wrong.add(--i);missing.add(--j);}
  else if(j&&dp[i][j]===dp[i][j-1]+1){missing.add(--j);}
  else{wrong.add(--i);}
 }
 function runs(chars,set){const out=[];for(let k=0;k<chars.length;k++){const marked=set.has(k);if(out.length&&out[out.length-1].marked===marked)out[out.length-1].text+=chars[k];else out.push({text:chars[k],marked});}return out;}
 return {distance:dp[a.length][b.length],input:input,target:target,inputRuns:runs(a,wrong),targetRuns:runs(b,missing)};
}
function answerDifference(input,item){
 if(grade(input,item).ok)return null;
 const candidates=[];
 for(const member of [item]){
  const matcher={norm,stripSlots,normalizeSlots,variants};
  const normalized=matcher.norm(input);
  if(item.module!==0){
   let core=matcher.norm(matcher.stripSlots(input.replace(/\([^)]*\)/g,'')));
   core=core.replace(/\b(?:de|à|pour) faire(?= |$)/g,m=>m.replace(/ faire$/,''));
   for(const target of matcher.variants(member))candidates.push({input:core,target,core:true});
  }
  const slotForm=s=>matcher.norm(matcher.normalizeSlots(s)).replace(/__slot__/g,'[占位词]');
  for(const target of [member.fr,...(member.acceptedFr||[])])candidates.push({input:slotForm(input),target:slotForm(target),core:false});
 }
 let best=null;
 for(const candidate of candidates){
  // Keep visual comparison bounded for accidentally pasted paragraphs.
  const bounded=candidate.input.slice(0,500);
  const diff=differenceAlignment(bounded,candidate.target);
  if(!best||diff.distance<best.distance)best={...diff,core:candidate.core,truncated:candidate.input.length>500};
 }
 return best;
}

function appendDifferenceRuns(node,runs,className){
 for(const run of runs){if(run.marked){const mark=document.createElement('mark');mark.className=className;mark.textContent=run.text;node.append(mark);}else node.append(document.createTextNode(run.text));}
}
function renderAnswerDifference(container,input,item){
 const diff=answerDifference(input,item);if(!diff)return;
 const view=document.createElement('div');view.className='answer-difference';
 const legend=document.createElement('p');legend.className='diff-legend';legend.textContent='红色：写错或多写　绿色：正确写法／需要补上的部分';
 const grid=document.createElement('div');grid.className='diff-grid';
 for(const [label,runs,cls] of [[diff.core?'你的答案（核心部分）':'你的答案',diff.inputRuns,'diff-wrong'],[diff.core?'正确核心表达':'正确表达',diff.targetRuns,'diff-required']]){
  const section=document.createElement('div'),head=document.createElement('strong'),line=document.createElement('div');head.textContent=label;line.className='diff-line';appendDifferenceRuns(line,runs,cls);if(!runs.length){const empty=document.createElement('span');empty.className='note';empty.textContent='（未写出核心表达）';line.append(empty);}section.append(head,line);grid.append(section);
 }
 const note=document.createElement('p');note.className='note';note.textContent='按原审核规则忽略大小写、标点和允许的占位词写法，保留重音。'+(diff.truncated?'此处显示前 500 个字符。':'');
 view.append(legend,grid,note);container.append(view);
}


const KEY='TCF-EO-T3-EXPRESSIONS-v1',names=['动词搭配','固定句型','动词固定用法'];const $=id=>document.getElementById(id);let state={version:1,records:{},module:0,current:null},mode=0,current=null,order=null;
try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.version===1&&x.records)state=x}catch(e){}
function persist(){state.module=mode;state.current=current?.id;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){$('toast').textContent='浏览器未能保存进度，请用导出进度备份。'}}
function rec(id=current?.id){return state.records[id]||(state.records[id]={draft:'',attempts:0,correct:0,wrong:0,last:null,error:null})}

function filtered(){let rs=DATA.filter(x=>x.module===mode&&(!$('category').value||x.category===$('category').value)&&x.zh.includes($('search').value.trim()));const f=$('status').value;if(f)rs=rs.filter(x=>{const r=state.records[x.id];return f==='new'?!r?.attempts:f==='wrong'?r?.error&&!r.error.resolved:r?.last===true});if(order)rs.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));return rs}
function stats(){const rs=mode==='errors'?DATA.filter(x=>state.records[x.id]?.error):filtered();$('total').textContent=rs.length;$('done').textContent=rs.filter(x=>state.records[x.id]?.attempts).length;$('pending').textContent=rs.filter(x=>state.records[x.id]?.error&&!state.records[x.id].error.resolved).length;$('errCount').textContent=Object.values(state.records).filter(r=>r.error&&!r.error.resolved).length}
function list(){const rs=filtered();$('list').replaceChildren();$('listCount').textContent=`${rs.length} 条表达`;for(const x of rs){const b=document.createElement('button');b.className='item'+(current?.id===x.id?' active':'');b.textContent=x.zh;const s=document.createElement('small');const r=state.records[x.id];s.textContent=x.category+(r?.error&&!r.error.resolved?' · 待复习':r?.last?' · 已答对':'');b.append(s);b.onclick=()=>show(x);$('list').append(b)}stats()}
function show(x){saveDraft();current=x;$('practice').classList.toggle('hidden',!x);if(!x){$('toast').textContent='这个筛选下暂无表达。';list();return}$('toast').textContent='';$('prompt').textContent=x.zh;$('position').textContent=`${x.category} · Excel 第 ${x.row} 行 · ${filtered().findIndex(t=>t.id===x.id)+1} / ${filtered().length}`;$('answer').value=rec().draft;$('feedback').classList.add('hidden');$('reference').classList.add('hidden');$('reveal').textContent='显示答案';$('moduleTitle').textContent=names[x.module];$('rule').textContent=x.module===0?'核对完整搭配；忽略大小写、末尾标点和多余空格，保留重音。':'只核对核心表达。占位词可省略，quelque chose / qqch / qch、quelqu’un / qqn / qn 均可；qqch ou qqn、qch ou qn 也可。核心词、时态、介词和重音须正确。';list();persist()}
function setModule(m){saveDraft();mode=m;order=null;document.querySelectorAll('[data-module]').forEach(b=>{const active=b.dataset.module===String(m);b.classList.toggle('active',active);b.setAttribute('aria-pressed',active)});$('category').replaceChildren(new Option('全部分类',''));$('category').disabled=m==='errors';$('status').disabled=m==='errors';$('search').disabled=m==='errors';$('random').disabled=m==='errors';$('shuffle').disabled=m==='errors';$('errorsView').classList.toggle('hidden',m!=='errors');$('practice').classList.toggle('hidden',m==='errors');if(m==='errors'){current=null;$('list').replaceChildren();$('listCount').textContent='错题按来源模块筛选';errors();stats();persist();return}for(const c of [...new Set(DATA.filter(x=>x.module===m).map(x=>x.category))])$('category').add(new Option(c,c));show(DATA.find(x=>x.id===state.current&&x.module===m)||filtered()[0]||null)}
function check(){if(!current)return;const input=$('answer').value.trim();if(!input){$('toast').textContent='请先写出法语再检查。';return}saveDraft();const result=grade(input,current),r=rec();r.attempts++;r.last=result.ok;r[result.ok?'correct':'wrong']++;if(!result.ok){r.error={...(r.error||{}),answer:input,count:(r.error?.count||0)+1,resolved:false,date:new Date().toISOString()}}else if(r.error)r.error.resolved=true;$('feedback').className='feedback '+(result.ok?'ok':'bad');$('feedback').textContent=result.ok?'✓ 正确'+(current.module===0?'，完整搭配已核对。':'，核心表达已核对。'):'还差一点。\n你的答案：'+input+'\n正确表达：'+current.fr+'\n需要保留的核心：'+result.cores.join(' 或 ')+'\n已加入错题本。';if(!result.ok)renderAnswerDifference($('feedback'),input,current);window.TCF_CONJUGATIONS?.render($('feedback'),current.fr);window.TCF_NOUNS?.render($('feedback'),current.fr);persist();list()}
function errors(){const items=DATA.filter(x=>state.records[x.id]?.error&&($('showResolved').checked||!state.records[x.id].error.resolved)&&(!$('errModule').value||x.module===Number($('errModule').value)));$('errorList').replaceChildren();if(!items.length){const p=document.createElement('p');p.className='muted';p.textContent='当前没有符合条件的错题。';$('errorList').append(p)}for(const x of items){const e=state.records[x.id].error,b=document.createElement('div');b.className='errorItem';const head=document.createElement('small');head.textContent=names[x.module]+' · '+x.category+' · 错 '+e.count+' 次'+(e.resolved?' · 已订正':' · 待复习');const title=document.createElement('p');title.textContent=x.zh;const detail=document.createElement('details'),summary=document.createElement('summary');summary.textContent='查看错误与正确表达';const text=document.createElement('p');text.textContent='错误：'+e.answer+'；正确：'+x.fr;detail.append(summary,text);window.TCF_NOUNS?.render(detail,x.fr);renderAnswerDifference(detail,e.answer,x);const btn=document.createElement('button');btn.textContent='重新练习';btn.onclick=()=>{setModule(x.module);$('status').value='';$('search').value='';$('category').value=x.category;show(x);$('answer').value='';rec().draft='';persist();$('answer').focus()};b.append(head,title,detail,btn);$('errorList').append(b)}}
document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>setModule(b.dataset.module==='errors'?'errors':Number(b.dataset.module)));for(const id of ['category','status','search'])$(id).addEventListener(id==='search'?'input':'change',()=>show(filtered()[0]||null));$('answer').oninput=saveDraft;$('answer').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();check()}};$('check').onclick=check;window.TCF_GRAMMAR_TARGET=()=>current?({fr:current.fr,zh:current.zh,usage:current.usage||''}):null;$('reveal').onclick=()=>{if(!current)return;const hidden=$('reference').classList.contains('hidden');$('reference').textContent='法语表达：'+current.fr+'\n核心核对：'+variants(current).join(' 或 ')+(current.usage?'\n用法提示：'+current.usage:'')+'\n\n原文例句：'+current.example+'\n出处：'+current.source;window.TCF_NOUNS?.render($('reference'),[current.fr,current.example].filter(Boolean).join('\n\n'));$('reference').classList.toggle('hidden',!hidden);$('reveal').textContent=hidden?'隐藏答案':'显示答案'};$('clear').onclick=()=>{$('answer').value='';saveDraft();$('feedback').classList.add('hidden')};function move(d){const rs=filtered(),n=rs.findIndex(x=>x.id===current?.id)+d;if(n>=0&&n<rs.length)show(rs[n]);else $('toast').textContent='已到当前列表边界。'}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('random').onclick=()=>{const rs=filtered();if(rs.length)show(rs[Math.floor(Math.random()*rs.length)])};$('shuffle').onclick=()=>{order=filtered().map(x=>x.id);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}show(filtered()[0]||null)};$('errModule').onchange=errors;$('showResolved').onchange=errors;
$('export').onclick=()=>{saveDraft();const u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='EO-Tache3-表达默写进度.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const x=JSON.parse(await f.text());if(x.version!==1||!x.records||typeof x.records!=='object'||Array.isArray(x.records))throw Error('请选择本网页导出的进度文件。');for(const [id,r] of Object.entries(x.records)){if(!DATA.some(t=>t.id===id)||!r||typeof r.draft!=='string'||!['attempts','correct','wrong'].every(k=>Number.isInteger(r[k])&&r[k]>=0)||(r.error&&(typeof r.error.answer!=='string'||typeof r.error.resolved!=='boolean'||!Number.isInteger(r.error.count))))throw Error('进度文件内容不正确。')}state.records={...state.records,...x.records};persist();mode==='errors'?errors():show(current);$('toast').textContent='进度已导入。'}catch(err){$('toast').textContent=err.message}e.target.value=''};
window.TRAINER_TEST={DATA,grade,variants,answerDifference,state};setModule([0,1,2,'errors'].includes(state.module)?state.module:0);
