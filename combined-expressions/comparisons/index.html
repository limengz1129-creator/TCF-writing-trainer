<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T3 C1 比较句型｜12 句极简复习</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1f2937;background:#f6f8fd}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:22px 16px 60px}a{color:#3949ab}h1{font-size:1.65rem;margin:12px 0}p{line-height:1.7}.muted{color:#64748b}.card{border:1px solid #e0e6f0;border-radius:15px;background:#fff;padding:20px;margin:16px 0;box-shadow:0 2px 9px #1a24400a}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.num{color:#4c5dd0;font-weight:bold}.pattern{font-size:1.1rem;font-weight:700}.fr{font-size:1.17rem;line-height:1.95;white-space:pre-wrap}.fr mark{background:#fff0b4;padding:2px 1px;border-radius:3px}.zh{font-size:1rem;line-height:1.8}.tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:12px 0}button{border:1px solid #cbd5e1;border-radius:9px;padding:9px 12px;cursor:pointer;background:#f8fafc;font:inherit}button:hover{background:#eaf0ff}.status{font-size:.87rem;color:#64748b}audio{width:100%;margin-top:6px}footer{color:#64748b;font-size:.9rem}.summary{background:#eef2ff;border-radius:12px;padding:12px 16px}.tag{font-size:.85rem;color:#475569}@media(max-width:500px){.card{padding:15px}.fr{font-size:1.06rem}}
</style></head><body><div class="wrap"><a href="../">← 返回综合练习首页</a><h1>T3 C1 比较句型 · 极简复习</h1><p class="muted">12 类结构 · 每类 1 条九大主题 C1 原句 · 法中对照 · Piper siwis 静态音频。只练结构，不额外增加背诵量。</p><div class="summary">重点：<b>compter autant que</b> 可以对比训练 <b>compter plus que / moins que</b>；替换练习属于语法变化，不是原论段。</div><main id="cards"></main><footer>原句以 GitHub C1 数据为准；仅匹配到原句的预生成 Piper 音频才播放，不使用浏览器合成语音。</footer></div>
<script>
const DATA=[{"num":1,"pattern":"plus + adjectif + que","fr":"Un artiste peut posséder de réelles compétences tout en ayant du mal à trouver régulièrement des contrats, ce qui rend sa situation plus précaire que celle d’un salarié au revenu fixe.","zh":"艺术家即使具备真正的专业能力，也可能难以持续获得合同，使其处境比收入固定的雇员更不稳定。","focus":"plus précaire que","theme":"career","id":"03-1","source":"职业与职场 · #03 · 艺术职业版"},{"num":2,"pattern":"moins + adverbe + que","fr":"Par exemple, pour se rendre dans une ville relativement proche, prendre le bus peut coûter beaucoup moins cher que prendre l’avion.","zh":"例如，去相对较近的城市，坐大巴可能比乘飞机便宜得多。","focus":"beaucoup moins cher que","theme":"travel","id":"24-2","source":"旅行与移民 · #24 · 大巴"},{"num":3,"pattern":"aussi + adjectif + que","fr":"De plus, la vie personnelle joue un rôle tout aussi important que la vie professionnelle.","zh":"此外，个人生活和职业生活同样重要。","focus":"tout aussi important que","theme":"career","id":"11-4a","source":"职业与职场 · #11 · 私人生活版"},{"num":4,"pattern":"verbe + autant que","fr":"L’épanouissement professionnel peut compter autant que le salaire dans le choix d’un emploi.","zh":"选择工作时，职业成就感可能与薪资同样重要。","focus":"compter autant que","theme":"career","id":"04-1","source":"职业与职场 · #04 · 工作意义版"},{"num":5,"pattern":"mieux + infinitif","fr":"En effet, elle leur permet d’accomplir plus facilement des démarches administratives et de mieux exprimer leurs besoins.","zh":"事实上，语言能力使他们能够更容易办理行政手续，并更好地表达自己的需求。","focus":"mieux exprimer","theme":"travel","id":"01-1","source":"旅行与移民 · #01 · 日常生活版"},{"num":6,"pattern":"meilleur(e) + nom","fr":"Ainsi, une meilleure maîtrise de la langue locale lui permet de comprendre les démarches courantes, de dissiper les malentendus et de gagner progressivement en autonomie.","zh":"因此，更好地掌握当地语言能够帮助他理解日常手续、消除误解，并逐渐提高自主生活能力。","focus":"une meilleure maîtrise","theme":"travel","id":"01-1","source":"旅行与移民 · #01 · 日常生活版"},{"num":7,"pattern":"le/la mieux + participe passé","fr":"Je préférerais donc choisir la personne la mieux préparée à exercer cette fonction, sans présumer de ses qualités en fonction de son sexe.","zh":"因此，我会选择最有准备履行这一职务的人，不依据性别预设其品质。","focus":"la mieux préparée","theme":"career","id":"07-3","source":"职业与职场 · #07 · 公平评价领导力"},{"num":8,"pattern":"plutôt que + infinitif","fr":"Les sorties pédagogiques devraient compléter les cours plutôt que les remplacer.","zh":"教学参观应补充课堂，而非取代课堂。","focus":"plutôt que les remplacer","theme":"education","id":"05-3","source":"教育与儿童 · #05 · 边界版"},{"num":9,"pattern":"au lieu de + infinitif","fr":"Il doit alors poursuivre son propre apprentissage de la langue et créer des contacts, au lieu de compter uniquement sur son enfant.","zh":"因此，他需要继续亲自学习语言、建立联系，而不能完全依赖孩子。","focus":"au lieu de compter","theme":"travel","id":"17-1b","source":"旅行与移民 · #17 · 个人责任版"},{"num":10,"pattern":"de plus en plus + adjectif","fr":"Faute de soutien et d’échanges réguliers, il peut se sentir de plus en plus seul et avoir davantage de mal à trouver ses repères.","zh":"缺乏支持和经常性的交流，可能使他越来越孤独，更难适应环境。","focus":"de plus en plus seul","theme":"travel","id":"11-1","source":"旅行与移民 · #11 · 孤独链"},{"num":11,"pattern":"davantage de + nom","fr":"Il pourrait accéder directement au passage utile et consacrer davantage de temps à comprendre puis à rédiger sa réponse.","zh":"他可以直接找到有用段落，将更多时间用于理解和撰写回答。","focus":"davantage de temps","theme":"tech","id":"B1-01-2","source":"科技与网络 · #01 · 效率版"},{"num":12,"pattern":"aussi + adjectif + que possible","fr":"Sa mission ne consiste pas seulement à transmettre des connaissances, mais aussi à rendre l’accès à une éducation de qualité aussi équitable que possible.","zh":"学校不仅要传授知识，还要尽可能公平地提供优质教育机会。","focus":"aussi équitable que possible","theme":"education","id":"28-3","source":"教育与儿童 · #28 · 社会背景版"}];const audioCache={};const blobUrls=new Set();
const names={travel:'c1-travel-audio',career:'c1-career-audio',education:'c1-education-audio',tech:'tech-audio'};
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function highlight(s,focus){const i=s.indexOf(focus);return i<0?escapeHtml(s):escapeHtml(s.slice(0,i))+'<mark>'+escapeHtml(focus)+'</mark>'+escapeHtml(s.slice(i+focus.length))}
const cards=document.getElementById('cards');cards.innerHTML=DATA.map(x=>'<article class="card" id="item-'+x.num+'"><div class="head"><span class="num">'+String(x.num).padStart(2,'0')+' / 12</span><span class="tag">'+escapeHtml(x.source)+'</span></div><h2 class="pattern">'+escapeHtml(x.pattern)+'</h2><div lang="fr" class="fr">'+highlight(x.fr,x.focus)+'</div><p class="zh">'+escapeHtml(x.zh)+'</p><div class="tools"><button type="button" data-play="'+x.num+'">🔊 Piper 朗读</button><button type="button" data-stop="'+x.num+'">停止</button><button type="button" data-copy="'+x.num+'">复制法语</button><span class="status" id="status-'+x.num+'"></span></div><audio id="audio-'+x.num+'" preload="none" controls hidden></audio></article>').join('');
async function play(x){const status=document.getElementById('status-'+x.num),el=document.getElementById('audio-'+x.num);status.textContent='读取现有 Piper 音频…';try{let root='../eo-tache3-corpus/'+names[x.theme]+'/';if(!audioCache[x.theme])audioCache[x.theme]=fetch(root+'manifest.json').then(r=>{if(!r.ok)throw Error('缺少音频清单');return r.json()});const manifest=await audioCache[x.theme];const entry=manifest.entries?.[x.fr];if(!entry)throw Error('此原句尚无匹配的预生成音频');const response=await fetch(root+entry.pack);if(!response.ok)throw Error('音频文件不可用');const pack=await response.json(),p=pack[entry.id];if(!p||p.text!==x.fr||!p.audio)throw Error('音频文字不匹配');const bytes=Uint8Array.from(atob(p.audio),c=>c.charCodeAt(0));if(el.dataset.url){URL.revokeObjectURL(el.dataset.url);blobUrls.delete(el.dataset.url)}const url=URL.createObjectURL(new Blob([bytes],{type:'audio/mpeg'}));blobUrls.add(url);el.dataset.url=url;el.src=url;el.hidden=false;status.textContent='Piper fr_FR-siwis-medium';await el.play()}catch(e){status.textContent=e.message||'无法播放';}}
cards.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;for(const action of ['play','stop','copy']){if(!b.dataset[action])continue;const x=DATA.find(v=>v.num===Number(b.dataset[action]));if(action==='play')play(x);if(action==='stop'){let a=document.getElementById('audio-'+x.num);a.pause();a.currentTime=0}if(action==='copy')navigator.clipboard?.writeText(x.fr);break}});
addEventListener('pagehide',()=>{for(const u of blobUrls)URL.revokeObjectURL(u)});
</script></body></html>
