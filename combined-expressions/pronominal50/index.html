<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCF Canada · 口语代词式动词 Top 50</title>
<style>body{margin:0;background:#f5f7fb;color:#243047;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}header,main{max-width:1130px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:15px;align-items:center}h1{font-size:1.8rem;margin:5px 0}a{color:#3548ae}main{padding-top:0}.panel,.card{background:white;border:1px solid #dfe4ef;border-radius:14px;padding:18px;margin:14px 0}.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end}label{display:grid;gap:4px}select,input,textarea,button{font:inherit;padding:9px;border:1px solid #cbd3e2;border-radius:8px}button{cursor:pointer;background:#eef1ff;color:#283c95}button:hover{background:#dee5ff}.primary{background:#4056c4;color:white}.grid{display:grid;grid-template-columns:minmax(180px,275px) 1fr;gap:16px}#items{max-height:570px;overflow:auto}#items button{display:block;width:100%;margin:4px 0;text-align:left}.active{background:#d9e2ff}textarea{width:100%;box-sizing:border-box;min-height:110px} .row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.muted{color:#657188}#batchView{overflow:auto}table{border-collapse:collapse;width:100%;min-width:680px}th,td{padding:10px;border-bottom:1px solid #e5e8f0;text-align:left;vertical-align:top}td:nth-child(2){font-weight:600;color:#283c95}details{margin-top:8px}.pill{display:inline-block;border-radius:100px;background:#e8ecff;padding:3px 12px;font-size:.85rem}@media(max-width:750px){.grid{display:block}#items{max-height:180px}header{display:block}}</style></head><body>
<header><div><small>TCF Canada · 口语 Tâche 2 / Tâche 3</small><h1>代词式动词 · Top 50</h1><div class="muted">P1 核心20 · P2 实用20 · P3 补充10｜应试优先级，非官方频率排名</div></div><a href="../">← 返回五任务</a></header>
<main><section class="panel filters"><label>分级<select id="tier"><option value="">全部50</option><option>P1</option><option>P2</option><option>P3</option></select></label><label>任务<select id="task"><option value="">口语T2 + T3</option><option value="T2">T2</option><option value="T3">T3</option></select></label><label>状态<select id="state"><option value="">全部</option><option value="new">未练习</option><option value="wrong">待复习</option></select></label><label>每批<select id="size"><option>20</option><option>40</option><option>50</option></select></label><label>搜索<input id="q" placeholder="中文或法语"></label><button id="shuffle">随机顺序</button><button id="export">导出进度</button><label>导入进度<input id="import" type="file" accept=".json,application/json"></label></section>
<div class="row"><button id="singleBtn" class="primary">逐题默写</button><button id="batchBtn">批量表格</button></div><p id="stats" class="muted"></p>
<div id="single" class="grid"><aside class="panel"><div id="items"></div><div class="row"><button id="prevPage">上一批</button><span id="page"></span><button id="nextPage">下一批</button></div></aside><section class="card"><div id="position" class="pill"></div><h2 id="zh"></h2><p class="muted">根据中文默写代词式动词或固定搭配。</p><textarea id="answer" lang="fr"></textarea><div class="row"><button id="check" class="primary">检查答案</button><button id="reveal">显示答案</button><button id="next">下一条 →</button></div><div id="result" aria-live="polite"></div><div id="details" hidden><h3 id="fr"></h3><p id="example"></p><button id="speak">🔊 朗读法语例句</button></div></section></div>
<section id="batchView" class="panel" hidden><h2>批量学习</h2><p class="muted">中文 → 法语搭配 → TCF口语例句。可使用浏览器法语语音朗读；效果取决于设备支持。</p><table><thead><tr><th>序号／中文</th><th>法语</th><th>口语例句</th></tr></thead><tbody id="rows"></tbody></table><div class="row"><button id="bprev">上一批</button><span id="bpage"></span><button id="bnext">下一批</button></div></section><p class="muted">进度独立保存于本浏览器，不会修改五任务其他模块。参考答案是标准表达，口语中合理变体不一定被自动判为正确。</p></main>
<script>const DATA=[{"id":1,"fr":"s'adapter à","zh":"适应","task":"T3","example":"Il faut s'adapter à un nouvel environnement.","tier":"P1"},{"id":2,"fr":"s'intéresser à","zh":"对……感兴趣","task":"T2/T3","example":"Je m'intéresse aux activités culturelles.","tier":"P1"},{"id":3,"fr":"se renseigner sur","zh":"咨询了解","task":"T2","example":"Je voudrais me renseigner sur les tarifs.","tier":"P1"},{"id":4,"fr":"s'inscrire à","zh":"报名参加","task":"T2","example":"Comment peut-on s'inscrire à ce cours ?","tier":"P1"},{"id":5,"fr":"se rendre compte de","zh":"意识到","task":"T3","example":"On se rend compte de l'importance de l'éducation.","tier":"P1"},{"id":6,"fr":"se sentir","zh":"感到","task":"T3","example":"Les nouveaux arrivants peuvent se sentir isolés.","tier":"P1"},{"id":7,"fr":"se préparer à","zh":"为……做准备","task":"T2/T3","example":"Je me prépare à passer un examen.","tier":"P1"},{"id":8,"fr":"s'occuper de","zh":"照顾、负责","task":"T2/T3","example":"Les parents s'occupent de leurs enfants.","tier":"P1"},{"id":9,"fr":"se concentrer sur","zh":"专注于","task":"T3","example":"Il faut se concentrer sur les priorités.","tier":"P1"},{"id":10,"fr":"se développer","zh":"发展","task":"T3","example":"Les compétences se développent avec la pratique.","tier":"P1"},{"id":11,"fr":"s'améliorer","zh":"改善、提高","task":"T3","example":"La qualité de vie peut s'améliorer.","tier":"P1"},{"id":12,"fr":"se rencontrer","zh":"见面、相遇","task":"T2/T3","example":"Nous nous sommes rencontrés pendant un cours.","tier":"P1"},{"id":13,"fr":"s'entraider","zh":"互相帮助","task":"T3","example":"Les voisins peuvent s'entraider.","tier":"P1"},{"id":14,"fr":"se connaître","zh":"互相认识","task":"T3","example":"Les participants apprennent à se connaître.","tier":"P1"},{"id":15,"fr":"se passer","zh":"发生、进行","task":"T2","example":"Comment se passe l'inscription ?","tier":"P1"},{"id":16,"fr":"se dérouler","zh":"举行、进行","task":"T2","example":"Où se déroule cette activité ?","tier":"P1"},{"id":17,"fr":"se trouver","zh":"位于","task":"T2","example":"Où se trouve votre établissement ?","tier":"P1"},{"id":18,"fr":"se déplacer","zh":"出行、移动","task":"T2/T3","example":"On peut se déplacer en transports en commun.","tier":"P1"},{"id":19,"fr":"se souvenir de","zh":"记得","task":"T3","example":"Je me souviens de ma première expérience.","tier":"P1"},{"id":20,"fr":"se demander si","zh":"想知道是否","task":"T3","example":"On peut se demander si cette mesure est efficace.","tier":"P1"},{"id":21,"fr":"s'intégrer dans","zh":"融入","task":"T3","example":"Il est important de s'intégrer dans la société.","tier":"P2"},{"id":22,"fr":"s'habituer à","zh":"习惯于","task":"T3","example":"Il faut du temps pour s'habituer au climat.","tier":"P2"},{"id":23,"fr":"s'engager dans","zh":"参与、投身","task":"T3","example":"Les jeunes peuvent s'engager dans des associations.","tier":"P2"},{"id":24,"fr":"se familiariser avec","zh":"熟悉","task":"T3","example":"Il faut se familiariser avec les coutumes locales.","tier":"P2"},{"id":25,"fr":"se débrouiller","zh":"自行应付","task":"T2/T3","example":"Je peux me débrouiller en français.","tier":"P2"},{"id":26,"fr":"se fixer un objectif","zh":"设定目标","task":"T3","example":"Il faut se fixer un objectif réaliste.","tier":"P2"},{"id":27,"fr":"se donner les moyens de","zh":"创造条件以实现","task":"T3","example":"On doit se donner les moyens de réussir.","tier":"P2"},{"id":28,"fr":"se poser des questions","zh":"思考、产生疑问","task":"T3","example":"Beaucoup de parents se posent des questions.","tier":"P2"},{"id":29,"fr":"se protéger contre","zh":"防范、保护","task":"T3","example":"Il faut se protéger contre les arnaques.","tier":"P2"},{"id":30,"fr":"se comporter","zh":"表现、举止","task":"T3","example":"Il est important de bien se comporter au travail.","tier":"P2"},{"id":31,"fr":"se respecter","zh":"相互尊重","task":"T3","example":"Les collègues doivent se respecter.","tier":"P2"},{"id":32,"fr":"se comprendre","zh":"相互理解","task":"T3","example":"Le dialogue aide les générations à se comprendre.","tier":"P2"},{"id":33,"fr":"se transmettre","zh":"相互传递、传承","task":"T3","example":"Les traditions se transmettent de génération en génération.","tier":"P2"},{"id":34,"fr":"se réunir","zh":"聚会、开会","task":"T2/T3","example":"Nous pouvons nous réunir le week-end.","tier":"P2"},{"id":35,"fr":"se partager les tâches","zh":"分担任务","task":"T3","example":"Les membres de la famille se partagent les tâches.","tier":"P2"},{"id":36,"fr":"se mettre d'accord","zh":"达成一致","task":"T2/T3","example":"Nous devons nous mettre d'accord sur la date.","tier":"P2"},{"id":37,"fr":"se servir de","zh":"使用、利用","task":"T2/T3","example":"On peut se servir de cette application.","tier":"P2"},{"id":38,"fr":"se procurer","zh":"获取、买到","task":"T2","example":"Où peut-on se procurer un billet ?","tier":"P2"},{"id":39,"fr":"s'organiser","zh":"安排好","task":"T2/T3","example":"Il faut bien s'organiser pour gagner du temps.","tier":"P2"},{"id":40,"fr":"se présenter","zh":"自我介绍、出现","task":"T2","example":"Dois-je me présenter à l'accueil ?","tier":"P2"},{"id":41,"fr":"se méfier de","zh":"提防","task":"T3","example":"Il faut se méfier des fausses informations.","tier":"P3"},{"id":42,"fr":"se plaindre de","zh":"抱怨","task":"T3","example":"Certains habitants se plaignent du bruit.","tier":"P3"},{"id":43,"fr":"se tromper","zh":"弄错、犯错","task":"T3","example":"On peut se tromper, puis apprendre de ses erreurs.","tier":"P3"},{"id":44,"fr":"se détendre","zh":"放松","task":"T2/T3","example":"Je préfère me détendre après le travail.","tier":"P3"},{"id":45,"fr":"se reposer","zh":"休息","task":"T2/T3","example":"Il est important de se reposer suffisamment.","tier":"P3"},{"id":46,"fr":"se promener","zh":"散步","task":"T2","example":"Peut-on se promener dans le parc ?","tier":"P3"},{"id":47,"fr":"se dépêcher","zh":"赶快","task":"T2","example":"Il faut se dépêcher pour arriver à l'heure.","tier":"P3"},{"id":48,"fr":"se réveiller","zh":"醒来","task":"T2","example":"Je me réveille tôt le matin.","tier":"P3"},{"id":49,"fr":"se laver","zh":"洗漱","task":"T2","example":"Les enfants doivent se laver les mains.","tier":"P3"},{"id":50,"fr":"s'habiller","zh":"穿衣","task":"T2","example":"Il faut s'habiller chaudement en hiver.","tier":"P3"}];const $=x=>document.getElementById(x),KEY='TCF-PRONOMINAL50-v1';let progress={};try{progress=JSON.parse(localStorage.getItem(KEY))||{}}catch{}let current=1,page=0,table=false,random=false,order=DATA.map(x=>x.id);
function norm(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z]/g,'')}function save(){localStorage.setItem(KEY,JSON.stringify(progress))}function filtered(){let a=DATA.filter(x=>(!$('tier').value||x.tier===$('tier').value)&&(!$('task').value||x.task.includes($('task').value))&&(!$('q').value||(x.fr+' '+x.zh+' '+x.example).toLowerCase().includes($('q').value.toLowerCase()))&&(!$('state').value||($('state').value==='new'?!progress[x.id]?.attempts:progress[x.id]?.wrong&&!progress[x.id]?.correct)));return random?a.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id)):a}function say(t){if(!window.speechSynthesis){alert('当前浏览器不支持语音朗读');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.85;speechSynthesis.speak(u)}
function draw(){let a=filtered(),n=+$('size').value,pages=Math.max(1,Math.ceil(a.length/n));page=Math.max(0,Math.min(page,pages-1));let chunk=a.slice(page*n,(page+1)*n);$('stats').textContent='筛选 '+a.length+' / 50 · 已练 '+DATA.filter(x=>progress[x.id]?.attempts).length+' · 待复习 '+DATA.filter(x=>progress[x.id]?.wrong&&!progress[x.id]?.correct).length;$('items').replaceChildren();chunk.forEach(x=>{let b=document.createElement('button');b.textContent=x.id+'. '+x.zh+' · '+x.tier;b.className=current===x.id?'active':'';b.onclick=()=>{current=x.id;draw()};$('items').append(b)});if(!chunk.some(x=>x.id===current))current=chunk[0]?.id||0;let x=DATA.find(z=>z.id===current);$('page').textContent=(page+1)+' / '+pages;$('prevPage').disabled=$('bprev').disabled=page===0;$('nextPage').disabled=$('bnext').disabled=page>=pages-1;$('bpage').textContent=$('page').textContent;$('rows').replaceChildren();for(let y of chunk){let tr=document.createElement('tr');for(let t of [y.id+'. '+y.zh,y.fr,y.example]){let td=document.createElement('td');td.textContent=t;tr.append(td)}let td=document.createElement('td'),b=document.createElement('button');b.textContent='🔊';b.title='朗读例句';b.onclick=()=>say(y.example);td.append(b);tr.append(td);$('rows').append(tr)}if(x){$('position').textContent=x.tier+' · '+x.task+' · '+x.id+'/50';$('zh').textContent=x.zh;$('answer').value=progress[x.id]?.draft||'';$('fr').textContent=x.fr;$('example').textContent=x.example;$('details').hidden=true;$('result').textContent=''}else{$('zh').textContent='无匹配项目'}$('single').hidden=table;$('batchView').hidden=!table;$('singleBtn').className=table?'':'primary';$('batchBtn').className=table?'primary':''}
function move(d){let a=filtered(),idx=a.findIndex(x=>x.id===current)+d;if(idx<0||idx>=a.length)return;current=a[idx].id;page=Math.floor(idx/+$('size').value);draw()}
for(let id of ['tier','task','state','size','q'])$(id).addEventListener(id==='q'?'input':'change',()=>{page=0;draw()});$('answer').oninput=()=>{if(!current)return;progress[current]={...(progress[current]||{}),draft:$('answer').value};save()};$('reveal').onclick=()=>{$('details').hidden=false};$('check').onclick=()=>{let x=DATA.find(x=>x.id===current);if(!x||!$('answer').value.trim())return;let ok=norm($('answer').value)===norm(x.fr);let p=progress[x.id]||{};progress[x.id]={...p,attempts:(p.attempts||0)+1,correct:ok,wrong:!ok};save();$('result').textContent=ok?'✓ 正确':'需复习 · 标准答案：'+x.fr;$('details').hidden=false};$('speak').onclick=()=>{let x=DATA.find(x=>x.id===current);if(x)say(x.example)};$('next').onclick=()=>move(1);$('prevPage').onclick=$('bprev').onclick=()=>{page--;current=0;draw()};$('nextPage').onclick=$('bnext').onclick=()=>{page++;current=0;draw()};$('singleBtn').onclick=()=>{table=false;draw()};$('batchBtn').onclick=()=>{table=true;draw()};$('shuffle').onclick=()=>{random=true;order.sort(()=>Math.random()-.5);page=0;draw()};$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'pronominal50',records:progress})],{type:'application/json'}));a.download='pronominal50-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onchange=async e=>{try{let j=JSON.parse(await e.target.files[0].text());if(j.app!=='pronominal50'||!j.records)throw Error('文件不是本模块进度');progress=j.records;save();draw()}catch(err){alert(err.message)}};draw();</script></body></html>
