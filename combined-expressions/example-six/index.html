<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCF · 口语举例表达 6</title><style>body{font:16px system-ui,sans-serif;background:#f5f6fb;color:#252d48;margin:0}main{max-width:850px;margin:auto;padding:20px}h1{font-size:1.7rem}button,a{font:inherit}button{padding:10px 14px;border:1px solid #cbd1e1;border-radius:9px;background:white;cursor:pointer}button:focus-visible{outline:3px solid #6476dc}.nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.nav button[aria-pressed=true]{background:#515cdd;color:white}.card{background:white;border:1px solid #dce1ed;border-radius:16px;padding:20px;margin:12px 0}.fr{font-size:1.25rem;line-height:1.6}textarea{width:100%;min-height:95px;box-sizing:border-box;font:1.05rem system-ui;border-radius:9px;padding:12px;border:1px solid #b7bfd4}.muted{color:#626c82}.row{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.good{color:#176b4c}.bad{color:#ad3d40}audio{width:100%}details{margin-top:12px}#notice{font-size:.9rem}</style></head><body><main><a href="../">← 返回五任务</a><h1>口语 T3 · 举例表达 6</h1><p class="muted">中文提示 → 法语默写 · 高频例句 · Piper siwis 预生成音频（仅播放已存在的音频）</p><nav id="nav" class="nav"></nav><section class="card"><div id="count" class="muted"></div><h2 id="zh"></h2><p id="hint" class="muted"></p><label for="answer">默写举例表达</label><textarea id="answer" lang="fr" spellcheck="false"></textarea><div class="row"><button id="check">检查</button><button id="reveal">显示答案</button><button id="next">下一条</button></div><div id="result" role="status"></div><details id="example"><summary>查看完整例句与翻译</summary><p id="fr" class="fr" lang="fr"></p><p id="trans"></p></details><div class="row"><button id="audioBtn">播放 Piper 例句</button><button id="slow">慢速 0.85×</button></div><audio id="player" controls preload="none"></audio><p id="notice" class="muted" role="status">Piper 音频仅使用预生成资源，不使用浏览器合成语音。</p></section></main><script>const rows=[["Par exemple,","例如","Par exemple, apprendre le français peut faciliter l'intégration des immigrants.","例如，学习法语可以帮助移民融入社会。"],["Prenons l’exemple de","以……为例","Prenons l'exemple du Canada, où plusieurs langues coexistent.","以加拿大为例，那里有多种语言共存。"],["On peut citer","可以列举……","On peut citer les transports en commun, qui réduisent la pollution.","可以列举公共交通，它可以减少污染。"],["C’est le cas de","……就是这种情况","C'est le cas des jeunes qui cherchent un emploi à l'étranger.","那些在国外找工作的年轻人就是这种情况。"],["Notamment","尤其是……","Les activités culturelles favorisent les échanges, notamment entre les générations.","文化活动促进交流，尤其是代际交流。"],["À titre d’exemple,","举例来说","À titre d'exemple, le télétravail permet de mieux concilier vie professionnelle et vie privée.","举例来说，远程办公可以更好地平衡工作与私人生活。"]];let idx=0;const $=id=>document.getElementById(id);const key='tcf-example-six-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key))||{}}catch{}function norm(s){return s.normalize('NFC').toLocaleLowerCase('fr').replace(/[.,!?;:’']/g,' ').replace(/\s+/g,' ').trim()}function render(){const r=rows[idx];$('count').textContent=(idx+1)+' / '+rows.length;$('zh').textContent=r[1];$('hint').textContent='提示：根据中文写出举例结构';$('fr').textContent=r[2];$('trans').textContent=r[3];$('answer').value=saved[idx]||'';$('result').textContent='';$('example').open=false;$('player').removeAttribute('src');$('player').load();$('notice').textContent='Piper 音频仅使用预生成资源，不使用浏览器合成语音。';$('nav').replaceChildren();rows.forEach((r,i)=>{const b=document.createElement('button');b.textContent=String(i+1);b.setAttribute('aria-pressed',String(i===idx));b.onclick=()=>{idx=i;render()};$('nav').append(b)})}$('answer').oninput=()=>{saved[idx]=$('answer').value;localStorage.setItem(key,JSON.stringify(saved))};$('check').onclick=()=>{const ok=norm($('answer').value)===norm(rows[idx][0]);$('result').className=ok?'good':'bad';$('result').textContent=ok?'正确':'正确表达：'+rows[idx][0]};$('reveal').onclick=()=>{$('result').className='';$('result').textContent=rows[idx][0];$('example').open=true};$('next').onclick=()=>{idx=(idx+1)%rows.length;render()};$('slow').onclick=()=>{$('player').playbackRate=.85;$('notice').textContent='播放速度 0.85×'};let manifest;async function loadManifest(){if(manifest)return manifest;const r=await fetch('../piper-audio/manifest.json');if(!r.ok)throw Error('Piper 索引不可用');return manifest=await r.json()}$('audioBtn').onclick=async()=>{const text=rows[idx][2];$('notice').textContent='查找 Piper 预生成音频……';try{const m=await loadManifest();const e=m.entries?.[text];if(!e)throw Error('这条例句尚未生成 Piper 音频');const p=await fetch(new URL('../piper-audio/'+e.pack,location.href));if(!p.ok)throw Error('音频包不可用');const d=(await p.json())[e.id];if(!d||d.text!==text)throw Error('音频原文不匹配');const bytes=Uint8Array.from(atob(d.audio),c=>c.charCodeAt(0));$('player').src=URL.createObjectURL(new Blob([bytes],{type:'audio/mpeg'}));await $('player').play();$('notice').textContent='Piper · fr_FR-siwis-medium'}catch(e){$('notice').textContent=e.message+'；未使用替代 TTS。'}};render();</script></body></html>
