<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T2｜真题12问三维训练</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1c2925;background:#f5f7f6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:20px 14px 60px}a{color:#205b50}.bar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;align-items:center}.panel{background:white;border:1px solid #dbe5e1;border-radius:14px;padding:17px;margin:14px 0}h1{font-size:1.7rem}h2{font-size:1.15rem}button,select,textarea{font:inherit}button,select{padding:9px 12px;border:1px solid #bfcfc8;border-radius:9px;background:#fff;cursor:pointer}button.primary{background:#24594d;color:white;border-color:#24594d}button:disabled{opacity:.5}select{max-width:100%}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px}.muted{color:#62736c;font-size:.9rem;line-height:1.6}.sujet{font-size:1.04rem;line-height:1.8}.meta{font-size:.86rem;color:#51665b}.q{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;border-top:1px solid #e5eeea;padding:16px 0}.qnum{font-weight:800;color:#32665b}.zh{font-weight:700;font-size:1.03rem;margin:5px 0 10px}.answer{width:100%;min-height:68px;padding:10px;border:1px solid #becfc6;border-radius:9px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.answerbox{margin-top:10px;background:#eef5f2;border-radius:10px;padding:12px;line-height:1.7}.answerbox[hidden]{display:none}.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat>div{border:1px solid #dce8e2;padding:12px;border-radius:10px}.stat strong{display:block;font-size:1.3rem}#message{color:#8e3b2d}.tiny{font-size:.8rem;color:#61746b}.classification{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}.classification select{font-size:.84rem;padding:5px;max-width:210px}@media(max-width:700px){.stat{grid-template-columns:1fr}.q{grid-template-columns:30px minmax(0,1fr)}}
</style></head><body><main class="wrap"><div class="bar"><a href="./?module=13">← 返回综合练习</a><a href="../tache2/real-exams/">查看真实Sujet来源</a></div><h1>🎯 Tâche 2｜真题12问三维训练</h1><p class="muted">直接读取原有真题库，不新增Sujet。中文题目来自真题学习版；法语原句仅作参考。统计以你的人工选择为准，不冒充AI自动语法评分。12问是训练基准，不是官方固定题数。</p>
<section class="panel"><div class="toolbar"><label>主题 <select id="theme"><option value="">加载中…</option></select></label><label>真实Sujet <select id="sujet"></select></label><button class="primary" id="start">开始／重新生成12问</button><button id="reset">清除本题进度</button></div><p id="message"></p></section>
<section id="context" class="panel" hidden><h2>原始Sujet</h2><p id="sujetText" class="sujet"></p><p id="sourceInfo" class="meta"></p></section>
<section id="metrics" class="panel" hidden><h2>三维分布（依据你选择的分类）</h2><div class="stat"><div><strong id="wordStat">—</strong><span>疑问词覆盖</span></div><div><strong id="structureStat">—</strong><span>结构覆盖</span></div><div><strong id="tenseStat">—</strong><span>时态覆盖</span></div></div><p id="details" class="muted"></p></section>
<section id="questions" class="panel" hidden><h2>中文提示 → 自主法语提问（共12题）</h2><div id="list"></div></section></main>
<script>
'use strict';
const BASE='../tache2/real-exams/';const keys=['travel','housing','social','education','consumption','transport','family','sport','health','culture','work'];
const labels=['旅行与住宿','住房与安家','社交聚会与个人生活','教育与培训','消费餐饮与生活服务','交通与车辆','家庭儿童与宠物照护','体育户外与场馆','健康安全与公共服务','文化媒体与节庆','工作与职业'];
const $=id=>document.getElementById(id);let entries=[],selected=[],selectionKey='';const all={};const W=['quel','combien','quand','où','comment','lequel','qui','pourquoi','quoi','oui/non','其他'];
const S=['简单倒装','复合倒装','间接疑问','est-ce que','语调疑问','疑问词作主语','其他'];
const T=['现在时','简单将来时','最近将来时','复合过去时','未完成过去时','条件式现在时','混合/其他'];
const clean=(x)=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function guess(fr){
 const f=clean(fr).replace(/[’]/g,"'");
 let word=f.match(/^(quel(?:le|s|les)?|combien|quand|ou|comment|lequel|laquelle|lesquels|lesquelles|qui|pourquoi|de quoi|en quoi|a quoi)/)?.[1]||'';
 if(/^(lequel|laquelle|lesquels|lesquelles)/.test(word))word='lequel';else if(/^quel/.test(word))word='quel';else if(/quoi/.test(word))word='quoi';
 else if(/^(y a-t-il|faut-il|est-ce que|est-il|est-elle|peut-on|puis-je|dois-je|avez-vous|avez-tu|pouvez-vous)/.test(f))word='oui/non';
 else if(!word)word='其他';
 const structure=/\b(est-ce que|est-ce qu')/.test(f)?'est-ce que':/^(pourriez-vous me dire|j'aimerais savoir|savez-vous)/.test(f)?'间接疑问':/[a-zà-ÿ]+\s+\w+-(?:t-)?(?:il|elle|ils|elles)\b/i.test(fr)?'复合倒装':/\b\w+-(?:t-)?(?:vous|tu|il|elle|ils|elles|on|nous|je)\b/i.test(fr)?'简单倒装':/^qu'est-ce qui/i.test(fr)?'疑问词作主语':'语调疑问';
 const tense=/\b(pourriez|voudriez|conseilleriez|recommanderiez|conviendrait|serait|aurait)\b/.test(f)?'条件式现在时':/\b(sera|seront|aura|durera|commencera|se deroulera|pourra|faudra|devra)\b/.test(f)?'简单将来时':/\b(allez|va|vont)\s+\w+er\b/.test(f)?'最近将来时':/\b(a|ont|avez|est|sont)\s+\w+(e|i|u|es|is|us)\b/.test(f)?'复合过去时':'现在时';
 return [word,structure,tense];
}
function option(parent,choices,chosen,onchange){const sel=document.createElement('select');for(const n of choices){const op=document.createElement('option');op.value=n;op.textContent=n;sel.append(op);}sel.value=chosen;sel.onchange=()=>onchange(sel.value);parent.append(sel);}
function getStored(){try{return JSON.parse(localStorage.getItem(selectionKey)||'{}')}catch{return {}}}
function putStored(o){localStorage.setItem(selectionKey,JSON.stringify(o));}
function choose(rows){
 // Sample from the 15 authored questions, maximizing distinct source information dimensions, while keeping original order.
 const pool=rows.filter(r=>r.fr&&r.zh);let output=[],used=new Set();
 for(const r of pool){const key=r.dimension||r.sub||'';if(!used.has(key)){output.push(r);used.add(key);}if(output.length===12)break;}
 for(const r of pool){if(output.length>=12)break;if(!output.includes(r))output.push(r);}
 return output.sort((a,b)=>(a.n||0)-(b.n||0));
}
function updateStats(){
 const st=getStored(),dimensions=[new Set(),new Set(),new Set()],count=[{}, {}, {}];selected.forEach((r,i)=>{const v=st[i]?.tags||guess(r.fr);v.forEach((x,j)=>{dimensions[j].add(x);count[j][x]=(count[j][x]||0)+1;});});
 $('wordStat').textContent=dimensions[0].size+'类';$('structureStat').textContent=dimensions[1].size+'类';$('tenseStat').textContent=dimensions[2].size+'类';
 $('details').textContent=['疑问词','结构','时态'].map((n,i)=>n+'：'+Object.entries(count[i]).map(([k,v])=>k+' '+v).join('、')).join('｜');
}
function render(){
 const theme=$('theme').value,idx=Number($('sujet').value),e=(all[theme]||[])[idx];if(!e){$('message').textContent='未找到Sujet';return;}
 selectionKey='t2-12-v1-'+theme+'-'+e.month+'-'+e.number;selected=choose(e.rows||[]);
 if(selected.length<12){$('message').textContent='这道原题只有'+selected.length+'条现存学习问句，无法凑够12条。不会自动补造题目。';return;}
 $('message').textContent='来源：'+labels[keys.indexOf(theme)]+'，'+e.month+' 第'+e.number+'题。采用原题已整理的12条提问。';
 $('context').hidden=$('metrics').hidden=$('questions').hidden=false;
 $('sujetText').textContent=e.sujet;$('sourceInfo').textContent='真实Sujet · '+e.month+' · 题号'+e.number+'｜原题问题库：'+e.rows.length+'条；选取12条';
 const list=$('list');list.replaceChildren();const saved=getStored();
 selected.forEach((q,i)=>{
 const div=document.createElement('article');div.className='q';const n=document.createElement('div');n.className='qnum';n.textContent=i+1;
 const c=document.createElement('div'),m=document.createElement('p');m.className='meta';m.textContent=(q.dimension||'')+' · '+(q.sub||'')+' · '+(q.timeline||'');
 const zh=document.createElement('p');zh.className='zh';zh.textContent=q.zh;const a=document.createElement('textarea');a.className='answer';a.placeholder='先说法语，再按需输入（不会自动判分）';a.value=saved[i]?.answer||'';a.oninput=()=>{const x=getStored();x[i]={...(x[i]||{}),answer:a.value};putStored(x)};
 const bar=document.createElement('div');bar.className='actions';const b=document.createElement('button');b.textContent='显示法语参考';const ref=document.createElement('div');ref.className='answerbox';ref.hidden=true;ref.textContent=q.fr;b.onclick=()=>{ref.hidden=!ref.hidden;b.textContent=ref.hidden?'显示法语参考':'隐藏法语参考'};bar.append(b);
 const tags=document.createElement('div');tags.className='classification';const defaults=saved[i]?.tags||guess(q.fr);
 [W,S,T].forEach((opts,j)=>option(tags,opts,defaults[j],value=>{const x=getStored();const state=x[i]||{};const v=state.tags||[...defaults];v[j]=value;x[i]={...state,tags:v};putStored(x);updateStats();}));
 c.append(m,zh,a,bar,ref,tags);div.append(n,c);list.append(div);
 });updateStats();
}
async function loadTheme(t){
 if(all[t])return;
 if(t==='travel'){
  window.T2_TRAVEL=[];for(let i=1;i<=9;i++){await new Promise((ok,fail)=>{const sc=document.createElement('script');sc.src=BASE+'travel-data-'+i+'.js';sc.onload=ok;sc.onerror=fail;document.head.append(sc);});}
  all[t]=window.T2_TRAVEL;return;
 }
 const res=await fetch(BASE+'data/'+t+'.json');if(!res.ok)throw Error('题库加载失败：'+t);const data=await res.json();all[t]=data.entries;
}
function subjects(){const rows=all[$('theme').value]||[];$('sujet').replaceChildren();rows.forEach((e,i)=>{const o=new Option((e.month||'')+' · 第'+e.number+'题 · '+(e.sujet||'').slice(0,68),String(i));$('sujet').add(o);});$('message').textContent=rows.length+'道已导入真实Sujet';}
$('theme').onchange=async()=>{try{$('message').textContent='读取真实题库中…';await loadTheme($('theme').value);subjects();}catch(e){$('message').textContent=e.message}};
$('start').onclick=render;
$('reset').onclick=()=>{if(!selectionKey)return;if(confirm('清除当前Sujet的12题答案和分类吗？')){localStorage.removeItem(selectionKey);render();}};
keys.forEach((k,i)=>$('theme').add(new Option(labels[i],k)));$('theme').value='education';$('theme').onchange();
</script></body></html>
