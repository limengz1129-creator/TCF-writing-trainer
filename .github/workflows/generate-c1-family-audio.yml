name: Generate C1 family Piper audio
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate_c1_family_piper.py'
      - 'eo-tache3-corpus/c1-family-data.js'
      - '.github/workflows/generate-c1-family-audio.yml'
concurrency:
  group: family-c1-piper-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Piper and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'piper-tts>=1.3,<2'
      - name: Download French siwis medium model
        run: |
          curl -fL --retry 5 -o /tmp/fr_FR-siwis-medium.onnx 'https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx'
          curl -fL --retry 5 -o /tmp/fr_FR-siwis-medium.onnx.json 'https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx.json'
      - name: Generate missing Family C1 audio
        run: python scripts/generate_c1_family_piper.py
      - name: Commit generated packs and manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eo-tache3-corpus/family-audio/
          if ! git diff --cached --quiet; then
            git commit -m 'Generate missing Piper siwis Family C1 audio'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              if git push origin HEAD:main; then exit 0; fi
              echo "Push race detected, retrying ($attempt/5)"
              sleep 5
            done
            echo 'Unable to push generated Piper packs after five attempts' >&2
            exit 1
          fi
