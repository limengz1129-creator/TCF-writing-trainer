name: Generate T3 scene chain Piper audio
on:
  push:
    paths:
      - 'tools/piper/build_t3_chain_audio.py'
      - '.github/workflows/t3-scene-chain-piper.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: piper-t3-scene-chain-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install piper-tts
      - name: Download siwis French model
        run: |
          curl -fL --retry 3 -o /tmp/fr_FR-siwis-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx
          curl -fL --retry 3 -o /tmp/fr_FR-siwis-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx.json
      - name: Generate chain audio and verify
        run: python -u tools/piper/build_t3_chain_audio.py
      - name: Publish static packs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eo-tache3-corpus/chain-audio/
          if ! git diff --cached --quiet; then
            git commit -m "Generate Piper recordings for T3 scene logic chunks"
            git pull --rebase
            git push
          fi
