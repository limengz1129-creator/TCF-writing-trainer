name: Build isolated verb120 Word copy
on:
  push:
    branches: [main]
    paths:
      - 'combined-expressions/verb120/data.json'
      - 'tools/piper/verb120/make_word.py'
      - '.github/workflows/build-verb120-word.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install python-docx
      - run: python tools/piper/verb120/make_word.py
      - name: Commit standalone Word download
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add combined-expressions/verb120/TCF-120-verb-constructions.docx
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add verb120 Word download"
            git fetch origin main
            git rebase origin/main
            git push
          fi
