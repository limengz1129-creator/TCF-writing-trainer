name: Build C1 Travel Piper Audio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'eo-tache3-corpus/c1-travel-data.js'
      - 'tools/piper/c1_travel_audio.py'
      - '.github/workflows/c1-travel-piper.yml'
permissions:
  contents: write
concurrency:
  group: c1-travel-piper
  cancel-in-progress: false
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline speech engine
        run: |
          python -m pip install 'piper-tts==1.3.0'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Download official SIWIS medium model and config
        run: |
          mkdir -p /tmp/siwis
          curl --fail --location --retry 3 'https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx' -o /tmp/siwis/fr_FR-siwis-medium.onnx
          curl --fail --location --retry 3 'https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx.json' -o /tmp/siwis/fr_FR-siwis-medium.onnx.json
      - name: Generate every C1 French utterance
        run: python tools/piper/c1_travel_audio.py generate --model /tmp/siwis/fr_FR-siwis-medium.onnx
      - name: Verify every referenced audio file
        run: python tools/piper/c1_travel_audio.py verify
      - name: Publish generated static recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eo-tache3-corpus/c1-travel-audio/
          if ! git diff --cached --quiet; then
            git commit -m "Generate and audit C1 travel siwis recordings"
            # Other commits may land on main during lengthy synthesis.
            # Rebase only the generated-audio commit; never force-push.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Generated audio conflicts with changes on main; manual reconciliation required"
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Generated Piper recordings published successfully"
                exit 0
              fi
              echo "Remote main moved during push attempt $attempt; retrying safely"
              sleep 5
            done
            echo "::error::Could not publish after 5 safe retries"
            exit 1
          fi
