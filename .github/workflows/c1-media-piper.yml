name: Build C1 Media Piper Audio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'eo-tache3-corpus/c1-media-data.js'
      - 'tools/piper/c1_media_audio.py'
      - '.github/workflows/c1-media-piper.yml'
permissions:
  contents: write
concurrency:
  group: c1-media-piper
  cancel-in-progress: false
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline speech engine
        run: |
          python -m pip install 'piper-tts==1.3.0'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Download official SIWIS medium model and config
        run: |
          mkdir -p /tmp/siwis
          curl --fail --location --retry 3 'https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx' -o /tmp/siwis/fr_FR-siwis-medium.onnx
          curl --fail --location --retry 3 'https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx.json' -o /tmp/siwis/fr_FR-siwis-medium.onnx.json
      - name: Generate every C1 French utterance
        run: python tools/piper/c1_media_audio.py generate --model /tmp/siwis/fr_FR-siwis-medium.onnx
      - name: Verify every referenced audio file
        run: python tools/piper/c1_media_audio.py verify
      - name: Publish generated static recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A long synthesis may start from an obsolete main. Never rebase an old
          # generated manifest onto a newer one: both replace the same JSON file.
          # Rebuild against the newest main instead, keeping audio/text aligned.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python tools/piper/c1_media_audio.py generate --model /tmp/siwis/fr_FR-siwis-medium.onnx
            python tools/piper/c1_media_audio.py verify
            git add eo-tache3-corpus/c1-media-audio/
            if git diff --cached --quiet; then
              echo "Media C1 Piper recordings are already current on main"
              exit 0
            fi
            git commit -m "Generate and audit C1 media siwis recordings"
            if git push origin HEAD:main; then
              echo "Generated media Piper recordings published successfully"
              exit 0
            fi
            echo "Remote main advanced; regenerate from latest main (attempt $attempt)"
          done
          echo "::error::Could not publish media C1 audio after safe retries"
          exit 1
