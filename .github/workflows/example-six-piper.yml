name: Generate example-six Piper audio
on:
  push:
    paths:
      - 'combined-expressions/example-six/index.html'
      - 'tools/piper/build_example_six.py'
      - '.github/workflows/example-six-piper.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    concurrency:
      group: piper-example-six-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install piper-tts
      - name: Verify Piper Python API and FFmpeg
        run: |
          python -c 'from piper import PiperVoice; print("Piper Python API available")'
          ffmpeg -version | head -1
      - name: Download official siwis model
        run: |
          curl -fL --retry 3 -o /tmp/fr_FR-siwis-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx
          curl -fL --retry 3 -o /tmp/fr_FR-siwis-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx.json
      - run: python tools/piper/build_example_six.py
      - name: Commit generated audio
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add combined-expressions/example-six/audio-manifest.json combined-expressions/example-six/audio-pack.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate six offline Piper siwis recordings"
            git pull --rebase
            git push
          fi
