name: Generate T3 argument-map Piper audio
on:
  push:
    paths:
      - 'tools/piper/build_t3_argument_audio.py'
      - '.github/workflows/t3-argument-piper.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    concurrency:
      group: piper-t3-argument-main
      cancel-in-progress: false
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
      - run: pip install piper-tts
      - name: Verify Piper Python API and FFmpeg
        run: |
          python -c 'from piper import PiperVoice; print("Piper Python API available")'
          ffmpeg -version | head -1
      - name: Download French siwis voice
        run: |
          curl -fL --retry 3 -o /tmp/fr_FR-siwis-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx
          curl -fL --retry 3 -o /tmp/fr_FR-siwis-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx.json
      - name: Generate all 1549 vocabulary recordings
        run: python -u tools/piper/build_t3_argument_audio.py
      - name: Validate generated audio
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('eo-tache3-corpus/argument-audio')
          entries=json.loads((root/'manifest.json').read_text())['entries']
          assert len(entries)==1549, f'Expected 1549 phrases, found {len(entries)}'
          assert all((root/e['pack']).is_file() for e in entries.values())
          print(f'Validated {len(entries)} French Piper recordings')
          PY
      - name: Commit audio packs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add eo-tache3-corpus/argument-audio/
          if ! git diff --cached --quiet; then
            git commit -m "Generate T3 argument vocabulary Piper recordings"
            git pull --rebase
            git push
          fi
