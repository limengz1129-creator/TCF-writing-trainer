name: Generate T3 argument-map Piper audio
on:
  push:
    paths:
      - 'tools/piper/build_t3_argument_audio.py'
      - '.github/workflows/t3-argument-piper.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    concurrency:
      group: piper-t3-argument-main
      cancel-in-progress: false
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
      - run: pip install piper-tts
      - name: Verify Piper Python API and FFmpeg
        run: |
          python -c 'from piper import PiperVoice; print("Piper Python API available")'
          ffmpeg -version | head -1
      - name: Download French siwis voice
        run: |
          curl -fL --retry 3 -o /tmp/fr_FR-siwis-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx
          curl -fL --retry 3 -o /tmp/fr_FR-siwis-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx.json
      - name: Configure Git author
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Generate and publish 16 resumable batches
        run: |
          set -euo pipefail
          for batch in $(seq 0 15); do
            echo "::group::Piper batch $((batch+1))/16"
            python -u tools/piper/build_t3_argument_audio.py "$batch"
            git add eo-tache3-corpus/argument-audio/
            if ! git diff --cached --quiet; then
              git commit -m "Piper T3 vocabulary batch $((batch+1)) of 16"
              git pull --rebase
              git push
            fi
            echo "::endgroup::"
          done
      - name: Validate complete coverage
        run: |
          python - <<'PY'
          import json,base64
          from pathlib import Path
          root=Path('eo-tache3-corpus/argument-audio')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          entries=manifest['entries']
          assert len(entries)==1549, f'Expected 1549, found {len(entries)}'
          packs={}
          for phrase,info in entries.items():
              name=info['pack']
              if name not in packs:
                  packs[name]=json.loads((root/name).read_text(encoding='utf-8'))
              record=packs[name][info['id']]
              assert record['text']==phrase
              assert len(base64.b64decode(record['audio']))>100
          assert len(packs)==16, f'Expected 16 packs, found {len(packs)}'
          print(f'PASS: {len(entries)} Piper phrases across {len(packs)} packs')
          PY
