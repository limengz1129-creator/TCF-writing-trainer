name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify T3 Piper audio included in Pages deployment
        run: |
          python - <<'PY'
          import json,base64
          from pathlib import Path
          root=Path('eo-tache3-corpus/argument-audio')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          entries=manifest['entries']
          assert len(entries)==1549, f'Expected 1549, found {len(entries)}'
          for i in range(16):
              pack=root/f'pack-{i:03}.json'
              assert pack.is_file(), f'Missing {pack}'
              assert pack.stat().st_size>100, f'Empty {pack}'
          print('Pages artifact includes 1549 indexed phrases and 16 Piper packs')
          chain=Path('eo-tache3-corpus/chain-audio')
          chain_manifest=json.loads((chain/'manifest.json').read_text(encoding='utf-8'))
          assert len(chain_manifest['entries'])==190, f"Missing scene audio: {len(chain_manifest['entries'])}/190"
          for phrase,item in chain_manifest['entries'].items():
              path=chain/item['pack']
              assert path.is_file(), f'Missing scene pack {path}'
          print('Pages artifact includes 190 scene logic-chain Piper recordings')
          examples=Path('eo-tache3-corpus/example-audio')
          example_manifest=json.loads((examples/'manifest.json').read_text(encoding='utf-8'))
          assert len(example_manifest['entries'])==323, f"Missing example audio: {len(example_manifest['entries'])}/323"
          for phrase,item in example_manifest['entries'].items():
              pack=examples/item['pack']
              assert pack.is_file() and pack.stat().st_size>100, f'Missing example audio pack {pack}'
          print('Pages artifact includes 323 example-chain Piper recordings')
          overview=Path('eo-tache3-corpus/overview-audio')
          overview_manifest=json.loads((overview/'manifest.json').read_text(encoding='utf-8'))
          assert len(overview_manifest['entries'])==93, f"Missing mother-chain audio: {len(overview_manifest['entries'])}/93"
          for phrase,item in overview_manifest['entries'].items():
              pack=overview/item['pack']
              assert pack.is_file() and pack.stat().st_size>100, f'Missing mother-chain pack {pack}'
          print('Pages artifact includes 93 mother-chain Piper recordings')
          # No career audio buttons may ship without exact on-disk Piper coverage.
          from pathlib import Path
          import re
          maps=Path('eo-tache3-corpus/argument-map.js').read_text(encoding='utf-8')
          topics,_=json.JSONDecoder().raw_decode(maps[maps.index('const TOPICS=')+len('const TOPICS='):])
          career=topics['职业与职场']
          raw=Path('eo-tache3-corpus/career-example-cards.js').read_text(encoding='utf-8')
          cards=json.loads(re.search(r'window.TCF_T3_CAREER_EXAMPLES=(\\{.*\\});\\s*
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
