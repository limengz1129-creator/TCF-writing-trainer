name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify T3 Piper audio included in Pages deployment
        run: |
          python - <<'PY'
          import json,base64
          from pathlib import Path
          root=Path('eo-tache3-corpus/argument-audio')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          entries=manifest['entries']
          assert len(entries)==1549, f'Expected 1549, found {len(entries)}'
          for i in range(16):
              pack=root/f'pack-{i:03}.json'
              assert pack.is_file(), f'Missing {pack}'
              assert pack.stat().st_size>100, f'Empty {pack}'
          print('Pages artifact includes 1549 indexed phrases and 16 Piper packs')
          chain=Path('eo-tache3-corpus/chain-audio')
          chain_manifest=json.loads((chain/'manifest.json').read_text(encoding='utf-8'))
          assert len(chain_manifest['entries'])==190, f"Missing scene audio: {len(chain_manifest['entries'])}/190"
          for phrase,item in chain_manifest['entries'].items():
              path=chain/item['pack']
              assert path.is_file(), f'Missing scene pack {path}'
          print('Pages artifact includes 190 scene logic-chain Piper recordings')
          examples=Path('eo-tache3-corpus/example-audio')
          example_manifest=json.loads((examples/'manifest.json').read_text(encoding='utf-8'))
          assert len(example_manifest['entries'])==323, f"Missing example audio: {len(example_manifest['entries'])}/323"
          for phrase,item in example_manifest['entries'].items():
              pack=examples/item['pack']
              assert pack.is_file() and pack.stat().st_size>100, f'Missing example audio pack {pack}'
          print('Pages artifact includes 323 example-chain Piper recordings')
          overview=Path('eo-tache3-corpus/overview-audio')
          overview_manifest=json.loads((overview/'manifest.json').read_text(encoding='utf-8'))
          assert len(overview_manifest['entries'])==93, f"Missing mother-chain audio: {len(overview_manifest['entries'])}/93"
          for phrase,item in overview_manifest['entries'].items():
              pack=overview/item['pack']
              assert pack.is_file() and pack.stat().st_size>100, f'Missing mother-chain pack {pack}'
          print('Pages artifact includes 93 mother-chain Piper recordings')
          career_folder=Path('eo-tache3-corpus')
          maps=(career_folder/'argument-map.js').read_text(encoding='utf-8')
          topics,_=json.JSONDecoder().raw_decode(maps[maps.index('const TOPICS=')+len('const TOPICS='):])
          career=topics['职业与职场']
          data=(career_folder/'career-example-cards.js').read_text(encoding='utf-8')
          payload=data.split('window.TCF_T3_CAREER_EXAMPLES=',1)[1].rsplit(';',1)[0]
          cards=json.loads(payload)
          assert len(cards)==75
          original=json.loads((career_folder/'data-2.js').read_text(encoding='utf-8').split('CORPUS.push(...',1)[1].rsplit(');',1)[0])
          by_id={item['id']:item['fr'] for item in original}
          for pid,card in cards.items():
              assert len(card['words'])>=2, f'Missing career source vocabulary: {pid}'
              for fr,zh in card['words']:
                  assert zh and fr.casefold() in by_id[pid].casefold(),f'Career word not from source: {pid} {fr}'
          assert (career_folder/'career-example-cards.js').is_file(), 'Missing career example UI data'
          requested={p.strip() for mother in career['M'].values() for line in [mother['fr'],*[scene['fr'] for scene in mother['scenes']]] for p in line.split('→')}
          requested.update(p.strip() for card in cards.values() for p in card['fr'].split('→'))
          requested.update(fr for card in cards.values() for fr,_ in card['words'])
          covered=set()
          for folder in ('argument-audio','chain-audio','example-audio','overview-audio','career-audio'):
              location=career_folder/folder
              index=json.loads((location/'manifest.json').read_text(encoding='utf-8'))['entries']
              for phrase in requested & index.keys():
                  pack=location/index[phrase]['pack']
                  assert pack.is_file() and pack.stat().st_size>100, f'Missing {pack}'
                  covered.add(phrase)
          missing=requested-covered
          assert not missing, f'Missing career Piper for {len(missing)} chunks'
          print(f'PASS: 75 career cards and {len(requested)} Piper chunks')
          # Travel topic: source-faithful vocabulary must have deployed Piper assets.
          travel_data=(career_folder/'example-cards.js').read_text(encoding='utf-8')
          travel_cards=json.loads(travel_data.split('window.TCF_T3_EXAMPLES=',1)[1].rsplit(';',1)[0])
          assert len(travel_cards)==96
          travel_original=json.loads((career_folder/'data-1.js').read_text(encoding='utf-8').split('CORPUS.push(...',1)[1].rsplit(');',1)[0])
          original_by_id={p['id']:p['fr'] for p in travel_original}
          travel_phrases=set()
          for pid,card in travel_cards.items():
              assert card['words'],f'Empty travel vocabulary: {pid}'
              for phrase,meaning in card['words']:
                  assert meaning and meaning!='原文高频表达',f'Untranslated phrase: {pid}'
                  assert phrase.casefold() in original_by_id[pid].casefold(),f'Not sourced: {pid}: {phrase}'
                  travel_phrases.add(phrase)
          travel_covered=set()
          for folder in ('argument-audio','chain-audio','example-audio','overview-audio','career-audio','travel-vocab-audio'):
              loc=career_folder/folder
              manifest=json.loads((loc/'manifest.json').read_text(encoding='utf-8'))['entries']
              for phrase in travel_phrases & manifest.keys():
                  pack=loc/manifest[phrase]['pack']
                  assert pack.is_file() and pack.stat().st_size>100,f'Missing travel audio {pack}'
                  travel_covered.add(phrase)
          assert travel_phrases==travel_covered,f'Missing {len(travel_phrases-travel_covered)} travel audio entries'
          print(f'PASS: 96 travel cards; {len(travel_phrases)} source-exact vocabulary clips')

          PY
      - name: Validate education topic Piper before publishing
        run: python3 tools/piper/audit_t3_education.py
      - name: Validate media and culture Piper before publishing
        run: python3 tools/piper/audit_t3_media.py
      - name: Validate food and health topic Piper before publishing
        run: python3 tools/piper/audit_t3_health.py
      - name: Validate environment topic Piper before publishing
        run: python3 tools/piper/audit_t3_environment.py
      - name: Validate social and public affairs Piper before publishing
        run: python3 tools/piper/audit_t3_social.py
      - name: Validate family topic Piper before publishing
        run: python3 tools/piper/audit_t3_family.py
      - name: Verify C1 review audio packs before Pages upload
        run: |
          python3 tools/piper/c1_travel_audio.py verify
          python3 tools/piper/c1_career_audio.py verify
          python3 tools/piper/c1_education_audio.py verify
          python3 tools/piper/c1_media_audio.py verify
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('eo-tache3-corpus')
          for name,minimum in (('travel',1200),('career',1100),('education',1100),('media',650)):
              folder=root/f'c1-{name}-audio'
              manifest=json.loads((folder/'manifest.json').read_text(encoding='utf-8'))
              entries=manifest['entries']
              assert len(entries)>=minimum,(name,len(entries))
              for text,record in entries.items():
                  assert (folder/record['pack']).is_file(),f'Missing C1 {name}: {text}'
              print(f'Pages C1 {name}: {len(entries)} text targets verified')
          PY
      - name: Verify 45 compact Travel C1 Piper recordings in Pages artifact
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('eo-tache3-corpus')
          data = (root / 'c1-travel-minimal45-data.js').read_text(encoding='utf-8')
          units = json.loads(data.split('=', 1)[1].strip().rstrip(';'))
          folder = root / 'c1-travel-minimal45-audio'
          manifest = json.loads((folder / 'manifest.json').read_text(encoding='utf-8'))
          entries = manifest['entries']
          assert len(units) == 45, f'Expected 45 C1 units, found {len(units)}'
          for unit in units:
              phrase = unit['fr'].strip()
              assert phrase in entries, f'Missing audio index: {unit["id"]}'
              ref = entries[phrase]
              file = folder / ref.get('reuse', ref.get('pack', ''))
              assert file.is_file() and file.stat().st_size > 100, f'Missing audio pack: {file}'
              pack = json.loads(file.read_text(encoding='utf-8'))
              assert pack[ref['id']]['text'] == phrase, f'Audio/text mismatch: {unit["id"]}'
              assert pack[ref['id']]['audio'], f'Empty audio: {unit["id"]}'
          print('PASS: 45/45 compact Travel C1 Piper audio packs and exact original texts')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
