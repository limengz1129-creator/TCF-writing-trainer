name: Audit T3 family and relationships Piper only
on:
  push:
    paths:
      - 'eo-tache3-corpus/tech-*'
      - 'eo-tache3-corpus/argument-map.js'
      - 'eo-tache3-corpus/family-audio/**'
      - 'tools/piper/audit_t3_family.py'
      - '.github/workflows/audit-t3-family.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/piper/audit_t3_family.py
