name: Browser smoke test T2 Piper buttons
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/piper/real-exam-themes/browser_smoke.cjs'
      - '.github/workflows/t2-piper-browser-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Click Piper button on each of the ten live theme pages
        run: node tools/piper/real-exam-themes/browser_smoke.cjs
