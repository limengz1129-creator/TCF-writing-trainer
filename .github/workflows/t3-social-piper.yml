name: Generate T3 social Piper audio
on:
  push:
    paths:
      - 'tools/piper/build_t3_social_audio.py'
      - '.github/workflows/t3-social-piper.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: social-piper
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: pip install piper-tts
      - run: |
          curl -fL --retry 3 -o /tmp/fr_FR-siwis-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx
          curl -fL --retry 3 -o /tmp/fr_FR-siwis-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx.json
      - name: Synchronize repository before generation
        run: git pull --ff-only origin main
      - run: python -u tools/piper/build_t3_social_audio.py
      - name: Publish packs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eo-tache3-corpus/social-audio/
          if ! git diff --cached --quiet; then
            git commit -m "Generate T3 social and public affairs Piper packs"
            git push origin HEAD:main
          fi
