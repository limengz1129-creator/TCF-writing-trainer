name: Build T2 transformation Piper audio
on:
  push:
    branches: [main]
    paths:
      - 'combined-expressions/t2-transform-data.js'
      - 'tools/piper/t2-transform-generate.py'
      - '.github/workflows/t2-transform-piper.yml'
  workflow_dispatch:
concurrency:
  group: t2-transform-piper
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Install Piper
        run: pip install piper-tts
      - name: Download SIWIS voice
        run: |
          curl -fL --retry 3 -o /tmp/fr_FR-siwis-medium.onnx 'https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx'
          curl -fL --retry 3 -o /tmp/fr_FR-siwis-medium.onnx.json 'https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx.json'
      - name: Generate all T2 Piper audio
        run: python tools/piper/t2-transform-generate.py
      - name: Verify generated manifest
        run: |
          python - <<'PY'
          import json, pathlib, re
          p=pathlib.Path('combined-expressions/t2-transform-audio')
          d=json.loads((p/'manifest.json').read_text())
          src=pathlib.Path('combined-expressions/t2-transform-data.js').read_text()
          modules=json.loads(re.search(r'const T2_TRANSFORM_DATA=(\{.*\});\s*$',src,re.S).group(1))['modules']
          assert len(modules)==45
          assert d['count']==len(d['entries'])
          assert all(m.get('baseExample') in d['entries'] for m in modules)
          assert all((p/f).stat().st_size>256 for f in d['entries'].values())
          print(f"Validated {d['count']} Piper MP3 files including 45 basic examples")
          PY
      - name: Publish audio to GitHub Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add combined-expressions/t2-transform-audio/
          if ! git diff --cached --quiet; then
            git commit -m 'Generate Piper SIWIS recordings for T2 transformation [skip ci]'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep 3
            done
          fi
