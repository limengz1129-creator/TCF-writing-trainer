name: Build all remaining T2 real-exam themes
on:
  push:
    branches: [main]
    paths:
      - 'tache2/real-exams/source/build-all.trigger'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: t2-real-exam-theme-build-all
  cancel-in-progress: false
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install NLLB, Piper and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install "transformers<5" sentencepiece piper-tts
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download Piper fr_FR-siwis-medium
        run: |
          mkdir -p .piper-model
          curl -L --fail --retry 3 -o .piper-model/fr_FR-siwis-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx
          curl -L --fail --retry 3 -o .piper-model/fr_FR-siwis-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx.json
      - name: Build, validate and push one checkpoint per theme
        run: |
          slug="$(sed -n '1s/^theme=//p' tache2/real-exams/source/build-all.trigger)"
          case "$slug" in
            housing|social|education|consumption|transport|family|sport|health|culture|work) ;;
            *) echo "Invalid theme trigger: $slug" >&2; exit 1 ;;
          esac
          python tools/piper/real-exam-themes/build.py --slug "$slug" --git-checkpoints --piper-model .piper-model/fr_FR-siwis-medium.onnx
