name: Build remaining T2 real-exam themes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-t2-real-exam-themes.yml'
      - 'tools/piper/real-exam-themes/build.py'
      - 'tache2/real-exams/source/themes-source*.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install translation, Piper and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install "transformers<5" sentencepiece sacremoses piper-tts
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download Piper fr_FR-siwis-medium
        run: |
          mkdir -p .piper-model
          curl -L --fail --retry 3 -o .piper-model/fr_FR-siwis-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx
          curl -L --fail --retry 3 -o .piper-model/fr_FR-siwis-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx.json
      - name: Build Chinese translations and static Piper audio
        run: python tools/piper/real-exam-themes/build.py --piper-model .piper-model/fr_FR-siwis-medium.onnx
      - name: Validate generated theme mapping
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path("tache2/real-exams/data")
          expected={"housing":33,"social":17,"education":17,"consumption":19,"transport":13,"family":5,"sport":9,"health":10,"culture":12,"work":9}
          for slug,n in expected.items():
              x=json.loads((root/f"{slug}.json").read_text())
              assert x["count"]==n,(slug,x["count"])
              assert len(x["entries"])==n
              assert all(len(q["rows"])==15 for q in x["entries"])
              assert all(r.get("zh") for q in x["entries"] for r in q["rows"])
          m=json.loads(pathlib.Path("tache2/real-exams/piper-audio/themes/manifest.json").read_text())
          allfr={r["fr"] for slug in expected for q in json.loads((root/f"{slug}.json").read_text())["entries"] for r in q["rows"]}
          assert set(m["targets"])==allfr
          print("Validated",sum(expected.values()),"questions",sum(n*15 for n in expected.values()),"rows",len(allfr),"unique Piper clips")
          PY
      - name: Commit generated study data and audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tache2/real-exams/data/ tache2/real-exams/piper-audio/themes/
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build remaining T2 real-exam themes with Piper audio"
            git fetch origin main
            git rebase origin/main
            git push
          fi
