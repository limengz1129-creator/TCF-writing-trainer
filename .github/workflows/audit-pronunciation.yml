name: Audit all French pronunciation
on:
  push:
    paths:
      - '**/*.js'
      - '**/*.html'
      - '**/*.ts'
      - '**/*.tsx'
      - 'tools/piper/audit_all_pronunciation.py'
      - '.github/workflows/audit-pronunciation.yml'
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject browser and non-Piper TTS
        run: python tools/piper/audit_all_pronunciation.py
