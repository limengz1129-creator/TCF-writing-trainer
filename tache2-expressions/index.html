<script>const DATA=[{"id":"0-2","module":0,"category":"学习与语言","fr":"prendre la parole","zh":"发言","example":"Je craignais surtout de prendre la parole, tant les échanges me semblaient rapides.","source":"第01题 · 第20段","row":2},{"id":"0-3","module":0,"category":"学习与语言","fr":"surmonter les difficultés","zh":"克服困难","example":"Pour surmonter ces difficultés, j’ai rejoint un groupe d’étudiants internationaux et organisé des révisions avec mes camarades.","source":"第01题 · 第21段","row":3},{"id":"0-4","module":0,"category":"学习与语言","fr":"organiser des révisions","zh":"安排复习","example":"Pour surmonter ces difficultés, j’ai rejoint un groupe d’étudiants internationaux et organisé des révisions avec mes camarades.","source":"第01题 · 第21段","row":4},{"id":"0-5","module":0,"category":"学习与语言","fr":"trouver ses repères","zh":"逐渐熟悉环境／找到方向","example":"Progressivement, j’ai trouvé mes repères et gagné en confiance.","source":"第01题 · 第21段","row":5},{"id":"0-6","module":0,"category":"学习与语言","fr":"gagner en confiance","zh":"增强自信","example":"Progressivement, j’ai trouvé mes repères et gagné en confiance.","source":"第01题 · 第21段","row":6},{"id":"0-7","module":0,"category":"学习与语言","fr":"gérer seul son quotidien","zh":"独自管理日常生活","example":"Ce séjour m’a offert bien davantage qu’un progrès linguistique : j’ai découvert de nouvelles méthodes d’apprentissage et appris à gérer seul mon quotidien.","source":"第01题 · 第22段","row":7},{"id":"0-8","module":0,"category":"学习与语言","fr":"aller vers les autres","zh":"主动接近他人／主动交往","example":"Toutefois, avec une préparation particulièrement sérieuse et la volonté d’aller vers les autres, cette expérience peut devenir une formidable occasion de grandir.","source":"第01题 · 第22段","row":8},{"id":"0-9","module":0,"category":"学习与语言","fr":"enrichir son parcours personnel et universitaire","zh":"丰富个人与学业经历","example":"Ce séjour, intégré à mon cursus, a profondément enrichi mon parcours personnel et universitaire.","source":"第02题 · 第35段","row":9},{"id":"0-10","module":0,"category":"学习与语言","fr":"s’adapter au rythme des cours","zh":"适应课程节奏","example":"Les premières semaines ont été exigeantes : je devais m’adapter au rythme des cours, comprendre les attentes des enseignants et trouver ma place dans une ville immense.","source":"第02题 · 第36段","row":10},{"id":"0-11","module":0,"category":"学习与语言","fr":"trouver sa place","zh":"找到自己的位置／融入","example":"Les premières semaines ont été exigeantes : je devais m’adapter au rythme des cours, comprendre les attentes des enseignants et trouver ma place dans une ville immense.","source":"第02题 · 第36段","row":11},{"id":"0-12","module":0,"category":"学习与语言","fr":"confronter ses idées à des perspectives différentes","zh":"让自己的观点与不同视角相碰撞","example":"Ces échanges m’ont permis de découvrir d’autres façons d’apprendre et de confronter mes idées à des perspectives différentes.","source":"第02题 · 第37段","row":12},{"id":"0-13","module":0,"category":"学习与语言","fr":"défendre son point de vue","zh":"为自己的观点辩护","example":"J’ai particulièrement apprécié les séminaires, où chacun était invité à défendre son point de vue.","source":"第02题 · 第37段","row":13},{"id":"0-14","module":0,"category":"学习与语言","fr":"demander de l’aide","zh":"寻求帮助","example":"Elle m’a appris à demander de l’aide sans renoncer à mon autonomie, et surtout à considérer les difficultés comme des occasions de progresser.","source":"第02题 · 第37段","row":14},{"id":"0-15","module":0,"category":"学习与语言","fr":"renoncer à son autonomie","zh":"放弃自主性","example":"Elle m’a appris à demander de l’aide sans renoncer à mon autonomie, et surtout à considérer les difficultés comme des occasions de progresser.","source":"第02题 · 第37段","row":15},{"id":"0-16","module":0,"category":"学习与语言","fr":"élargir ses perspectives","zh":"拓宽视野","example":"Les échanges avec des étudiants internationaux ont élargi mes perspectives, tandis que la gestion du quotidien a renforcé mon autonomie.","source":"第03题 · 第50段","row":16},{"id":"0-17","module":0,"category":"学习与语言","fr":"renforcer son autonomie","zh":"增强独立性","example":"Les échanges avec des étudiants internationaux ont élargi mes perspectives, tandis que la gestion du quotidien a renforcé mon autonomie.","source":"第03题 · 第50段","row":17},{"id":"0-18","module":0,"category":"学习与语言","fr":"accentuer le sentiment de solitude","zh":"加重孤独感","example":"Le logement coûtait cher et l’éloignement de mes proches accentuait parfois mon sentiment de solitude.","source":"第03题 · 第51段","row":18},{"id":"0-19","module":0,"category":"学习与语言","fr":"trouver un équilibre","zh":"找到平衡","example":"Il m’a fallu plusieurs semaines pour comprendre les attentes des enseignants et trouver un équilibre.","source":"第03题 · 第51段","row":19},{"id":"0-20","module":0,"category":"学习与语言","fr":"faciliter l’adaptation","zh":"帮助适应","example":"Un budget réaliste, une recherche préalable de logement et un réseau d’entraide facilitent l’adaptation.","source":"第03题 · 第52段","row":20},{"id":"0-21","module":0,"category":"学习与语言","fr":"noter les expressions dans leur contexte","zh":"在语境中记录表达","example":"Je notais les expressions dans leur contexte, plutôt que de mémoriser des mots isolés.","source":"第04题 · 第66段","row":21},{"id":"0-22","module":0,"category":"学习与语言","fr":"mémoriser des mots isolés","zh":"孤立地记忆单词","example":"Je notais les expressions dans leur contexte, plutôt que de mémoriser des mots isolés.","source":"第04题 · 第66段","row":22},{"id":"0-23","module":0,"category":"学习与语言","fr":"corriger les erreurs","zh":"纠正错误","example":"Deux fois par semaine, je discutais avec un partenaire linguistique qui corrigeait mes erreurs sans interrompre constamment l’échange.","source":"第04题 · 第66段","row":23},{"id":"0-24","module":0,"category":"学习与语言","fr":"accepter l’erreur comme une étape de l’apprentissage","zh":"把犯错视为学习的一部分","example":"À ceux qui débutent, je conseille de choisir des contenus intéressants et d’accepter l’erreur comme une étape de l’apprentissage.","source":"第04题 · 第67段","row":24},{"id":"0-25","module":0,"category":"学习与语言","fr":"suivre le rythme","zh":"跟上节奏","example":"Dès lundi, l’accueil chaleureux et les locaux lumineux m’ont rassuré, même si je craignais de ne pas suivre le rythme.","source":"第05题 · 第80段","row":25},{"id":"0-26","module":0,"category":"学习与语言","fr":"adapter ses conseils aux besoins de chacun","zh":"按各人的需要调整建议","example":"Les enseignants expliquent clairement les difficultés et adaptent leurs conseils aux besoins de chacun.","source":"第05题 · 第81段","row":26},{"id":"0-27","module":0,"category":"学习与语言","fr":"perdre confiance","zh":"失去信心","example":"J’apprécie leurs corrections précises, qui nous permettent de comprendre nos erreurs sans perdre confiance.","source":"第05题 · 第81段","row":27},{"id":"0-28","module":0,"category":"学习与语言","fr":"s’exprimer avec davantage d’aisance","zh":"表达得更加自如","example":"Certes, les devoirs demandent un effort quotidien, mais je sens que je m’exprime avec davantage d’aisance.","source":"第05题 · 第82段","row":28},{"id":"0-29","module":0,"category":"学习与语言","fr":"repérer ses erreurs récurrentes","zh":"发现自己反复出现的错误","example":"Leurs conseils personnalisés m’ont permis de repérer mes erreurs récurrentes et de travailler précisément les points qui freinaient mes progrès.","source":"第06题 · 第98段","row":29},{"id":"0-30","module":0,"category":"学习与语言","fr":"freiner les progrès","zh":"阻碍进步","example":"Leurs conseils personnalisés m’ont permis de repérer mes erreurs récurrentes et de travailler précisément les points qui freinaient mes progrès.","source":"第06题 · 第98段","row":30},{"id":"0-31","module":0,"category":"学习与语言","fr":"dépasser sa peur de parler","zh":"克服开口说话的恐惧","example":"Cette pratique m’a aidé à dépasser ma peur de parler.","source":"第06题 · 第99段","row":31},{"id":"0-32","module":0,"category":"学习与语言","fr":"suivre un programme intensif","zh":"参加强化课程","example":"J’ai récemment suivi un programme intensif dans une école de langues locale.","source":"第06题 · 第97段","row":32},{"id":"0-33","module":0,"category":"学习与语言","fr":"revoir les notions difficiles","zh":"复习难以理解的概念","example":"Les vidéos  };
 if(overrides[s])return overrides[s].map(norm);
 s=s.replace(/\([^)]*\)/g,'').replace(/de faire quelque chose/g,'de').replace(/à faire quelque chose/g,'à').replace(/pour faire quelque chose/g,'pour').replace(/faire quelque chose/g,'').replace(/un lieu|une heure/g,'');

function grade(input,item){
 const raw=norm(input);let cores=variants(item);
 if(item.module===0)return {ok:[item.fr,...(item.acceptedFr||[])].some(s=>norm(normalizeSlots(input))===norm(normalizeSlots(s))),cores};
 // Slot words may be omitted or abbreviated. Concrete content words are not guessed.
 let answer=norm(stripSlots(input.replace(/\([^)]*\)/g,'')));
 answer=answer.replace(/\b(?:de|à|pour) faire(?= |$)/g,m=>m.replace(/ faire$/,''));
 const exact=norm(item.fr);

 let ok=norm(normalizeSlots(input))===norm(normalizeSlots(item.fr))||raw===exact||cores.includes(answer)||cores.includes(raw);

}

function differenceAlignment(input,target){
 const a=Array.from(input),b=Array.from(target);
 const dp=Array.from({length:a.length+1},()=>new Uint16Array(b.length+1));
 for(let i=0;i<=a.length;i++)dp[i][0]=i;
 for(let j=0;j<=b.length;j++)dp[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
 const wrong=new Set(),missing=new Set();let i=a.length,j=b.length;
 while(i||j){
  if(i&&j&&a[i-1]===b[j-1]&&dp[i][j]===dp[i-1][j-1]){i--;j--;}
  else if(i&&j&&dp[i][j]===dp[i-1][j-1]+1){wrong.add(--i);missing.add(--j);}
  else if(j&&dp[i][j]===dp[i][j-1]+1){missing.add(--j);}
  else{wrong.add(--i);}
 }
 function runs(chars,set){const out=[];for(let k=0;k<chars.length;k++){const marked=set.has(k);if(out.length&&out[out.length-1].marked===marked)out[out.length-1].text+=chars[k];else out.push({text:chars[k],marked});}return out;}
 return {distance:dp[a.length][b.length],input:input,target:target,inputRuns:runs(a,wrong),targetRuns:runs(b,missing)};
}
function answerDifference(input,item){
 if(grade(input,item).ok)return null;
 const candidates=[];
 for(const member of [item]){
  const matcher={norm,stripSlots,normalizeSlots,variants};
  const normalized=matcher.norm(input);
  if(item.module!==0){
   let core=matcher.norm(matcher.stripSlots(input.replace(/\([^)]*\)/g,'')));
   core=core.replace(/\b(?:de|à|pour) faire(?= |$)/g,m=>m.replace(/ faire$/,''));
   for(const target of matcher.variants(member))candidates.push({input:core,target,core:true});
  }
  const slotForm=s=>matcher.norm(matcher.normalizeSlots(s)).replace(/__slot__/g,'[占位词]');
  for(const target of [member.fr,...(member.acceptedFr||[])])candidates.push({input:slotForm(input),target:slotForm(target),core:false});
 }
 let best=null;
 for(const candidate of candidates){
  // Keep visual comparison bounded for accidentally pasted paragraphs.
  const bounded=candidate.input.slice(0,500);
  const diff=differenceAlignment(bounded,candidate.target);
  if(!best||diff.distance<best.distance)best={...diff,core:candidate.core,truncated:candidate.input.length>500};
 }
 return best;
}

function appendDifferenceRuns(node,runs,className){
 for(const run of runs){if(run.marked){const mark=document.createElement('mark');mark.className=className;mark.textContent=run.text;node.append(mark);}else node.append(document.createTextNode(run.text));}
}

  const section=document.createElement('div'),head=document.createElement('strong'),line=document.createElement('div');head.textContent=label;line.className='diff-line';appendDifferenceRuns(line,runs,cls);if(!runs.length){const empty=document.createElement('span');empty.className='note';empty.textContent='（未写出核心表达）';line.append(empty);}section.append(head,line);grid.append(section);

 view.append(legend,grid,note);container.append(view);
}
