const storage='tcfca-cognates-v1';let marks={};try{marks=JSON.parse(localStorage.getItem(storage)||'{}')}catch(e){}let list=[],pos=0,revealed=false;
const $=id=>document.getElementById(id);
const clean=s=>s.toLowerCase().normalize('NFC').trim().replace(/\s+/g,' ');
function save(){try{localStorage.setItem(storage,JSON.stringify(marks))}catch(e){}}
function makeList(){const t=$('task').value,q=clean($('search').value);list=words.filter(w=>(t==='all'||(t==='review'?marks[w.id]==='review':w.task===t))&&(!q||clean([w.en,w.fr,w.zh,w.phrase].join(' ')).includes(q)));pos=Math.max(0,Math.min(pos,list.length-1));revealed=false;render()}
function render(){const w=list[pos];$('answer').value='';$('feedback').textContent='';$('status').textContent=list.length?('第 '+(pos+1)+' / '+list.length+' 词 · '+(marks[w.id]==='mastered'?'✅ 已熟练':marks[w.id]==='review'?'🟡 待复习':'未标记')):'没有符合筛选条件的词汇';$('bar').style.width=(list.length?((pos+1)/list.length)*100:0)+'%';$('taskLabel').textContent=w?(w.task==='T2'?'口语 Tâche 2 · 日常咨询':'口语 Tâche 3 · 观点论证'):'';$('word').textContent=w?(revealed?w.fr:w.en):'暂无词汇';$('meaning').textContent=w&&revealed?w.zh:'';$('example').textContent=w&&revealed?w.phrase:'';$('tapHint').textContent=w&&!revealed?'先尝试说出法语，再显示答案':'';$('flip').textContent=revealed?'隐藏法语答案':'显示法语答案';$('speak').disabled=!w;$('check').disabled=!w;$('review').disabled=!w;$('mastered').disabled=!w;$('prev').disabled=!w||pos===0;$('next').disabled=!w||pos===list.length-1;$('counts').textContent='词库：'+words.length+' 词 · 已熟练 '+words.filter(w=>marks[w.id]==='mastered').length+' · 待复习 '+words.filter(w=>marks[w.id]==='review').length+' · 未标记 '+words.filter(w=>!marks[w.id]).length}
$('task').addEventListener('change',()=>{pos=0;makeList()});$('search').addEventListener('input',()=>{pos=0;makeList()});
$('flip').onclick=()=>{revealed=!revealed;render()};
$('next').onclick=()=>{pos++;revealed=false;render()};
$('prev').onclick=()=>{pos--;revealed=false;render()};
$('shuffle').onclick=()=>{if(!list.length)return;pos=Math.floor(Math.random()*list.length);revealed=false;render()};
$('reset').onclick=()=>{$('task').value='all';$('search').value='';pos=0;makeList()};
function mark(v){if(!list.length)return;marks[list[pos].id]=v;save();if($('task').value==='review')makeList();else render()}
$('review').onclick=()=>mark('review');$('mastered').onclick=()=>mark('mastered');
$('check').onclick=()=>{if(!list.length)return;const w=list[pos],v=clean($('answer').value);$('feedback').textContent=!v?'请先输入法语答案。':v===clean(w.fr)?'✅ 拼写正确！':'还需复习。正确拼写：'+w.fr;revealed=true;const ans=$('answer').value;render();$('answer').value=ans;$('feedback').textContent=!v?'请先输入法语答案。':v===clean(w.fr)?'✅ 拼写正确！':'还需复习。正确拼写：'+w.fr};
$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')$('check').click()});
$('speak').onclick=()=>{if(!list.length)return;if(!('speechSynthesis' in window)){$('feedback').textContent='当前浏览器不支持法语朗读';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(list[pos].fr);u.lang='fr-FR';u.rate=.85;const voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('fr'));if(voices.length)u.voice=voices[0];speechSynthesis.speak(u)};
makeList();

<script>
// Batch mode intentionally reuses the existing word list, filters and mastery storage.
(()=>{
const get=id=>document.getElementById(id);
let batchPage=0;const typed={};const visible=new Set();const outcomes={};
const batchLength=()=>Number(get('batchSize').value);
const pages=()=>Math.max(1,Math.ceil(list.length/batchLength()));
const batchWords=()=>list.slice(batchPage*batchLength(),(batchPage+1)*batchLength());
function say(fr){if(!('speechSynthesis' in window)){get('batchSummary').textContent='当前浏览器不支持朗读';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(fr);u.lang='fr-FR';u.rate=.85;const voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('fr'));if(voices.length)u.voice=voices[0];speechSynthesis.speak(u)}
function addButton(label,fn){const b=document.createElement('button');b.type='button';b.className='smallbtn';b.textContent=label;b.addEventListener('click',fn);return b}
function redraw(){batchPage=Math.max(0,Math.min(batchPage,pages()-1));const ws=batchWords();const tbody=get('batchRows');tbody.replaceChildren();get('batchPosition').textContent=list.length?'第 '+(batchPage+1)+' / '+pages()+' 批 · 本批 '+ws.length+' 词':'没有符合筛选条件的单词';get('batchPrev').disabled=get('batchPrevBottom').disabled=batchPage===0;get('batchNext').disabled=get('batchNextBottom').disabled=batchPage>=pages()-1;
ws.forEach((w,i)=>{const tr=document.createElement('tr');if(outcomes[w.id]===true)tr.className='good';if(outcomes[w.id]===false)tr.className='bad';const first=document.createElement('td');first.dataset.label='英语提示';const ordinal=document.createElement('span');ordinal.className='meta';ordinal.textContent=String(batchPage*batchLength()+i+1)+' · '+(w.task==='T2'?'口语 T2':'口语 T3');const en=document.createElement('div');en.style.fontWeight='700';en.textContent=w.en;const zh=document.createElement('div');zh.className='meta';zh.textContent=w.zh;first.append(ordinal,en,zh);
const entry=document.createElement('td');entry.dataset.label='默写法语';const inp=document.createElement('input');inp.lang='fr';inp.autocomplete='off';inp.spellcheck=false;inp.setAttribute('aria-label',w.en+' 的法语拼写');inp.value=typed[w.id]||'';inp.addEventListener('input',()=>{typed[w.id]=inp.value;delete outcomes[w.id];tr.className='';feedback.textContent=''});const feedback=document.createElement('div');feedback.className='batchfeedback';if(outcomes[w.id]!==undefined)feedback.textContent=outcomes[w.id]?'✅ 正确':'❌ 请对照参考答案';entry.append(inp,feedback);
const answer=document.createElement('td');answer.dataset.label='法语答案 · 句块';answer.className='batchcell';const content=document.createElement('div');function drawAnswer(){content.replaceChildren();if(visible.has(w.id)){const fr=document.createElement('div');fr.className='batchanswer';fr.textContent=w.fr;const ph=document.createElement('div');ph.className='batchphrase';ph.textContent=w.phrase;content.append(fr,ph)}else{const hint=document.createElement('span');hint.className='meta';hint.textContent='答案已隐藏';content.append(hint)}}drawAnswer();answer.append(content);
const actions=document.createElement('td');actions.dataset.label='操作';const tools=document.createElement('div');tools.style.cssText='display:flex;gap:5px;flex-wrap:wrap';const reveal=addButton('👁 答案',()=>{visible.has(w.id)?visible.delete(w.id):visible.add(w.id);drawAnswer()});const speak=addButton('🔊',()=>say(w.fr));const review=addButton('🟡',()=>{marks[w.id]='review';save();review.title='已标记待复习';updateCount()});const mastered=addButton('✅',()=>{marks[w.id]='mastered';save();mastered.title='已标记熟练';updateCount()});tools.append(reveal,speak,review,mastered);actions.append(tools);tr.append(first,entry,answer,actions);tbody.append(tr)});updateCount()}
function updateCount(){const ws=batchWords();const right=ws.filter(w=>outcomes[w.id]===true).length;const wrong=ws.filter(w=>outcomes[w.id]===false).length;get('batchSummary').textContent='本批：'+ws.length+' 词 · 已答对 '+right+' · 答错 '+wrong+' · 已熟练 '+words.filter(w=>marks[w.id]==='mastered').length+' / '+words.length}
function changePage(delta){batchPage+=delta;redraw()}
get('singleMode').onclick=()=>{get('singlePanel').classList.remove('hidden');get('batchPanel').classList.add('hidden');get('singleMode').classList.add('active');get('batchMode').classList.remove('active');render()};
get('batchMode').onclick=()=>{get('singlePanel').classList.add('hidden');get('batchPanel').classList.remove('hidden');get('singleMode').classList.remove('active');get('batchMode').classList.add('active');redraw()};
get('batchSize').onchange=()=>{batchPage=0;redraw()};get('batchPrev').onclick=get('batchPrevBottom').onclick=()=>changePage(-1);get('batchNext').onclick=get('batchNextBottom').onclick=()=>changePage(1);
get('batchReveal').onclick=()=>{batchWords().forEach(w=>visible.add(w.id));redraw()};get('batchHide').onclick=()=>{batchWords().forEach(w=>visible.delete(w.id));redraw()};
get('batchCheck').onclick=()=>{batchWords().forEach(w=>{const val=clean(typed[w.id]||'');outcomes[w.id]=val!==''&&val===clean(w.fr);visible.add(w.id)});redraw()};
get('batchReviewWrong').onclick=()=>{let n=0;batchWords().forEach(w=>{if(outcomes[w.id]===false){marks[w.id]='review';n++}});save();redraw();get('batchSummary').textContent+=' · 本次标记 '+n+' 个错词为待复习'};
['task','search'].forEach(id=>get(id).addEventListener(id==='task'?'change':'input',()=>{batchPage=0;redraw()}));get('reset').addEventListener('click',()=>{batchPage=0;redraw()});redraw();
})();
</script>
