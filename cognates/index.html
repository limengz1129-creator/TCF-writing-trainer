<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCFCA 英法同源词 · 口语优先</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#20332f;background:#f7f9f8}*{box-sizing:border-box}body{margin:0}header{background:#eaf2ee;padding:25px max(20px,calc((100vw - 1040px)/2));border-bottom:1px solid #d4e1da}h1{margin:8px 0;font-size:clamp(24px,4vw,35px)}p{line-height:1.7}main{max-width:1040px;margin:24px auto;padding:0 18px}.sub{color:#516e62}a{color:#285d4b}button,input,select{font:inherit}button{border:1px solid #aac7b9;border-radius:10px;padding:10px 14px;background:white;color:#244d3e;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #62a88c;outline-offset:2px}button.active,.primary{background:#28634e;color:white;border-color:#28634e}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}.toolbar input,.toolbar select{padding:10px;border:1px solid #b9cfc3;border-radius:10px;background:white;min-width:170px}.panel{padding:22px;border:1px solid #d8e5de;background:white;border-radius:18px;box-shadow:0 4px 18px #173e2810}.meta{font-size:13px;color:#5c7567}.card{border:1px solid #d5e4da;background:#f9fcfa;border-radius:16px;min-height:220px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:12px}.big{font-size:clamp(28px,5vw,42px);font-weight:700;overflow-wrap:anywhere}.meaning{font-size:17px;color:#4b665b}.example{font-size:17px;line-height:1.6}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:17px 0}.progress{height:9px;background:#e5ece8;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:#4e9c7a}.practice{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}.practice input{flex:1;min-width:180px;border:1px solid #b8c9bf;border-radius:10px;padding:11px}.result{min-height:23px;margin-top:9px}.foot{margin:20px 0;color:#586e63;font-size:14px}small{line-height:1.5}@media(max-width:600px){.panel{padding:14px}.toolbar input,.toolbar select{width:100%}}
</style></head><body>
<header><a href="../">← 返回 TCFCA 练习主页</a><h1>英法同源词 · 口语优先</h1><p class="sub">仅服务 TCF Canada 口语 Tâche 2 / Tâche 3 和写作复用。英语提示 → 法语回忆 → 发音与句块 → 标记熟练度。</p></header>
<main><div class="toolbar"><select id="task" aria-label="练习分类"><option value="all">全部口语词汇</option><option value="T2">口语 Tâche 2</option><option value="T3">口语 Tâche 3</option><option value="review">只看待复习</option></select><input id="search" type="search" placeholder="搜索英 / 法 / 中文 / 句块"><button id="shuffle">🔀 随机抽词</button><button id="reset">清除筛选</button></div>
<section class="panel"><div class="meta" id="status" aria-live="polite"></div><div class="progress" aria-hidden="true"><div id="bar"></div></div>
<div class="card" id="card"><div class="meta" id="taskLabel"></div><div class="big" id="word"></div><div class="meaning" id="meaning"></div><div class="example" id="example"></div><small id="tapHint"></small></div>
<div class="actions"><button id="flip" class="primary">显示法语答案</button><button id="speak">🔊 法语朗读</button><button id="review">🟡 待复习</button><button id="mastered">✅ 已熟练</button></div>
<div class="practice"><input id="answer" type="text" lang="fr" autocomplete="off" placeholder="试着输入法语单词（含重音）"><button id="check">检查拼写</button></div><div class="result" id="feedback" role="status"></div>
<div class="actions"><button id="prev">← 上一个</button><button id="next" class="primary">下一个 →</button></div></section>
<p class="foot" id="counts"></p><p class="foot">首版为经过人工挑选的 50 个口语实用词，部分词汇与英语并非字母级规则变换，使用时以法语搭配为准。写作可复用，但不加入阅读／听力专项词汇。学习标记保存在当前浏览器；发音使用浏览器可用的法语语音，具体音色取决于设备。</p></main>
<script>
const words=[["considerably","considérablement","显著地","T3","améliorer considérablement la qualité de vie"],["particularly","particulièrement","尤其","T3","C'est particulièrement important pour les jeunes."],["progressively","progressivement","逐渐地","T3","s'adapter progressivement à un nouvel environnement"],["generally","généralement","通常","T2","Généralement, combien de temps dure l'activité ?"],["normally","normalement","通常、正常情况下","T2","Normalement, à quelle heure commence le cours ?"],["approximately","approximativement","大约","T2","Cela coûte approximativement combien ?"],["regularly","régulièrement","定期地","T2","Est-ce que vous organisez régulièrement ces activités ?"],["directly","directement","直接地","T2","Puis-je vous contacter directement ?"],["personally","personnellement","就个人而言","T3","Personnellement, je pense que cette mesure est utile."],["rapidly","rapidement","迅速地","T3","développer rapidement de nouvelles compétences"],["effectively","efficacement","有效地","T3","communiquer efficacement avec ses collègues"],["frequently","fréquemment","频繁地","T3","Les habitudes changent fréquemment."],["recently","récemment","最近","T2","Avez-vous récemment organisé une activité similaire ?"],["patiently","patiemment","耐心地","T2","Merci de m'avoir expliqué cela patiemment."],["completely","complètement","完全地","T3","changer complètement ses habitudes"],["sufficiently","suffisamment","足够地","T3","être suffisamment préparé pour un entretien"],["socially","socialement","在社会层面","T3","s'intégrer socialement dans un nouveau pays"],["culturally","culturellement","在文化层面","T3","s'enrichir culturellement"],["professionally","professionnellement","在职业方面","T3","évoluer professionnellement"],["financially","financièrement","在经济上","T3","être financièrement indépendant"],["responsibility","responsabilité","责任","T3","assumer ses responsabilités"],["diversity","diversité","多样性","T3","favoriser la diversité culturelle"],["equality","égalité","平等","T3","garantir l'égalité des chances"],["possibility","possibilité","可能性","T2","Y a-t-il une possibilité de reporter la réservation ?"],["flexibility","flexibilité","灵活性","T3","offrir davantage de flexibilité aux employés"],["stability","stabilité","稳定性","T3","assurer la stabilité professionnelle"],["priority","priorité","优先事项","T3","faire de l'éducation une priorité"],["quality","qualité","质量","T3","améliorer la qualité de vie"],["information","information","信息","T2","Pourriez-vous me donner plus d'informations ?"],["reservation","réservation","预订","T2","Comment puis-je confirmer ma réservation ?"],["confirmation","confirmation","确认","T2","Recevrai-je une confirmation par courriel ?"],["accessible","accessible","可获得的、容易使用的","T3","rendre l'éducation accessible à tous"],["flexible","flexible","灵活的","T2","Les horaires sont-ils flexibles ?"],["practical","pratique","实用的","T2","Est-ce une solution pratique pour les débutants ?"],["specific","spécifique","具体的、特定的","T2","Y a-t-il des conditions spécifiques ?"],["effective","efficace","有效的","T3","une méthode efficace pour apprendre"],["organize","organiser","组织","T2","Qui organise cet événement ?"],["optimize","optimiser","优化","T3","optimiser son temps de travail"],["modernize","moderniser","现代化","T3","moderniser les services publics"],["facilitate","faciliter","促进、使容易","T3","faciliter l'intégration des nouveaux arrivants"],["participate","participer","参加","T2","Comment puis-je participer à cette activité ?"],["compare","comparer","比较","T2","Puis-je comparer les deux formules ?"],["adapt","adapter","调整、适应","T3","adapter ses compétences au marché du travail"],["integrate","intégrer","融入、纳入","T3","intégrer de nouveaux employés"],["communication","communication","沟通","T3","améliorer la communication au travail"],["motivation","motivation","动力","T3","renforcer la motivation des étudiants"],["experience","expérience","经历、经验","T2","Faut-il avoir de l'expérience ?"],["condition","condition","条件","T2","Quelles sont les conditions d'inscription ?"],["available","disponible","可用的","T2","Est-ce que cette option est disponible ?"],["necessary","nécessaire","必要的","T2","Est-il nécessaire de réserver à l'avance ?"]].map(([en,fr,zh,task,phrase],i)=>({id:i,en,fr,zh,task,phrase}));
const storage='tcfca-cognates-v1';let marks={};try{marks=JSON.parse(localStorage.getItem(storage)||'{}')}catch(e){}let list=[],pos=0,revealed=false;
const $=id=>document.getElementById(id);
const clean=s=>s.toLowerCase().normalize('NFC').trim().replace(/\s+/g,' ');
function save(){try{localStorage.setItem(storage,JSON.stringify(marks))}catch(e){}}
function makeList(){const t=$('task').value,q=clean($('search').value);list=words.filter(w=>(t==='all'||(t==='review'?marks[w.id]==='review':w.task===t))&&(!q||clean([w.en,w.fr,w.zh,w.phrase].join(' ')).includes(q)));pos=Math.max(0,Math.min(pos,list.length-1));revealed=false;render()}
function render(){const w=list[pos];$('answer').value='';$('feedback').textContent='';$('status').textContent=list.length?('第 '+(pos+1)+' / '+list.length+' 词 · '+(marks[w.id]==='mastered'?'✅ 已熟练':marks[w.id]==='review'?'🟡 待复习':'未标记')):'没有符合筛选条件的词汇';$('bar').style.width=(list.length?((pos+1)/list.length)*100:0)+'%';$('taskLabel').textContent=w?(w.task==='T2'?'口语 Tâche 2 · 日常咨询':'口语 Tâche 3 · 观点论证'):'';$('word').textContent=w?(revealed?w.fr:w.en):'暂无词汇';$('meaning').textContent=w&&revealed?w.zh:'';$('example').textContent=w&&revealed?w.phrase:'';$('tapHint').textContent=w&&!revealed?'先尝试说出法语，再显示答案':'';$('flip').textContent=revealed?'隐藏法语答案':'显示法语答案';$('speak').disabled=!w;$('check').disabled=!w;$('review').disabled=!w;$('mastered').disabled=!w;$('prev').disabled=!w||pos===0;$('next').disabled=!w||pos===list.length-1;$('counts').textContent='词库：'+words.length+' 词 · 已熟练 '+words.filter(w=>marks[w.id]==='mastered').length+' · 待复习 '+words.filter(w=>marks[w.id]==='review').length+' · 未标记 '+words.filter(w=>!marks[w.id]).length}
$('task').addEventListener('change',()=>{pos=0;makeList()});$('search').addEventListener('input',()=>{pos=0;makeList()});
$('flip').onclick=()=>{revealed=!revealed;render()};
$('next').onclick=()=>{pos++;revealed=false;render()};
$('prev').onclick=()=>{pos--;revealed=false;render()};
$('shuffle').onclick=()=>{if(!list.length)return;pos=Math.floor(Math.random()*list.length);revealed=false;render()};
$('reset').onclick=()=>{$('task').value='all';$('search').value='';pos=0;makeList()};
function mark(v){if(!list.length)return;marks[list[pos].id]=v;save();if($('task').value==='review')makeList();else render()}
$('review').onclick=()=>mark('review');$('mastered').onclick=()=>mark('mastered');
$('check').onclick=()=>{if(!list.length)return;const w=list[pos],v=clean($('answer').value);$('feedback').textContent=!v?'请先输入法语答案。':v===clean(w.fr)?'✅ 拼写正确！':'还需复习。正确拼写：'+w.fr;revealed=true;const ans=$('answer').value;render();$('answer').value=ans;$('feedback').textContent=!v?'请先输入法语答案。':v===clean(w.fr)?'✅ 拼写正确！':'还需复习。正确拼写：'+w.fr};
$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')$('check').click()});
$('speak').onclick=()=>{if(!list.length)return;if(!('speechSynthesis' in window)){$('feedback').textContent='当前浏览器不支持法语朗读';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(list[pos].fr);u.lang='fr-FR';u.rate=.85;const voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('fr'));if(voices.length)u.voice=voices[0];speechSynthesis.speak(u)};
makeList();
</script></body></html>
