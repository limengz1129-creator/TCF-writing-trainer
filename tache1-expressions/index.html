uie, ce séjour m’a ressourcé.","source":"第37题 · 第605段","row":60},{"id":"1-61","module":1,"category":"条件与让步","fr":"Si + imparfait, conditionnel.","zh":"如果能……，就会……（假设／委婉请求）","example":"Si vous pouviez arriver à 9h30 pour décorer la salle, votre aide serait précieuse.","source":"第13题 · 第214段","row":61},{"id":"1-62","module":1,"category":"条件与让步","fr":"Si + présent, présent / futur / conditionnel de politesse.","zh":"如果……，就……（现实条件；此处条件式表达愿望）","example":"Si j’obtiens ce poste, j’aimerais que nous nous retrouvions pour célébrer cette bonne nouvelle !","source":"第38题 · 第623段","row":62},{"id":"1-63","module":1,"category":"目的与衔接","fr":"afin que + subjonctif","zh":"以便……（从句用虚拟式）","example":"Confirme-moi tes disponibilités afin que je réserve nos places avant qu’elles ne soient toutes prises.","source":"第01题 · 第22段","row":63},{"id":"1-64","module":1,"category":"目的与衔接","fr":"pour que + subjonctif","zh":"为了让……／以便……","example":"Pour que Thomas ne se doute de rien, arrivons à 17h30 et gardons le secret.","source":"第05题 · 第86段","row":64},{"id":"1-65","module":1,"category":"目的与衔接","fr":"afin de + infinitif","zh":"为了……（不定式表达目的）","example":"Bats les œufs avec la crème, puis fais-les cuire lentement à feu doux en remuant afin d’obtenir une texture onctueuse.","source":"第36题 · 第588段","row":65},{"id":"1-66","module":1,"category":"目的与衔接","fr":"pour éviter que + subjonctif","zh":"为了避免……","example":"Ensuite, écrase l’avocat avec un filet de jus de citron pour éviter qu’il ne noircisse.","source":"第36题 · 第588段","row":66},{"id":"1-67","module":1,"category":"目的与衔接","fr":"avant que + subjonctif (ne explétif possible)","zh":"在……之前（后接虚拟式；可出现赘词 ne，它不表示否定）","example":"Confirme-moi tes disponibilités afin que je réserve nos places avant qu’elles ne soient toutes prises.","source":"第01题 · 第22段","row":67},{"id":"1-68","module":1,"category":"目的与衔接","fr":"avant de + infinitif","zh":"在做……之前","example":"Après un déjeuner sur place, nous essaierons les activités aquatiques, avant de nous détendre dans les espaces verts.","source":"第17题 · 第278段","row":68},{"id":"1-69","module":1,"category":"目的与衔接","fr":"En + participe présent, ...","zh":"通过……／在……时（副动词）","example":"En vous inscrivant avant le 15 janvier sur le site de l’événement, vous bénéficierez d’une réduction de 10 %.","source":"第04题 · 第69段","row":69},{"id":"1-70","module":1,"category":"目的与衔接","fr":"tout en + participe présent","zh":"同时……（兼顾两个行为）","example":"Je recherche une personne respectueuse et ordonnée, appréciant le calme en semaine tout en aimant partager quelques moments conviviaux le week-end.","source":"第24题 · 第390段","row":70},{"id":"1-71","module":1,"category":"目的与衔接","fr":"tandis que + indicatif","zh":"而／与此同时……","example":"Les grandes fenêtres rendent le lieu agréable, tandis que le mobilier ergonomique améliore notre confort.","source":"第65题 · 第1076段","row":71},{"id":"1-72","module":1,"category":"目的与衔接","fr":"plutôt que de + infinitif","zh":"与其……，不如……","example":"Prenez le temps de rencontrer les habitants, plutôt que d’enchaîner les visites : c’est ainsi que votre voyage prendra son sens.","source":"第43题 · 第706段","row":72},{"id":"1-73","module":1,"category":"目的与衔接","fr":"plutôt que de + infinitif / plutôt qu’à + infinitif","zh":"而不是做……（保留前面动词所需的 de／à）","example":"Quant aux professeurs, ils sont compétents, disponibles et nous encouragent à discuter plutôt qu’à mémoriser les cours.","source":"第54题 · 第889段","row":73,"cores":["plutôt que de","plutôt qu’à"]},{"id":"1-74","module":1,"category":"目的与衔接","fr":"..., ce qui + verbe.","zh":"……，这使得／这……（指前面的整件事）","example":"L’ambiance est conviviale et mes collègues sont accueillants, ce qui facilite mon intégration.","source":"第50题 · 第822段","row":74},{"id":"1-75","module":1,"category":"目的与衔接","fr":"Outre + nom, ...","zh":"除了……之外，……","example":"Outre ses titres incontournables, Alex présentera des chansons inédites.","source":"第03题 · 第53段","row":75},{"id":"1-76","module":1,"category":"目的与衔接","fr":"compte tenu de + nom","zh":"考虑到……／鉴于……","example":"Le pass adulte ne coûte que 20 euros pour la semaine, un tarif particulièrement avantageux compte tenu de la diversité du programme.","source":"第01题 · 第21段","row":76},{"id":"1-77","module":1,"category":"目的与衔接","fr":"En échange, ...","zh":"作为交换，……","example":"En échange, je pourrais aider mon partenaire à apprendre le chinois, ma langue maternelle.","source":"第51题 · 第839段","row":77},{"id":"1-78","module":1,"category":"目的与衔接","fr":"Quant à + nom, ...","zh":"至于……，……","example":"Quant aux professeurs, ils sont compétents, disponibles et nous encouragent à discuter plutôt qu’à mémoriser les cours.","source":"第54题 · 第889段","row":78},{"id":"1-79","module":1,"category":"结尾与感谢","fr":"J’ai hâte de + infinitif.","zh":"我迫不及待想……","example":"J’ai hâte de t’y retrouver !","source":"第16题 · 第263段","row":79},{"id":"1-80","module":1,"category":"结尾与感谢","fr":"Je vous remercie par avance de votre aide.","zh":"提前感谢您的帮助","example":"Je vous remercie par avance de votre aide.","source":"第25题 · 第407段","row":80},{"id":"1-81","module":1,"category":"结尾与感谢","fr":"Je reste à votre disposition pour + infinitif.","zh":"我随时愿意……／如有需要，我可……","example":"Je reste à votre disposition pour intervenir et répondre aux questions des élèves.","source":"第55题 · 第908段","row":81},{"id":"1-82","module":1,"category":"结尾与感谢","fr":"Dans l’attente de votre réponse, ...","zh":"静候您的回复，……","example":"Dans l’attente de votre réponse, je vous remercie de votre assistance.","source":"第31题 · 第508段","row":82},{"id":"1-83","module":1,"category":"结尾与感谢","fr":"Vos suggestions sont les bienvenues !","zh":"欢迎提出建议！","example":"Vos suggestions sont également les bienvenues !","source":"第56题 · 第925段","row":83},{"id":"1-84","module":1,"category":"结尾与感谢","fr":"Je te revaudrai cela à mon retour !","zh":"我回来后会回报你的帮助！","example":"Merci encore pour ton aide précieuse, je te revaudrai cela à mon retour !","source":"第68题 · 第1129段","row":84},{"id":"1-85","module":1,"category":"结尾与感谢","fr":"Cordialement,","zh":"此致／谨致问候（正式结尾）","example":"Cordialement,","source":"第25题 · 第408段","row":85},{"id":"1-86","module":1,"category":"结尾与感谢","fr":"Bises,","zh":"亲亲／祝好（亲友间结尾）","example":"Bises,","source":"第01题 · 第23段","row":86},{"id":"2-2","module":2,"category":"动词＋介词＋名词","fr":"assister à quelque chose","zh":"参加／观看某项活动或演出","example":"Nous pourrons également assister à des spectacles de danse et déguster des spécialités culinaires.","source":"第01题 · 第21段","row":2},{"id":"2-3","module":2,"category":"动词＋介词＋名词","fr":"participer à quelque chose","zh":"参加某事","example":"Nous nous promènerons le long du lac pour admirer les paysages, puis nous participerons à une découverte des champignons avec un guide.","source":"第09题 · 第149段","row":3},{"id":"2-4","module":2,"category":"动词＋介词＋名词","fr":"bénéficier de quelque chose","zh":"享受／受益于某事","example":"Le billet coûte 20 euros par adulte ; une réservation anticipée en ligne permet toutefois de bénéficier d’une réduction de 10 %.","source":"第03题 · 第53段","row":4},{"id":"2-5","module":2,"category":"动词＋介词＋名词","fr":"profiter de quelque chose","zh":"享受／利用某事","example":"Véritable vitrine culturelle de notre ville, le musée propose aussi un atelier interactif dont nous pourrons profiter.","source":"第10题 · 第165段","row":5},{"id":"2-6","module":2,"category":"动词＋介词＋名词","fr":"disposer de quelque chose","zh":"拥有可使用的某物","example":"Pour découvrir notre ville, tu disposeras de plusieurs moyens de transport particulièrement pratiques.","source":"第19题 · 第309段","row":6},{"id":"2-7","module":2,"category":"动词＋介词＋名词","fr":"prendre connaissance de quelque chose","zh":"获知／查看某事","example":"J’ai pris connaissance de votre annonce et je possède un vélo qui pourrait répondre à votre recherche.","source":"第28题 · 第455段","row":7},{"id":"2-8","module":2,"category":"动词＋介词＋名词","fr":"répondre à quelque chose","zh":"满足某种需求／回应某事","example":"J’ai pris connaissance de votre annonce et je possède un vélo qui pourrait répondre à votre recherche.","source":"第28题 · 第455段","row":8},{"id":"2-9","module":2,"category":"动词＋介词＋名词","fr":"se charger de quelque chose","zh":"负责某事","example":"Une participation de 5 euros suffirait ; je me chargerai de l’achat.","source":"第05题 · 第85段","row":9},{"id":"2-10","module":2,"category":"动词＋介词＋名词","fr":"s’occuper de quelque chose","zh":"负责／处理某事","example":"Thomas s’occuperait des décorations, tandis qu’Anna préparerait la playlist.","source":"第07题 · 第118段","row":10},{"id":"2-11","module":2,"category":"动词＋介词＋名词","fr":"convenir de quelque chose","zh":"就某事达成一致／商定某事","example":"Je reste disponible pour convenir d’un rendez-vous et visiter les logements retenus selon vos disponibilités.","source":"第25题 · 第407段","row":11},{"id":"2-12","module":2,"category":"动词＋介词＋名词","fr":"procéder à quelque chose","zh":"着手办理某事","example":"Si ce modèle n’est plus disponible, je vous remercie de procéder au remboursement intégral.","source":"第31题 · 第507段","row":12},{"id":"2-13","module":2,"category":"动词＋介词＋名词","fr":"correspondre à quelque chose","zh":"符合／对应某事","example":"Le loyer est de 1000 euros par mois, charges comprises, ce qui correspond à mon budget.","source":"第67题 · 第1110段","row":13},{"id":"2-14","module":2,"category":"动词＋介词＋名词","fr":"contribuer à quelque chose","zh":"为某事出力／出资","example":"J’ai créé une cagnotte en ligne ; vous pourrez y contribuer avant le 20 novembre.","source":"第30题 · 第490段","row":14},{"id":"2-15","module":2,"category":"动词＋介词＋名词","fr":"donner sur quelque chose","zh":"朝向／面向某处","example":"Les fenêtres donnent sur une cour calme, ce qui permet de profiter d’un environnement agréable malgré le dynamisme du quartier.","source":"第26题 · 第422段","row":15},{"id":"2-16","module":2,"category":"动词＋介词＋名词","fr":"être associé à quelque chose","zh":"与某事相联系","example":"Les maisons sont décorées de rouge, couleur associée à la chance et à la prospérité.","source":"第41题 · 第671段","row":16},{"id":"2-17","module":2,"category":"动词＋介词＋名词","fr":"témoigner de quelque chose","zh":"体现／证明某事","example":"À Xi’an, l’armée de terre cuite témoigne d’un patrimoine exceptionnel.","source":"第42题 · 第687段","row":17} function differenceAlignment(input,target){
 const a=Array.from(input),b=Array.from(target);
 const dp=Array.from({length:a.length+1},()=>new Uint16Array(b.length+1));
 for(let i=0;i<=a.length;i++)dp[i][0]=i;
 for(let j=0;j<=b.length;j++)dp[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
 const wrong=new Set(),missing=new Set();let i=a.length,j=b.length;
 while(i||j){
  if(i&&j&&a[i-1]===b[j-1]&&dp[i][j]===dp[i-1][j-1]){i--;j--;}
  else if(i&&j&&dp[i][j]===dp[i-1][j-1]+1){wrong.add(--i);missing.add(--j);}
  else if(j&&dp[i][j]===dp[i][j-1]+1){missing.add(--j);}
  else{wrong.add(--i);}
 }
 function runs(chars,set){const out=[];for(let k=0;k<chars.length;k++){const marked=set.has(k);if(out.length&&out[out.length-1].marked===marked)out[out.length-1].text+=chars[k];else out.push({text:chars[k],marked});}return out;}
 return {distance:dp[a.length][b.length],input:input,target:target,inputRuns:runs(a,wrong),targetRuns:runs(b,missing)};
}
function answerDifference(input,item){
 if(grade(input,item).ok)return null;
 const candidates=[];
 for(const member of [item]){
  const matcher={norm,stripSlots,normalizeSlots,variants};
  const normalized=matcher.norm(input);
  if(item.module!==0){
   let core=matcher.norm(matcher.stripSlots(input.replace(/\([^)]*\)/g,'')));
   core=core.replace(/\b(?:de|à|pour) faire(?= |$)/g,m=>m.replace(/ faire$/,''));
   for(const target of matcher.variants(member))candidates.push({input:core,target,core:true});
  }
  const slotForm=s=>matcher.norm(matcher.normalizeSlots(s)).replace(/__slot__/g,'[占位词]');
  for(const target of [member.fr,...(member.acceptedFr||[])])candidates.push({input:slotForm(input),target:slotForm(target),core:false});
 }
 let best=null;
 for(const candidate of candidates){
  // Keep visual comparison bounded for accidentally pasted paragraphs.
  const bounded=candidate.input.slice(0,500);
  const diff=differenceAlignment(bounded,candidate.target);
  if(!best||diff.distance<best.distance)best={...diff,core:candidate.core,truncated:candidate.input.length>500};
 }
 return best;
}

function appendDifferenceRuns(node,runs,className){

}
