function norm(s){return s.normalize('NFC').toLowerCase().replace(/[’‘`]/g,"'").replace(/œ/g,'oe').replace(/[.,!?;:…()]/g,' ').replace(/\s+/g,' ').trim()}
// Normalize only placeholder alternatives; grammatical "ou" remains significant.
function normalizeSlots(s){
 const slot=String.raw`(?:\bquelque\s+chose\b|\bquelqu['’]un\b|\b(?:qqch|qch|qqn|qn|qcn)\b)`;
 return s.replace(new RegExp(slot+String.raw`(?:\s*(?:ou|\/)\s*`+slot+')*','gi'),'__slot__');
}
function stripSlots(s){return normalizeSlots(s).replace(/__slot__/g,' ').replace(/\b(?:infinitif|subjonctif|indicatif|nom|prénom|activité|verbe|adjectif|proposition|lieu)\b/gi,' ').replace(/\+/g,' ').replace(/\s+/g,' ').trim()}
function variants(item){
 if(item.cores)return item.cores.map(norm);
 if(item.module===0)return [norm(item.fr)];
 let s=item.fr;
 const overrides={
  '… tout en + participe présent':['tout en','tout en participe présent'],
  'Après avoir + participe passé, …':['après avoir','après avoir participe passé'],
  'quel que soit / quelle que soit + nom':['quel que soit','quelle que soit'],
  'après avoir + participe passé':['après avoir','après avoir participe passé'],
  'Ayant + participe passé, ...':['ayant','ayant participe passé'],
  'Récemment, j’ai + participe passé ...':['récemment j’ai','récemment j’ai participe passé'],
  'Dès + jour / moment, ...':['dès'],
  'Après avoir + participe passé, ...':['après avoir','après avoir participe passé'],
  'À votre place, je + conditionnel.':['à votre place je','à votre place je conditionnel'],
  'Si + présent, conditionnel de politesse.':['si','si présent conditionnel de politesse'],
  'plutôt que de / à + infinitif, selon le verbe':['plutôt que de','plutôt que à'],
  'Je voudrais aussi savoir comment / si ...':['je voudrais aussi savoir comment','je voudrais aussi savoir si'],
  'prendre soin de quelqu’un / quelque chose':['prendre soin de'],
  'constater que / combien + indicatif':['constater que','constater combien'],
  'Dans le cadre de + nom, je recherche ...':['dans le cadre de je recherche'],
  'En tant que + nom, je souhaite ...':['en tant que je souhaite'],
  'Si + imparfait, conditionnel.':['si','si imparfait conditionnel'],
  'Si + présent, présent / futur / conditionnel de politesse.':['si','si présent présent','si présent futur','si présent conditionnel de politesse'],
  'En + participe présent, ...':['en','en participe présent'],
  'tout en + participe présent':['tout en','tout en participe présent'],
  'avant que + subjonctif (ne explétif possible)':['avant que'],
  'Le loyer ... est de ... par mois, charges comprises.':['le loyer est de par mois charges comprises'],
  'Situé(e) ... et bien desservi(e) par ..., ...':['situé et bien desservi par','située et bien desservie par'],
  'Situé(e) en plein centre-ville, ...':['situé en plein centre-ville','située en plein centre-ville'],
  'plutôt que de / à + infinitif (selon le verbe)':['plutôt que de','plutôt que à'],
  's’installer à / dans un lieu':['s’installer à','s’installer dans'],
  'se retrouver à un lieu / à une heure':['se retrouver à'],
  'être ravi de faire / d’avoir fait quelque chose':['être ravi de','être ravi d’avoir fait'],
  'remercier quelqu’un de faire / d’avoir fait quelque chose':['remercier de','remercier d’avoir fait'],
  's’inscrire sur un site':['s’inscrire sur'],
  's’inscrire dans une salle de sport':['s’inscrire dans'],
  's’intégrer à un milieu':['s’intégrer à'],
  'se détendre dans un lieu':['se détendre dans'],
  'être disponible dès que + futur simple':['être disponible dès que'],
  'Je t’invite à / au + activité.':['je t’invite à','je t’invite au'],
 };
 if(overrides[s])return overrides[s].map(norm);
 s=s.replace(/\([^)]*\)/g,'').replace(/de faire quelque chose/g,'de').replace(/à faire quelque chose/g,'à').replace(/pour faire quelque chose/g,'pour').replace(/faire quelque chose/g,'').replace(/un lieu|une heure/g,'');
 return [norm(stripSlots(s).replace(/\s*\/\s*/g,' ').replace(/\.{2,}/g,' '))];
}
function grade(input,item){
 const raw=norm(input);let cores=variants(item);
 if(item.module===0)return {ok:[item.fr,...(item.acceptedFr||[])].some(s=>norm(normalizeSlots(input))===norm(normalizeSlots(s))),cores};
 // Slot words may be omitted or abbreviated. Concrete content words are not guessed.
 let answer=norm(stripSlots(input.replace(/\([^)]*\)/g,'')));
 answer=answer.replace(/\b(?:de|à|pour) faire(?= |$)/g,m=>m.replace(/ faire$/,''));
 const exact=norm(item.fr);
 // Full source notation is valid, including tense labels and all placeholders.
 let ok=norm(normalizeSlots(input))===norm(normalizeSlots(item.fr))||raw===exact||cores.includes(answer)||cores.includes(raw);
 return {ok,cores};
}
if(typeof module!=='undefined')module.exports={norm,variants,grade};

function differenceAlignment(input,target){
 const a=Array.from(input),b=Array.from(target);
 const dp=Array.from({length:a.length+1},()=>new Uint16Array(b.length+1));
 for(let i=0;i<=a.length;i++)dp[i][0]=i;
 for(let j=0;j<=b.length;j++)dp[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
 const wrong=new Set(),missing=new Set();let i=a.length,j=b.length;
 while(i||j){
  if(i&&j&&a[i-1]===b[j-1]&&dp[i][j]===dp[i-1][j-1]){i--;j--;}
  else if(i&&j&&dp[i][j]===dp[i-1][j-1]+1){wrong.add(--i);missing.add(--j);}
  else if(j&&dp[i][j]===dp[i][j-1]+1){missing.add(--j);}
  else{wrong.add(--i);}
 }
 function runs(chars,set){const out=[];for(let k=0;k<chars.length;k++){const marked=set.has(k);if(out.length&&out[out.length-1].marked===marked)out[out.length-1].text+=chars[k];else out.push({text:chars[k],marked});}return out;}
 return {distance:dp[a.length][b.length],input:input,target:target,inputRuns:runs(a,wrong),targetRuns:runs(b,missing)};
}
function answerDifference(input,item){
 if(grade(input,item).ok)return null;
 const candidates=[];
 for(const member of [item]){
  const matcher={norm,stripSlots,normalizeSlots,variants};
  const normalized=matcher.norm(input);
  if(item.module!==0){
   let core=matcher.norm(matcher.stripSlots(input.replace(/\([^)]*\)/g,'')));
   core=core.replace(/\b(?:de|à|pour) faire(?= |$)/g,m=>m.replace(/ faire$/,''));
   for(const target of matcher.variants(member))candidates.push({input:core,target,core:true});
  }
  const slotForm=s=>matcher.norm(matcher.normalizeSlots(s)).replace(/__slot__/g,'[占位词]');
  for(const target of [member.fr,...(member.acceptedFr||[])])candidates.push({input:slotForm(input),target:slotForm(target),core:false});
 }
 let best=null;
 for(const candidate of candidates){
  // Keep visual comparison bounded for accidentally pasted paragraphs.
  const bounded=candidate.input.slice(0,500);
  const diff=differenceAlignment(bounded,candidate.target);
  if(!best||diff.distance<best.distance)best={...diff,core:candidate.core,truncated:candidate.input.length>500};
 }
 return best;
}

function appendDifferenceRuns(node,runs,className){
 for(const run of runs){if(run.marked){const mark=document.createElement('mark');mark.className=className;mark.textContent=run.text;node.append(mark);}else node.append(document.createTextNode(run.text));}
}
function renderAnswerDifference(container,input,item){
 const diff=answerDifference(input,item);if(!diff)return;
 const view=document.createElement('div');view.className='answer-difference';
 const legend=document.createElement('p');legend.className='diff-legend';legend.textContent='红色：写错或多写　绿色：正确写法／需要补上的部分';
 const grid=document.createElement('div');grid.className='diff-grid';
 for(const [label,runs,cls] of [[diff.core?'你的答案（核心部分）':'你的答案',diff.inputRuns,'diff-wrong'],[diff.core?'正确核心表达':'正确表达',diff.targetRuns,'diff-required']]){
  const section=document.createElement('div'),head=document.createElement('strong'),line=document.createElement('div');head.textContent=label;line.className='diff-line';appendDifferenceRuns(line,runs,cls);if(!runs.length){const empty=document.createElement('span');empty.className='note';empty.textContent='（未写出核心表达）';line.append(empty);}section.append(head,line);grid.append(section);
 }
 const note=document.createElement('p');note.className='note';note.textContent='按原审核规则忽略大小写、标点和允许的占位词写法，保留重音。'+(diff.truncated?'此处显示前 500 个字符。':'');
 view.append(legend,grid,note);container.append(view);
}


const KEY='TCF-EE-T3-EXPRESSIONS-v1',names=['动词搭配','固定句型','动词固定用法'];const $=id=>document.getElementById(id);let state={version:1,records:{},module:0,current:null},mode=0,current=null,order=null;
try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.version===1&&x.records)state=x}catch(e){}
function persist(){state.module=mode;state.current=current?.id;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){$('toast').textContent='浏览器未能保存进度，请用导出进度备份。'}}
function rec(id=current?.id){return state.records[id]||(state.records[id]={draft:'',attempts:0,correct:0,wrong:0,last:null,error:null})}
function saveDraft(){if(current){rec().draft=$('answer').value;persist()}}
function filtered(){let rs=DATA.filter(x=>x.module===mode&&(!$('category').value||x.category===$('category').value)&&x.zh.includes($('search').value.trim()));const f=$('status').value;if(f)rs=rs.filter(x=>{const r=state.records[x.id];return f==='new'?!r?.attempts:f==='wrong'?r?.error&&!r.error.resolved:r?.last===true});if(order)rs.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));return rs}
function stats(){const rs=mode==='errors'?DATA.filter(x=>state.records[x.id]?.error):filtered();$('total').textContent=rs.length;$('done').textContent=rs.filter(x=>state.records[x.id]?.attempts).length;$('pending').textContent=rs.filter(x=>state.records[x.id]?.error&&!state.records[x.id].error.resolved).length;$('errCount').textContent=Object.values(state.records).filter(r=>r.error&&!r.error.resolved).length}
function list(){const rs=filtered();$('list').replaceChildren();$('listCount').textContent=`${rs.length} 条表达`;for(const x of rs){const b=document.createElement('button');b.className='item'+(current?.id===x.id?' active':'');b.textContent=x.zh;const s=document.createElement('small');const r=state.records[x.id];s.textContent=x.category+(r?.error&&!r.error.resolved?' · 待复习':r?.last?' · 已答对':'');b.append(s);b.onclick=()=>show(x);$('list').append(b)}stats()}
function show(x){saveDraft();current=x;$('practice').classList.toggle('hidden',!x);if(!x){$('toast').textContent='这个筛选下暂无表达。';list();return}$('toast').textContent='';$('prompt').textContent=x.zh;$('position').textContent=`${x.category} · Excel 第 ${x.row} 行 · ${filtered().findIndex(t=>t.id===x.id)+1} / ${filtered().length}`;$('answer').value=rec().draft;$('feedback').classList.add('hidden');$('reference').classList.add('hidden');$('reveal').textContent='显示答案';$('moduleTitle').textContent=names[x.module];$('rule').textContent=x.module===0?'核对完整搭配；忽略大小写、末尾标点和多余空格，保留重音。':'只核对核心表达。占位词可省略，quelque chose / qqch / qch、quelqu’un / qqn / qn 均可；qqch ou qqn、qch ou qn 也可。核心词、时态、介词和重音须正确。';list();persist()}
function setModule(m){saveDraft();mode=m;order=null;document.querySelectorAll('[data-module]').forEach(b=>{const active=b.dataset.module===String(m);b.classList.toggle('active',active);b.setAttribute('aria-pressed',active)});$('category').replaceChildren(new Option('全部分类',''));$('category').disabled=m==='errors';$('status').disabled=m==='errors';$('search').disabled=m==='errors';$('random').disabled=m==='errors';$('shuffle').disabled=m==='errors';$('errorsView').classList.toggle('hidden',m!=='errors');$('practice').classList.toggle('hidden',m==='errors');if(m==='errors'){current=null;$('list').replaceChildren();$('listCount').textContent='错题按来源模块筛选';errors();stats();persist();return}for(const c of [...new Set(DATA.filter(x=>x.module===m).map(x=>x.category))])$('category').add(new Option(c,c));show(DATA.find(x=>x.id===state.current&&x.module===m)||filtered()[0]||null)}
function check(){if(!current)return;const input=$('answer').value.trim();if(!input){$('toast').textContent='请先写出法语再检查。';return}saveDraft();const result=grade(input,current),r=rec();r.attempts++;r.last=result.ok;r[result.ok?'correct':'wrong']++;if(!result.ok){r.error={...(r.error||{}),answer:input,count:(r.error?.count||0)+1,resolved:false,date:new Date().toISOString()}}else if(r.error)r.error.resolved=true;$('feedback').className='feedback '+(result.ok?'ok':'bad');$('feedback').textContent=result.ok?'✓ 正确'+(current.module===0?'，完整搭配已核对。':'，核心表达已核对。'):'还差一点。\n你的答案：'+input+'\n正确表达：'+current.fr+'\n需要保留的核心：'+result.cores.join(' 或 ')+'\n已加入错题本。';if(!result.ok)renderAnswerDifference($('feedback'),input,current);window.TCF_CONJUGATIONS?.render($('feedback'),current.fr);window.TCF_NOUNS?.render($('feedback'),current.fr);persist();list()}
function errors(){const items=DATA.filter(x=>state.records[x.id]?.error&&($('showResolved').checked||!state.records[x.id].error.resolved)&&(!$('errModule').value||x.module===Number($('errModule').value)));$('errorList').replaceChildren();if(!items.length){const p=document.createElement('p');p.className='muted';p.textContent='当前没有符合条件的错题。';$('errorList').append(p)}for(const x of items){const e=state.records[x.id].error,b=document.createElement('div');b.className='errorItem';const head=document.createElement('small');head.textContent=names[x.module]+' · '+x.category+' · 错 '+e.count+' 次'+(e.resolved?' · 已订正':' · 待复习');const title=document.createElement('p');title.textContent=x.zh;const detail=document.createElement('details'),summary=document.createElement('summary');summary.textContent='查看错误与正确表达';const text=document.createElement('p');text.textContent='错误：'+e.answer+'；正确：'+x.fr;detail.append(summary,text);window.TCF_NOUNS?.render(detail,x.fr);renderAnswerDifference(detail,e.answer,x);const btn=document.createElement('button');btn.textContent='重新练习';btn.onclick=()=>{setModule(x.module);$('status').value='';$('search').value='';$('category').value=x.category;show(x);$('answer').value='';rec().draft='';persist();$('answer').focus()};b.append(head,title,detail,btn);$('errorList').append(b)}}
document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>setModule(b.dataset.module==='errors'?'errors':Number(b.dataset.module)));for(const id of ['category','status','search'])$(id).addEventListener(id==='search'?'input':'change',()=>show(filtered()[0]||null));$('answer').oninput=saveDraft;$('answer').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();check()}};$('check').onclick=check;window.TCF_GRAMMAR_TARGET=()=>current?({fr:current.fr,zh:current.zh,usage:current.usage||''}):null;$('reveal').onclick=()=>{if(!current)return;const hidden=$('reference').classList.contains('hidden');$('reference').textContent='法语表达：'+current.fr+'\n核心核对：'+variants(current).join(' 或 ')+(current.usage?'\n用法提示：'+current.usage:'')+'\n\n原文例句：'+current.example+'\n出处：'+current.source;window.TCF_NOUNS?.render($('reference'),[current.fr,current.example].filter(Boolean).join('\n\n'));$('reference').classList.toggle('hidden',!hidden);$('reveal').textContent=hidden?'隐藏答案':'显示答案'};$('clear').onclick=()=>{$('answer').value='';saveDraft();$('feedback').classList.add('hidden')};function move(d){const rs=filtered(),n=rs.findIndex(x=>x.id===current?.id)+d;if(n>=0&&n<rs.length)show(rs[n]);else $('toast').textContent='已到当前列表边界。'}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('random').onclick=()=>{const rs=filtered();if(rs.length)show(rs[Math.floor(Math.random()*rs.length)])};$('shuffle').onclick=()=>{order=filtered().map(x=>x.id);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}show(filtered()[0]||null)};$('errModule').onchange=errors;$('showResolved').onchange=errors;
$('export').onclick=()=>{saveDraft();const u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='EE-Tache3-表达默写进度.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const x=JSON.parse(await f.text());if(x.version!==1||!x.records||typeof x.records!=='object'||Array.isArray(x.records))throw Error('请选择本网页导出的进度文件。');for(const [id,r] of Object.entries(x.records)){if(!DATA.some(t=>t.id===id)||!r||typeof r.draft!=='string'||!['attempts','correct','wrong'].every(k=>Number.isInteger(r[k])&&r[k]>=0)||(r.error&&(typeof r.error.answer!=='string'||typeof r.error.resolved!=='boolean'||!Number.isInteger(r.error.count))))throw Error('进度文件内容不正确。')}state.records={...state.records,...x.records};persist();mode==='errors'?errors():show(current);$('toast').textContent='进度已导入。'}catch(err){$('toast').textContent=err.message}e.target.value=''};
window.TRAINER_TEST={DATA,grade,variants,answerDifference,state};setModule([0,1,2,'errors'].includes(state.module)?state.module:0);
