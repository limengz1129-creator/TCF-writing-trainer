<script>const DATA=[{"id":"0-2","module":0,"category":"教育、家庭与儿童成长","fr":"développer son sens des responsabilités","zh":"培养责任感","example":"Certains considèrent qu’une discipline stricte est nécessaire pour développer leur sens des responsabilités, tandis que d’autres estiment qu’une approche plus bienveillante et coopérative favorise davantage leur épanouissement.","source":"第01篇 · Word第6段","row":2},{"id":"0-3","module":0,"category":"教育、家庭与儿童成长","fr":"fixer des limites","zh":"设定界限","example":"Les parents doivent donc fixer certaines limites et leur apprendre à respecter des règles.","source":"第01篇 · Word第7段","row":3},{"id":"0-4","module":0,"category":"教育、家庭与儿童成长","fr":"respecter des règles","zh":"遵守规则","example":"Les parents doivent donc fixer certaines limites et leur apprendre à respecter des règles.","source":"第01篇 · Word第7段","row":4},{"id":"0-5","module":0,"category":"教育、家庭与儿童成长","fr":"développer son autonomie","zh":"培养自主能力","example":"D’autre part, une autorité excessive peut empêcher les enfants de développer leur autonomie et leur indépendance.","source":"第01篇 · Word第8段","row":5},{"id":"0-6","module":0,"category":"教育、家庭与儿童成长","fr":"prendre des décisions à la place de quelqu’un","zh":"代替某人作决定","example":"Si les parents prennent toutes les décisions à leur place et interviennent constamment dans leur vie quotidienne, les enfants risquent de devenir trop dépendants.","source":"第01篇 · Word第8段","row":6},{"id":"0-7","module":0,"category":"教育、家庭与儿童成长","fr":"entrer en conflit avec ses parents","zh":"与父母发生冲突","example":"Face à des règles trop strictes, certains adolescents peuvent également devenir rebelles et entrer en conflit avec leurs parents.","source":"第01篇 · Word第8段","row":7},{"id":"0-8","module":0,"category":"教育、家庭与儿童成长","fr":"trouver un équilibre entre l’encadrement et la liberté","zh":"在管教与自由之间找到平衡","example":"Parallèlement, il faudrait que les parents trouvent un équilibre entre l’encadrement et la liberté, afin d’aider leurs enfants à devenir progressivement autonomes et responsables.","source":"第01篇 · Word第9段","row":8},{"id":"0-9","module":0,"category":"教育、家庭与儿童成长","fr":"s’occuper d’un animal","zh":"照料动物","example":"Lorsqu’il s’occupe d’un chien ou d’un chat, par exemple, il doit lui donner à manger et à boire, le promener et veiller régulièrement à son bien-être.","source":"第02篇 · Word第12段","row":9},{"id":"0-10","module":0,"category":"教育、家庭与儿童成长","fr":"veiller au bien-être d’un animal","zh":"关注并保障动物的身心状态","example":"Lorsqu’il s’occupe d’un chien ou d’un chat, par exemple, il doit lui donner à manger et à boire, le promener et veiller régulièrement à son bien-être.","source":"第02篇 · Word第12段","row":10},{"id":"0-11","module":0,"category":"教育、家庭与儿童成长","fr":"prendre soin d’un autre être vivant","zh":"照顾另一个生命","example":"Cette expérience peut donc lui apprendre à prendre soin d’un autre être vivant et à assumer progressivement ses responsabilités au quotidien.","source":"第02篇 · Word第12段","row":11},{"id":"0-12","module":0,"category":"教育、家庭与儿童成长","fr":"assumer ses responsabilités","zh":"承担自己的责任","example":"Cette expérience peut donc lui apprendre à prendre soin d’un autre être vivant et à assumer progressivement ses responsabilités au quotidien.","source":"第02篇 · Word第12段","row":12},{"id":"0-13","module":0,"category":"教育、家庭与儿童成长","fr":"provoquer des allergies","zh":"引发过敏","example":"De plus, les chats et les chiens perdent souvent leurs poils, ce qui peut provoquer des allergies chez certains enfants.","source":"第02篇 · Word第13段","row":13},{"id":"0-14","module":0,"category":"教育、家庭与儿童成长","fr":"nuire à la santé","zh":"损害健康","example":"Dans ce cas, la présence d’un animal à la maison peut devenir problématique et même nuire à leur santé.","source":"第02篇 · Word第13段","row":14},{"id":"0-15","module":0,"category":"教育、家庭与儿童成长","fr":"organiser son temps","zh":"安排自己的时间","example":"D’une part, les devoirs peuvent aider les élèves à mieux organiser leur temps et à développer leur autodiscipline.","source":"第03篇 · Word第17段","row":15},{"id":"0-16","module":0,"category":"教育、家庭与儿童成长","fr":"développer son autodiscipline","zh":"培养自律能力","example":"D’une part, les devoirs peuvent aider les élèves à mieux organiser leur temps et à développer leur autodiscipline.","source":"第03篇 · Word第17段","row":16},{"id":"0-17","module":0,"category":"教育、家庭与儿童成长","fr":"rendre un devoir","zh":"交作业","example":"Lorsqu’un enfant sait qu’il doit rendre un devoir le lendemain, il est obligé de planifier son travail, de réviser plus régulièrement et de respecter ses échéances.","source":"第03篇 · Word第17段","row":17},{"id":"0-18","module":0,"category":"教育、家庭与儿童成长","fr":"respecter ses échéances","zh":"按时完成任务","example":"Lorsqu’un enfant sait qu’il doit rendre un devoir le lendemain, il est obligé de planifier son travail, de réviser plus régulièrement et de respecter ses échéances.","source":"第03篇 · Word第17段","row":18},{"id":"0-19","module":0,"category":"教育、家庭与儿童成长","fr":"prendre ses études au sérieux","zh":"认真对待学业","example":"Cette habitude peut donc l’aider à prendre ses études plus au sérieux et à devenir progressivement plus autonome.","source":"第03篇 · Word第17段","row":19},{"id":"0-20","module":0,"category":"教育、家庭与儿童成长","fr":"être exposé à des contenus violents","zh":"接触暴力内容","example":"Ils peuvent facilement être exposés à des contenus violents ou destinés aux adultes.","source":"第04篇 · Word第22段","row":20},{"id":"0-21","module":0,"category":"教育、家庭与儿童成长","fr":"avoir accès à des contenus","zh":"能够接触到内容","example":"Les parents doivent donc fixer certaines limites et superviser les contenus auxquels leurs enfants ont accès.","source":"第04篇 · Word第22段","row":21},{"id":"0-22","module":0,"category":"教育、家庭与儿童成长","fr":"produire l’effet inverse de celui recherché","zh":"产生与预期相反的效果","example":"Une surveillance trop stricte risque donc de produire l’effet inverse de celui recherché.","source":"第04篇 · Word第23段","row":22},{"id":"0-23","module":0,"category":"教育、家庭与儿童成长","fr":"utiliser Internet de manière responsable","zh":"负责任地使用互联网","example":"Parallèlement, il faudrait que les parents trouvent un équilibre entre la supervision et le dialogue afin d’aider leurs enfants à utiliser Internet de manière responsable.","source":"第04篇 · Word第24段","row":23},{"id":"0-24","module":0,"category":"教育、家庭与儿童成长","fr":"influencer la confiance en soi","zh":"影响自信心","example":"D’une part, les vêtements peuvent influencer la confiance en soi et la manière dont les autres nous perçoivent.","source":"第05篇 · Word第28段","row":24},{"id":"0-25","module":0,"category":"教育、家庭与儿童成长","fr":"se sentir intégré à son groupe d’amis","zh":"感到融入自己的朋友圈","example":"À cet âge, l’apparence peut également l’aider à se sentir davantage intégré à son groupe d’amis.","source":"第05篇 · Word第28段","row":25},{"id":"0-26","module":0,"category":"教育、家庭与儿童成长","fr":"accorder de l’importance à la personnalité","zh":"重视个性与人格","example":"Parallèlement, il faudrait que les parents apprennent à leurs enfants à accorder davantage d’importance à la personnalité qu’à l’apparence.","source":"第05篇 · Word第30段","row":26},{"id":"0-27","module":0,"category":"教育、家庭与儿童成长","fr":"créer un sentiment d’infériorité","zh":"造成自卑感","example":"Ces différences peuvent créer de la jalousie, de l’exclusion, voire un sentiment d’infériorité.","source":"第05篇 · Word第29段","row":27},{"id":"0-28","module":0,"category":"教育、家庭与儿童成长","fr":"réduire les inégalités économiques","zh":"减少经济差距","example":"D’une part, l’uniforme scolaire peut contribuer à réduire les inégalités économiques entre les élèves.","source":"第06篇 · Word第33段","row":28},{"id":"0-29","module":0,"category":"教育、家庭与儿童成长","fr":"exprimer sa personnalité","zh":"表达自己的个性","example":"D’autre part, le choix des vêtements peut constituer une manière d’exprimer sa personnalité.","source":"第06篇 · Word第34段","row":29},{"id":"0-30","module":0,"category":"教育、家庭与儿童成长","fr":"correspondre à ses goûts","zh":"符合自己的喜好","example":"Certains jeunes accordent beaucoup d’importance à leur style et aiment choisir des tenues qui correspondent à leurs goûts.","source":"第06篇 · Word第34段","row":30},{"id":"0-31","module":0,"category":"教育、家庭与儿童成长","fr":"perdre sa liberté d’expression","zh":"失去表达自由","example":"Porter constamment le même uniforme peut donc leur donner l’impression de perdre une partie de leur liberté d’expression.","source":"第06篇 · Word第34段","row":31},{"id":"0-32","module":0,"category":"教育、家庭与儿童成长","fr":"accéder à des ressources éducatives","zh":"获取教育资源","example":"Grâce aux tablettes et aux ordinateurs, les enfants peuvent accéder facilement à de nombreuses ressources éducatives, rechercher des informations, regarder des vidéos pédagogiques ou encore apprendre une langue étrangère.","source":"第07篇 · Word第39段","row":32},{"id":"0-33","module":0,"category":"教育、家庭与儿童成长","fr":"rechercher des informations","zh":"查找信息","example":"Grâce aux tablettes et aux ordinateurs, les enfants peuvent accéder facilement à de nombreuses ressources éducatives, rechercher des informations, regarder des vidéos pédagogiques ou encore apprendre une langue étrangère.","source":"第07篇 · Word第39段","row":33},{"id":"0-34","module":0,"category":"教育、家庭与儿童成长","fr":"rendre l’apprentissage plus interactif","zh":"让学习更具互动性","example":"Ces outils peuvent ainsi rendre l’apprentissage plus interactif et permettre aux élèves de travailler de manière plus autonome.","source":"第07篇 · Word第39段","row":34},{"id":"0-35","module":0,"category":"教育、家庭与儿童成长","fr":"favoriser une dépendance aux appareils numériques","zh":"助长对数码设备的依赖","example":"À long terme, cela peut limiter leurs interactions sociales et favoriser une certaine dépendance aux appareils numériques.","source":"第07篇 · Word第40段","row":35},{"id":"0-36","module":0,"category":"教育、家庭与儿童成长","fr":"suivre des cours à distance","zh":"参加远程课程","example":"Grâce à Internet, les apprenants peuvent accéder à de nombreuses ressources linguistiques, suivre des cours à distance et organiser leur apprentissage en fonction de leur emploi du temps.","source":"第08篇 · Word第44段","row":36},{"id":"0-37","module":0,"category":"教育、家庭与儿童成长","fr":"organiser son apprentissage en fonction de son emploi du temps","zh":"根据自己的日程安排学习","example":"Grâce à Internet, les apprenants peuvent accéder à de nombreuses ressources linguistiques, suivre des cours à distance et organiser leur apprentissage en fonction de leur emploi du temps.","source":"第08篇 · Word第44段","row":37},{"id":"0-38","module":0,"category":"教育、家庭与儿童成长","fr":"apprendre à son propre rythme","zh":"按照自己的节奏学习","example":"Cette flexibilité leur permet également d’éviter les déplacements et d’apprendre à leur propre rythme.","source":"第08篇 · Word第44段","row":38},{"id":"0-39","module":0,"category":"教育、家庭与儿童成长","fr":"corriger ses erreurs","zh":"改正自己的错误","example":"Sans professeur à ses côtés, un élève peut se décourager plus facilement ou avoir du mal à corriger ses erreurs.","source":"第08篇 · Word第45段","row":39},{"id":"0-40","module":0,"category":"教育、家庭与儿童成长","fr":"adapter son enseignement aux difficultés de l’élève","zh":"针对学生的困难调整教学","example":"Or, un enseignant peut expliquer pourquoi il s’est trompé et adapter son enseignement à ses difficultés.","source":"第08篇 · Word第45段","row":40},{"id":"0-41","module":0,"category":"教育、家庭与儿童成长","fr":"réinvestir les revenus dans des équipements scolaires","zh":"将收入重新投入学校设备","example":"De plus, les revenus générés peuvent être réinvestis dans certains équipements ou programmes scolaires.","source":"第09篇 · Word第50段","row":41},{"id":"0-42","module":0,"category":"教育、家庭与儿童成长","fr":"favoriser une prise de poids","zh":"促使体重增加","example":"À long terme, une consommation régulière peut favoriser une prise de poids et augmenter certains risques, notamment le diabète.","source":"第09篇 · Word第51段","row":42},{"id":"0-43","module":0,"category":"教育、家庭与儿童成长","fr":"encourager de meilleures habitudes alimentaires","zh":"鼓励更好的饮食习惯","example":"L’école devrait donc encourager de meilleures habitudes alimentaires.","source":"第09篇 · Word第51段","row":43},{"id":"0-44","module":0,"category":"教育、家庭与儿童成长","fr":"préserver la santé des é er un rejet de la lecture","zh":"产生对阅读的排斥","example":"Face à une pression excessive, certains peuvent développer un véritable rejet de la lecture et finir par la considérer comme une contrainte plutôt que comme une source de plaisir.","source":"第11篇 · Word第62段","row":51},{"id":"0-52","module":0,"category":"教育、家庭与儿童成长","fr":"donner envie à quelqu’un de lire","zh":"激发某人的阅读意愿","example":"Parallèlement, il faudrait que les parents sachent respecter leurs goûts et leur proposent des livres adaptés afin de leur donner progressivement envie de lire.","source":"第11篇 · Word第63段","row":52},{"id":"0-53","module":0,"category":"教育、家庭与儿童成长","fr":"jouer un rôle éducatif","zh":"发挥教育作用","example":"D’une part, la télévision peut jouer un véritable rôle éducatif.","source":"第12篇 · Word第66段","row":53},{"id":"0-54","module":0,"category":"教育、家庭与儿童成长","fr":"se familiariser avec la prononciation","zh":"熟悉发音","example":"Par exemple, un enfant qui apprend le français peut regarder des émissions en français afin de se familiariser avec la prononciation et d’enrichir son vocabulaire.","source":"第12篇 · Word第66段","row":54},{"id":"0-55","module":0,"category":"教育、家庭与儿童成长","fr":"compléter l’apprentissage scolaire","zh":"补充学校里的学习","example":"La télévision peut donc compléter l’apprentissage scolaire d’une manière plus ludique.","source":"第12篇 · Word第66段","row":55},{"id":"0-56","module":0,"category":"教育、家庭与儿童成长","fr":"limiter le temps passé devant l’écran","zh":"限制屏幕使用时间","example":"Parallèlement, il faudrait que les parents contrôlent les contenus regardés et limitent le temps passé devant l’écran.","source":"第12篇 · Word第68段","row":56},{"id":"0-57","module":0,"category":"教育、家庭与儿童成长","fr":"découvrir de nouveaux univers","zh":"发现新的世界","example":"Les livres leur permettent également de découvrir de nouveaux univers et de stimuler leur imagination.","source":"第13篇 · Word第71段","row":57},{"id":"0-58","module":0,"category":"教育、家庭与儿童成长","fr":"stimuler son imagination","zh":"激发想象力","example":"Les livres leur permettent également de découvrir de nouveaux univers et de stimuler leur imagination.","source":"第13篇 · Word第71段","row":58},{"id":"0-59","module":0,"category":"教育、家庭与儿童成长","fr":"respecter les goûts des enfants","zh":"尊重孩子的喜好","example":"Parallèlement, il faudrait que les parents les accompagnent et respectent leurs goûts afin de développer durablement leur plaisir de lire.","source":"第13篇 · Word第73段","row":59},{"id":"0-60","module":0,"category":"教育、家庭与儿童成长","fr":"offrir un environnement plus encadré","zh":"提供管理更严密的环境","example":"D’une part, les écoles privées peuvent offrir un environnement plus encadré.","source":"第14篇 · Word第77段","row":60},{"id":"0-61","module":0,"category":"教育、家庭与儿童成长","fr":"limiter la mixité sociale","zh":"限制不同社会背景群体的融合","example":"Cette situation peut limiter la mixité sociale et réduire les occasions pour les jeunes de rencontrer des camarades issus de milieux différents.","source":"第14篇 · Word第78段","row":61},{"id":"0-62","module":0,"category":"教育、家庭与儿童成长","fr":"garantir l’égalité des chances","zh":"保障机会平等","example":"Parallèlement, il faudrait que le système éducatif garantisse autant que possible l’égalité des chances, quelle que soit la situation financière des familles.","source":"第14篇 · Word第79段","row":62},{"id":"0-63","module":0,"category":"教育、家庭与儿童成长","fr":"approfondir les sujets qui intéressent les enfants","zh":"深入学习孩子感兴趣的主题","example":"Ils peuvent également approfondir les sujets qui les intéressent et apprendre dans un environnement moins stressant.","source":"第15篇 · Word第82段","row":63},{"id":"0-64","module":0,"category":"教育、家庭与儿童成长","fr":"travailler en équipe","zh":"团队合作","example":"À l’école, les élèves apprennent à communiquer, à travailler en équipe et à respecter des personnes ayant des personnalités différentes.","source":"第15篇 · Word第83段","row":64},{"id":"0-65","module":0,"category":"教育、家庭与儿童成长","fr":"interagir avec des jeunes de son âge","zh":"与同龄人互动","example":"À l’inverse, un enfant qui reste principalement à la maison risque d’avoir moins d’occasions d’interagir avec des jeunes de son âge.","source":"第15篇 · Word第83段","row":65},{"id":"0-66","module":0,"category":"教育、家庭与儿童成长","fr":"développer ses compétences sociales","zh":"培养社交能力","example":"Parallèlement, il faudrait que les parents offrent à leurs enfants suffisamment d’occasions d’interagir avec d’autres jeunes afin de développer leurs compétences sociales.","source":"第15篇 · Word第84段","row":66},{"id":"0-67","module":0,"category":"工作、就业与职场","fr":"contribuer à la réalisation de soi","zh":"有助于自我实现","example":"D’une part, le travail peut contribuer à la réalisation de soi.","source":"第16篇 · Word第89段","row":67},{"id":"0-68","module":0,"category":"工作、就业与职场","fr":"exercer un métier","zh":"从事一种职业","example":"Lorsqu’une personne exerce un métier qui lui plaît, elle peut développer ses compétences, atteindre ses objectifs et se sentir utile.","source":"第16篇 · Word第89段","row":68},{"id":"0-69","module":0,"category":"工作、就业与职场","fr":"atteindre ses objectifs","zh":"实现自己的目标","example":"Lorsqu’une personne exerce un métier qui lui plaît, elle peut développer ses compétences, atteindre ses objectifs et se sentir utile.","source":"第16篇 · Word第89段","row":69},{"id":"0-70","module":0,"category":"工作、就业与职场","fr":"développer son réseau social et professionnel","zh":"拓展社交和职业人脉","example":"Le travail permet également de rencontrer d’autres personnes, de créer des relations avec ses collègues et de développer son réseau social et professionnel.","source":"第16篇 · Word第89段","row":70},{"id":"0-71","module":0,"category":"工作、就业与职场","fr":"nuire à la qualité de vie","zh":"损害生活质量","example":"À long terme, cela peut nuire à sa qualité de vie.","source":"第16篇 · Word第90段","row":71},{"id":"0-72","module":0,"category":"工作、就业与职场","fr":"retrouver son énergie","zh":"恢复精力","example":"Après avoir travaillé plusieurs heures, quelques minutes de repos peuvent les aider à retrouver leur énergie, à mieux se concentrer et à être plus efficaces pendant l’après-midi.","source":"第17篇 · Word第94段","row":72},{"id":"0-73","module":0,"category":"工作、就业与职场","fr":"aménager une salle de repos","zh":"布置休息室","example":"Certaines n’ont pas suffisamment d’espace pour aménager une salle de repos, et dormir directement dans son bureau à côté de ses collègues peut être inconfortable.","source":"第17篇 · Word第95段","row":73},{"id":"0-74","module":0,"category":"工作、就业与职场","fr":"perturber le fonctionnement de l’entreprise","zh":"干扰企业运转","example":"Parallèlement, il faudrait que les entreprises proposent des conditions adaptées afin que les employés puissent se reposer sans perturber le fonctionnement de l’entreprise.","source":"第17篇 · Word第96段","row":74},{"id":"0-75","module":0,"category":"工作、就业与职场","fr":"consacrer du temps à sa famille","zh":"把时间投入家庭","example":"D’une part, travailler moins peut permettre de consacrer davantage de temps à sa famille, à ses loisirs ou aux tâches de la vie quotidienne.","source":"第18篇 · Word第99段","row":75},{"id":"0-76","module":0,"category":"工作、就业与职场","fr":"accomplir les mêmes tâches","zh":"完成相同的任务","example":"Si les employés doivent accomplir les mêmes tâches et participer au même nombre de réunions en moins de temps, ils risquent de travailler plus vite et sous davantage de pression.","source":"第18篇 · Word第100段","row":76},{"id":"0-77","module":0,"category":"工作、就业与职场","fr":"adapter la charge de travail","zh":"调整工作量","example":"Parallèlement, il faudrait que les entreprises adaptent réellement la charge de travail afin d’éviter d’augmenter la pression sur les employés.","source":"第18篇 · Word第101段","row":77},{"id":"0-78","module":0,"category":"工作、就业与职场","fr":"augmenter la pression sur les employés","zh":"增加员工承受的压力","example":"Parallèlement, il faudrait que les entreprises adaptent réellement la charge de travail afin d’éviter d’augmenter la pression sur les employés.","source":"第18篇 · Word第101段","row":78},{"id":"0-79","module":0,"category":"工作、就业与职场","fr":"contribuer à un meilleur équilibre entre la vie professionnelle et la vie personnelle","zh":"有助于更好地平衡工作与个人生活","example":"D’une part, la flexibilité peut contribuer à un meilleur équilibre entre la vie professionnelle et la vie personnelle.","source":"第19篇 · Word第104段","row":79},{"id":"0-80","module":0,"category":"工作、就业与职场","fr":"renforcer la motivation et la satisfaction","zh":"增强积极性和满意度","example":"Des retours positifs, de bonnes relations avec les responsables et des possibilités de formation peuvent renforcer la motivation et la satisfaction des employés.","source":"第19篇 · Word第105段","row":80},{"id":"0-81","module":0,"category":"工作、就业与职场","fr":"créer un environnement de travail plus agréable","zh":"营造更舒适的工作环境","example":"Parallèlement, il faudrait que les entreprises offrent davantage de flexibilité, de reconnaissance et de soutien afin de créer un environnement de travail plus agréable.","source":"第19篇 · Word第106段","row":81},{"id":"0-82","module":0,"category":"工作、就业与职场","fr":"s’entendre bien avec ses collègues","zh":"与同事相处融洽","example":"Lorsque des collègues s’entendent bien, ils peuvent communiquer plus facilement, s’entraider lorsqu’ils rencontrent une difficulté et collaborer de manière plus efficace.","source":"第20篇 · Word第110段","row":82},{"id":"0-83","module":0,"category":"工作、就业与职场","fr":"collaborer de manière efficace","zh":"有效合作","example":"Lorsque des collègues s’entendent bien, ils peuvent communiquer plus facilement, s’entraider lorsqu’ils rencontrent une difficulté et collaborer de manière plus efficace.","source":"第20篇 · Word第110段","row":83},{"id":"0-84","module":0,"category":"工作、就业与职场","fr":"nuire à l’objectivité","zh":"损害客观性","example":"D’autre part, des relations trop proches peuvent parfois créer des tensions ou nuire à l’objectivité.","source":"第20篇 · Word第111段","row":84},{"id":"0-85","module":0,"category":"工作、就业与职场","fr":"laisser les autres à l’écart","zh":"将他人排除在外","example":"Certains collègues peuvent former des groupes exclusifs et laisser les autres à l’écart.","source":"第20篇 · Word第111段","row":85},{"id":"0-86","modu  donc des logements où celui-ci peut être accueilli dans de bonnes conditions, avec suffisamment d’espace et, si possible, des endroits adaptés aux promenades et aux jeux.","source":"第57篇 · Word第313段","row":213},{"id":"0-214","module":0,"category":"住房、居住与代际生活","fr":"endommager le logement","zh":"损坏住房","example":"D’autre part, certains animaux peuvent être bruyants, endommager le logement ou provoquer des allergies chez d’autres voyageurs.","source":"第57篇 · Word第314段","row":214},{"id":"0-215","module":0,"category":"住房、居住与代际生活","fr":"prévoir des équipements adaptés","zh":"安排合适的设备","example":"Parallèlement, il faudrait que les propriétaires établissent des règles claires et prévoient des équipements adaptés afin de garantir le confort de tous.","source":"第57篇 · Word第315段","row":215},{"id":"0-216","module":0,"category":"住房、居住与代际生活","fr":"garantir le confort de tous","zh":"保障所有人的舒适","example":"Parallèlement, il faudrait que les propriétaires établissent des règles claires et prévoient des équipements adaptés afin de garantir le confort de tous.","source":"第57篇 · Word第315段","row":216},{"id":"0-217","module":0,"category":"公共利益、文化与社会伦理","fr":"contribuer à la destruction de la faune","zh":"助长野生动物的毁灭","example":"Pour certaines personnes, il est difficile de comprendre comment on peut prétendre aimer la nature tout en contribuant à la destruction de la faune.","source":"第58篇 · Word第320段","row":217},{"id":"0-218","module":0,"category":"公共利益、文化与社会伦理","fr":"susciter de fortes critiques","zh":"引发强烈批评","example":"La chasse pratiquée uniquement pour se divertir peut donc susciter de fortes critiques.","source":"第58篇 · Word第320段","row":218},{"id":"0-219","module":0,"category":"公共利益、文化与社会伦理","fr":"gérer la faune","zh":"管理野生动物种群","example":"Elle peut aussi servir à se nourrir, à gérer la faune ou à protéger certaines propriétés.","source":"第58篇 · Word第321段","row":219},{"id":"0-220","module":0,"category":"公共利益、文化与社会伦理","fr":"encadrer strictement une pratique","zh":"严格规范某种做法","example":"Parallèlement, il faudrait que cette pratique soit strictement encadrée lorsqu’elle répond à des besoins précis.","source":"第58篇 · Word第322段","row":220},{"id":"0-221","module":0,"category":"公共利益、文化与社会伦理","fr":"contribuer à la sauvegarde des espèces","zh":"有助于物种保护","example":"D’une part, les zoos peuvent contribuer à la sauvegarde de certaines espèces en voie de disparition.","source":"第59篇 · Word第325段","row":221},{"id":"0-222","module":0,"category":"公共利益、文化与社会伦理","fr":"bénéficier de programmes de reproduction","zh":"受益于繁殖计划","example":"Les animaux y reçoivent des soins et peuvent bénéficier de programmes de reproduction.","source":"第59篇 · Word第325段","row":222},{"id":"0-223","module":0,"category":"公共利益、文化与社会伦理","fr":"être privé de liberté","zh":"被剥夺自由","example":"D’autre part, vivre dans un zoo signifie aussi être privé de liberté.","source":"第59篇 · Word第326段","row":223},{"id":"0-224","module":0,"category":"公共利益、文化与社会伦理","fr":"soulever des questions sur le bien-être des animaux","zh":"引发对动物福利的疑问","example":"Certaines espèces peuvent ainsi être maintenues dans des conditions peu adaptées à leurs besoins, ce qui soulève des questions sur leur bien-être.","source":"第59篇 · Word第326段","row":224},{"id":"0-225","module":0,"category":"公共利益、文化与社会伦理","fr":"favoriser l’accès à la culture","zh":"促进文化资源的获取","example":"La gratuité peut donc favoriser un meilleur accès à la culture.","source":"第60篇 · Word第331段","row":225},{"id":"0-226","module":0,"category":"公共利益、文化与社会伦理","fr":"entretenir les bâtiments","zh":"维护建筑","example":"D’autre part, les musées doivent disposer de fonds pour entretenir leurs bâtiments, conserver leurs collections et développer de nouvelles expositions.","source":"第60篇 · Word第332段","row":226},{"id":"0-227","module":0,"category":"公共利益、文化与社会伦理","fr":"conserver les collections","zh":"保存馆藏","example":"D’autre part, les musées doivent disposer de fonds pour entretenir leurs bâtiments, conserver leurs collections et développer de nouvelles expositions.","source":"第60篇 · Word第332段","row":227},{"id":"0-228","module":0,"category":"公共利益、文化与社会伦理","fr":"proposer des tarifs réduits","zh":"提供优惠票价","example":"Il peut être plus adapté de proposer des tarifs réduits à certains publics et d’organiser des visites ou des activités adaptées.","source":"第60篇 · Word第332段","row":228},{"id":"0-229","module":0,"category":"公共利益、文化与社会伦理","fr":"rendre la culture accessible au plus grand nombre","zh":"让尽可能多的人接触文化","example":"Parallèlement, il faudrait que les établissements proposent davantage de tarifs réduits et d’activités afin de rendre la culture accessible au plus grand nombre.","source":"第60篇 · Word第333段","row":229},{"id":"0-230","module":0,"category":"公共利益、文化与社会伦理","fr":"attirer l’attention internationale","zh":"吸引国际关注","example":"D’une part, organiser des événements comme les Jeux olympiques ou la Coupe du monde peut attirer l’attention internationale et mettre en valeur la culture d’un pays.","source":"第61篇 · Word第336段","row":230},{"id":"0-231","module":0,"category":"公共利益、文化与社会伦理","fr":"mettre en valeur la culture d’un pays","zh":"展示一个国家的文化价值","example":"D’une part, organiser des événements comme les Jeux olympiques ou la Coupe du monde peut attirer l’attention internationale et mettre en valeur la culture d’un pays.","source":"第61篇 · Word第336段","row":231},{"id":"0-232","module":0,"category":"公共利益、文化与社会伦理","fr":"créer des emplois","zh":"创造就业岗位","example":"Ces compétitions peuvent également créer des emplois et encourager la modernisation des infrastructures, ce qui peut profiter à la population à long terme.","source":"第61篇 · Word第336段","row":232},{"id":"0-233","module":0,"category":"公共利益、文化与社会伦理","fr":"encourager la modernisation des infrastructures","zh":"推动基础设施现代化","example":"Ces compétitions peuvent également créer des emplois et encourager la modernisation des infrastructures, ce qui peut profiter à la population à long terme.","source":"第61篇 · Word第336段","row":233},{"id":"0-234","module":0,"category":"公共利益、文化与社会伦理","fr":"investir des fonds publics","zh":"投入公共资金","example":"Parallèlement, il faudrait que les autorités évaluent attentivement leur coût et leurs bénéfices à long terme avant d’investir des fonds publics.","source":"第61篇 · Word第338段","row":234},{"id":"0-235","module":0,"category":"公共利益、文化与社会伦理","fr":"répondre à des besoins immédiats","zh":"满足迫切需求","example":"D’une part, donner de l’argent ou soutenir une association peut répondre à des besoins immédiats.","source":"第62篇 · Word第342段","row":235},{"id":"0-236","module":0,"category":"公共利益、文化与社会伦理","fr":"participer à un effort de solidarité","zh":"参与互助行动","example":"Même une petite contribution peut donc être utile et permettre à chacun de participer à un effort de solidarité.","source":"第62篇 · Word第342段","row":236},{"id":"0-237","module":0,"category":"公共利益、文化与社会伦理","fr":"résoudre les difficultés à long terme","zh":"解决长期困难","example":"D’autre part, l’aide financière ne suffit pas toujours à résoudre les difficultés à long terme.","source":"第62篇 · Word第343段","row":237},{"id":"0-238","module":0,"category":"公共利益、文化与社会伦理","fr":"retrouver son autonomie","zh":"恢复自主生活能力","example":"Le bénévolat et les associations peuvent ainsi les aider à retrouver progressivement leur autonomie.","source":"第62篇 · Word第343段","row":238},{"id":"0-239","module":0,"category":"公共利益、文化与社会伦理","fr":"développer des solutions durables","zh":"制定长效解决方案","example":"Parallèlement, il faudrait que les associations et les pouvoirs publics développent davantage de solutions durables afin d’aider les personnes en difficulté à retrouver leur autonomie.","source":"第62篇 · Word第344段","row":239},{"id":"1-2","module":1,"category":"开头引题","fr":"De nos jours, la question de savoir si… suscite de nombreux débats.","zh":"如今，是否……这一问题引发了许多争论","example":"De nos jours, la question de savoir s’il faut être sévère avec ses enfants suscite de nombreux débats.","source":"第01篇 · Word第6段","row":2},{"id":"1-3","module":1,"category":"双方观点","fr":"Certains considèrent que…, tandis que d’autres estiment que…","zh":"一些人认为……，而另一些人则认为……","example":"Certains considèrent qu’une discipline stricte est nécessaire pour développer leur sens des responsabilités, tandis que d’autres estiment qu’une approche plus bienveillante et coopérative favorise davantage leur épanouissement.","source":"第01篇 · Word第6段","row":3},{"id":"1-4","module":1,"category":"分层论证","fr":"D’une part, …","zh":"一方面，……","example":"D’une part, une certaine autorité parentale peut être nécessaire pour encadrer et protéger les enfants.","source":"第01篇 · Word第7段","row":4},{"id":"1-5","module":1,"category":"分层论证","fr":"D’autre part, …","zh":"另一方面，……","example":"D’autre part, une autorité excessive peut empêcher les enfants de développer leur autonomie et leur indépendance.","source":"第01篇 · Word第8段","row":5},{"id":"1-6","module":1,"category":"原因说明","fr":"Comme…, …","zh":"由于……，……","example":"Comme ils sont encore jeunes, ils n’ont pas toujours suffisamment de recul pour distinguer ce qui est approprié de ce qui ne l’est pas.","source":"第01篇 · Word第7段","row":6},{"id":"1-7","module":1,"category":"结果推导","fr":"… doivent donc…","zh":"……因此必须……","example":"Les parents doivent donc fixer certaines limites et leur apprendre à respecter des règles.","source":"第01篇 · Word第7段","row":7},{"id":"1-8","module":1,"category":"条件后果","fr":"Si…, … risquent de…","zh":"如果……，……就有可能……","example":"Si les parents prennent toutes les décisions à leur place et interviennent constamment dans leur vie quotidienne, les enfants risquent de devenir trop dépendants.","source":"第01篇 · Word第8段","row":8},{"id":"1-9","module":1,"category":"情境说明","fr":"Face à…, … peuvent également…","zh":"面对……，……也可能……","example":"Face à des règles trop strictes, certains adolescents peuvent également devenir rebelles et entrer en conflit avec leurs parents.","source":"第01篇 · Word第8段","row":9},{"id":"1-10","module":1,"category":"结尾立场","fr":"Pour conclure, il me semble que…","zh":"总而言之，在我看来……","example":"Pour conclure, il me semble qu’une certaine autorité parentale est nécessaire, mais qu’elle ne doit jamais devenir excessive.","source":"第01篇 · Word第9段","row":10},{"id":"1-11","module":1,"category":"结尾建议","fr":"Parallèlement, il faudrait que…","zh":"与此同时，应当……。（后接虚拟式）","example":"Parallèlement, il faudrait que les parents trouvent un équilibre entre l’encadrement et la liberté, afin d’aider leurs enfants à devenir progressivement autonomes et responsables.","source":"第01篇 · Word第9段","row":11},{"id":"1-12","module":1,"category":"目的表达","fr":"… afin de + infinitif","zh":"……，以便……。（同一动作主体）","example":"Parallèlement, il faudrait que les parents trouvent un équilibre entre l’encadrement et la liberté, afin d’aider leurs enfants à devenir progressivement autonomes et responsables.","source":"第01篇 · Word第9段","row":12},{"id":"1-13","module":1,"category":"时间情境","fr":"Lorsque…, …","zh":"当……时，……","example":"Lorsqu’il s’occupe d’un chien ou d’un chat, par exemple, il doit lui donner à manger et à boire, le promener et veiller régulièrement à son bien-être.","source":"第02篇 · Word第12段","row":13},{"id":"1-14","module":1,"category":"举例说明","fr":"Par exemple, …","zh":"例如，……","example":"Par exemple, certains chiens peuvent mordre lorsqu’ils se sentent menacés ou stressés.","source":"第02篇 · Word第13段","row":14},{"id":"1-15","module":1,"category":"递进补充","fr":"De plus, …","zh":"此外，……","example":"De plus, les chats et les chiens perdent souvent leurs poils, ce qui peut provoquer des allergies chez certains enfants.","source":"第02篇 · Word第13段","row":15},{"id":"1-16","module":1,"category":"情境后果","fr":"Dans ce cas, …","zh":"在这种情况下，……","example":"Dans ce cas, la présence d’un animal à la maison peut devenir problématique et même nuire à leur santé.","source":"第02篇 · Word第13段","row":16},{"id":"1-17","module":1,"category":"限制条件","fr":"… à condition que…","zh":"……，条件是……。（后接虚拟式）","example":"Pour conclure, il me semble qu’un animal peut être bénéfique pour un enfant, à condition que l’enfant soit suffisamment responsable.","source":"第02篇 · Word第14段","row":17},{"id":"1-18","module":1,"category":"对比辨析","fr":"Être… ne signifie pas forcément…","zh":"身为……并不一定意味着……","example":"Être parent ne signifie pas forcément savoir enseigner efficacement.","source":"第03篇 · Word第18段","row":18},{"id":"1-19","module":1,"category":"目的表达","fr":"… afin que… puisse…","zh":"……，以便……能够……。（后接虚拟式）","example":"Parallèlement, il faudrait que les écoles veillent à limiter leur quantité afin que chaque élève puisse progresser dans des conditions plus équitables.","source":"第03篇 · Word第19段","row":19},{"id":"1-20","module":1,"category":"因果关系","fr":"… risque de produire l’effet inverse de celui recherché.","zh":"……有可能产生与预期相反的效果","example":"Une surveillance trop stricte risque donc de produire l’effet inverse de celui recherché.","source":"第04篇 · Word第23段","row":20},{"id":"1-21","module":1,"category":"正面论证","fr":"Lorsqu’…, … peut se sentir plus…","zh":"当……时，……可能会感到更……","example":"Lorsqu’un adolescent porte une tenue dans laquelle il se sent élégant et à l’aise, il peut se sentir plus sûr de lui dans ses interactions sociales.","source":"第05篇 · Word第28段","row":21},{"id":"1-22","module":1,"category":"对比辨析","fr":"Certains… peuvent…, tandis que d’autres n’en ont pas les moyens.","zh":"一些……有能力……，而另一些人没有这样的经济条件","example":"Certains enfants issus de familles aisées peuvent porter des vêtements coûteux, tandis que d’autres n’en ont pas les moyens.","source":"第05篇 · Word第29段","row":22},{"id":"1-23","module":1,"category":"递进补充","fr":"… peuvent créer…, voire…","zh":"……可能造成……，甚至……","example":"Ces différences peuvent créer de la jalousie, de l’exclusion, voire un sentiment d’infériorité.","source":"第05篇 · Word第29段","row":23},{"id":"1-24","module":1,"category":"折中立场","fr":"… peuvent avoir certains avantages, mais… ne devraient jamais…","zh":"……可能有一些好处，但……绝不应当……","example":"Pour conclure, il me semble que les vêtements de marque peuvent avoir certains avantages, mais qu’ils ne devraient jamais déterminer la valeur d’un enfant.","source":"第05篇 · Word第30段","row":24},{"id":"1-25","module":1,"category":"举例说明","fr":"Dans certaines écoles, …","zh":"在某些学校里，……","example":"Dans certaines écoles, les différences de niveau de vie peuvent devenir particulièrement visibles à travers les vêtements.","source":"第06篇 · Word第33段","row":25},{"id":"1-26","module":1,"category":"原因资源","fr":"Grâce à…, … peuvent…","zh":"借助……，……能够……","example":"Grâce aux tablettes et aux ordinateurs, les enfants peuvent accéder facilement à de nombreuses ressources éducatives, rechercher des informations, regarder des vidéos pédagogiques ou encore apprendre une langue étrangère.","source":"第07篇 · Word第39段","row":26},{"id":"1-27","module":1,"category":"结果推导","fr":"Ces outils peuvent ainsi…","zh":"这些工具由此能够……","example":"Ces outils peuvent ainsi rendre l’apprentissage plus interactif et permettre aux élèves de travailler de manière plus autonome.","source":"第07篇 · Word第39段","row":27},{"id":"1-28","module":1,"category":"长远影响","fr":"À long terme, cela peut…","zh":"从长远来看，这可能……","example":"À long terme, cela peut limiter leurs interactions sociales et favoriser une certaine dépendance aux appareils numériques.","source":"第07篇 · Word第40段","row":28},{"id":"1-29","module":1,"category":"反面论证","fr":"Sans…, … peut…","zh":"没有……，……可能……","example":"Sans professeur à ses côtés, un élève peut se décourager plus facilement ou avoir du mal à corriger ses erreurs.","source":"第08篇 · Word第45段","row":29},{"id":"1-30","module":1,"category":"转折提醒","fr":"Or, …","zh":"然而／事实上，……。（提示关键事实或转折）","example":"Or, un enseignant peut expliquer pourquoi il s’est trompé et adapter son enseignement à ses difficultés.","source":"第08篇 · Word第45段","row":30},{"id":"1-31","module":1,"category":"保留立场","fr":"… constituent une solution très utile, malgré certaines limites.","zh":"……是一种非常有用的解决办法，尽管存在一些局限","example":"Pour conclure, il me semble que les cours de langue en ligne constituent une solution très utile, malgré certaines limites.","source":"第08篇 · Word第46段","row":31},{"id":"1-32","module":1,"category":"让步承认","fr":"Il faut reconnaître que…","zh":"必须承认……","example":"D’autre part, il faut reconnaître qu’une consommation excessive de boissons sucrées peut avoir des effets négatifs sur la santé.","source":"第09篇 · Word第51段","row":32},{"id":"1-33","module":1,"category":"限制条件","fr":"… à condition de + infinitif","zh":"……，条件是……。（后接不定式）","example":"Pour conclure, il me semble que les distributeurs peuvent être utiles, à condition de proposer principalement des boissons plus saines.","source":"第09篇 · Word第52段","row":33},{"id":"1-34","module":1,"category":"可行性论证","fr":"Il est tout à fait possible de…","zh":"完全可以……","example":"D’une part, il est tout à fait possible d’avoir une alimentation équilibrée sans consommer systématiquement de viande.","source":"第10篇 · Word第55段","row":34},{"id":"1-35","module":1,"category":"同步行动","fr":"… tout en + participe présent","zh":"……，同时……。（同一主体）","example":"À condition de varier suffisamment leur alimentation, ils peuvent couvrir une grande partie de leurs besoins nutritionnels tout en limitant la consommation de produits trop gras.","source":"第10篇 · Word第55段","row":35},{"id":"1-36","module":1,"category":"让步承认","fr":"… constitue tout de même…","zh":"……毕竟仍构成……","example":"D’autre part, la viande constitue tout de même une source importante de protéines et de certains nutriments essentiels.","source":"第10篇 · Word第56段","row":36},{"id":"1-37","module":1,"category":"纠正误解","fr":"… ne signifie pas qu’il faille… à tout prix.","zh":"……并不意味着必须不惜一切代价……","example":"D’autre part, encourager les enfants à lire ne signifie pas qu’il faille les y obliger à tout prix.","source":"第11篇 · Word第62段","row":37},{"id":"1-38","module":1,"category":"对比辨析","fr":"… comme une contrainte plutôt que comme une source de plaisir.","zh":"……被视为一种负担，而非快乐的来源","example":"Face à une pression excessive, certains peuvent développer un véritable rejet de la lecture et finir par la considérer comme une contrainte plutôt que comme une source de plaisir.","source":"第11篇 · Word第62段","row":38},{"id":"1-39","module":1,"category":"不足与建议","fr":"Il ne suffit donc pas de…","zh":"因此，仅仅……还不够","example":"Il ne suffit donc pas de les obliger à lire.","source":"第13篇 · Word第72段","row":39},{"id":"1-40","module":1,"category":"原因说明","fr":"…, car…","zh":"……，因为……","example":"Pour certains parents, cet encadrement constitue un avantage important, car il peut les rassurer et permettre aux enfants d’étudier dans de bonnes conditions.","source":"第14篇 · Word第77段","row":40},{"id":"1-41","module":1,"category":"无论条件","fr":"… quelle que soit la situation financière des familles.","zh":"……，无论家庭的经济状况如何","example":"Parallèlement, il faudrait que le système éducatif garantisse autant que possible l’égalité des chances, quelle que soit la situation financière des familles.","source":"第14篇 · Word第79段","row":41},{"id":"1-42","module":1,"category":"对比辨析","fr":"À l’inverse, …","zh":"相反，……","example":"À l’inverse, un enfant qui reste principalement à la maison risque d’avoir moins d’occasions d’interagir avec des jeunes de son âge.","source":"第15篇 · Word第83段","row":42},{"id":"1-43","module":1,"category":"正面论证","fr":"Après avoir + participe passé, …","zh":"在完成……之后，……","example":"Après avoir travaillé plusieurs heures, quelques minutes de repos peuvent les aider à retrouver leur énergie, à mieux se concentrer et à être plus efficaces pendant l’après-midi.","source":"第17篇 · Word第94段","row":43},{"id":"1-44","module":1,"category":"双重益处","fr":"… à la fois… et…","zh":"……既……又……","example":"La sieste peut donc contribuer à améliorer à la fois leur bien-être et leur productivité.","source":"第17篇 · Word第94段","row":44},{"id":"1-45","module":1,"category":"互补立场","fr":"… dépend de plusieurs facteurs complémentaires.","zh":"……取决于多个互为补充的因素","example":"Pour conclure, il me semble que le bien-être au travail dépend de plusieurs facteurs complémentaires.","source":"第19篇 · Word第106段","row":45},{"id":"1-46","module":1,"category":"特定情境","fr":"Lorsqu’une décision… doit être prise, il peut être plus difficile de…","zh":"当必须作出……决定时，……可能更困难","example":"De plus, lorsqu’une décision professionnelle doit être prise, il peut être plus difficile de rester impartial face à un ami.","source":"第20篇 · Word第111段","row":46},{"id":"1-47","module":1,"category":"必要性建议","fr":"Il est donc important que…","zh":"因此，……很重要。（后接虚拟式）","example":"Il est donc important que les employés prennent suffisamment de temps pour se reposer.","source":"第21篇 · Word第116段","row":47},{"id":"1-48","module":1,"category":"避免代价","fr":"… sans + infinitif","zh":"……，而不……。（同一主体）","example":"Parallèlement, il faudrait que les entreprises améliorent les conditions de travail sans augmenter excessivement la charge imposée aux employés.","source":"第22篇 · Word第122段","row":48},{"id":"1-49","module":1,"category":"让步反驳","fr":"Même si…, … peuvent…","zh":"即使……，……仍能够……。（后接直陈式）","example":"Même si l’emploi n’est pas directement lié à leurs études, ils peuvent développer des compétences utiles, comme la communication, le travail en équipe ou encore la gestion du temps.","source":"第26篇 · Word第142段","row":49},{"id":"1-50","module":1,"category":"双重考量","fr":"… non seulement…, mais aussi…","zh":"……不仅……，也……","example":"Parallèlement, il faudrait que les recruteurs évaluent les jeunes candidats de manière globale, en tenant compte non seulement de leurs diplômes, mais aussi de leurs compétences et de leur expérience.","source":"第27篇 · Word第149段","row":50},{"id":"1-51","module":1,"category":"便利性论证","fr":"… sans avoir à + infinitif","zh":"……，无需……","example":"Lorsqu’une personne a un emploi du temps chargé, elle peut obtenir rapidement un repas chaud sans avoir à cuisiner.","source":"第28篇 · Word第154段","row":51},{"id":"1-52","module":1,"category":"补充论证","fr":"Par ailleurs, …","zh":"另外，……","example":"Par ailleurs, les emballages en plastique utilisés dans ces restaurants augmentent la quantité de déchets et contribuent à la pollution.","source":"第28篇 · Word第155段","row":52},{"id":"1-53","module":1,"category":"条件选择","fr":"… peuvent être adaptées selon la situation.","zh":"……可以根据情况成为合适的选择","example":"Pour conclure, il me semble que les deux habitudes peuvent être adaptées selon la situation.","source":"第30篇 · Word第166段","row":53},{"id":"1-54","module":1,"category":"保留立场","fr":"… restent très utiles, mais… ne constituent pas la seule voie possible.","zh":"……仍然很有用，但……并非唯一可行途径","example":"Pour conclure, il me semble que la formation et l’expérience restent très utiles, mais qu’elles ne constituent pas la seule voie possible.","source":"第31篇 · Word第172段","row":54},{"id":"1-55","module":1,"category":"正面论证","fr":"… sans devoir + infinitif","zh":"……，不必……","example":"Les clients peuvent y acheter des fruits, des légumes, de la viande ou encore des boissons sans devoir se rendre dans plusieurs magasins.","source":"第33篇 · Word第181段","row":55},{"id":"1-56","module":1,"category":"最后补充","fr":"Enfin, …","zh":"最后，……","example":"Enfin, ces magasins favorisent davantage les échanges entre les habitants du quartier et peuvent renforcer les liens sociaux.","source":"第33篇 · Word第182段","row":56},{"id":"1-57","module":1,"category":"有限适用","fr":"… lorsqu’ils sont utilisés de manière raisonnable.","zh":"……，前提是它们被合理使用","example":"Ils peuvent donc constituer une activité stimulante lorsqu’ils sont utilisés de manière raisonnable.","source":"第35篇 · Word第193段","row":57},{"id":"1-58","module":1,"category":"不同影响","fr":"… peuvent avoir des effets positifs comme négatifs selon…","zh":"……可能带来正面也可能带来负面影响，取决于……","example":"Pour conclure, il me semble que les jeux vidéo peuvent avoir des effets positifs comme négatifs selon la manière dont ils sont utilisés.","source":"第35篇 · Word第195段","row":58},{"id":"1-59","module":1,"category":"风险情境","fr":"Dans certains cas, cela peut même…","zh":"在某些情况下，这甚至可能……","example":"Dans certains cas, cela peut même représenter un risque pour la sécurité d’un logement ou d’un véhicule.","source":"第36篇 · Word第199段","row":59},{"id":"1-60","module":1,"category":"相反观点","fr":"En revanche, …","zh":"相比之下／然而，……","example":"En revanche, le livre numérique peut sembler plus impersonnel.","source":"第37篇 · Word第204段","row":60},{"id":"1-61","module":1,"category":"比较优势","fr":"… est généralement moins… que…","zh":"……通常比……更不……","example":"Il est généralement moins cher que la version papier et permet également d’économiser du papier.","source":"第37篇 · Word第203段","row":61},{"id":"1-62","module":1,"category":"不充分立场","fr":"… ne constituent pas une solution suffisante à elles seules.","zh":"仅靠……本身并不足以解决问题","example":"Pour conclure, il me semble que les caméras peuvent être utiles dans certains espaces publics, mais qu’elles ne constituent pas une solution suffisante à elles seules.","source":"第39篇 · Word第216段","row":62},{"id":"1-63","module":1,"category":"必要条件","fr":"… peut être difficile à appliquer si…","zh":"如果……，……可能难以实施","example":"D’autre part, une telle mesure peut être difficile à appliquer si les villes ne disposent pas de transports en commun suffisamment développés.","source":"第43篇 · Word第238段","row":63},{"id":"1-64","module":1,"category":"缺少配套","fr":"Sans ces solutions, … risque de…","zh":"缺少这些配套办法，……可能……","example":"Sans ces solutions, l’interdiction risque de compliquer les déplacements quotidiens.","source":"第43篇 · Word第238段","row":64},{"id":"1-65","module":1,"category":"价格比较","fr":"… peut même coûter moins cher que…","zh":"……甚至可能比……更便宜","example":"Dans certains cas, le billet d’avion peut même coûter moins cher que le train ou la voiture.","source":"第44篇 · Word第242段","row":65},{"id":"1-66","module":1,"category":"原因对比","fr":"… non pas à cause de…, mais parce que…","zh":"……不是由于……，而是因为……","example":"D’autre part, certaines personnes n’utilisent pas les transports en commun non pas à cause du prix, mais parce que le réseau est insuffisamment développé.","source":"第45篇 · Word第248段","row":66},{"id":"1-67","module":1,"category":"不充分立场","fr":"… ne suffit pas à elle seule.","zh":"单靠……本身还不够","example":"Pour conclure, il me semble que la gratuité des transports en commun peut avoir des effets positifs, mais qu’elle ne suffit pas à elle seule.","source":"第45篇 · Word第249段","row":67},{"id":"1-68","module":1,"category":"意外情境","fr":"En cas de problème ou de situation imprévue, …","zh":"在发生问题或意外情况时，……","example":"En cas de problème ou de situation imprévue, l’absence d’un compagnon peut également devenir une difficulté.","source":"第46篇 · Word第253段","row":68},{"id":"1-69","module":1,"category":"转述材料","fr":"Selon le document, …","zh":"根据材料，……","example":"De plus, selon le document, la consommation d’énergie d’un citadin peut être inférieure à celle d’un habitant de la campagne.","source":"第49篇 · Word第269段","row":69},{"id":"1-70","module":1,"category":"双重评估","fr":"… présente à la fois des risques et certains avantages…","zh":"……既存在风险，也具有一些……优势","example":"Pour conclure, il me semble que le développement des villes présente à la fois des risques et certains avantages environnementaux.","source":"第49篇 · Word第270段","row":70},{"id":"1-71","module":1,"category":"现实判断","fr":"Il n’est pas réaliste de…","zh":"……并不现实","example":"Pour conclure, il me semble qu’il n’est pas réaliste de supprimer complètement le plastique.","source":"第50篇 · Word第276段","row":71},{"id":"1-72","module":1,"category":"低预算适用","fr":"Cette solution peut donc être particulièrement intéressante pour…","zh":"因此，这一方案对……尤其有吸引力","example":"Cette solution peut donc être particulièrement intéressante pour les étudiants ou les personnes ayant un budget limité.","source":"第51篇 · Word第281段","row":72},{"id":"1-73","module":1,"category":"让步补充","fr":"Toutefois, … reste parfois trop élevé pour…","zh":"不过，……对……而言有时仍然太高","example":"Toutefois, leur coût reste parfois trop élevé pour certains ménages.","source":"第52篇 · Word第287段","row":73},{"id":"1-74","module":1,"category":"适用立场","fr":"Les deux solutions peuvent convenir selon la situation.","zh":"这两种方案都可能适用，要视具体情况而定","example":"Pour conclure, il me semble que les deux solutions peuvent convenir selon la situation.","source":"第52篇 · Word第288段","row":74},{"id":"1-75","module":1,"category":"可选补充","fr":"… et, si possible, …","zh":"……，并且如果可能的话，……","example":"Ils recherchent donc des logements où celui-ci peut être accueilli dans de bonnes conditions, avec suffisamment d’espace et, si possible, des endroits adaptés aux promenades et aux jeux.","source":"第57篇 · Word第313段","row":75},{"id":"1-76","module":1,"category":"反面论证","fr":"Il est difficile de comprendre comment on peut… tout en…","zh":"很难理解一个人怎么能……，同时却……","example":"Pour certaines personnes, il est difficile de comprendre comment on peut prétendre aimer la nature tout en contribuant à la destruction de la faune.","source":"第58篇 · Word第320段","row":76},{"id":"1-77","module":1,"category":"不绝对判断","fr":"… n’est pas toujours…","zh":"……并不总是……","example":"D’autre part, la chasse n’est pas toujours pratiquée pour le plaisir.","source":"第58篇 · Word第321段","row":77},{"id":"1-78","module":1,"category":"被动态立场","fr":"… peut être perçue comme…","zh":"……可以被看作……","example":"D’une part, la chasse peut être perçue comme une pratique contraire au respect de la nature et des animaux.","source":"第58篇 · Word第320段","row":78},{"id":"1-79","module":1,"category":"程度建议","fr":"… aussi proches que possible de…","zh":"……尽可能接近……","example":"Parallèlement, il faudrait qu’ils garantissent aux animaux des conditions de vie aussi proches que possible de leur environnement naturel.","source":"第59篇 · Word第327段","row":79},{"id":"1-80","module":1,"category":"替代方案","fr":"Il peut être plus adapté de…","zh":"……可能更合适","example":"Il peut être plus adapté de proposer des tarifs réduits à certains publics et d’organiser des visites ou des activités adaptées.","source":"第60篇 · Word第332段","row":80},{"id":"1-81","module":1,"category":"折中建议","fr":"… devrait être facilité sans nécessairement devenir totalement…","zh":"应当让……更便利，而不一定要变得完全……","example":"Pour conclure, il me semble que l’accès aux musées devrait être facilité sans nécessairement devenir totalement gratuit.","source":"第60篇 · Word第333段","row":81},{"id":"1-82","module":1,"category":"审慎立场","fr":"… doivent être organisés avec prudence.","zh":"应当审慎地组织……","example":"Pour conclure, il me semble que les grands événements sportifs peuvent présenter certains avantages, mais qu’ils doivent être organisés avec prudence.","source":"第61篇 · Word第338段","row":82},{"id":"1-83","module":1,"category":"紧急需求","fr":"Même une petite contribution peut donc être utile…","zh":"因此，即使是一份小小的贡献也可能有用……","example":"Même une petite contribution peut donc être utile et permettre à chacun de participer à un effort de solidarité.","source":"第62篇 · Word第342段","row":83},{"id":"1-84","module":1,"category":"长效解决","fr":"… ne suffit pas toujours à résoudre les difficultés à long terme.","zh":"……并不总能解决长期困难","example":"D’autre part, l’aide financière ne suffit pas toujours à résoudre les difficultés à long terme.","source":"第62篇 · Word第343段","row":84},{"id":"2-2","module":2,"category":"动词 + à + 不定式","fr":"apprendre à quelqu’un à + infinitif","zh":"教某人做……","example":"Les parents doivent donc fixer certaines limites et leur apprendre à respecter des règles.","source":"第01篇 · Word第7段","row":2},{"id":"2-3","module":2,"category":"动词 + de + 不定式","fr":"empêcher quelqu’un de + infinitif","zh":"阻止某人做……","example":"D’autre part, une autorité excessive peut empêcher les enfants de développer leur autonomie et leur indépendance.","source":"第01篇 · Word第8段","row":3},{"id":"2-4","module":2,"category":"动词 + de + 不定式","fr":"risquer de + infinitif","zh":"有可能做……","example":"Si les parents prennent toutes les décisions à leur place et interviennent constamment dans leur vie quotidienne, les enfants risquent de devenir trop dépendants.","source":"第01篇 · Word第8段","row":4},{"id":"2-5","module":2,"category":"动词 + à + 不定式","fr":"aider quelqu’un à + infinitif","zh":"帮助某人做……","example":"Parallèlement, il faudrait que les parents trouvent un équilibre entre l’encadrement et la liberté, afin d’aider leurs enfants à devenir progressivement autonomes et responsables.","source":"第01篇 · Word第9段","row":5},{"id":"2-6","module":2,"category":"动词 + dans","fr":"intervenir dans + nom","zh":"介入／干预……","example":"Si les parents prennent toutes les décisions à leur place et interviennent constamment dans leur vie quotidienne, les enfants risquent de devenir trop dépendants.","source":"第01篇 · Word第8段","row":6},{"id":"2-7","module":2,"category":"动词 + avec","fr":"entrer en conflit avec quelqu’un","zh":"与某人发生冲突","example":"Face à des règles trop strictes, certains adolescents peuvent également devenir rebelles et entrer en conflit avec leurs parents.","source":"第01篇 · Word第8段","row":7},{"id":"2-8","module":2,"category":"动词 + 虚拟式","fr":"il faudrait que + subjonctif","zh":"应当……","example":"Parallèlement, il faudrait que les parents trouvent un équilibre entre l’encadrement et la liberté, afin d’aider leurs enfants à devenir progressivement autonomes et responsables.","source":"第01篇 · Word第9段","row":8},{"id":"2-9","module":2,"category":"动词 + de + 不定式","fr":"permettre à quelqu’un de + infinitif","zh":"使某人能够做……","example":"D’une part, avoir un animal domestique peut permettre à un enfant de développer le sens des responsabilités.","source":"第02篇 · Word第12段","row":9},{"id":"2-10","module":2,"category":"自反动词 + de","fr":"s’occuper de + nom","zh":"照料／负责……","example":"Lorsqu’il s’occupe d’un chien ou d’un chat, par exemple, il doit lui donner à manger et à boire, le promener et veiller régulièrement à son bien-être.","source":"第02篇 · Word第12段","row":10},{"id":"2-11","module":2,"category":"动词 + à + 名词","fr":"veiller à + nom","zh":"关注并确保……","example":"Lorsqu’il s’occupe d’un chien ou d’un chat, par exemple, il doit lui donner à manger et à boire, le promener et veiller régulièrement à son bien-être.","source":"第02篇 · Word第12段","row":11},{"id":"2-12","module":2,"category":"动词 + de + 名词","fr":"prendre soin de + nom","zh":"照顾……","example":"Cette expérience peut donc lui apprendre à prendre soin d’un autre être vivant et à assumer progressivement ses responsabilités au quotidien.","source":"第02篇 · Word第12段","row":12},{"id":"2-13","module":2,"category":"动词 + à + 名词","fr":"nuire à + nom","zh":"损害……","example":"Dans ce cas, la présence d’un animal à la maison peut devenir problématique et même nuire à leur santé.","source":"第02篇 · Word第13段","row":13},{"id":"2-14","module":2,"category":"动词 + 虚拟式","fr":"à condition que + subjonctif","zh":"条件是……","example":"Pour conclure, il me semble qu’un animal peut être bénéfique pour un enfant, à condition que l’enfant soit suffisamment responsable.","source":"第02篇 · Word第14段","row":14},{"id":"2-15","module":2,"category":"动词 + de + 不定式","fr":"être obligé de + infinitif","zh":"被要求／不得不做……","example":"Lorsqu’un enfant sait qu’il doit rendre un devoir le lendemain, il est obligé de planifier son travail, de réviser plus régulièrement et de respecter ses échéances.","source":"第03篇 · Word第17段","row":15},{"id":"2-16","module":2,"category":"动词 + de + 名词","fr":"bénéficier de + nom","zh":"受益于／享有……","example":"D’autre part, tous les enfants ne bénéficient pas du même accompagnement à la maison.","source":"第03篇 · Word第18段","row":16},{"id":"2-17","module":2,"category":"动词 + de + 名词","fr":"manquer de + nom","zh":"缺少……","example":"Certains parents manquent de temps, tandis que d’autres ne possèdent pas nécessairement les compétences pédagogiques nécessaires.","source":"第03篇 · Word第18段","row":17},{"id":"2-18","module":2,"category":"动词 + à + 不定式","fr":"veiller à + infinitif","zh":"注意确保做……","example":"Parallèlement, il faudrait que les écoles veillent à limiter leur quantité afin que chaque élève puisse progresser dans des conditions plus équitables.","source":"第03篇 · Word第19段","row":18},{"id":"2-19","module":2,"category":"动词 + 虚拟式","fr":"afin que + subjonctif","zh":"以便……","example":"Parallèlement, il faudrait que les écoles veillent à limiter leur quantité afin que chaque élève puisse progresser dans des conditions plus équitables.","source":"第03篇 · Word第19段","row":19},{"id":"2-20","module":2,"category":"被动结构 + à","fr":"être exposé à + nom","zh":"接触到／暴露于……","example":"Ils peuvent facilement être exposés à des contenus violents ou destinés aux adultes.","source":"第04篇 · Word第22段","row":20},{"id":"2-21","module":2,"category":"动词 + à + 名词","fr":"avoir accès à + nom","zh":"可以使用／接触……","example":"Les parents doivent donc fixer certaines limites et superviser les contenus auxquels leurs enfants ont accès.","source":"第04篇 · Word第22段","row":21},{"id":"2-22","module":2,"category":"自反结构 + 形容词","fr":"se sentir + adjectif","zh":"感到……","example":"Lorsqu’un adolescent porte une tenue dans laquelle il se sent élégant et à l’aise, il peut se sentir plus sûr de lui dans ses interactions sociales.","source":"第05篇 · Word第28段","row":22},{"id":"2-23","module":2,"category":"动词 + à + 名词","fr":"accorder de l’importance à + nom","zh":"重视……","example":"D’autre part, accorder trop d’importance aux marques peut rendre les inégalités économiques particulièrement visibles.","source":"第05篇 · Word第29段","row":23},{"id":"2-24","module":2,"category":"关系从句","fr":"la manière dont + proposition","zh":"……的方式","example":"D’une part, les vêtements peuvent influencer la confiance en soi et la manière dont les autres nous perçoivent.","source":"第05篇 · Word第28段","row":24},{"id":"2-25","module":2,"category":"动词 + à + 不定式","fr":"contribuer à + infinitif","zh":"有助于做……","example":"D’une part, l’uniforme scolaire peut contribuer à réduire les inégalités économiques entre les élèves.","source":"第06篇 · Word第33段","row":25},{"id":"2-26","module":2,"category":"动词 + à + 名词","fr":"correspondre à + nom","zh":"符合／对应……","example":"Certains jeunes accordent beaucoup d’importance à leur style et aiment choisir des tenues qui correspondent à leurs goûts.","source":"第06篇 · Word第34段","row":26},{"id":"2-27","module":2,"category":"动词 + de + 不定式","fr":"donner à quelqu’un l’impression de + infinitif","zh":"让某人有……的感觉","example":"Porter constamment le même uniforme peut donc leur donner l’impression de perdre une partie de leur liberté d’expression.","source":"第06篇 · Word第34段","row":27},{"id":"2-28","module":2,"category":"动词 + à + 名词","fr":"accéder à + nom","zh":"获得／访问……","example":"Grâce aux tablettes et aux ordinateurs, les enfants peuvent accéder facilement à de nombreuses ressources éducatives, rechercher des informations, regarder des vidéos pédagogiques ou encore apprendre une langue étrangère.","source":"第07篇 · Word第39段","row":28},{"id":"2-29","module":2,"category":"使役结果结构","fr":"rendre + nom + adjectif","zh":"使……变得……","example":"Ces outils peuvent ainsi rendre l’apprentissage plus interactif et permettre aux élèves de travailler de manière plus autonome.","source":"第07篇 · Word第39段","row":29},{"id":"2-30","module":2,"category":"动词 + avec","fr":"échanger avec quelqu’un","zh":"与某人交流","example":"Les enfants peuvent passer de longues heures devant un ordinateur ou une tablette et avoir moins d’occasions d’échanger directement avec leurs enseignants ou leurs camarades.","source":"第07篇 · Word第40段","row":30},{"id":"2-31","module":2,"category":"动词 + à + 不定式","fr":"avoir du mal à + infinitif","zh":"做……有困难","example":"Sans professeur à ses côtés, un élève peut se décourager plus facilement ou avoir du mal à corriger ses erreurs.","source":"第08篇 · Word第45段","row":31},{"id":"2-32","module":2,"category":"动词 + à + 名词","fr":"adapter quelque chose à + nom","zh":"根据……调整某事，使其适合……","example":"Or, un enseignant peut expliquer pourquoi il s’est trompé et adapter son enseignement à ses difficultés.","source":"第08篇 · Word第45段","row":32},{"id":"2-33","module":2,"category":"动词 + de + 名词","fr":"profiter de + nom","zh":"充分利用／享受……","example":"Parallèlement, il faudrait que les apprenants restent suffisamment disciplinés et motivés afin de profiter pleinement de cette flexibilité.","source":"第08篇 · Word第46段","row":33},{"id":"2-34","module":2,"category":"非人称 + 直陈式","fr":"il faut reconnaître que + indicatif","zh":"必须承认……","example":"D’autre part, il faut reconnaître qu’une consommation excessive de boissons sucrées peut avoir des effets négatifs sur la santé.","source":"第09篇 · Word第51段","row":34},{"id":"2-35","module":2,"category":"条件 + 不定式","fr":"à condition de + infinitif","zh":"条件是做……","example":"Pour conclure, il me semble que les distributeurs peuvent être utiles, à condition de proposer principalement des boissons plus saines.","source":"第09篇 · Word第52段","row":35},{"id":"2-36","module":2,"category":"非人称 + 不定式","fr":"il est possible de + infinitif","zh":"可以做……","example":"D’une part, il est tout à fait possible d’avoir une alimentation équilibrée sans consommer systématiquement de viande.","source":"第10篇 · Word第55段","row":36},{"id":"2-37","module":2,"category":"同步动作","fr":"tout en + participe présent","zh":"一边……／同时……","example":"À condition de varier suffisamment leur alimentation, ils peuvent couvrir une grande partie de leurs besoins nutritionnels tout en limitant la consommation de produits trop gras.","source":"第10篇 · Word第55段","row":37},{"id":"2-38","module":2,"category":"否定后虚拟式","fr":"ne pas signifier qu’il faille + infinitif","zh":"并不意味着必须……","example":"D’autre part, encourager les enfants à lire ne signifie pas qu’il faille les y obliger à tout prix.","source":"第11篇 · Word第62段","row":38},{"id":"2-39","module":2,"category":"动词 + par + 不定式","fr":"finir par + infinitif","zh":"最终／到头来做……","example":"Face à une pression excessive, certains peuvent développer un véritable rejet de la lecture et finir par la considérer comme une contrainte plutôt que comme une source de plaisir.","source":"第11篇 · Word第62段","row":39},{"id":"2-40","module":2,"category":"动词 + de + 不定式","fr":"donner envie à quelqu’un de + infinitif","zh":"使某人想做……","example":"Parallèlement, il faudrait que les parents sachent respecter leurs goûts et leur proposent des livres adaptés afin de leur donner progressivement envie de lire.","source":"第11篇 · Word第63段","row":40,"cores":["donner envie à de","donner à envie de"],"usage":"donner envie à quelqu’un de… 与 donner à quelqu’un envie de… 两种词序均可；à 引出某人，de 引出动作。"},{"id":"2-41","module":2,"category":"自反动词 + avec","fr":"se familiariser avec + nom","zh":"熟悉……","example":"Par exemple, un enfant qui apprend le français peut regarder des émissions en français afin de se familiariser avec la prononciation et d’enrichir son vocabulaire.","source":"第12篇 · Word第66段","row":41},{"id":"2-42","module":2,"category":"非人称 + 不定式","fr":"il ne suffit pas de + infinitif","zh":"仅仅做……不够","example":"Il ne suffit donc pas de les obliger à lire.","source":"第13篇 · Word第72段","row":42},{"id":"2-43","module":2,"category":"动词 + à + 不定式","fr":"obliger quelqu’un à + infinitif","zh":"强迫某人做……","example":"Il ne suffit donc pas de les obliger à lire.","source":"第13篇 · Word第72段","row":43},{"id":"2-44","module":2,"category":"动词 + dans","fr":"accompagner quelqu’un dans + nom","zh":"在……方面陪伴／支持某人","example":"Les élèves y sont souvent davantage surveillés et les enseignants peuvent être plus présents pour les accompagner dans leur apprentissage.","source":"第14篇 · Word第77段","row":44},{"id":"2-45","module":2,"category":"动词 + de + 名词","fr":"avoir les moyens de + infinitif","zh":"有财力做……","example":"Certaines familles modestes n’ont donc pas les moyens d’y inscrire leurs enfants.","source":"第14篇 · Word第78段","row":45},{"id":"2-46","module":2,"category":"让步 + 虚拟式","fr":"quel que soit / quelle que soit + nom","zh":"无论……如何（quel／quelle／quels／quelles 与后面的名词配合）","example":"Parallèlement, il faudrait que le système éducatif garantisse autant que possible l’égalité des chances, quelle que soit la situation financière des familles.","source":"第14篇 · Word第79段","row":46,"cores":["quel que soit","quelle que soit","quels que soient","quelles que soient"],"usage":"quel que soit son âge；quelle que soit la situation；quels que soient les problèmes；quelles que soient les difficultés。"},{"id":"2-47","module":2,"category":"动词 + à + 名词","fr":"consacrer du temps à + nom","zh":"把时间用于……","example":"Les enfants peuvent organiser leur emploi du temps en fonction de leur rythme d’apprentissage et consacrer davantage de temps aux matières dans lesquelles ils rencontrent des difficultés.","source":"第15篇 · Word第82段","row":47},{"id":"2-48","module":2,"category":"动词 + avec","fr":"interagir avec quelqu’un","zh":"与某人互动","example":"À l’inverse, un enfant qui reste principalement à la maison risque d’avoir moins d’occasions d’interagir avec des jeunes de son âge.","source":"第15篇 · Word第83段","row":48},{"id":"2-49","module":2,"category":"动词 + à + 名词","fr":"contribuer à + nom","zh":"有助于／促进……","example":"D’une part, le travail peut contribuer à la réalisation de soi.","source":"第16篇 · Word第89段","row":49},{"id":"2-50","module":2,"category":"动词 + de + 名词","fr":"disposer de + nom","zh":"拥有／可以支配……","example":"D’autre part, lorsqu’une personne consacre trop de temps à son travail, elle dispose de moins de temps pour sa famille, ses amis ou ses loisirs.","source":"第16篇 · Word第90段","row":50},{"id":"2-51","module":2,"category":"先行动作","fr":"après avoir + participe passé","zh":"做完……之后","example":"Après avoir travaillé plusieurs heures, quelques minutes de repos peuvent les aider à retrouver leur énergie, à mieux se concentrer et à être plus efficaces pendant l’après-midi.","source":"第17篇 · Word第94段","row":51},{"id":"2-52","module":2,"category":"自反动词","fr":"se concentrer","zh":"集中注意力","example":"Après avoir travaillé plusieurs heures, quelques minutes de repos peuvent les aider à retrouver leur énergie, à mieux se concentrer et à être plus efficaces pendant l’après-midi.","source":"第17篇 · Word第94段","row":52},{"id":"2-53","module":2,"category":"动词 + de + 不定式","fr":"éviter de + infinitif","zh":"避免做……","example":"Parallèlement, il faudrait que les entreprises adaptent réellement la charge de travail afin d’éviter d’augmenter la pression sur les employés.","source":"第18篇 · Word第101段","row":53},{"id":"2-54","module":2,"category":"动词 + de + 名词","fr":"dépendre de + nom","zh":"取决于……","example":"Pour conclure, il me semble que le bien-être au travail dépend de plusieurs facteurs complémentaires.","source":"第19篇 · Word第106段","row":54},{"id":"2-55","module":2,"category":"自反动词 + avec","fr":"s’entendre avec quelqu’un","zh":"与某人相处融洽","example":"Lorsque des collègues s’entendent bien, ils peuvent communiquer plus facilement, s’entraider lorsqu’ils rencontrent une difficulté et collaborer de manière plus efficace.","source":"第20篇 · Word第110段","row":55},{"id":"2-56","module":2,"category":"动词 + de + 不定式","fr":"avoir besoin de + infinitif","zh":"需要做……","example":"Ils n’ont plus besoin de quitter leur lieu de travail pour chercher à manger et peuvent ainsi gagner du temps et de l’énergie.","source":"第21篇 · Word第115段","row":56},{"id":"2-57","module":2,"category":"非人称 + 虚拟式","fr":"il est important que + subjonctif","zh":"……很重要","example":"Il est donc important que les employés prennent suffisamment de temps pour se reposer.","source":"第21篇 · Word第116段","row":57},{"id":"2-58","module":2,"category":"动词 + à + 不定式","fr":"conduire quelqu’un à + infinitif","zh":"导致／促使某人做……","example":"D’autre part, la recherche d’une plus grande productivité ne devrait pas conduire les employés à travailler davantage ou à faire régulièrement des heures supplémentaires.","source":"第22篇 · Word第121段","row":58},{"id":"2-59","module":2,"category":"动词 + de + 名词","fr":"tenir compte de + nom","zh":"考虑……","example":"Parallèlement, il faudrait que les employeurs tiennent compte de la santé, du confort et des préférences de l’ensemble des salariés.","source":"第23篇 · Word第127段","row":59},{"id":"2-60","module":2,"category":"形容词 + à","fr":"être allergique à + nom","zh":"对……过敏","example":"Certaines personnes sont allergiques aux chats ou aux chiens, tandis que d’autres ne se sentent tout simplement pas à l’aise en leur présence.","source":"第23篇 · Word第126段","row":60},{"id":"2-61","module":2,"category":"动词 + à + 不定式","fr":"apprendre à + infinitif","zh":"学会做……","example":"De plus, ils peuvent gagner leur propre argent et apprendre à le gérer de manière plus responsable.","source":"第26篇 · Word第142段","row":61},{"id":"2-62","module":2,"category":"让步 + 直陈式","fr":"même si + indicatif","zh":"即使……","example":"Même si l’emploi n’est pas directement lié à leurs études, ils peuvent développer des compétences utiles, comme la communication, le travail en équipe ou encore la gestion du temps.","source":"第26篇 · Word第142段","row":62},{"id":"2-63","module":2,"category":"形容词 + de + 不定式","fr":"être capable de + infinitif","zh":"有能力做……","example":"Or, de nombreux recruteurs recherchent des candidats capables d’être rapidement opérationnels.","source":"第27篇 · Word第148段","row":63},{"id":"2-64","module":2,"category":"无需动作","fr":"sans avoir à + infinitif","zh":"无需做……","example":"Lorsqu’une personne a un emploi du temps chargé, elle peut obtenir rapidement un repas chaud sans avoir à cuisiner.","source":"第28篇 · Word第154段","row":64},{"id":"2-65","module":2,"category":"动词 + de + 名词","fr":"faire partie de + nom","zh":"是……的一部分","example":"Elle peut donc faire partie d’une alimentation équilibrée.","source":"第29篇 · Word第159段","row":65},{"id":"2-66","module":2,"category":"动词 + à + 不定式","fr":"pousser quelqu’un à + infinitif","zh":"促使某人做……","example":"D’une part, le rythme de travail très soutenu pousse de nombreuses personnes à choisir des solutions rapides.","source":"第30篇 · Word第164段","row":66},{"id":"2-67","module":2,"category":"动词 + à + 名词","fr":"faire face à + nom","zh":"应对／面对……","example":"Une formation permet d’apprendre différentes techniques, tandis que l’expérience acquise sur le terrain aide à travailler de manière plus efficace et à faire face à des situations variées.","source":"第31篇 · Word第170段","row":67},{"id":"2-68","module":2,"category":"动词 + en","fr":"transformer quelque chose en + nom","zh":"把……转变成……","example":"Certains peuvent ainsi développer progressivement leurs compétences et même transformer leur passion en activité professionnelle.","source":"第31篇 · Word第171段","row":68},{"id":"2-69","module":2,"category":"自反动词 + dans","fr":"se rendre dans + lieu","zh":"前往……","example":"Les clients peuvent y acheter des fruits, des légumes,
